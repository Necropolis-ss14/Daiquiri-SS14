# Черты персонажа: зависимости. Доступны в редакторе персонажа в категории "Зависимости".
# Выбрать можно только одну зависимость (maxTraits у категории), и только виды, которые вообще
# могут впитывать вещества (у них есть кровоток), могут взять такую черту.

- type: trait
  id: TraitAlcoholAddiction
  name: trait-alcohol-addiction-name
  description: trait-alcohol-addiction-desc
  category: Addictions
  cost: 0
  requirements:
  - !type:SpeciesComponentsRequirement
    components:
    - Bloodstream
  effects:
  - !type:AddCompsEffect
    components:
    - type: Addiction
      addictions:
      - AlcoholAddiction

