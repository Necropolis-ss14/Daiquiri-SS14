- type: entity
  parent: BaseItem
  id: Holoprojector
  name: holographic sign projector
  description: A handy-dandy holographic projector that displays a janitorial sign.
  components:
  - type: Item
    storedRotation: -90
  - type: HolosignProjector
  - type: UseDelay
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot {}
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
        #Starlight Start
        blacklist:
          tags:
          - MechReactor
        #Starlight End
  - type: Sprite
    sprite: Objects/Devices/Holoprojectors/custodial.rsi
    state: icon
  - type: Tag
    tags:
    - HolosignProjector
    - HoloprojectorCrafting # SL Edit
  - type: ForceQuickDraw #Starlight Don't pull the power cell when using hotkeys to remove from pockets

- type: entity
  parent: Holoprojector
  id: HoloprojectorEmpty
  suffix: Empty
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        #Starlight Start
        blacklist:
          tags:
          - MechReactor
        #Starlight End

- type: entity
  parent: Holoprojector
  id: HoloprojectorBorg
  suffix: borg
  name: проектор голознаков
  description: Модифицированный голографический проектор знаков для уборочных киборгов. Автоматически самозаряжается.
  components:
  - type: HolosignProjector
    chargeUse: 240
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMicroreactor
        disableEject: true
        swap: false

- type: entity
  parent: Holoprojector
  id: HoloprojectorClownBorg
  name: проектор голокожуры
  description: Проектор голокожуры, создающий скользкую твёрдо-световую банановую кожуру. Он перезаряжается, так что веселью нет конца!
  suffix: borg
  components:
  - type: HolosignProjector
    signProto: HoloPeel
    chargeUse: 240
  - type: Sprite
    sprite: Objects/Devices/Holoprojectors/peel.rsi
    state: icon
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMicroreactor
        disableEject: true
        swap: false

- type: entity
  parent: Holoprojector
  id: HolofanProjector
  name: проектор голо-вентилятора
  description: Не дайте суицидальным ассистентам убить всех во время атмосферных аварий.
  components:
  - type: HolosignProjector
    signProto: HoloFan
    chargeUse: 120
  - type: Sprite
    sprite: Objects/Devices/Holoprojectors/atmos.rsi
    state: icon
  - type: Tag
    tags:
    - HolofanProjector
    - HoloprojectorCrafting #SL Edit
  - type: StaticPrice
    price: 50
  - type: GuideHelp
    guides:
    - AtmosTools
    - Fires
    - Spacing

