# Milk crates with gradual fill sprites, using the same StorageFillVisualizer pattern as CdRack.
- type: entity
  abstract: true
  id: BaseMilkCrate
  parent: BaseStructureDynamic
  components:
  - type: Appearance
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: InteractionOutline
  - type: Transform
    noRot: true
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: FlimsyMetallic
  - type: Destructible
    thresholds:
    - trigger: # Excess damage, don't spawn entities
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlastic1:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  id: RecordMilkCrate
  parent: BaseMilkCrate
  name: ящик для пластинок
  description: Прочный пластиковый молочный ящик, приспособленный для хранения виниловых пластинок в конвертах. Больше ничего не вмещает.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Storage/milkcrate.rsi
    snapCardinals: true
    layers:
      - map: ["enum.StorageFillLayers.Fill"]
        state: recordcrate-0
  - type: StorageFillVisualizer
    maxFillLevels: 6
    fillBaseName: recordcrate
  - type: Storage
    grid:
    - 0,0,3,3
    maxItemSize: Normal
    whitelist:
      tags:
        - VinylSleeve
        - VinylSleeveFit
  - type: Construction
    graph: MilkCrateGraph
    node: recordMilkCrate

- type: entity
  id: RecordMilkCrateFilled
  suffix: Filled
  parent: RecordMilkCrate
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:NestedSelector
        tableId: RandomVinylSleeve
        rolls: !type:RangeNumberSelector
          range: 6, 8

- type: entity
  id: MilkCrate
  parent: BaseMilkCrate
  name: молочный ящик
  description: Прочный пластиковый ящик для перевозки пакетов молока. Больше ничего не вмещает.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Storage/milkcrate.rsi
    snapCardinals: true
    layers:
      - map: ["enum.StorageFillLayers.Fill"]
        state: milkcrate-0
  - type: StorageFillVisualizer
    maxFillLevels: 5
    fillBaseName: milkcrate
  - type: Storage
    grid:
    - 0,0,3,3
    maxItemSize: Normal
    whitelist:
      tags:
        - MilkCarton
  - type: Construction
    graph: MilkCrateGraph
    node: milkCrate

- type: entity
  id: SyndicateMilkCrate
  parent: [BaseMilkCrate, BaseSyndicateContraband]
  name: молочный ящик Синдиката
  description: Кроваво-красный пластиковый молочный ящик для хранения виниловых пластинок в конвертах. NanoTrasen предпочла бы, чтобы вы это не слушали.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Storage/milkcrate.rsi
    snapCardinals: true
    layers:
      - map: ["enum.StorageFillLayers.Fill"]
        state: syndicrate-0
  - type: StorageFillVisualizer
    maxFillLevels: 6
    fillBaseName: syndicrate
  - type: Storage
    grid:
    - 0,0,3,3
    maxItemSize: Normal
    whitelist:
      tags:
        - VinylSleeve
  - type: Construction
    graph: MilkCrateGraph
    node: syndicateMilkCrate
