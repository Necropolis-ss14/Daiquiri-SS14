# Starlight Shuttle Cannons

# CYERXA Dual 120mm Cannon - Based on Duster, fires 2 shots per trigger
- type: entity
  id: ShuttleGunCyerxa120mm
  parent: ShuttleGunBase
  name: Спаренные пушки CYERXA 120 мм
  description: Мощная спаренная 120-мм пушечная система для тяжёлого шаттлового боя. Стреляет разрушительными фугасными гранатами с огромной разрушительной силой. Каждая активация выпускает оба ствола быстрой очередью.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Shuttleguns/cyerxa_120mm.rsi
    state: space_artillery
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 500
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Anchorable
    delay: 90
  - type: Pullable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
        - !type:ChangeConstructionNodeBehavior
          node: machineFrame
        - !type:DoActsBehavior
          acts: ["Destruction"]
  - type: Gun
    projectileSpeed: 150
    fireRate: 1.0
    burstFireRate: 4
    shotsPerBurst: 2
    burstCooldown: 28.0
    selectedMode: Burst
    angleDecay: 30
    minAngle: 0
    maxAngle: 10
    availableModes:
    - Burst
    soundGunshot:
      path: /Audio/_Starlight/Weapons/Shuttleguns/uaf_cyrexa_452.ogg
      params:
        variation: 0.05
        volume: 5
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: MagazineAmmoProvider
  - type: ItemSlots
    slots:
      gun_magazine:
        name: item-slot-component-slot-name-magazine
        startingItem: Magazine120mmGrenadeBlast
        priority: 2
        whitelist:
          tags:
          - MagazineGrenade120mm
        insertSound:
          path: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg
          params:
            pitch: 2
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
  - type: RadarBlip
    color: "#FFB300"
    scale: 1.4
    shape: Square
    requireInSpace: false
  - type: GunneryTrackable
    category: Ballistic
  - type: StaticPrice
    price: 5000
  - type: AutoLoader
    container: gun_magazine
    whitelist:
      tags:
      - MagazineGrenade120mm

# Apollo Heavy Laser Cannon - Precision ship-to-ship energy weapon
- type: entity
  id: ShuttleGunApollo
  parent: ShuttleGunBase
  name: Тяжёлая лазерная пушка «Аполлон»
  description: Точная плазменная пушка для боёв корабль-корабль. Стреляет сфокусированными плазменными сгустками, наносящими концентрированный тепловой урон с малым радиусом детонации — идеально для вывода из строя вражеских систем без сопутствующих разрушений. Возможна продолжительная стрельба, пока хватает энергозарядов. [Класс хардпоинта]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Shuttleguns/Apollo.rsi
    layers:
    - state: space_artillery
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
          damage: 1200
      behaviors:
        - !type:ChangeConstructionNodeBehavior
          node: machineFrame
        - !type:DoActsBehavior
          acts: ["Destruction"]
  - type: Gun
    projectileSpeed: 80
    fireRate: 1
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
      params:
        variation: 0.05
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: item-slot-component-slot-name-magazine
        startingItem: PowerCageHigh
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
            - PowerCage
            - PowerCageOmega
  - type: BatteryAmmoProvider
    proto: ApolloHeavyLaser
    fireCost: 500
  - type: RadarBlip
    color: "#FF44FF"
    scale: 1.4
    shape: Square
    requireInSpace: false
  - type: GunneryTrackable
    category: Energy
  - type: AutoLoader
    container: cell_slot
    whitelist:
      tags:
      - PowerCage
      - PowerCageOmega

# Vanyk-MK2 60mm Rocket Launcher - Multi-rocket burst fire system
