#Basic Helmet (Abductor Helmet)
- type: entity
  parent: [ ClothingHeadHelmetBase, BaseMajorContraband ]
  id: ClothingHeadHelmetAbductor
  name: шлем
  components:
  - type: Pierceable
    level: Metal
  - type: FlashImmunity
  - type: EyeProtection
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.80
        Slash: 0.80
        Piercing: 0.80
        Heat: 0.80
        Radiation: 0.80
        Caustic: 0.95
  - type: ExplosionResistance
    damageCoefficient: 0.75
  - type: Sprite
    sprite: _Starlight/Clothing/Head/Helmets/abductor.rsi
  - type: Clothing
    sprite: _Starlight/Clothing/Head/Helmets/abductor.rsi
  - type: Tag
    tags:
    - WhitelistChameleon
    - SecurityHelmet

#Basic Helmet (Security Helmet Reskin)
- type: entity
  parent: [ BaseContrabandTier2, ClothingHeadHelmetBase, BaseSecurityContraband ] # Blimpuf
  id: ClothingHeadHelmetDredd
  name: шлем
  description: Я — ЗАКОН!
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Head/Helmets/dredd.rsi
  - type: Clothing
    sprite: _Starlight/Clothing/Head/Helmets/dredd.rsi
  - type: Tag
    tags:
    - WhitelistChameleon
