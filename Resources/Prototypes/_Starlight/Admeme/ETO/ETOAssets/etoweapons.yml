- type: entity
  name: ПС З46
  parent: [BaseSecurityContraband, BaseWeaponRifle]
  id: WeaponRifleZ46
  suffix: ETO
  categories: [ DoNotMap ]
  description: Винтовка от Private Servitude для доступности тяжёлых винтовок. Патроны .30.
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/ETO/weapons/g36/g36.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Item
    sprite: _Starlight/Admeme/ETO/weapons/g36/g36hands.rsi
  - type: Clothing
    sprite: _Starlight/Admeme/ETO/weapons/g36/g36.rsi
  - type: Gun
    fireRate: 5
    soundGunshot:
      path: /Audio/_Starlight/Weapons/Guns/Gunshots/m90.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: item-slot-component-slot-name-magazine
        startingItem: MagazineLightRifleFMJ
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineLightRifle
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: item-slot-component-slot-name-chamber
        startingItem: CartridgeLightRifleFMJ
        priority: 1
        whitelist:
          tags:
          - CartridgeLightRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot ""
      gun_chamber: !type:ContainerSlot ""
      firing_pin: !type:Container
  - type: Appearance
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: ContainerFill
    containers:
      firing_pin:
      - FiringPin
  - type: FiringPinHolder
    supportedPins: [ Rifle, GunUpgrade ]

- type: entity
  name: ПС З77 Т1
  parent: [BaseWeaponRifle, BaseSecurityContraband]
  id: WeaponRifleZ77T1
  description: Винтовка от Private Servitude, дешевле ходового Lecter. Патроны .20.
