- type: entity
  parent: AppraisalTool
  id: GoldenAppraisalTool
  name: золотой оценочный инструмент
  description: Золотой оценочный инструмент для самых элитных карго-техников. Сможет ли он определить стоимость вселенной?
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Tools/golden_appraisal_tool.rsi
    state: icon
  - type: Item
    sprite: _Starlight/Objects/Tools/golden_appraisal_tool.rsi
    size: Small

# From Funky
- type: entity
