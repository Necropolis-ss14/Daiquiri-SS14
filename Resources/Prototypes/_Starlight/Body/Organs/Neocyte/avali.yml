- type: entity
  id: OrganNeoAvaliStomach
  parent: OrganNeocyteStomach
  name: ent-OrganNeoAvaliStomach
  suffix: Neo-Avali
  components:
  - type: Stomach
    specialDigestible:
      tags:
      - RamChip
    isSpecialDigestibleExclusive: false
  - type: SolutionManager
    solutions:
    - SolutionOrganFoodMeat
    - SolutionOrganStomach50

- type: entity
  id: OrganNeoAvaliHeart
  parent: OrganNeocyteHeart
  name: ent-OrganNeoAvaliHeart
  suffix: Neo-Avali
  components:
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [Avali, Neocyte]
    stages: [ Bloodstream ]
- type: entity
  id: OrganNeoAvaliLiver
  parent: OrganNeocyteLiver
  name: ent-OrganNeoAvaliLiver
  suffix: Neo-Avali
  components:
  - type: Metabolizer
    updateInterval: 1.5
    maxReagents: 1
    metabolizerTypes: [Avali]
    stages: [ Metabolites ]

- type: entity
  id: OrganNeoAvaliTongue
  parent: OrganNeocyteTongueForked
  suffix: Neo-Avali
  components:
  - type: OrganTongue
    sounds:
      Male: NeoAvaliMSounds
      Female: NeoAvaliFSounds
      Unsexed: NeoAvaliMSounds
