- type: entity
  abstract: true
  parent: FoodMealBase
  id: FoodIceCreamBase
  components:
  - type: Appearance
  - type: Edible
    transferAmount: 4
    utensil: Spoon
    trash:
    - DrinkGlass
  - type: Solution
    solution:
      id: food
      maxVol: 20
  - type: Sprite
    layers:
    - state: icon_empty
      map: [ "enum.SolutionContainerLayers.Base" ]
    - state: fill-1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
  - type: SolutionContainerVisuals
    changeColor: false
    solutionName: food
    maxFillLevels: 5
    fillBaseName: fill-
  - type: Tag
    tags:
      - IceCream

