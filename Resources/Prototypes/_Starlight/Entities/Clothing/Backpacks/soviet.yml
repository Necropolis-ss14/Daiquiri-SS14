- type: entity
  parent: [ClothingBackpackDuffel, BaseSovietContraband]
  id: ClothingBackpackDuffelSSF
  name: вещмешок ССФ
  description: Громоздкая оливковая сумка с выцветшей эмблемой ССФ.
  components:
  - type: Contraband # Blimpuf
    tier: Tier3
  - type: Sprite
    sprite: _Starlight/Clothing/Back/Duffels/soviet_marine_duffel.rsi
  - type: ExplosionResistance
    damageCoefficient: 0.3
  - type: Storage
    grid:
    - 0,0,8,4

