    speciesBlacklist: []
    speciesWhitelist:
    - SlimePerson
    - NeoSlimePerson
  - type: SurgeryPartCondition
    parts:
    - Head

- type: entity
  parent: SurgeryCloseIncision
  id: SurgeryCloseIncisionLimbSlime
