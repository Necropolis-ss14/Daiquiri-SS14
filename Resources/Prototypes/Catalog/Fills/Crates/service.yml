- type: entity
  parent: CratePlastic
  id: CrateServiceJanitorialSupplies
  name: ящик уборочных принадлежностей
  description: Дайте отпор грязи и копоти вместе с «Уборочным набором» от NanoTrasen (tm)! Содержит три ведра, предупреждающие знаки и чистящие гранаты. А также одну швабру, метлу, чистящий спрей, проволочную щётку, тряпку и мешок для мусора. # SL
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: AllSoapsTable
        - id: MopItem
        - id: MopBucketCubeWrapped
        - id: Bucket
          amount: 3
        - id: WetFloorSign
          amount: 2
        - id: SprayBottleSpaceCleaner
          amount: 2
        - id: TrashBag
          amount: 2
        - id: Plunger
          amount: 2
        - id: BoxCleanerGrenades
        - id: WireBrush
          amount: 2

