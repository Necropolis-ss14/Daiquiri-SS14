# Smokesicles
# They're supposed to be smoking alternatives for vox. You teeeeeechnically shouldn't be able to light a cigarette in an environment without oxygen.
# Not technically meant to be food so not adding them to random food spawner

- type: entity
  name: ent-FoodFrozenPopsicleNicotine
  parent: FoodFrozenBase
  id: FoodFrozenPopsicleNicotine
  description: ent-FoodFrozenPopsicleNicotine-desc
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Consumable/Food/frozen.rsi
    state: smokesicle-open
  - type: Edible
    trash:
    - FoodFrozenPopsicleNicotineTrashStick
  - type: FlavorProfile
    flavors:
      - cold
      - terrible
  - type: Solution
    id: food
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: Nicotine
        Quantity: 10

- type: entity
  name: ent-FoodFrozenPopsicleNicotineSpicy
  parent: FoodFrozenBase
  id: FoodFrozenPopsicleNicotineSpicy
  description: ent-FoodFrozenPopsicleNicotineSpicy-desc
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Consumable/Food/frozen.rsi
    state: spicy-smokesicle-open
  - type: Edible
    trash:
    - FoodFrozenPopsicleNicotineTrashStick
  - type: FlavorProfile
    flavors:
      - cold
      - terrible
      - spicy
  - type: Solution
    id: food
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: Nicotine
        Quantity: 8
      - ReagentId: CapsaicinOil
        Quantity: 2

- type: entity
  name: ent-FoodFrozenPopsicleNicotineLegend
  parent: [SolutionTiny, FoodFrozenBase]
  id: FoodFrozenPopsicleNicotineLegend
  description: ent-FoodFrozenPopsicleNicotineLegend-desc
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Consumable/Food/frozen.rsi
    state: legendsicle-open
  - type: Edible
    trash:
    - FoodFrozenPopsicleNicotineTrashStick
  - type: FlavorProfile
    flavors:
      - paintthinner
      - cold
      - terrible
  - type: Solution
    id: food
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 2
      - ReagentId: THC
        Quantity: 20 # a joint has 20 thc

# Packaged ice-cream
# Look, if I had an unpackaged popsicle fall out a vending machine I wouldn't touch that with a mile long stick. Or maybe I would, as long as it didn't crack.

- type: entity
  parent: BaseItem
  id: FoodFrozenPopsicleNicotinePackaged
  name: ent-FoodFrozenPopsicleNicotinePackaged
  description: ent-FoodFrozenPopsicleNicotinePackaged-desc
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Consumable/Food/frozen.rsi
    state: smokesicle
  - type: SpawnItemsOnUse
    items:
      - id: FoodFrozenPopsicleNicotineTrash
      - id: FoodFrozenPopsicleNicotine
    sound:
      path: /Audio/Effects/unwrap.ogg

