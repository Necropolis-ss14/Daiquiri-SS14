- type: entity
  id: BaseAbductorOrgan
  parent: BaseItem
  abstract: true
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Abductor/organs.rsi
  - type: Organ
  - type: Edible
  - type: Extractable
    grindableSolutionName: organ
  - type: SolutionManager
    solutions:
    - SolutionOrganNutriment
    - SolutionOrganFoodMeat
  - type: FlavorProfile
    flavors:
      - people
  - type: Tag
    tags:
      - Meat


- type: entity
  id: OrganAbductorBrain
  parent: [BaseOrganBrain, BaseAbductorOrgan]
  name: странный мозг
  suffix: Abductor
  description: Источник невероятного, но странного интеллекта.
  components:
  - type: Sprite
    state: brain

- type: entity
  id: OrganAbductorEyes
  parent: [BaseAbductorOrgan, BaseOrganEyes]
  name: странные глаза
  suffix: Abductor
  description: Эти большие глаза-бусины молча пялятся на вас.
  components:
  - type: Sprite
    layers:
      - state: eyeballs
  - type: OrganVisualization
    layer: Eyes
    prototypes:
      Default: MobAbductorEyes

- type: entity
  id: OrganAbductorEars
  parent: [BaseAbductorOrgan, BaseOrganEars]
  name: странные уши
  suffix: Abductor
  description: "У уха три части: внутренняя, средняя и наружная. В норме видимой должна быть только одна из них."
  components:
  - type: Sprite
    state: ears

- type: entity
  id: OrganAbductorLungs
  parent: [BaseAbductorOrgan, BaseOrganLungs]
  name: странные лёгкие
  suffix: Abductor
  description: Фильтруют кислород из атмосферы, который затем поступает в кровоток и используется как переносчик электронов.
  components:
  - type: Sprite
    layers:
      - state: lung-l
      - state: lung-r

- type: entity
  id: OrganAbductorHeart
  parent: [BaseAbductorOrgan, BaseOrganHeart]
  name: странное сердце
  suffix: Abductor
  description: Не похоже, чтобы над этим экспериментировали.
  components:
  - type: Sprite
    state: heart-on
  # The heart 'metabolizes' medicines and poisons that aren't filtered out by other organs.
  # This is done because these chemicals need to have some effect even if they aren't being filtered out of your body.
  # You're technically 'immune to poison' without a heart, but.. uhh, you'll have bigger problems on your hands.
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [ Slime ]
    stages: [ Bloodstream ]
- type: entity
  id: OrganAbductorStomach
  parent: [BaseAbductorOrgan, BaseOrganStomach]
  name: странный желудок
  suffix: Abductor
  description: Возможно, тоскует по жареному сыру.
  components:
  - type: Sprite
    state: stomach
  - type: SolutionManager
    solutions:
    - SolutionOrganNutriment
    - SolutionOrganFoodMeat
    - SolutionOrganStomach50
  - type: Stomach
  # The stomach metabolizes stuff like foods and drinks.
  # TODO: Have it work off of the ent's solution container, and move this
  # to intestines instead.
  - type: Metabolizer
    # mm yummy
    maxReagents: 3
    metabolizerTypes: [ Slime ]
    stages: [ Digestion ]

- type: entity
  id: OrganAbductorLiver
  parent: [BaseAbductorOrgan, BaseOrganLiver]
  name: странная печень
  suffix: Abductor
  description: Эта чудная печень довольно плохо расщепляет алкоголь.
  components:
  - type: Sprite
    state: liver
  - type: Metabolizer # The liver metabolizes certain chemicals only, like alcohol.
    maxReagents: 1
    metabolizerTypes: [ Slime ]
    stages: [ Metabolites ]
- type: entity
  id: OrganAbductorKidneys
  parent: [BaseAbductorOrgan, BaseOrganKidneys]
  name: странные почки
  suffix: Abductor
  description: Фильтруют странные токсины из странного кровотока.
  components:
  - type: Sprite
    layers:
      - state: kidney-l
      - state: kidney-r
  # The kidneys just remove anything that doesn't currently have any metabolisms, as a stopgap.
  - type: Metabolizer
    maxReagents: 5
    metabolizerTypes: [ Slime ]

- type: entity
  id: OrganAbductorTongue
  parent: OrganHumanTongue
  suffix: Abductor
