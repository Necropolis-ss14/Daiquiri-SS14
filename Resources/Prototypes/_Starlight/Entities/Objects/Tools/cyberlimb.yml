# Mechwright
- type: entity
  name: гаечный ключ
  parent: Wrench
  id: WrenchCyber
  description: "Обычный инструмент для сборки и разборки. Помните: влево — крепи, вправо — снимай."
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Tools/cyberling.rsi
    state: wrench
  - type: MeleeWeapon
    wideAnimationRotation: 135
    attackRate: 1.5
    damage:
      types:
        Blunt: 6.5
    soundHit:
      collection: MetalThud
  - type: Tool
    speedModifier: 1.75
    qualities:
      - Anchoring
    useSound:
      path: /Audio/Items/ratchet.ogg
  - type: GuideHelp
    guides:
    - Construction
  - type: Tag
    tags:
      - CyberHandItem
  - type: WrenchSurgery
    startSound:
      path: /Audio/Items/ratchet.ogg

- type: entity
  name: отвёртка
  parent: BaseItem
  id: ScrewdriverCyber
  description: Промышленный крутящий момент в компактном корпусе отвёртки.
  components:
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/screwdriver_drop.ogg
  - type: Tag
    tags:
    - Screwdriver
    - CyberHandItem
  - type: Sprite
    sprite: _Starlight/Objects/Tools/cyberling.rsi
    layers:
    - state: screwdriver
      map: ["enum.DamageStateVisualLayers.Base"]
  - type: MeleeWeapon
    wideAnimationRotation: -90
    attackRate: 1
    damage:
      types:
        Piercing: 8
    soundHit:
      path: "/Audio/Weapons/bladeslice.ogg"
  - type: Tool
    speedModifier: 1.75
    qualities:
      - Screwing
    useSound:
      collection: Screwdriver
  - type: RandomSprite
    available:
      - enum.DamageStateVisualLayers.Base:
          screwdriver: Rainbow
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
  - type: StaticPrice
    price: 30
  - type: ScrewdriverSurgery
    startSound:
      path: /Audio/Items/screwdriver.ogg

- type: entity
  name: монтировка
  parent: BaseItem
  id: CrowbarCyber
  components:
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/crowbar_drop.ogg
  - type: Tag
    tags:
    - Crowbar
    - CyberHandItem
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 10
    soundHit:
      collection: MetalThud
  - type: Tool
    speedModifier: 1.75
    qualities:
      - Prying
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: ToolTileCompatible
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
  - type: Prying
  - type: Sprite
    sprite: _Starlight/Objects/Tools/cyberling.rsi
    state: crowbar
  - type: CrowbarSurgery
    startSound:
      path: /Audio/Items/crowbar.ogg

- type: entity
  name: кусачки
  parent: BaseItem
  id: WirecutterCyber
  description: Это убивает провод.
  components:
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/wirecutter_drop.ogg
  - type: Tag
    tags:
    - Wirecutter
    - CyberHandItem
  - type: Sprite
    sprite: _Starlight/Objects/Tools/cyberling.rsi
    state: cutters
  - type: MeleeWeapon
    wideAnimationRotation: -90
    damage:
      types:
        Piercing: 2
    attackRate: 2 #open and close that shit on their arm like hell! because you sure aren't doing any damage with this
    soundHit:
      path: "/Audio/Items/wirecutter.ogg"
  - type: Tool
    speedModifier: 1.75
    qualities:
      - Cutting
    useSound:
      path: /Audio/Items/wirecutter.ogg
  - type: ToolTileCompatible
  - type: BotanySampleTaker
  - type: SurgeryTool
  - type: Scalpel
    successRate: 0.35
    startSound:
      path: /Audio/_Starlight/Medical/Surgery/scalpel1.ogg
    endSound:
      path: /Audio/_Starlight/Medical/Surgery/scalpel2.ogg
  - type: WirecutterSurgery
    startSound:
      path: /Audio/Items/wirecutter.ogg

- type: entity
  name: сварочник
  parent: [ SolutionToolWelder, BaseItem ]
  id: WelderCyber
  description: Плавит всё, пока есть топливо, не забудьте защиту для глаз!
  components:
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/welder_drop.ogg
  - type: Sprite
    sprite: _Starlight/Objects/Tools/cyberling.rsi
    layers:
    - state: indwelder
    - state: indwelder-on
      visible: false
      shader: unshaded
      map: ["enum.ToggleableVisuals.Layer"]
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
  - type: ItemToggle
    predictable: false
    soundActivate:
      collection: WelderOn
      params:
        variation: 0.125
        volume: -5
    soundDeactivate:
      collection: WelderOff
      params:
        variation: 0.125
        volume: -5
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/Weapons/Guns/Hits/energy_meat1.ogg
      params:
        variation: 0.250
        volume: -10
    activatedSoundOnHitNoDamage:
      path: /Audio/Weapons/Guns/Hits/energy_meat1.ogg
      params:
        variation: 0.250
        volume: -12
    deactivatedSoundOnHitNoDamage:
      collection: MetalThud
    activatedDamage:
        types:
            Heat: 8
  - type: ItemToggleSize
    activatedSize: Large
  - type: ItemToggleHot
  - type: ComponentToggler
    components:
    - type: DisarmMalus
      malus: 0.6
  - type: ToggleableVisuals
    spriteLayer: flame
    inhandVisuals:
      left:
      - state: inhand-left-flame
        shader: unshaded
      right:
      - state: inhand-right-flame
        shader: unshaded
  - type: UseDelay
  - type: MeleeWeapon
    wideAnimationRotation: -90
    damage:
      types:
        Blunt: 7 #i mean... i GUESS you could use it like that
    soundHit:
      collection: MetalThud
  - type: RefillableSolution
    solution: welder
  - type: Tool
    speedModifier: 1.75
    useSound:
      collection: Welder
    qualities: [ Welding ]
  - type: Welder
  - type: PointLight
    enabled: false
    radius: 1.5
    color: orange
    netsync: false
  - type: ItemTogglePointLight
  - type: Appearance
  - type: RequiresEyeProtection
  - type: PhysicalComposition
    materialComposition:
      Steel: 200
  - type: StaticPrice
    price: 40
  - type: IgnitionSource
    temperature: 700
  - type: Tag
    tags:
      - CyberHandItem
  - type: WelderSurgery
    startSound:
      path: /Audio/Items/welder.ogg

# Spacer
- type: entity
  id: ProtokineticAcceleratorCyber
  name: кибер-протокинетический ускоритель
  description: Стреляет слабоповреждающими кинетическими болтами на короткой дистанции. Отсутствие стабилизации снижает точность при частой стрельбе.
  parent: BaseItem
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Tools/cyberling.rsi
      state: protokineticaccelerator
    - type: Gun
      fireRate: 0.5
      selectedMode: SemiAuto
      angleDecay: 20
      minAngle: 1
      maxAngle: 60
      angleIncrease: 15
      availableModes:
      - SemiAuto
      soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/kinetic_accel.ogg
    - type: GunWieldBonus
      minAngle: -1
      maxAngle: -55
    - type: Wieldable
      freeHandsRequired: 2
    - type: AmmoCounter
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.AmmoVisuals.HasAmmo:
          empty-icon:
            True: { visible: False }
            False: { visible: True }
          #todo: add other 'empty' animations
    - type: RechargeBasicEntityAmmo
      rechargeCooldown: 0.75
      rechargeSound:
        path: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg
    - type: BasicEntityAmmoProvider
      proto: BulletKinetic
      capacity: 1
      count: 1
    - type: Clothing
      sprite: Objects/Weapons/Guns/Basic/kinetic_accelerator.rsi
      quickEquip: false
      slots:
      - suitStorage
      - Belt
    - type: UseDelay
      delay: 1
    - type: UpgradeableGun
      whitelist:
        tags:
        - PKAUpgrade
    - type: ContainerContainer
      containers:
        upgrades: !type:Container
    - type: Tag
      tags:
        - CyberHandItem


- type: entity
  name: кибернетический абордажный пистолет
  parent: BaseItem
  id: WeaponGrapplingGunCyber
  components:
    - type: AmmoCounter
    - type: GrapplingGun
    - type: Gun
      soundGunshot: /Audio/Weapons/Guns/Gunshots/harpoon.ogg
      fireRate: 0.5
      clumsyProof: true
    - type: BasicEntityAmmoProvider
      proto: GrapplingHook
      capacity: 1
    - type: Sprite
      sprite: _Starlight/Objects/Tools/cyberling.rsi
      layers:
        - state: grapplinghook
        - state: grapplinghook-loaded
          map: [ "unshaded" ]
          visible: true
    - type: UseDelay
      delay: 1.5
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.TetherVisualsStatus.Key:
          unshaded:
            True: { state: grapplinghook-loaded }
            False: { state: grapplinghook-unloaded }
    - type: PacifismAllowedGun
    - type: Tag
      tags:
        - CyberHandItem

- type: entity
  parent: [ BaseKnife, BaseWeaponCrusher]
  id: WeaponCrusherDaggerCyber
  name: кибер-кинжал дробитель
  description: Уменьшенная версия прото-кинетического дробителя. Использует кинетическую энергию для вибрации лезвия на высокой скорости.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Tools/cyberling.rsi
      state: crusherdagger
    - type: MeleeWeapon
      autoAttack: true
      wideAnimationRotation: -135
      attackRate: 2
      damage:
        types:
          Slash: 12
    - type: DisarmMalus
      malus: 0.225
    - type: Tag
      tags:
        - CyberHandItem

# Gorilla
- type: entity
  name: наручная перчатка Г.О.Р.И.Л.Л.А.
  parent: BaseItem
  id: WeaponGauntletGorillaCyber
  description: Прочное исследовательское оборудование. При питании от ядра аномалии одним ударом может запускать аномальные объекты по воздуху.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Tools/cyberling.rsi
      state: gorillagauntlet
    - type: MeleeWeapon
      attackRate: 0.5
      angle: 0
      animation: WeaponArcFist
      wideAnimationRotation: -135
      damage:
        types:
          Blunt: 20
      soundHit:
        path: "/Audio/Weapons/Guns/Gunshots/kinetic_accel.ogg"
    - type: CorePoweredThrower
    - type: MeleeThrowOnHit
      unanchorOnHit: Unanchorable
    - type: ItemSlots
      slots:
        core_slot:
          name: anomaly-gorilla-core-slot-name
          insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
          ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
          whitelist:
            components:
            - AnomalyCore
    - type: ContainerContainer
      containers:
        core_slot: !type:ContainerSlot
    - type: DamageOnAttackedProtection
      damageProtection:
        flatReductions:
          Heat: 100
          Cold: 100
          Radiation: 100
      slots: NONE
    - type: Tag
      tags:
        - CyberHandItem

- type: entity
  name: наручная ручная пушка Ш.И.М.П.
  parent: BaseWeaponBatterySmall
  id: WeaponPistolCHIMPCyber
  description: То, что это маленький C.H.I.M.P., не значит, что он не бьёт как A.P.E.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Tools/cyberling.rsi
      layers:
        - state: chimphandcannon
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-unshaded-1
          visible: false
          map: ["enum.GunVisualLayers.MagUnshaded"]
          shader: unshaded
    - type: Appearance
    - type: MagazineVisuals
      magState: mag
      steps: 3
      zeroVisible: false
    - type: Gun
      projectileSpeed: 10
      fireRate: 1.5
      soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/taser2.ogg
    - type: BatteryAmmoProvider
      proto: AnomalousParticleDeltaStrong
      fireCost: 100
    - type: BatteryWeaponFireModes
      fireModes:
      - proto: AnomalousParticleDeltaStrong
        fireCost: 100
      - proto: AnomalousParticleEpsilonStrong
        fireCost: 100
      - proto: AnomalousParticleZetaStrong
        fireCost: 100
      - proto: AnomalousParticleSigmaStrong
        fireCost: 100
    - type: StaticPrice
      price: 0
    - type: BatterySelfRecharger
      autoRechargeRate: 2 # takes 6 minutes to charge itself back to full
    - type: Tag
      tags:
        - CyberHandItem

- type: entity
  parent: BaseItem
  id: AnomalyScannerCyber
  name: кибернетический сканер аномалий
  description: Наручный сканер, созданный для сбора информации о различных аномальных объектах.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Tools/cyberling.rsi
      state: anomalyscanner
    - type: ActivatableUI
      key: enum.AnomalyScannerUiKey.Key
      requireActiveHand: false
      inHandsOnly: true
    - type: UserInterface
      interfaces:
        enum.AnomalyScannerUiKey.Key:
          type: AnomalyScannerBoundUserInterface
    - type: AnomalyScanner
    - type: GuideHelp
      guides:
      - ScannersAndVessels
    - type: Tag
      tags:
        - CyberHandItem

# Responder
- type: entity
  name: кибернетический автоинъектор на руку
  parent: BaseItem
  description: Стерильный инъектор для быстрого введения препаратов пациентам.
  id: AutoinjectorCyber
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Tools/cyberling.rsi
      layers:
        - state: autoinjector
          map: ["enum.SolutionContainerLayers.Base"]
        - state: autoinjector-fill-1
          map: ["enum.SolutionContainerLayers.Fill"]
          visible: false
    - type: Solution
      id: hypospray
      solution:
        maxVol: 15
    - type: ExaminableSolution
      solution: hypospray
    - type: Injector
      solutionName: hypospray
      ignoreClosed: false
      activeModeProtoId: HyposprayDynamicMode
      allowedModes:
      - HyposprayDynamicMode
      - HyposprayInjectMode
      needHand: false
      currentTransferAmount: 15
    - type: StaticPrice
      price: 0
    - type: Appearance
    - type: SolutionContainerVisuals
      maxFillLevels: 1
      fillBaseName: autoinjector-fill-
      solutionName: hypospray
    - type: Tag
      tags:
        - CyberHandItem

- type: entity
  name: кибер-автоинъектор с трикордразином
  parent: AutoinjectorCyber
  description: Стерильный инъектор для быстрого введения препаратов пациентам.
  id: AutoinjectorCyberTricordrazine
  components:
    - type: Solution
      id: hypospray
      solution:
        maxVol: 15
    - type: Injector
      solutionName: hypospray
      ignoreClosed: false
      activeModeProtoId: HyposprayDynamicMode
      allowedModes:
      - HyposprayDynamicMode
      - HyposprayInjectMode
      needHand: false
      currentTransferAmount: 15
      reagentWhitelist:
        - Tricordrazine

- type: entity
  name: кибер-автоинъектор с инапровалином
  parent: AutoinjectorCyber
  description: Стерильный инъектор для быстрого введения препаратов пациентам.
  id: AutoinjectorCyberInaprovaline
  components:
    - type: Solution
      id: hypospray
      solution:
        maxVol: 15
    - type: Injector
      solutionName: hypospray
      ignoreClosed: false
      activeModeProtoId: HyposprayDynamicMode
      allowedModes:
      - HyposprayDynamicMode
      - HyposprayInjectMode
      needHand: false
      currentTransferAmount: 15
      reagentWhitelist:
        - Inaprovaline
    - type: Tag
      tags:
        - CyberHandItem

- type: entity
  parent: AdvancedJetInjector
  id: AdvancedJetInjectorCyber
  name: кибернетический струйный инъектор
  description: Безупречный, модный, высококачественный инъектор. Теперь встроен в вашу руку!
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Tools/cyberling.rsi
      layers:
        - state: jetinjector
          map: ["enum.SolutionContainerLayers.Base"]
        - state: autoinjector-fill-1
          map: ["enum.SolutionContainerLayers.Fill"]
          visible: false
    - type: SolutionContainerVisuals
      maxFillLevels: 1
      fillBaseName: autoinjector-fill-
      solutionName: hypospray

- type: entity
  id: DefibrillatorCyber
  parent: BaseDefibrillator
  name: кибер-дефибриллятор
  description: Наручное устройство, способное спасать жизни, а в крайнем случае сойти за оружие.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Tools/cyberling.rsi
      layers:
        - state: defibrillator
        - state: defibrillator-ready
          map: [ "enum.ToggleableVisuals.Layer" ]
          visible: false
          shader: unshaded
    - type: MeleeWeapon
      damage:
        types:
          Blunt: 4
    - type: ToggleCellDraw
    - type: PowerCellDraw
      useCharge: 50
    - type: Defibrillator
      zapHeal:
        types:
          Asphyxiation: -40
      doAfterDuration: 6
    - type: DoAfter
    - type: UseDelay
    - type: ItemToggleMeleeWeapon
      activatedSoundOnHit:
        path: /Audio/Items/Defib/defib_zap.ogg
        params:
          variation: 0.250
      activatedSoundOnHitNoDamage:
        path: /Audio/Items/Defib/defib_zap.ogg
        params:
          variation: 0.250
          volume: -10
      activatedDamage:
        types:
          Blunt: 4
          Shock: 7
    - type: ContainerContainer
      containers:
        cell_slot: !type:ContainerSlot { }
    - type: PowerCellSlot
      cellSlotId: cell_slot
    - type: ItemSlots
      slots:
        cell_slot:
          insertOnInteract: false
          disableEject: true
          whitelist:
            components:
              - PowerCell
          blacklist:
            tags:
            - MechReactor
            requireAll: true
          name: power-cell-slot-component-slot-name-default
          startingItem: PowerCellTinyCyber
    - type: Tag
      tags:
        - CyberHandItem

- type: entity
  name: батарейка кибер-дефибриллятора
  description: Крошечный микрореактор... Имеет некоторую задержку запуска после использования.
  id: PowerCellTinyCyber
  suffix: Full
  parent: BasePowerCell
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Power/power_cells.rsi
    layers:
    - map: [ "enum.PowerCellVisualLayers.Base" ]
      state: tiny
  - type: Item
    size: Small
  - type: Battery
    maxCharge: 250 #while in theory this could give five uses, in practice it gives 2-3 uses (between charge-up time, cooldown and idle-time). Any lower and the margins are too narrow to get more than 1 use out of the defib.
    startingCharge: 250
  - type: Tag
    tags:
      - PowerCellTiny
  - type: BatterySelfRecharger
    autoRechargeRate: 3 # Full charge in two minutes
    autoRechargePauseTime: 30
  - type: GenericVisualizer
    visuals:
      enum.BatteryVisuals.State:
        enum.PowerCellVisualLayers.Unshaded:
          Full: {visible: false}
          Neither: {visible: false}
          Empty: {visible: false}

# Riplet
- type: entity
