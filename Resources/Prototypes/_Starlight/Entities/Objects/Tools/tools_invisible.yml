- type: entity
  name: невидимые кусачки
  parent: BaseItem
  id: WirecuttersInvisible
  description: Идеальный невидимый инструмент, чтобы перекусить эти противные провода той невидимой двери! Изоляция не включена.
  components:
  - type: Sprite
    sprite: /Textures/_Starlight/Objects/Tools/Invisible/wirecutters_invisible.rsi
    state: cutters
  - type: MeleeWeapon
    wideAnimationRotation: -90
    damage:
      types:
        Piercing: 0
    attackRate: 2
  - type: BotanySampleTaker
  - type: Tool
    qualities:
    - Cutting
    useSound:
      path: /Audio/Items/wirecutter.ogg
    speedModifier: 0.05
  - type: Item
    sprite: /Textures/_Starlight/Objects/Tools/Invisible/wirecutters_invisible.rsi

- type: entity
  name: невидимая отвёртка
  parent: BaseItem
  id: ScrewdriverInvisible
  description: Давайте. Откройте невидимую панель обслуживания.
  components:
  - type: Sprite
    sprite: /Textures/_Starlight/Objects/Tools/Invisible/screwdriver_invisible.rsi
    state: screwdriver
  - type: Item
    sprite: /Textures/_Starlight/Objects/Tools/Invisible/screwdriver_invisible.rsi
  - type: MeleeWeapon
    attackRate: 1.5
    damage:
      types:
        Blunt: 0.1 #poke poke poke
  - type: Tool
    qualities:
    - Screwing
    useSound:
      collection: Screwdriver
    speedModifier: 0.05

- type: entity
  name: невидимый гаечный ключ
  parent: BaseItem
  id: WrenchInvisible
  description: Впечатлите всех, заякорив эту невидимую машину!
  components:
  - type: Sprite
    sprite: /Textures/_Starlight/Objects/Tools/Invisible/wrench_invisible.rsi
    state: icon
  - type: Item
    sprite: /Textures/_Starlight/Objects/Tools/Invisible/wrench_invisible.rsi
  - type: MeleeWeapon
    attackRate: 1.5
    damage:
      types:
        Blunt: 0.1
  - type: Tool
    qualities:
    - Anchoring
    useSound:
      path: /Audio/Items/ratchet.ogg
    speedModifier: 0.05

- type: entity
  name: невидимый ломик
  parent: BaseItem
  id: CrowbarInvisible
  description: Зачем лить беззвучные слёзы, когда можно поддеть!
  components:
  - type: Sprite
    sprite: /Textures/_Starlight/Objects/Tools/Invisible/crowbar_invisible.rsi
    state: icon
  - type: Item
    sprite: /Textures/_Starlight/Objects/Tools/Invisible/crowbar_invisible.rsi
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 1
  - type: StaminaDamageOnHit
    damage: 5 #have you ever been hit with a plastic bat? that shit hurts
  - type: Tool
    qualities:
    - Prying
  - type: ToolTileCompatible
    delay: 10
  - type: Prying
    speedModifier: 0.05

- type: entity
  name: невидимый мультитул
  parent: BaseItem
  id: MultitoolInvisible
  description: Пульс, пульс, пульс... погодите, разве не должно было быть тихо?
  components:
  - type: Sprite
    sprite: /Textures/_Starlight/Objects/Tools/Invisible/multitool_invisible.rsi
    state: icon
  - type: Item
    sprite: /Textures/_Starlight/Objects/Tools/Invisible/multitool_invisible.rsi
  - type: Tool
    qualities:
    - Pulsing
  - type: Tag
    tags:
      - Multitool

- type: entity
  name: невидимый сварочник
  parent: Welder
  id: WelderInvisible
  description: Несмотря на невидимость, защита для глаз всё равно нужна. Каким-то образом.
  components:
  - type: Sprite
    sprite: /Textures/_Starlight/Objects/Tools/Invisible/welder_invisible.rsi
  - type: Item
    size: Small
    sprite: /Textures/_Starlight/Objects/Tools/Invisible/welder_invisible.rsi
  - type: Tool
    speedModifier: 0.05

- type: entity
  name: невидимый ящик с инструментами
  parent: ToolboxBase
  id: ToolboxInvisible
  description: Идеальный невидимый носитель для вашего невидимого снаряжения!
  components:
  - type: Sprite
    sprite: /Textures/_Starlight/Objects/Tools/Invisible/toolbox_invisible.rsi
    state: icon
  - type: Item
    sprite: /Textures/_Starlight/Objects/Tools/Invisible/toolbox_invisible.rsi
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 4

- type: entity
  id: ToolboxInvisibleFilled
  name: невидимый ящик с инструментами
  suffix: Filled
  parent: ToolboxInvisible
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: WirecuttersInvisible
        - id: ScrewdriverInvisible
        - id: WrenchInvisible
        - id: CrowbarInvisible
        - id: MultitoolInvisible
        - id: WelderInvisible
