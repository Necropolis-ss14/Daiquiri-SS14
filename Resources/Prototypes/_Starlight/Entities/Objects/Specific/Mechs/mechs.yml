# Ripley MK-II
- type: entity
  id: MechRipley2
  parent: [ BaseMech, IndustrialMech, BaseCargoContraband ]
  name: Рипли АПЛУ МК-II
  description: У «МК-II» герметичная кабина для космоса, а усиленные захваты выламывают двери, но вес снизил скорость.
  components:
    - type: Sprite
      drawdepth: Mobs
      noRot: true
      sprite: _Starlight/Objects/Specific/Mechs/Mechs/ripleymkii.rsi
      layers:
        - map: [ "enum.MechVisualLayers.Base" ]
          state: base
    - type: FootstepModifier
      footstepSoundCollection:
        path: /Audio/Mecha/sound_mecha_powerloader_step.ogg
    - type: Mech
      maxIntegrity: 250 # Plasteel armor grants this mech superior durability
      equipmentWhitelist:
        tags:
          - IndustrialMech
          - PaddyUpgradeKit
      baseState: base
      openState: base-open
      brokenState: base-broken
      mechToPilotDamageMultiplier: 0.0
      airtight: true
      pilotWhitelist:
        components:
          - HumanoidAppearance
    - type: MeleeWeapon
      hidden: true
      attackRate: 1
      damage:
        types:
          Blunt: 25 #brought in line with Ripley
    - type: MovementSpeedModifier
      baseWalkSpeed: 2 #All mechs walk at the same speed
      baseSprintSpeed: 3.0 #Mk II is still slower, but not unusably slow
    - type: Damageable
      damageModifierSet: MediumArmorNT
    - type: PointLight
      lightMask: ConeSingle
      autoRot: true
      radius: 3
      energy: 5
      enabled: false
    - type: Construction
      graph: PaddyUpgrade
      node: start
      defaultTarget: paddy
    - type: Prying
      pryPowered: true

- type: entity
  id: MechRipley2Battery
  parent: MechRipley2
  suffix: Battery, Air
  components:
    - type: ContainerFill
      containers:
        mech-battery-slot:
          - MechReactorHigh
        mech-gas-tank-slot:
          - MechAirTankFilled

# Paddy
- type: entity
  id: MechPaddy
  parent: [ BaseMech, CombatMech, IndustrialMech, BaseSecurityContraband ]
  name: Пэдди
  description: Автономный погрузчик подтипа Пэдди. Переделанный МК-II Рипли для лёгкой охраны.
  components:
    - type: Sprite
      drawdepth: Mobs
      noRot: true
      sprite: _Starlight/Objects/Specific/Mechs/Mechs/paddy.rsi
      layers:
        - map: [ "enum.MechVisualLayers.Base" ]
          state: base
        - state: base-sirens
          map: [ "enum.MechVisualLayers.Siren" ]
          shader: unshaded
          visible: false
    - type: FootstepModifier
      footstepSoundCollection:
        path: /Audio/Mecha/sound_mecha_powerloader_step.ogg
    - type: Mech
      equipmentWhitelist:
        tags:
          - IndustrialMech
          - NonLethalMech
      baseState: base
      openState: base-open
      brokenState: base-broken
      mechToPilotDamageMultiplier: 0.0
      airtight: true
      maxIntegrity: 250
      maxEquipmentAmount: 4
      pilotWhitelist:
        components:
          - HumanoidAppearance
    - type: MechSiren
    - type: MeleeWeapon
      hidden: true
      attackRate: 1
      bluntStaminaDamageFactor: 2 # Raised from 1.5 to give it more nonlethal capacity.
      damage:
        types:
          Blunt: 20 # Lowered from 30 to 20 to emphasize it to be nonlethal and put it onpar with a truncheon.
    - type: MovementSpeedModifier
      baseWalkSpeed: 2
      baseSprintSpeed: 4
    - type: PointLight
      lightMask: ConeSingle
      autoRot: true
      radius: 5
      energy: 5
      enabled: false
    - type: Prying
      pryPowered: true

- type: entity
  id: MechPaddyBattery
  parent: MechPaddy
  suffix: Battery, Air
  components:
    - type: ContainerFill
