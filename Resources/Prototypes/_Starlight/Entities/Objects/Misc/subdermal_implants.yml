- type: entity
  parent: BaseSubdermalImplant
  id: MagillitisSerumImplant
  name: имплант сыворотки магиллита
  description: Экспериментальный биочип, вызывающий необратимый быстрый рост мышц у гоминид. Побочные эффекты могут включать гипертрихоз, вспышки ярости и бесконечную любовь к бананам.
  categories: [HideSpawnMenu]
  components:
    - type: SubdermalImplant
      implantAction: ActionActivateMagillitisSerumImplant
      whitelist:
        components:
          - Hands
    - type: TriggerOnActivateImplant
    - type: PolymorphOnTrigger
      polymorph: RampagingGorilla
      targetUser: true

