- type: entity
  parent: [BaseItem, BaseSyndicateContraband ]
  id: LoneopDeclarationOfWar
  name: объявитель войны
  description: Используйте, чтобы отправить объявление о враждебности цели. Столь дерзкий шаг привлечёт внимание влиятельных покровителей в Синдикате, которые снабдят вас огромным количеством бонусных телекристаллов. Нужно использовать в начале миссии, иначе покровители потеряют интерес.
  components:
    - type: Sprite
      sprite: Objects/Devices/declaration_of_war.rsi
      layers:
        - state: declarator
    - type: SpawnItemsOnUse
      items:
       - id: LoneopDeclarationOfWarAnnouncementSpawner
       - id: Telecrystal
    - type: TimedDespawn
      lifetime: 300

- type: entity
  parent: [BaseItem, BaseSyndicateContraband ]
  id: LoneopDeclarationOfWarAnnouncementSpawner
  name: использованный объявитель войны
  description: Использованное объявление войны, вы не должны это видеть...
  components:
    - type: Sprite
      sprite: Objects/Devices/declaration_of_war.rsi
      layers:
        - state: declarator
    - type: AnnounceOnSpawn
      message: war-declarator-default-message
      ignoreASpace: true
      globalAnnounce: true
      sound:
       path: /Audio/Announcements/war.ogg
      color: red
    - type: TimedDespawn
      lifetime: 1
