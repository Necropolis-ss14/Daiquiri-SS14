- type: entity
  parent: ClothingBackpack
  id: ClothingBackpackRoboticist
  name: рюкзак робототехника
  description: Рюкзак, специально разработанный для защиты от масла и коротких замыканий.
  components:
    - type: Sprite
      sprite: _Starlight/Clothing/Back/Backpacks/roboticist.rsi

- type: entity
  parent: ClothingBackpack
  id: ClothingBackpackCargoSenior
  name: рюкзак старшего курьера
  description: Прочный рюкзак для тех, кто знает карту станции наизусть.
  components:
    - type: Sprite
      sprite: _Starlight/Clothing/Back/Backpacks/cargosenior.rsi

- type: entity
  parent: ClothingBackpack
  id: ClothingBackpackChemistrySenior
  name: рюкзак старшего химика
  description: Специально разработанный рюкзак, который никогда не испачкается, какие бы жидкости на него ни пролили.
  components:
    - type: Sprite
      sprite: _Starlight/Clothing/Back/Backpacks/chemistrysenior.rsi

- type: entity
  parent: [ClothingBackpack, BaseSecurityContraband]
  id: ClothingBackpackCorpsman
  name: рюкзак санитара
  description: Рюкзак с удобными карманами для организованного корпсмена!
  components:
    - type: Sprite
      sprite: _Starlight/Clothing/Back/Backpacks/corpsman.rsi

- type: entity
  parent: [ClothingBackpack, BaseCommandContraband]
  id: ClothingBackpackHoP
  name: рюкзак главы персонала
  description: Роскошный рюкзак, идеальный для заполнения доверху бумажной работой.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Back/Backpacks/hop.rsi

- type: entity
  parent: [ ClothingBackpack, BaseCommandContraband, BaseAssistantManagerContraband ]
  id: ClothingBackpackCommandGeneric
  name: рюкзак командования
  description: Рюкзак цвета командования в цветах NanoTrasen. Излучает ауру неопределённой власти.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Back/Backpacks/command.rsi

- type: entity
  parent: [ ClothingBackpack, BaseBlueShieldContraband ]
  id: ClothingBackpackBlueShield
  name: рюкзак блюшилда
  description: Лёгкий, но надёжный рюкзак. Классика не подводит!
  components:
    - type: Sprite
      sprite: _Starlight/Clothing/Back/Backpacks/blueshield.rsi

- type: entity
  parent: [ClothingBackpackERTLeader, BaseNanoTrasenContraband]
  id: ClothingBackpackNTNC
  name: рюкзак НТНК
  description: Вместительный рюкзак с множеством карманов, который носят офицеры NTNC.
  components:
    - type: ExplosionResistance
      damageCoefficient: 0.1
    - type: Sprite
      sprite: _Starlight/Clothing/Back/Backpacks/ntnc_bag.rsi

- type: entity
  parent: [BaseTSFContraband, ClothingBackpackERTLeader]
  id: ClothingBackpackTSF
  name: рюкзак морпеха ТСФ
  description: Вместительный ранец в подсумках и карманах, который носят морпехи Транс-Солнечной Федерации.
  components:
    - type: Sprite
      sprite: _Starlight/Clothing/Back/Backpacks/tsf.rsi

- type: entity
  parent: [ ClothingBackpack, BaseMagicalContraband ]
  id: ClothingBackpackWizard
  name: рюкзак волшебника
  description: Магический рюкзак, который носят члены Федерации космических волшебников.
  components:
    - type: Sprite
      sprite: _Starlight/Clothing/Back/Backpacks/wizard.rsi
    - type: ExplosionResistance
      damageCoefficient: 0.1
    - type: Storage
      grid:
      - 0,0,8,4

- type: entity
  parent: [ClothingBackpack, BaseSheatheWeapon]
  id: ClothingBackpackBunnyGang
  name: рюкзак заячьей банды
  description: Меч, который на самом деле рюкзак. Впечатляет, как им удалось всё туда впихнуть, но учёт инвентаря будет испытанием.
  components:
    - type: Sprite
      sprite: _Starlight/Clothing/Back/Backpacks/bunnygang.rsi
    - type: Storage
      grid:
      - 0,0,1,15 #its a part of the joke of the inventory being sword shaped and inconvient.

- type: entity
  parent: ClothingBackpack
  id: ClothingBackpackStar
  name: звёздный рюкзак
