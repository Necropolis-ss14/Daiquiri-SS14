## Bruise packs
- type: entity
  name: красный пак от ушибов
  description: Паки от ушибов охранного класса для твоих нужд с дубинкой!
  parent: BaseStarlightHealingItem
  id: RedBrutePack
  suffix: 20
  components:
  - type: Tag
    tags:
    - Brutepack
  - type: Sprite
    state: redbrutepack3
  - type: Item
    heldPrefix: redbrutepack
  - type: Healing
    damageContainers:
      - Biological
      - Hybrid
    delay: 1.6 # STARLIGHT
    damage:
      types:
        Blunt: -6
        Piercing: -6
        Slash: -6 # 6 for each type in the group :3
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
  - type: Stack
    stackType: RedBrutePack
    count: 20
  - type: InteractRestriction #FH - Edit
    restrictInteractionTarget:
      blacklist:  # Use blacklist instead of whitelist so can be clicked on bags/medkits
        - IPC

- type: entity
  name: красный пак от ушибов
  description: Паки от ушибов охранного класса для твоих нужд с дубинкой! Ты ей прямо размахался, а?
  parent: RedBrutePack
  id: RedBrutePack1
  suffix: 1
  components:
  - type: Sprite
    state: redbrutepack
  - type: Stack
    stackType: RedBrutePack
    count: 1

- type: entity
  name: красный пак от ушибов
  description: Паки от ушибов охранного класса для твоих нужд с дубинкой! Кто-то тут поработал!
  parent: RedBrutePack
  id: RedBrutePack10
  suffix: 10
  components:
  - type: Sprite
    state: redbrutepack2
  - type: Stack
    stackType: RedBrutePack
    count: 10

- type: stack
  id: RedBrutePack
  name: stack-redbrutepack
  icon: { sprite: "/Textures/_Starlight/Objects/Specific/Medical/medical.rsi", state: redbrutepack }
  spawn: RedBrutePack1
  maxCount: 20

# Ointments
