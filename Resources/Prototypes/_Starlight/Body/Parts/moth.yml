- type: entity
  id: PartMoth
  parent: [BaseItem, BasePart]
  name: часть тела ниана
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: TorsoMoth
  name: торс ниана
  parent: [PartMoth, BaseTorso]
  components:
