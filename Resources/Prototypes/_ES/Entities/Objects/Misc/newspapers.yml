# Base Prototypes
- type: entity
  id: BaseNewspaper
  parent: BaseItem
  name: газета
  description: Мягкая газета. Эта выпущена несколько лет назад и, похоже, не содержит ничего, чего вы уже не знаете.
  abstract: true
  components:
  - type: Sprite
    sprite: _ES/Objects/Misc/magazines.rsi
    state: newspaper
  - type: Item
    size: Small
    storedRotation: -90
    # SL Start
    inhandVisuals:
      left:
      - state: newspaper-inhand-left
      right:
      - state: newspaper-inhand-right
  - type: Appearance
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
  - type: ExtinguishableSetCollisionWake
  - type: Flammable
    fireSpread: true
    alwaysCombustible: true
    canExtinguish: true
    damage:
      types:
        Heat: 1
  - type: FireVisuals
    sprite: Effects/fire.rsi
    normalState: fire
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger: # Excess damage, don't spawn entities
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          Ash:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Edible
    delay: 7
    forceFeedDelay: 7
  - type: FlavorProfile
    flavors:
    - paper
  - type: BadFood
  - type: Solution
    id: food
    solution:
      maxVol: 1
      reagents:
      - ReagentId: Fiber
        Quantity: 1
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      SheetPrinter: 100
  - type: Tag
    tags:
    - Paper
  - type: HeldIdentityBlocker # SL End

