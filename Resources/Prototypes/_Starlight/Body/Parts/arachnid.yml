- type: entity
  id: PartArachnid
  parent: [BaseItem, BasePart]
  name: часть тела арахнида
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: CopperBlood
        Quantity: 10

