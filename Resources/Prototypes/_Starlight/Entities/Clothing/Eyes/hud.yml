- type: entity
  parent: [ClothingEyesBase, ShowSecurityIcons, BaseSovietContraband]
  id: ClothingEyesHudSovietMarine
  name: гогглы морпеха ССФ
  description: Культовые советские гогглы, широко используемые советскими войсками.
  components:
    - type: Contraband
      tier: Tier3
    - type: Sprite
      sprite: _Starlight/Clothing/Eyes/Soviet/marine_goggles.rsi
    - type: Clothing
      sprite: _Starlight/Clothing/Eyes/Soviet/marine_goggles.rsi
      clothingVisuals:
        eyes:
          - state: equipped-EYES
          - state: equipped-EYES-unshaded
            shader: unshaded
        eyes-vox:
          - state: equipped-EYES-vox
          - state: equipped-EYES-unshaded-vox
            shader: unshaded
        eyes-resomi:
          - state: equipped-EYES-resomi
          - state: equipped-EYES-unshaded-resomi
            shader: unshaded
        eyes-cyclorite:
          - state: equipped-EYES-cyclorite
          - state: equipped-EYES-unshaded-cyclorite
            shader: unshaded
    #- type: ShowSovietIcons  need faction
    - type: ShowJobIcons
    - type: ShowMindShieldIcons
    - type: EyeProtection
      protectionTime: 5
    - type: IdentityBlocker
      coverage: EYES
    - type: FlashImmunity
    - type: Armor
      modifiers:
        coefficients:
          Heat: 0.95

