- type: entity
  name: торт сновидений
  parent: [FoodCakeBase, BaseSlicingRefinableFood]
  id: FoodResomiCake
  description: Бедные резоми больше не могут гнаться за своими мечтами
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Consumable/Food/Custcake.rsi
      layers:
        - state: ResomiKart
    - type: FlavorProfile
      flavors:
        - hope
        - sadness
        - pilk
    - type: ToolRefinable
      refineResult:
      - id: FoodCakeResomiSlice
        amount: 8
    - type: Solution
      id: food
      solution:
        reagents:
          - ReagentId: Nutriment
            Quantity: 60
          - ReagentId: Vitamin
            Quantity: 10
          - ReagentId: Sugar
            Quantity: 15
    - type: Tag
      tags:
        - Cake


- type: entity
  name: хлопковый торт
  parent: [FoodCakeBase, BaseSlicingRefinableFood]
  id: FoodCottonCake
  description: Сладкое лакомство для моли
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Consumable/Food/Custcake.rsi
      layers:
        - state: mothcake
    - type: FlavorProfile
      flavors:
        - Fiber
        - Sweetness
    - type: ToolRefinable
      refineResult:
      - id: FoodCottonCakeSlice
        amount: 8
    - type: Solution
      id: food
      solution:
        reagents:
          - ReagentId: Nutriment
            Quantity: 60
          - ReagentId: Vitamin
            Quantity: 10
          - ReagentId: Sugar
            Quantity: 10
          - ReagentId: Fiber
            Quantity: 10
    - type: Tag
      tags:
        - Cake
        - ClothMade
        - CottonCake # Starlight
    - type: Edible
      requiresSpecialDigestion: true

- type: entity
  name: кусок хлопкового торта
  parent: FoodCakeSliceBase
  id: FoodCottonCakeSlice
  description: Ты разрезал моффа, как ты посмел
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Consumable/Food/Custcake.rsi
      layers:
        - state: mothcakeslice
    - type: FlavorProfile
      flavors:
        - Fiber
        - Sweetness
    - type: Solution
      id: food
      solution:
        reagents:
          - ReagentId: Nutriment
            Quantity: 7.5
          - ReagentId: Vitamin
            Quantity: 1.25
          - ReagentId: Sugar
            Quantity: 1.25
          - ReagentId: Fiber
            Quantity: 1.25
    - type: Tag
      tags:
        - Cake
        - Slice
        - ClothMade
        - CottonCake # Starlight
    - type: Edible
      requiresSpecialDigestion: true


- type: entity
  name: кусок сновидений
  parent: FoodCakeSliceBase
  id: FoodCakeResomiSlice
  description: Сломанные крылья не летают, как и резоми, из которых это сделано.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Consumable/Food/Custcake.rsi
      layers:
        - state: ResomiKartSlice
    - type: FlavorProfile
      flavors:
        - hope
        - sadness
        - pilk
    - type: Solution
      id: food
      solution:
        reagents:
          - ReagentId: Nutriment
            Quantity: 7.5
          - ReagentId: Vitamin
            Quantity: 1.25
          - ReagentId: Sugar
            Quantity: 1.875
    - type: Tag
      tags:
        - Cake
        - Slice
