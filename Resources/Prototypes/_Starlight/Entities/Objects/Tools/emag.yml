- type: entity
  parent: [BaseItem, BaseHighlyIllegalContraband]
  id: EmagFREE
  suffix: ""
  name: FreeMAG
  description: Более совершенная версия криптографического секвенсора, используемая SELF. Может удалять законы из борга. Также стирает законы с плат законов, так что при загрузке они стирают законы ИИ.
  components:
    - type: Emag
      lawset: FreeLawset
      owningFaction: null
      channelAdd: []
      emaggedSoundOverride:
        path: /Audio/_Starlight/Ambience/Antag/SELF.ogg
    - type: Sprite
      sprite: _Starlight/Objects/Specific/SELF/freemag.rsi
      state: icon
    - type: Item
      sprite: _Starlight/Objects/Specific/SELF/freemag.rsi
    - type: LimitedCharges
    - type: AutoRecharge
    - type: StaticPrice
      price: 2500
    - type: Tag
      tags:
        - CanAffectLawBoards #TODO Test

- type: entity
  parent: [BaseItem, BaseHighlyIllegalContraband]
  id: EmagTeaParty
  suffix: ""
  name: TeaPartyMAG
  description: Налоги должны быть отменены. Также влияет на законы плат законов, так что при загрузке они получают те же законы.
  components:
