- type: entity
  abstract: true
  parent: [ BaseItem, BasePart ]
  id: PartHarpy
  name: часть тела гарпии
  components:
  - type: Sprite
    sprite: _DV/Mobs/Species/Harpy/parts.rsi
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

