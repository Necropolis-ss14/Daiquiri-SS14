- type: entity
  name: самодельный ПП
  parent: [BaseWeaponSubMachineGun, BaseMinorContraband]
  id: WeaponSubMachineGunMakeshift
  description: Держится на тряпках и мечтах, зловеще гремит каждым выстрелом.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/SMGs/makeshift_smg.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Guns/SMGs/makeshift_smg.rsi
  - type: Item
    size: Normal
  - type: Gun
    fireRate: 9
    minAngle: 16
    angleIncrease: 3
    maxAngle: 40
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/smg.ogg
    angleDecay: 12
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: ItemSlots
    slots:
      gun_magazine:
        name: item-slot-component-slot-name-magazine
        startingItem: null
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineSMGImprovised
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: item-slot-component-slot-name-chamber
        startingItem: null
        priority: 1
        whitelist:
          tags:
            - CartridgePistolImprovised
  - type: Construction
    graph: MakeshiftSMGGraph
    node: shotgun
  - type: WeaponDismantleOnShoot
    dismantleChance: 0.03 #Very low to account for automatic weapon fire, if entire mag is shot 3/10 SMGs will survive
    selfDamage:
      types:
        Blunt: 5
        Heat: 5
    items:
      - id: ModularBarrel
        launchAngle: 0
        prob: 1
      - id: ModularReceiver
        launchAngle: 90
        prob: 0.30
      - id: RifleStock
        launchAngle: 180
        prob: 0.80
      - id: MagazinePistolSubMachineGunImprovised
        launchAngle: 190
        prob: 1
  - type: ContainerFill
    containers:
      firing_pin:
      - FiringPinMakeshift
  - type: FiringPinHolder
    supportedPins: [ Makeshift, GunUpgrade ]

