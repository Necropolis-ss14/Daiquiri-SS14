## Bruise packs
# NanoMed GOLD yellow bruise packs
- type: entity
  name: золотой пак от ушибов
  description: Лимитированные золотые паки от ушибов.
  parent: BaseStarlightHealingItem
  id: GoldBrutePack
  suffix: Full
  components:
  - type: Tag
    tags:
    - Brutepack
  - type: Sprite
    state: yellowbrutepack2
  - type: Item
    heldPrefix: goldbrutepack
  - type: Stack
    stackType: GoldBrutePack
    count: 10
  - type: Healing
    damageContainers:
      - Biological
      - Hybrid
    delay: 1.6
    damage:
      types:
        Blunt: -8
        Piercing: -8
        Slash: -8 # 8 for each type in the group! Wow, that's amazing!
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
  - type: InteractRestriction
    restrictInteractionTarget:
      blacklist:  # Use blacklist instead of whitelist so can be clicked on bags/medkits
        - IPC

- type: entity
  name: золотой пак от ушибов
  description: Лимитированные золотые паки от ушибов. Страшная редкость. Береги их.
  parent: GoldBrutePack
  id: GoldBrutePack1
  suffix: Single
  components:
  - type: Sprite
    state: yellowbrutepack
  - type: Stack
    stackType: GoldBrutePack
    count: 1

- type: stack
  id: GoldBrutePack
  name: stack-goldbrutepack
  spawn: GoldBrutePack1
  maxCount: 10

