  components:
  - type: FlavorProfile
    flavors:
    - fishy
  - type: Tag
    tags:
    - Cooked
    - Meat
  - type: Sprite
    sprite: _TP/Objects/Consumable/fried-food.rsi
    state: Fish_Sticks
  - type: Solution
    id: food
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: Protein
        Quantity: 5

- type: entity
