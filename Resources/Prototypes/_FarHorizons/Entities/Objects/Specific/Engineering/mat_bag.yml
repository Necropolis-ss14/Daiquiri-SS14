- type: entity
  name: строительная сумка
  id: MatBag
  parent: BaseStorageItem
  description: Грубая, грязная, тяжёлая строительная сумка с неаккуратно приваренным сбоку магнитом. Её можно положить в рюкзак или прикрепить к бедру как пояс.
  components:
  - type: ItemToggle
    onUse: false
    onActivate: false
    verbToggleOn: verb-toggle-magnet-activate
    verbToggleOff: verb-toggle-magnet-deactivate
    soundActivate:
      collection: sparks
      params:
        variation: 0.250
    soundDeactivate:
      collection: sparks
      params:
        variation: 0.250
  - type: AltUseToggle
  - type: ComponentToggler
    components:
    - type: MagnetPickup
      requiresEquipping: false
  - type: Sprite
    sprite: _FarHorizons/Objects/Specific/Engineering/mat_bag.rsi
    state: icon
  - type: Clothing
    sprite: _FarHorizons/Objects/Specific/Engineering/mat_bag.rsi
    quickEquip: false #SL
    slots: belt
  - type: Item
    size: Large
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,5,3
    quickInsert: true
    areaInsert: true
    whitelist:
      tags:
        - ConstructionMaterial
        - CableCoil
  - type: Dumpable
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { state: "magnet" }
          False: { state: "icon" }

- type: entity
  parent: MatBag
  id: MatBagFilled
  suffix: Filled
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: SheetPlasteel
        - id: SheetPlasteel
        - id: SheetPlasteel
        - id: SheetGlass
        - id: SheetSteel
        - id: SheetSteel

