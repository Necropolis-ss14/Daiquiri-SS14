#Longswords
- type: entity
  parent: [ BaseContrabandTier3, BaseSword, BaseCommandContraband ] # Blimpuf
  id: PrototypeVibroblade
  name: виброклинок SCSPT-101
  description: На раннем этапе разработки SCS-111 для Корпоративного Консорциума было много тестовых проектов, финализованных в прототип SCS-101. Эти клинки стали шаблоном для прыжка Консорциума от дробильного оружия к дозвуковому колющему виброоружию.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Melee/crusher_sword.rsi
  - type: MeleeWeapon
    attackRate: 1.2
    range: 1.25
    damage:
      types:
        Slash: 10
        Piercing: 10
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg
  - type: Reflect
    reflectProb: .2
    spread: 90
  - type: Item
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/captain_sabre_storage_64x.rsi #Done in 64x64 because it looks way too puny in 32x32
    shape:
    - 0,0,0,3
  - type: Tag
    tags:
    - PrototypeVibroblade
  - type: DisarmMalus
  - type: SentienceTarget
    flavorKind: station-event-random-sentience-flavor-inanimate
    weight: 0.0002 # 5,000 times less likely than 1 regular animal
  - type: PirateAccent
    # not putting a BlockMovement component here cause that's funny.

#Longswords
- type: entity
  parent: [ BaseSword, BaseCentcommContraband ]
  id: CentcommVibroblade
  name: виброклинок SCSPT-111
  description: Vulcan Industries по заказу Корпоративного Консорциума спроектировала и массово выпускала оружие с упором на дробильные технологии. Так родился вариант SCS-111, клинок чистой точности на дозвуковом режущем дизайне из материала, держащегося против форонового оружия.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Melee/cc_crusher_sword.rsi
  - type: MeleeWeapon
    attackRate: 2.0
    range: 1.5
    damage:
      types:
        Slash: 15
        Piercing: 15
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg
  - type: Reflect
    reflectProb: .3
    spread: 90
  - type: Item
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/captain_sabre_storage_64x.rsi #Done in 64x64 because it looks way too puny in 32x32
    shape:
    - 0,0,0,3
  - type: Tag
    tags:
    - CentcommVibroblade
  - type: DisarmMalus
  - type: SentienceTarget
    flavorKind: station-event-random-sentience-flavor-inanimate
    weight: 0.0002 # 5,000 times less likely than 1 regular animal
  - type: PirateAccent
    # not putting a BlockMovement component here cause that's funny.
