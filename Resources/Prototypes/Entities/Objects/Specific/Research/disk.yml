- type: entity
  parent: ResearchDisk
  id: ResearchDiskDebug
  name: диск исследовательских очков
  suffix: DEBUG, DO NOT MAP
  categories: [ DoNotMap ]
  description: Диск для сервера РНД, содержащий все очки, которые вам когда-либо понадобятся.
  components:
  - type: ResearchDisk
    unlockAllTech: true

- type: entity
  parent: BaseItem
  id: TechnologyDisk
  name: технологический диск
  description: Диск с технологическими данными для сервера РНД.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    layers:
    - state: datadisk_base
      map: [ "base" ]
    - state: datadisk_label
    - state: datadisk_t2_marks
      shader: unshaded
      map: [ "t2_marks" ]
      visible: false
    - state: datadisk_t2_border
      map: [ "t2_border" ]
      visible: false
    - state: datadisk_t3_marks
      map: [ "t3_marks" ]
      shader: unshaded
      visible: false
    - state: datadisk_t3_border
      map: [ "t3_border" ]
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.TechDiskVisuals.Discipline:
        base:
          Industrial: { color: "#eeac34" }
          Arsenal: { color: "#dc373b" }
          Experimental: { color: "#9a6ef0" }
          CivilianServices: { color: "#7ecd48" }
          Biochemical: { color: "#6ceeee" } # Starlight, biochem

      enum.TechDiskVisuals.Tier:
        t2_marks:
          2: { visible: true }
        t2_border:
          2: { visible: true }
        t3_marks:
          3: { visible: true }
        t3_border:
          3: { visible: true }
  - type: StealTarget
    stealGroup: TechnologyDisk
  - type: TechnologyDisk

