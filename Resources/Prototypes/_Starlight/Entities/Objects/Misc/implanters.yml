# USSP Implanters

- type: entity
  id: BaseImplantOnlyImplanterSyndi_StarLight
  parent: [BaseImplantOnlyImplanter, BaseSovietContraband]
  name: синдикатовский имплантер
  description: Компактный одноразовый шприц, предназначенный исключительно для введения подкожных имплантов.
  abstract: true
  components:
    - type: Contraband # Blimpuf
      tier: Tier3
    - type: Item
      sprite: Objects/Specific/Medical/syndi_implanter.rsi
      heldPrefix: implanter
    - type: Sprite
      sprite: Objects/Specific/Medical/syndi_implanter.rsi
      state: implanter1
      layers:
        - state: implanter0
          map: [ "implantFull" ]
          visible: true
        - state: implanter1
          map: [ "implantOnly" ]
    - type: GenericVisualizer
      visuals:
        enum.ImplanterVisuals.Full:
          implantFull:
            True: {visible: true}
            False: {visible: false}
        enum.ImplanterImplantOnlyVisuals.ImplantOnly:
          implantOnly:
            True: {state: broken}
            False: {state: implanter1}
    - type: Tag
      tags: []

- type: entity
  id: USSPUplinkImplanterEmpty
  suffix: Empty
  parent: BaseImplantOnlyImplanterSyndi_StarLight
  name: имплантер СКБ
  description: Хрупкий одноразовый шприц, предназначенный исключительно для введения подкожных имплантов агентам СКБ.
  components:
  - type: Implanter
    drawTime: 5
    currentMode: Draw
    implantOnly: false
    deimplantWhitelist:
    - MindShieldImplant
    deimplantFailureDamage:
        types:
          Heat: 30
  - type: Item
    sprite: _Starlight/Objects/Specific/USSP/SKB_implanter.rsi
    heldPrefix: implanter
  - type: Sprite
    sprite: _Starlight/Objects/Specific/USSP/SKB_implanter.rsi
    state: implanter0
    layers:
      - state: implanter0
        map: [ "implantOnly" ]
        visible: true
      - state: implanter1
        map: [ "implantFull" ]
        visible: false
  - type: GenericVisualizer
    visuals:
      enum.ImplanterVisuals.Full:
        implantFull:
          True: {visible: true}
          False: {visible: false}
      enum.ImplanterImplantOnlyVisuals.ImplantOnly:
        implantOnly:
          True: {state: broken}
          False: {state: implanter0}

- type: entity
  id: USSPUplinkImplanter
  suffix: USSP uplink
  parent: BaseImplantOnlyImplanterSyndi_StarLight
  name: имплантер СКБ
  description: Хрупкий одноразовый шприц, предназначенный исключительно для введения подкожных имплантов агентам СКБ. Растворяется при использовании.
  components:
  - type: Implanter
    implant: USSPUplinkImplant
    dissolveOnUse: true
  - type: Item
    sprite: _Starlight/Objects/Specific/USSP/SKB_implanter.rsi
    heldPrefix: implanter
  - type: Sprite
    sprite: _Starlight/Objects/Specific/USSP/SKB_implanter.rsi
    state: implanter1
    layers:
      - state: implanter0
        map: [ "implantFull" ]
        visible: true
      - state: implanter1
        map: [ "implantOnly" ]

