- type: entity
  parent: [BaseTSFContraband, ClothingBackpackSatchel]
  id: ClothingBackpackRadioTSF
  name: ранцевая радиостанция ТСФ
  description: Прочный ранец, используемый для связи с центральным командованием.
  components:
    - type: Sprite
      sprite: _Starlight/Clothing/Back/rtp.rsi
    - type: UserInterface
      interfaces:
        enum.HolopadUiKey.InteractionWindow:
          type: HolopadBoundUserInterface
        enum.StorageUiKey.Key:
          type: StorageBoundUserInterface
    - type: Telephone
      transmissionRange: Unlimited
      compatibleRanges:
        - Grid
        - Map
        - Unlimited
      ringTone: /Audio/_Starlight/Machines/telephone_ring.ogg
      listeningRange: 0
    - type: Holopad
    - type: ActivatableUI
      key: enum.HolopadUiKey.InteractionWindow
    - type: TypingIndicator
      proto: robot
    - type: Speech
      speechVerb: Robotic
      speechSounds: PhoneSpeak
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.TelephoneVisuals.Key:
          lights:
            Idle: { state: icon }
            Calling: { state: ring }
            Ringing: { state: ring }
            InCall: { state: ear }
            EndingCall: { state: ring }
    - type: EntityTableContainerFill
      containers:
        storagebase:
          id: HandLabeler

- type: entity
  parent: [BaseTSFContraband, ClothingBackpackSatchel, BaseToggleClothing]
  id: ClothingBackpackThermalCloakTSF
  name: термоплащ «Фантом»
  description: Лёгкие термодемпферы и оптический камуфляж этого плаща слабее, чем у стандартных маскировочных костюмов UNMC. Взамен плащ можно носить поверх боевой брони, обеспечивая высокую мобильность и адаптивность.
  components:
    - type: Sprite
      sprite: _Starlight/Clothing/Back/thermalcloak.rsi
    - type: ItemToggle
      onUse: false
      onActivate: false
    - type: ToggleClothing
      action: ActionTogglePhaseCloak
      disableOnUnequip: true
    - type: ComponentToggler
      parent: true
      components:
        - type: Stealth
          minVisibility: 0.15
          maxVisibility: 0.15
          lastVisibility: 0.15
    - type: PowerCellDraw
      drawRate: 14 # roughly 200 seconds on the default cell
    - type: ToggleCellDraw
    - type: PowerCellSlot
      cellSlotId: cell_slot
      fitsInCharger: false
    - type: ContainerContainer
      containers:
        cell_slot: !type:ContainerSlot
        storagebase: !type:Container
    - type: ItemSlots
      slots:
        cell_slot:
          name: power-cell-slot-component-slot-name-default
          startingItem: PowerCellMicroreactor
          disableEject: true
          whitelist:
            tags:
              - PowerCell
          blacklist:
            tags:
            - MechReactor
