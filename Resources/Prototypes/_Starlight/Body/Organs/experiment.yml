- type: entity
  id: OrganExperimentStomach
  parent: [OrganAnimalStomach]
  name: ent-OrganExperimentStomach
  description: ent-OrganExperimentStomach-desc
  components:
  - type: Stomach
  - type: SolutionManager
    solutions:
    - SolutionOrganNutriment
    - SolutionOrganFoodMeat
    - SolutionOrganStomach50
  - type: Metabolizer
    updateInterval: 0.75

- type: entity
  id: OrganExperimentHeart
  parent: [BaseAnimalOrgan, BaseOrganHeart]
  name: ent-OrganExperimentHeart
  description: ent-OrganExperimentHeart-desc
  components:
  - type: Sprite
    state: heart-on
  - type: Organ
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [ Experiment ]
    stages: [ Bloodstream ]
    updateInterval: 0.75
  - type: Item
    size: Small
    heldPrefix: heart

- type: entity
  id: OrganExperimentLiver
  parent: [ BaseAnimalOrgan, BaseOrganLiver]
  name: ent-OrganExperimentLiver
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    state: liver
  - type: Organ
  - type: Metabolizer
    maxReagents: 1
    metabolizerTypes: [ Experiment ]
    stages: [ Metabolites ]
  - type: Item
    size: Small
    heldPrefix: liver

- type: entity
  id: OrganExperimentEyes
  parent: OrganHumanEyes
  name: ent-OrganExperimentEyes
  suffix: Experiment
  description: ent-OrganExperimentEyes-desc
  components:
  - type: OrganVisualization
    layer: Eyes
    prototypes:
      Default: MobExperimentEyes
  - type: FunctionalOrgan
    comps:
      - type: PointLight
        color: orange
      - type: FlashImmunityTogglePointLight
        invert: true

- type: entity
  id: OrganExperimentTongue
  parent: OrganHumanTongue
  name: ent-OrganExperimentTongue
  suffix: Experiment
  description: ent-OrganExperimentTongue-desc
  components:
  - type: OrganTongue
    sounds:
      Male: Experiment
      Female: Experiment
      Unsexed: Experiment
