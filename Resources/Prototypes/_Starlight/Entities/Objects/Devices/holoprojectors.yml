- type: entity
  parent: Holoprojector
  id: HoloprojectorEngineering
  name: инженерный голопроектор-предупреждение
  description: Создаёт нетвёрдую предупреждающую проекцию для обозначения опасностей.
  components:
    - type: HolosignProjector
      signProto: HolosignEngineeringWarning
      chargeUse: 60
    - type: Sprite
      sprite: _Starlight/Objects/Devices/Holoprojectors/engineering.rsi
      state: icon
    - type: Tag
      tags:
        - HolofanProjector
        - SecBeltEquip
        - HoloprojectorCrafting
    - type: StaticPrice
      price: 40

- type: entity
  parent: HoloprojectorEngineering
  id: HoloprojectorEngineeringEmpty
  suffix: Empty
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        blacklist:
          tags:
          - MechReactor

- type: entity
  parent: [ Holoprojector, BaseMinorContraband ]
  id: FalseShutterProjector
  name: проектор ложных ставней
  description: Выглядит почти как настоящее. Полезно для блокировки обзора рассеянных или невнимательных, пока вы делаете то, что нужно.
  components:
  - type: HolosignProjector
    signProto: HolosignFalseShutter
    chargeUse: 60
  - type: Sprite
    sprite: _Starlight/Objects/Devices/Holoprojectors/shutter.rsi
    state: icon
  - type: Tag
    tags:
      - HolosignProjector
  - type: StaticPrice
    price: 80

- type: entity
  parent: FalseShutterProjector
  id: FalseShutterProjectorEmpty
  suffix: Empty
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        blacklist:
          tags:
          - MechReactor
  - type: Construction
    graph: FalseShutterProjectorEmpty
    node: projector
