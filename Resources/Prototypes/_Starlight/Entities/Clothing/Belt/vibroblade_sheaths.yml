- type: entity
  parent: [ClothingBeltBase, ClothingSlotBase, BaseCentcommContraband, BaseSheatheWeapon]
  id: CentcommVibrobladeSheath
  name: ножны для виброклинка ЦК
  description: «Вулкан Индастриз» считали, что обслуживание виброоружия нужно откладывать как можно дольше, а качество клинков держать на высоте всегда; специально для Корпоративного консорциума были созданы ножны, в которых дозвуковые свойства клинка замедляют его деградацию, пока он не используется.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Belt/cc_crusher_belt.rsi
    state: sheath
  - type: Clothing
    sprite: _Starlight/Clothing/Belt/cc_crusher_belt.rsi
  - type: Item
    size: Ginormous
  - type: ItemSlots
    slots:
      item:
        name: item-slot-component-slot-name-sabre
        insertVerbText: sheath-insert-verb
        ejectVerbText: sheath-eject-verb
        insertSound: /Audio/Items/sheath.ogg
        ejectSound: /Audio/Items/unsheath.ogg
        whitelist:
          tags:
          - CentcommVibroblade
  - type: ItemMapper
    mapLayers:
      sheath-sword:
        whitelist:
          tags:
          - CentcommVibroblade
  - type: Appearance

- type: entity
  parent: CentcommVibrobladeSheath
  id: CentcommVibrobladeSheathFilled
  name: ножны для виброклинка ЦК
  description: "{ ent-CentcommVibrobladeSheath-desc }"
  suffix: Filled
  components:
  - type: ContainerFill
    containers:
      item:
      - CentcommVibroblade

- type: entity
  parent: [ClothingBeltBase, ClothingSlotBase, BaseCentcommContraband, BaseSheatheWeapon]
  id: PrototypeVibrobladeSheath
  name: ножны прототипа виброклинка
  description: Vulcan Industries believed that maintenance of the Vibroweapons should be delayed as much as possible and the quality of the blades to be at top notch at all times, even for the prototypes of the final weapons that were to be completed and shipped out. This sheath was designed to fit one of the final prototype designs that Vulcan Industries would conceptalize and produce.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Belt/crusher_belt.rsi
    state: sheath
  - type: Clothing
    sprite: _Starlight/Clothing/Belt/crusher_belt.rsi
  - type: Item
    size: Ginormous
  - type: ItemSlots
    slots:
      item:
        name: item-slot-component-slot-name-sabre
        insertVerbText: sheath-insert-verb
        ejectVerbText: sheath-eject-verb
        insertSound: /Audio/Items/sheath.ogg
        ejectSound: /Audio/Items/unsheath.ogg
        whitelist:
          tags:
          - PrototypeVibroblade
  - type: ItemMapper
    mapLayers:
      sheath-sabre:
        whitelist:
          tags:
          - PrototypeVibroblade
  - type: Appearance

- type: entity
  parent: PrototypeVibrobladeSheath
  id: PrototypeVibrobladeSheathFilled
  name: ножны прототипа виброклинка
  description: Vulcan Industries believed that maintenance of the Vibroweapons should be delayed as much as possible and the quality of the blades to be at top notch at all times, even for the prototypes of the final weapons that were to be completed and shipped out. This sheath was designed to fit one of the final prototype designs that Vulcan Industries would conceptalize and produce.
  suffix: Filled
  components:
  - type: ContainerFill
    containers:
      item:
      - PrototypeVibroblade
