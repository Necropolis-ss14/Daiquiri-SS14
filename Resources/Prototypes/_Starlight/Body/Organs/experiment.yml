- type: entity
  id: OrganExperimentStomach
  parent: [OrganAnimalStomach]
  name: желудок
  description: Мерзость. Такое тяжело переварить.
  components:
  - type: Stomach
  - type: SolutionManager
    solutions:
    - SolutionOrganNutriment
    - SolutionOrganFoodMeat
    - SolutionOrganStomach50
  - type: Metabolizer
    updateInterval: 0.75

- type: entity
  id: OrganExperimentHeart
  parent: [BaseAnimalOrgan, BaseOrganHeart]
  name: сердце
  description: Замирает при виде мин.
  components:
  - type: Sprite
    state: heart-on
  - type: Organ
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [ Experiment ]
    stages: [ Bloodstream ]
    updateInterval: 0.75
  - type: Item
    size: Small
    heldPrefix: heart

- type: entity
  id: OrganExperimentLiver
  parent: [ BaseAnimalOrgan, BaseOrganLiver]
  name: печень
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    state: liver
  - type: Organ
  - type: Metabolizer
    maxReagents: 1
    metabolizerTypes: [ Experiment ]
    stages: [ Metabolites ]
  - type: Item
    size: Small
    heldPrefix: liver

- type: entity
  id: OrganExperimentEyes
  parent: OrganHumanEyes
  name: глаза
  suffix: Experiment
  description: Такого нельзя было предвидеть.
  components:
  - type: OrganVisualization
    layer: Eyes
    prototypes:
      Default: MobExperimentEyes
  - type: FunctionalOrgan
    comps:
      - type: PointLight
        color: orange
      - type: FlashImmunityTogglePointLight
        invert: true

- type: entity
  id: OrganExperimentTongue
  parent: OrganHumanTongue
  name: язык
  suffix: Experiment
  description: Мясистая мышца, в основном используемая для лжи.
  components:
  - type: OrganTongue
    sounds:
      Male: Experiment
      Female: Experiment
      Unsexed: Experiment
