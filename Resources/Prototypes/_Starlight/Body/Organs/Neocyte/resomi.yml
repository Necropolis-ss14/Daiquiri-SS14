- type: entity
  id: OrganNeoResomiEyes
  parent: OrganNeocyteEyes
  name: кибернетические глаза резоми
  suffix: Neo-Resomi
  description: Эти кибернетические глаза отлично видят ночью для охоты на добычу в технических туннелях, но очень чувствительны к ярким вспышкам.
  components:
  - type: FunctionalOrgan
    comps:
    - type: NightVision
      disabilityBlockable: true
    - type: FlashModifier
      modifier: 2

- type: entity
  id: OrganNeoResomiHeart
  parent: OrganNeocyteHeart
  name: кибернетическое сердце резоми
  suffix: Neo-Resomi
  components:
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [ Resomi, Neocyte ]
    stages: [ Bloodstream ]
- type: entity
  id: OrganNeoResomiLungs
  parent: OrganNeocyteLungs
  name: кибернетические лёгкие резоми
  suffix: Neo-Resomi
  description: Фильтруют кислород из атмосферы, который затем поступает в кровоток и используется как переносчик электронов. Полностью кибернетические по природе, работают в паре с системой фильтрации визора.
  components:
  - type: Metabolizer
    metabolizerTypes: [ Resomi, Neocyte ]
    stages: [ Respiration ]

- type: entity
  id: OrganNeoResomiTongue
  parent: OrganNeocyteTongueForked
  suffix: Neo-Resomi
  components:
  - type: OrganTongue
    sounds:
      Male: NeoResomiMSounds
      Female: NeoResomiFSounds
      Unsexed: NeoResomiMSounds
