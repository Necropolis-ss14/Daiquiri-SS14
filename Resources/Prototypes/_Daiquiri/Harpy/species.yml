- type: species
  id: Harpy
  name: species-name-harpy
  roundStart: true
  prototype: MobHarpy
  sprites: MobHarpySprites
  markingLimits: MobHarpyMarkingLimits
  dollPrototype: AppearanceHarpy
  skinColoration: HumanToned
  minHeight: 0.80
  defaultHeight: 0.95
  maxHeight: 1.2
  minWidth: 0.80
  defaultWidth: 0.95
  maxWidth: 1.2
  standardSize: 150
  standardWeight: 55
  standardDensity: 17
  customName: true

- type: speciesBaseSprites
  id: MobHarpySprites
  sprites:
    Head: MobHarpyHead
    Hair: MobHumanoidAnyMarking
    FacialHair: MobHumanoidAnyMarking
    Snout: MobHumanoidAnyMarking
    Chest: MobHarpyTorso
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    UndergarmentTop: MobHumanoidAnyMarking
    UndergarmentBottom: MobHumanoidAnyMarking
    Tail: MobHumanoidAnyMarking
    Eyes: MobHumanoidEyes
    LArm: MobHarpyLArm
    RArm: MobHarpyRArm
    LHand: MobHarpyLHand
    RHand: MobHarpyRHand
    LLeg: MobHarpyLLeg
    RLeg: MobHarpyRLeg
    LFoot: MobHarpyLFoot
    RFoot: MobHarpyRFoot

- type: markingPoints
  id: MobHarpyMarkingLimits
  points:
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 1
      required: false
    Snout:
      points: 1
      required: false
    Tail:
      points: 1
      required: true
      defaultMarkings: [ HarpyTailPhoenix ]
    HeadTop:
      points: 1
      required: true
      defaultMarkings: [ HarpyEarsDefault ]
    HeadSide:
      points: 8
      required: false
    Chest:
      points: 1
      required: true
      defaultMarkings: [ HarpyChestDefault ]
    UndergarmentTop:
      points: 1
      required: false
    UndergarmentBottom:
      points: 1
      required: false
    Arms:
      points: 6
      required: false
      defaultMarkings: [ HarpyWingDefaultHuescale ]
    Legs:
      points: 6
      required: false

