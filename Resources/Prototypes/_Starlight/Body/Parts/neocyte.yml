    sprite: _FarHorizons/Mobs/Species/Protogen/parts.rsi
    state: "head_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 5
      - ReagentId: BatteryAcid
        Quantity: 5
      - ReagentId: Blood
        Quantity: 10

