# Sneeze and Smell Target are granted/revoked dynamically, not at MapInit - see SharedScentSystem.
- type: entity
  parent: BaseAction
  id: ActionToggleSniff
  name: Включить обоняние
  description: Начать или прекратить активное обоняние, позволяя видеть оставшиеся следы запахов в мире.
  components:
  - type: Action
    useDelay: 0.5
    icon: { sprite: _Starlight/Interface/Actions/actions_scent.rsi, state: smell-off }
    iconOn: { sprite: _Starlight/Interface/Actions/actions_scent.rsi, state: smell-on }
  - type: InstantAction
    event: !type:ToggleSniffActionEvent

- type: entity
  parent: BaseAction
  id: ActionSneeze
  name: Чихнуть
  description: Очистить нос от запаха, который вы отслеживали.
  components:
  - type: Action
    useDelay: 2
    icon: { sprite: _Starlight/Interface/Actions/actions_scent.rsi, state: sneeze }
  - type: InstantAction
    event: !type:SneezeActionEvent

- type: entity
  parent: BaseAction
  id: ActionSniffObject
  name: Понюхать цель
  description: Понюхать цель, чтобы определить оставленные на ней запахи.
  components:
  - type: Action
    useDelay: 0.5
    icon: { sprite: _Starlight/Interface/Actions/actions_scent.rsi, state: smell-target }
    itemIconStyle: BigAction
  - type: TargetAction
  - type: EntityTargetAction
    event: !type:SniffObjectActionEvent
