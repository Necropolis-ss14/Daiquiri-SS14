- type: entity
  parent: BaseVendingMachineRestock
  id: VendingMachineRestockSustenance
  name: набор пополнения автомата с пищей для заключённых
  description: Коробка, полная того, что юридически считается едой. Загрузите её в автомат «Пропитание» для пополнения.
  components:
  - type: VendingMachineRestock
    canRestock:
    - SustenanceInventory
  - type: Sprite
    layers:
    - state: base
    - state: green_bit
      shader: unshaded
    - state: refill_condiment

