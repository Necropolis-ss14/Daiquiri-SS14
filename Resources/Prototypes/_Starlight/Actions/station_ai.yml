# Actions

- type: entity
  parent: BaseMentalAction
  id: ActionStationAiOpenPDA
  name: Открыть КПК
  description: Открывает ваш личный цифровой помощник.
  components:
  - type: Action
    icon:
      { sprite: _Starlight/Interface/Actions/actions_aipda.rsi, state: icon }
    itemIconStyle: NoItem
  - type: InstantAction
    event: !type:ToggleIntrinsicUIEvent { key: enum.PdaUiKey.Key }

- type: entity
  parent: BaseMentalAction
  id: ActionAIShunt
  name: Перенос
  description: Перенестись в корпус борга с установленным интерфейсом ИИ.
  components:
    - type: Action
      icon:
        { sprite: _Starlight/Interface/Actions/actions_shunt.rsi, state: icon }
      iconOn:
        {
          sprite: _Starlight/Interface/Actions/actions_shunt.rsi,
          state: icon-on,
        }
      itemIconStyle: BigAction
      priority: 1
    - type: TargetAction
    - type: EntityTargetAction
      canTargetSelf: false # no whitelist cause the posibrain has the shunt comp. not the chassis.
      whitelist:
        components:
          - StationAIShunt
      event: !type:AIShuntActionEvent

- type: entity
  parent: BaseMentalAction
  id: ActionAIRemoteControl
  name: Удалённое управление
  description: Удалённо управлять переносным корпусом или интерфейсом, не переносясь в него.
  components:
    - type: Action
      useDelay: 1
      icon:
        sprite: _Starlight/Interface/Actions/actions_shunt.rsi
        state: icon
      itemIconStyle: BigAction
    - type: TargetAction
    - type: EntityTargetAction
      canTargetSelf: false
      whitelist:
        components:
          - StationAIShunt
      event: !type:AIRemoteControlActionEvent

- type: entity
  parent: BaseMentalAction
  id: ActionAIUnShunt
  name: Отмена переноса
  description: Отключиться от корпуса/интерфейса, вернувшись в ядро.
  components:
    - type: Action
      useDelay: 1
      icon:
        {
          sprite: _Starlight/Interface/Actions/actions_shunt.rsi,
          state: icon-unshunt,
        }
    - type: InstantAction
      event: !type:AIUnShuntActionEvent

- type: entity
  parent: BaseMentalAction
  id: ActionAIReconnectShunt
  name: Переподключить шунт
  description: Reconnect to the last chassis or interface you shunted into.
  components:
    - type: Action
      icon:
        { sprite: _Starlight/Interface/Actions/actions_shunt.rsi, state: icon }
      itemIconStyle: BigAction
    - type: InstantAction
      event: !type:AIReconnectShuntActionEvent

- type: entity
  parent: BaseAction
  id: ActionAIWarp
  name: Прыжок
  description: Открыть список экипажа и локаций для перемещения.
  components:
    - type: Action
      priority: 3
      itemIconStyle: BigAction
      icon:
        sprite: Interface/Actions/actions_ai.rsi
        state: warp
    - type: InstantAction
      event: !type:StationAiOpenWarpActionEvent
# Restored removed surveillance camera lights from upstream
- type: entity
  parent: BaseAction
  id: ActionSurvCameraLights
  name: Переключить подсветку камер
  description: Enable surveillance camera lights near wherever you're viewing.
  components:
  - type: Action
    priority: -5
    itemIconStyle: BigAction
    icon:
      sprite: Interface/Actions/actions_ai.rsi
      state: camera_light
  - type: InstantAction
    event: !type:RelayedActionComponentChangeEvent
      components:
      - type: LightOnCollideCollider
      - type: FixturesChange
        fixtures:
          illuminationTrigger:
            shape:
              !type:PhysShapeCircle
              radius: 5
            density: 80
            hard: false
            layer:
            - GhostImpassable
