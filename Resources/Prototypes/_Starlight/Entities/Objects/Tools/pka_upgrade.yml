#Damage Kits
- type: entity
  id: PKAUpgradeDamageExp
  parent: BasePKAUpgrade
  name: экспериментальный модуль ПКУ (заточенный)
  description: "Экспериментальный модуль: затачивает снаряды в шипы перед выстрелом ценой некоторой скорострельности."
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#b37a2d"
    - state: overlay-2
      color: "#b37a2d"
    - state: overlay-3
      color: "#b37a2d"
  - type: GunUpgrade
    tags: [ GunUpgradeDamageExp ]
    examineText: gun-upgrade-examine-text-damage
  - type: GunUpgradeDamage
    damage:
      types:
        Slash: 5
        Piercing: 5
  - type: GunUpgradeFireRate
    coefficient: .7

- type: entity
  id: PKAUpgradeDamageStruct
  parent: BasePKAUpgrade
  name: экспериментальный модуль ПКУ (структурный)
  description: "Экспериментальный модуль: делает каждый выстрел разрушительнее ценой скорострельности и урона тупым."
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#70624f"
    - state: overlay-2
      color: "#70624f"
    - state: overlay-3
      color: "#70624f"
  - type: GunUpgrade
    tags: [ GunUpgradeDamageExp ]
    examineText: gun-upgrade-examine-text-damage
  - type: GunUpgradeDamage
    damageMultiplier:
      types:
        Blunt: 0.25
        Structural: 2.5
  - type: GunUpgradeFireRate
    coefficient: .7

- type: entity
  id: PKAUpgradeDamageCaus
  parent: BasePKAUpgrade
  name: экспериментальный модуль ПКУ (кислотный)
  description: "Экспериментальный модуль: пропитывает каждый снаряд фторсульфоновой кислотой. Наносит урон конструкциям и мягким тканям, но сильно замедляет снаряды, снижает скорострельность и почти лишает их урона тупым."
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#222f12"
    - state: overlay-2
      color: "#222f12"
    - state: overlay-3
      color: "#222f12"
  - type: GunUpgrade
    tags: [ GunUpgradeDamageExp ]
    examineText: gun-upgrade-examine-text-damage
  - type: GunUpgradeDamage
    damage:
      types:
        Caustic: 8
        Structural: 5
    damageMultiplier:
      types:
        Blunt: 0.15
  - type: GunUpgradeSpeed
    coefficient: .7
  - type: GunUpgradeFireRate
    coefficient: .7

- type: entity
  id: PKAUpgradeDamageAdv
  parent: BasePKAUpgrade
  name: продвинутый модуль ПКУ (урон)
  description: Продвинутая версия модуля урона, несовместима с базовой и экспериментальными версиями.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#ff1100"
    - state: overlay-2
      color: "#ff1100"
    - state: overlay-3
      color: "#ff1100"
  - type: GunUpgrade
    tags:
      - GunUpgradeDamage
      - GunUpgradeDamageExp
    examineText: gun-upgrade-examine-text-damage
  - type: GunUpgradeDamage
    damage:
      types:
        Structural: 17
    damageMultiplier:
      types:
        Blunt: 2

#Range Kits
- type: entity
