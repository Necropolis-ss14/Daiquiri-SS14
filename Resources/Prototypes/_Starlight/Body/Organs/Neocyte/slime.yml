- type: entity
  id: SentientNeoSlimeCore
  parent: SentientSlimeCore
  name: улучшенное ядро разумного слайма
  suffix: Neo-Slime
  description: Источник невероятной, бесконечной слизистости.
  components:
    - type: Stomach
      specialDigestible:
        tags:
        - RamChip
      isSpecialDigestibleExclusive: false
    - type: Metabolizer
      maxReagents: 6
      metabolizerTypes: [ Slime, Animal ]
      stages: [ Digestion, Metabolites ]
    - type: SolutionManager
      solutions:
      - SolutionOrganSlime
      - SolutionOrganFoodGreyMatterLarge
      - SolutionOrganStomach50

- type: entity
  id: OrganNeoSlimeHeart
  parent: OrganSlimeHeart
  name: улучшенный циркулятор слайма
  suffix: Neo-Slime
  description: Маленький циркулятор, гоняющий жидкость по телу слайма.
  components:
  - type: Metabolizer
    maxReagents: 6
    metabolizerTypes: [ Slime, Neocyte ]
    stages: [ Bloodstream ]
  - type: OrganDamage
    damage:
      types:
        Shock: 130
        Cellular: 30 # 1.5x cellular, since it can make it impossible to revive them with the half healing they get
        Bloodloss: 20
        Caustic: 20
        Radiation: 10

- type: entity
  id: OrganNeoSlimeLungs
  parent: OrganSlimeLungs
  name: улучшенные газовые мешки слайма
  suffix: Neo-Slime
  description: Собирают азот, который клетки слайма используют для жизнедеятельности.
  components:
  - type: OrganDamage
    damage:
      types:
        Asphyxiation: 130
        Cellular: 30 # 1.5x cellular, since it can make it impossible to revive them with the half healing they get
        Bloodloss: 20
        Radiation: 30

- type: entity
  id: OrganNeoSlimePeepoids
  parent: OrganSlimePeepoids
  name: улучшенные пипоиды
  suffix: Neo-Slime
  description: Примитивные и сопливые, но почти так же хороши, как человеческий аналог.
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Slime/organs.rsi
    state: peepoids
  - type: Item
    size: Small
    heldPrefix: peepoids
  - type: OrganVisualization
    layer: Eyes
    prototypes:
      Default: MobHumanoidEyes
  - type: OrganDamage
    damage:
      types:
        Poison: 10
        Cellular: 15 # 1.5x cellular, since it can make it impossible to revive them with the half healing they get
        Bloodloss: 10
        Radiation: 10
        Caustic: 10

- type: entity
  id: OrganNeoSlimeSlurpoid
  parent: OrganSlimeSlurpoid
  name: улучшенный сларпоид
  suffix: Neo-Slime
  description: По консистенции — чистое желе.
  components:
  - type: OrganTongue
    allowedEmotes: ['Chirp', 'Hisses', 'Squish', 'Bubble', 'Pop', 'Bubble', 'Pop', 'Purr', 'Growl', 'Trill', 'Scree', 'Call', 'Squawk', 'Bark', 'Snarl', 'Whine', 'Howl', 'Yip', 'Mew', 'Meow', 'Liss', 'Lurr', 'Rattle', "Marr", "Wurble", 'Chitter', 'Squeak', 'Click', 'Beep', 'Ping', 'Buzz', 'Buzz-Two', 'Chime', 'Honk', 'ThavenHum', 'ThavenGlub', 'Squee', 'Snort', 'Sneeze', 'LagomorphSnore']
    sounds:
      Male: NeoHumanMSounds
      Female: NeoHumanFSounds
      Unsexed: NeoHumanMSounds
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Slime/organs.rsi
    state: slurpoid
  - type: OrganDamage
    damage:
      types:
        Poison: 10
        Cellular: 15 # 1.5x cellular, since it can make it impossible to revive them with the half healing they get
        Bloodloss: 10
        Radiation: 10
        Caustic: 10
