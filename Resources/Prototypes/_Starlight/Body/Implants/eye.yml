- type: entity
  id: BaseEntityEyeImplant
  abstract: true
  parent: [ BaseItem, BaseImplant ]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/implants.rsi
  - type: Organ
  - type: EyeImplant
  - type: FlavorProfile
    flavors:
      - people

- type: entity
  id: EyeImplantWelding
  name: сварочный имплант
  description: Защищает глаза от сварочных вспышек.
  parent: BaseEntityEyeImplant
  components:
  - type: Sprite
    state: eye_implant_welding
  - type: FunctionalOrgan
    comps:
    - type: EyeProtection
    - type: WeldingMask

- type: entity
  id: EyeImplantDiagnostic
  name: диагностический имплант
  description: Позволяет видеть информацию о механизмах без диагностических очков.
  parent: BaseEntityEyeImplant
  components:
  - type: Sprite
    state: eye_implant_diagnostic
  - type: FunctionalOrgan
    comps:
    - type: ShowAccessReaderSettings
    - type: ShowHealthBars
      damageContainers:
      - Inorganic
      - Silicon
      - IPC
      - Hybrid
      - MoffDemonInorganic

- type: entity
  id: EyeImplantMedical
  name: медицинский имплант
  description: Позволяет видеть информацию о гуманоидах без медицинских очков.
  parent: BaseEntityEyeImplant
  components:
  - type: Sprite
    state: eye_implant_medical
  - type: FunctionalOrgan
    comps:
    - type: ShowHealthBars
      damageContainers:
      - Biological
      - Hybrid # Neocytes
      - MoffDemonBiological
    - type: ShowHealthIcons
      damageContainers:
        - Biological
        - Hybrid

- type: entity
  id: EyeImplantChemistry
  name: химический имплант
  description: Позволяет видеть информацию о растворах без очков химического анализа.
  parent: BaseEntityEyeImplant
  components:
  - type: Sprite
    state: eye_implant_chemistry
  - type: FunctionalOrgan
    comps:
    - type: SolutionScanner

- type: entity
  id: EyeImplantSecurity
  name: охранный имплант
  description: Позволяет видеть информацию об экипаже станции без охранных очков.
  parent: BaseEntityEyeImplant
  components:
  - type: Sprite
    state: eye_implant_security
  - type: FunctionalOrgan
    comps:
    - type: ShowJobIcons
    - type: ShowMindShieldIcons
    - type: ShowCriminalRecordIcons

- type: entity
  id: EyeImplantSyndie
  name: синди-имплант
  description: Позволяет видеть информацию об экипаже станции, гуманоидах и синдикатовцах без всяких очков.
  parent: [ BaseEntityEyeImplant, BaseSyndicateContraband ]
  components:
  - type: Sprite
    state: eye_implant_syndicate
  - type: FunctionalOrgan
    comps:
    - type: ShowHealthBars
      damageContainers:
      - Biological
      - Hybrid # Neocytes
      - MoffDemonBiological
    - type: ShowHealthIcons
      damageContainers:
        - Biological
        - Hybrid
    - type: ShowJobIcons
    - type: ShowMindShieldIcons
    - type: ShowCriminalRecordIcons
    - type: ShowSyndicateIcons
