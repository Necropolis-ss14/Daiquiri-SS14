- type: entity
  id: OrganShadekinBrain
  parent: OrganHumanBrain
  name: мозг шейдкина
  suffix: Shadekin
  description: Источник невероятного, бесконечного интеллекта. Марр.
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Shadekin/organs.rsi
    state: brain

- type: entity
  id: OrganShadekinEyes
  parent: OrganHumanEyes
  name: глаза шейдкина
  suffix: Shadekin
  description: Глаза черноглазого шейдкина, который больше никогда не увидит родную реальность. Отлично видят ночью, но из-за этого очень чувствительны к ярким вспышкам.
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Shadekin/organs.rsi
    layers:
      - state: eyes
  - type: FunctionalOrgan
    comps:
    - type: NightVision
      disabilityBlockable: true
    - type: FlashModifier
      modifier: 2
  - type: OrganVisualization
    layer: Eyes
    prototypes:
      Default: MobShadekinEyes
  - type: Tag
    tags:
      - ShadekinEyes

- type: entity
  id: OrganShadekinTongue
  parent: OrganHumanTongue
  name: язык шейдкина
  suffix: Shadekin
  description: Используется для марра и изредка вурбла.
  components:
  - type: OrganTongue
    allowedEmotes: ["Marr", "Wurble", "Hisses", "Growl", "Purr"]
    sounds:
      Male: MaleShadekin
      Female: FemaleShadekin
      Unsexed: MaleShadekin
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Shadekin/organs.rsi
    state: tongue

