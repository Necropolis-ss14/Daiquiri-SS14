#CMO
- type: entity
  parent: [ClothingUniformBase, BaseCommandContraband]
  id: ClothingUniformJumpskirtCmoFormal
  name: парадный юбочный костюм главного врача
  description: Роскошный зеленовато-синий юбочный костюм с золотыми пуговицами и значком зелёного креста, сшитый для главы медотдела.
  components:
    - type: Sprite
      sprite: DeltaV/Clothing/Uniforms/Jumpskirt/cmo_formal.rsi

- type: entity
  parent: [ClothingUniformBase, BaseCommandContraband]
  id: ClothingUniformJumpskirtCmoVest
  name: юбка-жилет главного врача
  description: Уютный бирюзовый хлопковый жилет со значком зелёного креста в комплекте с белой рубашкой.
  components:
    - type: Sprite
      sprite: DeltaV/Clothing/Uniforms/Jumpskirt/cmo_vest.rsi

#HOP
- type: entity
  parent: [ClothingUniformBase, BaseCommandContraband]
  id: ClothingUniformJumpskirtHopFormal
  name: парадное платье главы персонала
  description: Хорошо сшитое платье с золотыми пуговицами и красной окантовкой. Почему бы не выглядеть шикарно, когда ботаника пылает.
  components:
    - type: Sprite
      sprite: DeltaV/Clothing/Uniforms/Jumpskirt/hopformaldress.rsi

#QM
- type: entity
  parent: [ClothingUniformBase, BaseCommandContraband]
  id: ClothingUniformJumpskirtQmFormal
  name: парадное платье квартирмейстера
  description: Вдохновлённое офицерами логистики прошлых армий — идеальный наряд для снабжения парадного мероприятия.
  components:
    - type: Sprite
      sprite: DeltaV/Clothing/Uniforms/Jumpskirt/qmformaldress.rsi

#Duty officer
- type: entity
  parent: [ClothingUniformBase, BaseSecurityContraband]
  id: ClothingUniformJumpskirtDutyOfficerOrange
  name: оранжевая юбка дежурного офицера
  description: Яркая охранная юбка, чтобы отличаться от смотрителя, давая ему повод избить вас, заявив, что вы выглядели как заключённый.
  components:
    - type: Sprite
      sprite: DeltaV/Clothing/Uniforms/Jumpskirt/prisonguard.rsi
