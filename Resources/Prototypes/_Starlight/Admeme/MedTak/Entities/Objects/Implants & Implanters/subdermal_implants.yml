- type: entity
  parent: DeathRattleImplant
  id: TrackingImplantMedTak
  name: маячок МедТак
  description: Этот имплант оповестит ближайшее подразделение МедТак, если пользователь окажется в критическом состоянии или умрёт.
  abstract: true
  components:
    - type: IconImplant
      icon: MedTakOperator
      iconType: MedTak
    - type: RattleOnTrigger
      radioChannel:
      - MedTak
    - type: SuitSensor
      faction: MedTak
      randomMode: false
      controlsLocked: true
      mode: SensorCords
      activationContainer: "implant"
    - type: DeviceNetwork
      deviceNetId: Wireless
      transmitFrequencyId: SuitSensor
    - type: StationLimitedNetwork
      allowNonStationPackets: true
    - type: WirelessNetworkConnection
      range: 1500

- type: entity
  parent: TrackingImplantMedTak
  id: TrackingImplantMedTakBronze
  name: бронзовый маячок МедТак
  categories: [ HideSpawnMenu ]
  components:
    - type: IconImplant
      icon: MedTakBronze
    - type: RattleOnTrigger
      messages:
        Critical: rattle-on-trigger-medtak-bronze-critical
        Dead: rattle-on-trigger-medtak-bronze-dead

