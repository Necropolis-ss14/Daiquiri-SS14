- type: entity
  id: OrganNeoVoxStomach
  parent: OrganNeocyteStomach
  name: ent-OrganNeoVoxStomach
  suffix: Neo-Vox
  components:
  - type: Metabolizer
    metabolizerTypes: [Vox] # They don't need animal since Vox inherits the same properties anyways.
  - type: Stomach
    specialDigestible:
      tags:
      - RamChip
      - Trash
    isSpecialDigestibleExclusive: false
  - type: SolutionManager
    solutions:
    - SolutionOrganFoodMeat
    - SolutionOrganStomach50

- type: entity
  id: OrganNeoVoxHeart
  parent: [BaseNeocyteOrgan, OrganNeocyteHeart]
  name: ent-OrganNeoVoxHeart
  suffix: Neo-Vox
  components:
  - type: Sprite
    state: heart-on
  - type: Item
    size: Small
    heldPrefix: heart
  - type: Metabolizer
    metabolizerTypes: [ Vox, Neocyte ]

- type: entity
  id: OrganNeoVoxLungs
  parent: OrganNeocyteLungs
  name: ent-OrganNeoVoxLungs
  suffix: Neo-Vox
  description: ent-OrganNeoVoxLungs-desc
  components:
  - type: Metabolizer
    metabolizerTypes: [ Slime, NeoVox ]
    stages: [ Respiration ]
  - type: Lung
    alert: LowNitrogen

- type: entity
  id: OrganNeoVoxTongue
  parent: OrganNeocyteTongue
  suffix: Neo-Vox
  components:
  - type: OrganTongue
    sounds:
      Male: NeoVoxMSounds
      Female: NeoVoxFSounds
      Unsexed: NeoVoxMSounds
