# An air alarm that starts with its access reader deactivated, as if the ACC wire
# had been cut. Access levels are inherited from AirAlarm and left intact, so
# mending the wire re-locks it to Atmospherics access.
- type: entity
  parent: AirAlarm
  id: AirAlarmUnlocked
  name: разблокированная воздушная сигнализация
  suffix: Unlocked
  description: Воздушная тревога с отключённым считывателем доступа. Настроить может кто угодно.
  components:
  - type: AccessReader
    enabled: false

# Mode None commands no vent or scrubber until one is picked, autoMode off stops
# alarm states reapplying a mode, and group Invalid drops it from the alerts
# console queries. All three are reversible from the UI.
- type: entity
  parent: AirAlarm
  id: AirAlarmChamber
  name: камерная воздушная сигнализация
  suffix: Chamber
  description: Воздушная тревога для камер. На консоль тревог станции не докладывает.
  components:
  - type: AirAlarm
    currentMode: None
    autoMode: false
  - type: AtmosAlertsDevice
    group: Invalid

- type: entity
  parent: [AirAlarmChamber, AirAlarmUnlocked]
  id: AirAlarmChamberUnlocked
  name: разблокированная камерная воздушная сигнализация
  suffix: Chamber, unlocked
  description: Воздушная тревога для камер. Настраивать может кто угодно, на консоль тревог станции не докладывает.
