- type: polymorph
  id: MutationMonkey
  configuration:
    entity: MobMonkey
    transferName: true
    stripNameModifier: false
    componentsToTransfer: []
    forced: true
    revertOnCrit: false
    revertOnDeath: false
    revertOnDelete: false
    inventory: Transfer
    polymorphSound: /Audio/Animals/monkey_scream.ogg

