- type: entity
  parent: BaseComputer
  id: XenobiologyConsole
  name: консоль ксенобиологии
  description: Компьютер для работы со слаймами. Может перемещать слаймов, применять мутагенные зелья и даже кормить их!
  components:
    - type: XenobiologyConsole
      monkeyTag: Monkey
      monkeyCubeTag: MonkeyCube
      monkeyProtoId: MobMonkey
    - type: Computer
      board: XenobiologyConsoleCircuitboard
    - type: Sprite
      layers:
        - map: [ "computerLayerBody" ]
          state: computer
        - map: [ "computerLayerKeyboard" ]
          state: generic_keyboard
        - map: [ "computerLayerScreen" ]
          sprite: _Starlight/Structures/Machines/slime_computer.rsi
          state: slime
        - map: [ "computerLayerKeys" ]
          sprite: _Starlight/Structures/Machines/slime_computer.rsi
          state: slime_key
        - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
          state: generic_panel_open
  # Starlight Start - Immersive Lighting PR
    - type: PointLight
      radius: 2.5
      energy: 1.5
      color: "#c24fa1"
  # Starlight End
    - type: Animateable
    - type: ContainerContainer
    - type: RemoteEyeConsole
      remoteEntityProto: XenobiologyConsoleEye
      color: "#00FF00"
      actions:
        - SyntrunnerActionExitConsole
        - XenobiologyConsoleActionAnalyzeSlime
        - XenobiologyConsoleActionGrabSlime
        - XenobiologyConsoleActionPlaceSlime
        - XenobiologyConsoleActionPlaceMonkey
        - XenobiologyConsoleActionRecycleMonkey
        - XenobiologyConsoleActionApplyMutationPotion
        - XenobiologyConsoleActionApplyStabilizerPotion
      viewOnConsolePosition: true

- type: entity
  parent:
    - Incorporeal
    - BaseMob
  id: XenobiologyConsoleEye
  name: око консоли ксенобиологии
  description: Глаз или, может, коготь, тянущийся из консоли ксенобиологии. Он за тобой шпионит?
  categories: [ HideSpawnMenu ]
  suffix: DO NOT MAP
  components:
    - type: NoFTL
    - type: WarpPoint
      follow: true
    - type: Eye
      pvsScale: 1.5
    - type: StationAiOverlay
      allowCrossGrid: true
      requiredTags:
        - "xenobiology"
    - type: Visibility
      layer: 32768
    - type: Sprite
      sprite: _Starlight/Mobs/Net/net_eye.rsi
      drawdepth: CyberspaceObjects
      layers:
        - map: ["base"]
          state: enemy
          shader: unshaded
    - type: SpriteWhitelisted
      localEntityWhitelist:
        tags:
          - Syndicate
          - Abductor
      passedLayers:
        base:
          state: enemy
      failedLayers:
        base:
          state: centcomm
    - type: Tag
      tags:
        - CantInteract

- type: entity
  parent: SurveillanceCameraScience
  id: SurveillanceCameraXenobiology
  name: камера
  suffix: Science (Xenobiology Console)
  components:
    - type: StationAiVision
      tags:
        - "xenobiology"
