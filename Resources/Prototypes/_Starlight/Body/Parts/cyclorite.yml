- type: entity
  id: PartCyclorite
  parent: [BaseItem, BasePart]
  name: ent-PartCyclorite
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: CopperBlood
        Quantity: 10

- type: entity
  id: TorsoCyclorite
  name: ent-TorsoCyclorite
  parent: [PartCyclorite, BaseTorso]
  components:
