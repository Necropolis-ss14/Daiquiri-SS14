- type: entityCategory
  id: PapersPlease
  name: Papers, please
  suffix: PapersPlease
  hideSpawnMenu: false

- type: entity
  abstract: true
  parent: Paper
  id: PassportBase
  categories: [ PapersPlease ]
  components:
  - type: Passport
  - type: ActivatableUI
    key: enum.PassportUiKey.Key
  - type: UserInterface
    interfaces:
      enum.PassportUiKey.Key:
        type: PassportBoundUserInterface

- type: entity
  parent: PassportBase
  id: PassportSSSPValid
  name: паспорт (СССП)
  suffix: PapersPlease
  categories: [ PapersPlease ]
  components:
  - type: Passport
    state: SSSP
    forcedValid: true
    forcedInvalid: false

- type: entity
  parent: PassportBase
  id: PassportSSSPInvalid
  name: паспорт (СССП)
  suffix: PapersPlease
  categories: [ PapersPlease ]
  components:
