# Clarke

- type: entity
  id: BaseClarkePart
  parent: BaseMechPart
  abstract: true
  components:
  - type: Sprite
    drawdepth: Items
    noRot: false
    sprite: _Starlight/Objects/Specific/Mechs/Mechs/clarke.rsi

- type: entity
  id: BaseClarkePartItem
  parent: BaseClarkePart
  abstract: true
  components:
  - type: Item
    size: Ginormous

- type: entity
  parent: BaseClarkePart
  id: ClarkeHarness
  name: каркас «Кларк»
  description: The core of the Clarke.
  components:
  - type: Appearance
  - type: ItemMapper
    mapLayers:
      clarke_head+o:
        whitelist:
          tags:
          - ClarkeHead
      clarke_r_arm+o:
        whitelist:
          tags:
          - ClarkeLArm
      clarke_l_arm+o:
        whitelist:
          tags:
          - ClarkeRArm
      clarke_treads+o:
        whitelist:
          tags:
          - ClarkeTreads
    sprite: _Starlight/Objects/Specific/Mechs/Mechs/clarke.rsi
  - type: ContainerContainer
    containers:
      part-container: !type:Container
      battery-container: !type:Container
  - type: MechAssemblyVisuals
    statePrefix: clarke
  - type: PartAssembly
    parts:
      Clarke:
      - ClarkeHead
      - ClarkeLArm
      - ClarkeRArm
      - ClarkeTreads
  - type: Construction
    graph: Clarke
    node: start
  - type: Sprite
    state: clarke_harness+o
    noRot: true

- type: entity
  parent: BaseClarkePartItem
  id: ClarkeHead
  name: голова «Кларк»
  description: The head of the Clarke. It belongs on the chassis of the mech.
  components:
  - type: Sprite
    state: clarke_head
  - type: Tag
    tags:
    - ClarkeHead

- type: entity
  parent: BaseClarkePartItem
  id: ClarkeRArm
  name: правая рука «Кларк»
  description: The right arm of the Clarke. It belongs on the chassis of the mech.
  components:
  - type: Sprite
    state: clarke_r_arm
  - type: Tag
    tags:
    - ClarkeRArm

- type: entity
  parent: BaseClarkePartItem
  id: ClarkeLArm
  name: левая рука «Кларк»
  description: The left arm of the Clarke. It belongs on the chassis of the mech.
  components:
  - type: Sprite
    state: clarke_l_arm
  - type: Tag
    tags:
    - ClarkeLArm

- type: entity
  parent: BaseClarkePartItem
  id: ClarkeTreads
  name: гусеницы «Кларк»
  description: The treads of the Clarke. It belongs on the chassis of the mech.
  components:
  - type: Sprite
    state: clarke_treads
  - type: Tag
    tags:
    - ClarkeTreads

- type: entity
  id: ClarkeChassis
  parent: BaseClarkePart
  name: шасси «Кларк»
  description: Недостроенный мех «Кларк».
  components:
  - type: Appearance
  - type: ContainerContainer
    containers:
      battery-container: !type:Container
      gas-tank-container: !type:Container
  - type: MechAssemblyVisuals
    statePrefix: clarke
  - type: Sprite
    noRot: true
    state: clarke0
  - type: Construction
    graph: Clarke
    node: start
    defaultTarget: clarke

