# Звуки взмахов крыльев для полёта гарпии.
- type: soundCollection
  id: WingFlaps
  files:
  - /Audio/_Starlight/Voice/Moth/moth_flapwings.ogg

# Гарпия - речь (щебет).
- type: speechSounds
  id: Harpy
  saySound:
    path: /Audio/_DV/Voice/Harpy/chirp1.ogg
  askSound:
    path: /Audio/_DV/Voice/Harpy/chirp1.ogg
  exclaimSound:
    path: /Audio/_DV/Voice/Harpy/chirp1.ogg

- type: speechVerb
  id: Harpy
  name: chat-speech-verb-name-harpy
  speechVerbStrings:
  - chat-speech-verb-harpy-1
  - chat-speech-verb-harpy-2
  - chat-speech-verb-harpy-3
  - chat-speech-verb-harpy-4

- type: emoteSounds
  id: SoundsHarpyMale
