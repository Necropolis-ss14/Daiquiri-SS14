- type: entity
  name: сумка для экстрактов слайма
  id: SlimeExtractBag
  parent: BaseStorageItem
  description: Сумка для жадных ксенобиологов, чтобы хранить неразумное количество экстрактов.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Specific/Hydroponics/Equipment/plant_bag.rsi # TODO: Replace with unique sprite
      state: icon
    - type: Item
      storedRotation: -90
    - type: Clothing
      quickEquip: false
      slots:
        - belt
    - type: Storage
      grid:
        - 0,0,10,10
      maxItemSize: Tiny
      quickInsert: true
      areaInsert: true
      whitelist:
        components:
          - SlimeExtract
    - type: Dumpable

- type: entity
  name: ручной сканер слаймов
  id: HandheldSlimeScanner
  parent: BaseItem
  description: Ручной сканер для сбора информации о слаймах.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Specific/Xenobiology/test_slime_analyzer.rsi
      state: icon
    - type: SlimeScanner

- type: entity
  name: камерный тэггер консоли ксенобиологии
  id: XenobiologyConsoleCameraTagger
  parent: BaseItem
  description: Может помечать любую камеру для регистрации в сети ксенобиологии. Следите за слаймами издалека или даже за соседями!
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Specific/Xenobiology/test_camera_tagger.rsi
      state: icon
    - type: XenobiologyConsoleCameraTagger
