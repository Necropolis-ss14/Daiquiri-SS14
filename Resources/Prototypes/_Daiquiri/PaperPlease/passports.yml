- type: entity
  parent: MarkerBase
  id: PassportRandomSpawner
  name: спавнер паспорта (случайный, 50/50)
  suffix: PapersPlease
  categories: [ PapersPlease ]
  components:
  - type: Sprite
    layers:
    - state: green
  - type: RandomSpawner
    chance: 1
    prototypes:
    - PassportSSSPValid
    - PassportSSSPInvalid
    - PassportSolGovValid
    - PassportSolGovInvalid
    - PassportConfederationValid
    - PassportConfederationInvalid
    - PassportNovoNihonValid
    - PassportNovoNihonInvalid
    - PassportRaitoriaValid
    - PassportRaitoriaInvalid
    - PassportIndependentColoniesValid
    - PassportIndependentColoniesInvalid

