- type: entity
  name: подзорная труба
  parent: BaseItem
  id: Spyglass
  description: Используется для слежки на дальних дистанциях. Заставляет чувствовать себя пиратом.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Tools/spyglass.rsi
    state: spyglass
  - type: Item
    size: Normal
  - type: Wieldable
  - type: UseDelay
    delay: 1.0
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 10
    pvsIncrease: 1.0
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
      Glass: 50
  - type: StaticPrice
    price: 250

- type: entity
  name: подзорная труба капитана
  parent: [ BaseItem, BaseGrandTheftContraband ]
  id: SpyglassCaptain
  description: Используется для слежки на дальних дистанциях. Заставляет чувствовать себя капитаном.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Tools/spyglass.rsi
    state: captain_spyglass
  - type: Item
    size: Normal
  - type: Wieldable
  - type: UseDelay
    delay: 1.0
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 10
    pvsIncrease: 1.0
  - type: PhysicalComposition
    materialComposition:
      Gold: 100
      Glass: 50
  - type: StaticPrice
    price: 1000
  - type: Tag
    tags:
    - HighRiskItem
  - type: StealTarget
    stealGroup: SpyglassCaptain

- type: entity
  name: импровизированная подзорная труба
  parent: BaseItem
  id: SpyglassImprovised
  description: Используется для слежки на дальних дистанциях. Кажется, можно порезать глаз о линзу.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Tools/spyglass.rsi
    state: improvised_spyglass
  - type: Item
    size: Normal
  - type: Wieldable
  - type: UseDelay
    delay: 1.0
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 4
    pvsIncrease: 0.4
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
      Glass: 50
  - type: StaticPrice
    price: 100
