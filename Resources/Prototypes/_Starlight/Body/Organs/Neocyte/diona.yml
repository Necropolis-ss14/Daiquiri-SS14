- type: entity
  id: OrganNeoDionaStomach
  parent: OrganDionaStomach
  name: улучшенный желудок
  suffix: Neo-Diona
  description: Аналог желудка у дионы, разит спаржей и уксусом.
  components:
  - type: Stomach
    specialDigestible:
      tags:
      - RamChip
    isSpecialDigestibleExclusive: false
  - type: Metabolizer
    maxReagents: 6
    metabolizerTypes: [ Plant, Neocyte ] # Can't do animal since they would get poisoned by theobromine.
    stages: [ Digestion, Bloodstream, Metabolites ]
  - type: OrganDamage
    damage:
      types:
        Poison: 130
        Cellular: 30 # 1.5x cellular, since it can make it impossible to revive them with the half healing they get
        Bloodloss: 20
        Caustic: 20
        Radiation: 10

- type: entity
  id: OrganNeoDionaLungs
  parent: OrganDionaLungs
  name: улучшенные лёгкие дионы
  suffix: Neo-Diona
  description: Губчатое месиво из склизких листовидных структур. Способны дышать как углекислым газом, так и кислородом.
  components:
  - type: OrganDamage
    damage:
      types:
        Asphyxiation: 130
        Cellular: 30 # 1.5x cellular, since it can make it impossible to revive them with the half healing they get
        Bloodloss: 20
        Radiation: 30

# Organs that turn into nymphs on removal
- type: entity
  id: OrganNeoDionaStomachNymph
  categories: [ HideSpawnMenu ]
  parent: OrganNeoDionaStomach
  name: желудок нимфы нео-дионы
  suffix: Neo-Diona Nymph
  description: Мерзость. Такое тяжело переварить.
  components:
  - type: Nymph
    entityPrototype: OrganNeoDionaNymphStomach

- type: entity
  id: OrganNeoDionaNymphStomach
  categories: [ HideSpawnMenu ]
  parent: MobDionaNymphAccent
  name: желудок нимфы нео-дионы
  suffix: Neo-Diona Nymph
  description: Содержит желудок бывшей полноценной нео-дионы. На вкус от этого не лучше.
  components:
  - type: IsDeadIC
  - type: Body
    prototype: AnimalProtoNymphStomach

- type: entity
  id: OrganNeoDionaLungsNymph
  categories: [ HideSpawnMenu ]
  parent: OrganNeoDionaLungs
  name: лёгкие нимфы нео-дионы
  suffix: Neo-Diona Nymph
  description: Фильтруют кислород из атмосферы, который затем поступает в кровоток и используется как переносчик электронов.
  components:
  - type: Nymph
    entityPrototype: OrganNeoDionaNymphLungs

- type: entity
  id: OrganNeoDionaNymphLungs
  categories: [ HideSpawnMenu ]
  parent: MobDionaNymphAccent
  name: лёгкие нимфы нео-дионы
  suffix: Neo-Diona Nymph
  description: Содержат лёгкие бывшей полноценной нео-дионы. Захватывает дух.
  components:
  - type: IsDeadIC
  - type: Body
    prototype: AnimalProtoNymphLungs

- type: entity
  id: OrganNeoDionaTongue
  parent: OrganNeocyteTongue
  suffix: Neo-Diona
  components:
  - type: OrganTongue
    sounds:
