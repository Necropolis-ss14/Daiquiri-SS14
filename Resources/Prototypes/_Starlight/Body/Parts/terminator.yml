- type: entity
  abstract: true
  parent: BaseItem
  id: PartTerminator
  name: часть тела НТ-800
  components:
  - type: Sprite
    sprite: Mobs/Species/Terminator/parts.rsi
  - type: Icon
    sprite: Mobs/Species/Terminator/parts.rsi
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Cybernetic
  - type: BodyPart
  - type: ContainerContainer
    containers:
      bodypart: !type:Container
        ents: []
  - type: StaticPrice
    price: 200

