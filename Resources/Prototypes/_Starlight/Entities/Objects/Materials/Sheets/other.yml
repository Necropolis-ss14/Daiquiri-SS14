- type: entity
  parent: Paper
  id: SheetPrinter
  suffix: Full
  components:
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      SheetPrinter: 100
  - type: UserInterface
    interfaces:
      enum.StackCustomSplitUiKey.Key:
        type: StackCustomSplitBoundUserInterface
  - type: Stack
    stackType: SheetPrinter
    baseLayer: base
    layerStates:
    - paper
    - paper
    - paper
  - type: Sprite
    state: paper
    layers:
    - state: paper
      map: ["base"]
    - state: paper_words
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: Tag
    tags:
    - Document

- type: entity
  parent: SheetPrinter
  id: SheetPrinter1
  suffix: Single
  components:
  - type: Stack
    stackType: SheetPrinter
    count: 1

- type: entity
  parent: [BaseItem, BaseSlicingRefinable]
  id: CheapInsulatedFabric
  name: дешёвая изолированная ткань
  description: Рулон грубой изолированной ткани, в нынешнем виде почти бесполезен.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Misc/insults.rsi
      state: cheapinsulativefabric
    - type: Item
      sprite: _Starlight/Objects/Misc/insults.rsi
    - type: ToolRefinable
      refineResult:
        - id: InsulatedThread
    - type: Tag
      tags:
        - CheapInsulatedFabric

- type: entity
  parent: BaseItem
  id: PlasteelFilament
  name: нить из пластали
  description: Катушка тонких нитей из пластали, полезная для превращения дешёвой изолированной ткани в по-настоящему изолированную.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Misc/insults.rsi
      state: plasteelfilament
    - type: Item
      sprite: _Starlight/Objects/Misc/insults.rsi
    - type: Tag
      tags:
        - PlasteelFilament

- type: entity
  parent: BaseItem
  id: InsulatedThread
  name: изолированная нить
  description: Катушка изолированной нити, полезной для сшивания перчаток.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Misc/insults.rsi
      state: insulativethread
    - type: Item
      sprite: _Starlight/Objects/Misc/insults.rsi
    - type: Tag
      tags:
        - InsulatedThread

- type: entity
  parent: BaseItem
  id: InsulatedFabric
  name: изолированная ткань
  description: Рулон гладкой изолированной ткани, в нынешнем виде почти бесполезен.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Misc/insults.rsi
      state: insulativefabric
    - type: Item
      sprite: _Starlight/Objects/Misc/insults.rsi
    - type: Tag
      tags:
        - InsulatedFabric
    - type: Construction
      graph: StandardInsulFabric
      node: fabric
