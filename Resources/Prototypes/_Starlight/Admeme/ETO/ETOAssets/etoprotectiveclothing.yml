# ETO Gear

- type: entity
  parent: [BaseETOContraband, ClothingOuterArmorBase, ClothingOuterStorageBase]
  id: ClothingOuterVestWebETOBase
  name: разгрузочный жилет ETO
  description: Защитный жилет для членов ETO, лёгкий на ногах.
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/ETO/clothing/armour/etovest.rsi
  - type: Clothing
    sprite: _Starlight/Admeme/ETO/clothing/armour/etovest.rsi
  - type: Pierceable
    level: Metal
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.6
        Heat: 0.9
    staminaModifier: 0.85
  - type: ExplosionResistance
    damageCoefficient: 0.9

- type: entity
  parent: ClothingOuterVestWebETOBase
  id: ClothingOuterVestWebETOCorpsman
  name: медицинский жилет ETO
