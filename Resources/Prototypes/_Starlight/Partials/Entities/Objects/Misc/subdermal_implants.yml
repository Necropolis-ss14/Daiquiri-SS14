- type: !PartialOnly entity
  id: TrackingImplant
  components:
  # Tracker rattle
  - type: TriggerOnMobstateChange
    mobState:
    - Critical
    - Dead
  - type: RattleOnTrigger
    targetUser: true
    radioChannel:
    - Security

- type: !PartialOnly entity
  id: UplinkImplant
  components:
  - type: UplinkImplant # Uplink Implant discounts

- type: !PartialOnly entity
  id: DeathRattleImplant
  components:
  - type: RattleOnTrigger
    radioChannel: [Syndicate] # syndicate isn't default rattle channel anymore

- type: !PartialOnly entity
  id: MindShieldImplant
  description: "Этот имплант обеспечивает верность NanoTrasen и защищает от устройств контроля разума."
  components:
  - type: Tag
    tags:
    - FragileImplant

- type: !PartialOnly entity
  id: RadioImplantCentcomm
  name: "имплант радио Центрального командования"

- type: !PartialOnly entity
  id: DeathRattleImplantCentcomm
  components:
  - type: RattleOnTrigger
    radioChannel: [CentCom] # List

- type: !PartialOnly entity
  id: FreedomImplant
  description: "Этот имплант позволяет носителю освобождаться от наручников и бола до трёх раз, после чего перестаёт работать."
  components:
  - type: RemoveBolaOnTrigger
    targetUser: true
