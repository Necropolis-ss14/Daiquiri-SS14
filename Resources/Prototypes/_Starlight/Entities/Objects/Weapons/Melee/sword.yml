- type: entity
  abstract: true
  parent: BaseItem
  id: BaseSheatheWeapon
  name: base sheathe
  description: It's a sheathe.
  components:
  - type: MeleeWeapon
    animation: WeaponArcSlash
    wideAnimationRotation: -30
    damage:
      types:
        Blunt: 9
    soundHit:
      collection: MetalThud

- type: entity
  name: самодельный меч
  parent: [ BaseSword, BaseMinorContraband ]
  id: SwordMakeshift
  description: Какая-то острая сталь на металлическом пруте, мечом это назвать сложно.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Melee/makeshift_sword.rsi
  - type: MeleeWeapon
    attackRate: 1
    damage:
      types:
        Slash: 10
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg
  - type: Item
  - type: DisarmMalus
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Melee/makeshift_sword.rsi
    slots:
    - suitStorage
  - type: Construction
    graph: SwordMakeshiftGraph
    node: sword

- type: entity
  name: импровизированный меч
  parent: [ BaseSword, BaseMinorContraband ]
  id: SwordImprovised
  description: Не слишком острый, но работу делает.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Melee/improvised_sword.rsi
  - type: MeleeWeapon
    attackRate: 1
    damage:
      types:
        Slash: 14
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg
  - type: Item
  - type: DisarmMalus
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Melee/improvised_sword.rsi
    slots:
    - suitStorage
  - type: Construction
    graph: SwordImprovisedGraph
    node: sword

- type: entity
  name: кованый меч
  parent: [ BaseSword, BaseMinorContraband ]
  id: SwordForged
  description: Сделан из пластали, одного касания клинка хватает для крови.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Melee/forged_sword.rsi
  - type: Reflect
    reflectProb: .1
    spread: 90
  - type: MeleeWeapon
    damage:
      types:
        Slash: 16
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg
  - type: Item
  - type: DisarmMalus
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Melee/forged_sword.rsi
    slots:
    - suitStorage
  - type: Tag
    tags:
    - SwordForged

- type: entity
  name: рассветный меч
  parent: [ BaseSword, BaseMajorContraband, Welder ]
  id: SwordFlaming
  description: Что может быть лучше совершенства. Конечно, огонь! Будь сияющим светом в техах и сражайся доблестно!
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Melee/dawnbreaker.rsi
    layers:
    - state: icon
    - state: welder_flame
      visible: false
      shader: unshaded
      map: ["enum.ToggleableVisuals.Layer"]
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
  - type: PointLight
    enabled: false
    radius: 3
  - type: Reflect
    reflectProb: .1
    spread: 90
  - type: ItemToggle
    predictable: false
    soundActivate:
      collection: WelderOn
      params:
        variation: 0.125
        volume: -5
    soundDeactivate:
      collection: WelderOff
      params:
        variation: 0.125
        volume: -5
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/Weapons/Guns/Hits/energy_meat1.ogg
      params:
        variation: 0.250
        volume: -10
    activatedSoundOnHitNoDamage:
      path: /Audio/Weapons/Guns/Hits/energy_meat1.ogg
      params:
        variation: 0.250
        volume: -12
    deactivatedSoundOnHitNoDamage:
      collection: MetalThud
    activatedDamage:
        types:
            Heat: 8
            Slash: 10
  - type: MeleeWeapon
    damage:
      types:
        Slash: 16
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg
  - type: Item
    sprite: _Starlight/Objects/Weapons/Melee/dawnbreaker.rsi
  - type: DisarmMalus
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Melee/dawnbreaker.rsi
    slots:
    - suitStorage
  - type: Construction
    graph: SwordFlamingGraph
    node: sword

- type: entity
  name: тайдбрейкер
  parent: [ BaseSword, BaseMajorContraband ]
  id: ClaymoreForged
  description: Идеальное оружие для начинающего рыцаря техов!
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Melee/tidebreaker.rsi
  - type: MeleeWeapon
    attackRate: 0.75
    damage:
      types:
        Slash: 20
        Structural: 10
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg
  - type: Item
    shape:
    - 0,0,1,3
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Melee/tidebreaker.rsi
    slots:
    - suitStorage
  - type: DisarmMalus
  - type: SurgeryTool
  - type: Scalpel
    successRate: 0.6
    startSound:
      path: /Audio/_Starlight/Medical/Surgery/scalpel1.ogg
    endSound:
      path: /Audio/_Starlight/Medical/Surgery/scalpel2.ogg

- type: entity
  name: спектральный клинок
  parent: [ BaseSword, BaseMagicalContraband ]
  id: ManaBlade
  description: Меч из закалённой маны.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Weapons/Melee/Mana_Blade.rsi
    - type: MeleeWeapon
      attackRate: 1
      damage:
        types:
          Slash: 20
          Structural: 10
      soundHit:
        path: /Audio/Weapons/bladeslice.ogg
    - type: Item

