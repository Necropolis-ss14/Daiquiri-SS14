- type: entity
  id: OrganVulpkaninHeart
  parent: OrganAnimalHeart
  name: "{ ent-OrganBaseHeart }"
  suffix: Vulpkanin
  description: "A disgustingly hyperactive pump designed to keep things animate."
  components:
    - type: Sprite
      sprite: Mobs/Species/Vulpkanin/organs.rsi
      state: heart-on
    - type: Metabolizer
      updateInterval: 0.8

- type: entity
  id: OrganVulpkaninStomach
  parent: [OrganAnimalStomach, BaseOrganStomach] # Starlight - add BaseOrganStomach
  name: "ent-OrganVulpkaninStomach # Starlight"
  suffix: Vulpkanin
  description: "A nearly bottomless caloric pit." # Starlight
  components:
    # Starlight start
    - type: Sprite
      sprite: Mobs/Species/Vulpkanin/organs.rsi
      state: stomach
    - type: Item
      size: Small
      heldPrefix: stomach
    - type: Stomach
    # Starlight end
    - type: SolutionManager
      solutions:
      - SolutionOrganFoodMeat
      - SolutionOrganStomach50
    - type: Metabolizer
      updateInterval: 1.5
    # Starlight end

- type: entity
  id: OrganVulpkaninEyes
  parent: OrganHumanEyes
  name: "{ ent-OrganBaseEyes }"
  suffix: Vulpkanin
  components:
  - type: Sprite
    sprite: Mobs/Species/Vulpkanin/organs.rsi
    layers:
    - state: eyeball-l
    - state: eyeball-r

- type: entity
  id: OrganVulpkaninTongue
  parent: OrganHumanTongue
  name: "{ ent-OrganBaseTongue }"
  suffix: Vulpkanin
  components:
    - type: Sprite
      sprite: Mobs/Species/Vulpkanin/organs.rsi
      state: tongue
    - type: OrganTongue
      allowedEmotes: [ 'Bark', 'Snarl', 'Whine', 'Howl', 'Growl', 'Yip' ]
      sounds:
        Male: MaleVulpkanin
        Female: FemaleVulpkanin
        Unsexed: MaleVulpkanin

- type: entity
  id: OrganVulpkaninLungs
  parent: OrganHumanLungs
  name: "{ ent-OrganBaseLungs }"
  suffix: Vulpkanin
  components:
  - type: Sprite
    sprite: Mobs/Species/Vulpkanin/organs.rsi
    layers:
    - state: lung-l
    - state: lung-r

- type: entity
  id: OrganVulpkaninLiver
  parent: OrganAnimalLiver
  name: "{ ent-OrganBaseLiver }"
  suffix: Vulpkanin
  components:
  - type: Sprite
    sprite: Mobs/Species/Vulpkanin/organs.rsi
    state: liver

- type: entity
  id: OrganVulpkaninKidneys
  parent: OrganHumanKidneys
  name: "{ ent-OrganBaseKidneys }"
  suffix: Vulpkanin
  components:
  - type: Sprite
    sprite: Mobs/Species/Vulpkanin/organs.rsi
    layers:
    - state: kidney-l
    - state: kidney-r
