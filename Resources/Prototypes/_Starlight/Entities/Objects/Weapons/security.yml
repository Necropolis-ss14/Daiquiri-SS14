# Self-recharging PDW-9 taser integrated into security borg
- type: entity
  id: WeaponPistolPDW9TaserBorg
  name: встроенный тазер PDW-9
  parent: WeaponPistolPDW9
  description: Самоперезаряжающийся тазер PDW-9, встроенный прямо в корпус охранного киборга. Летальный режим требует Красный код или выше.
  components:
  - type: StationGridMemory
  - type: Battery
    maxCharge: 750
    startingCharge: 750
  - type: BatterySelfRecharger
    autoRechargeRate: 20
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: DisablerBolt
      fireCost: 75
      magState: disable
      visualState: disable
    - proto: RedLaserBeam
      fireCost: 100
      magState: kill
      visualState: kill
      conditions:
      - !type:AlertLevelCondition
        alertLevels:
        - red
        - gamma
        - psi
        - delta
  - type: Unremoveable

# Self-recharging stunbaton integrated into security borg
- type: entity
  id: BorgStunbatonRechargeable
  name: встроенная дубинка
  parent: Stunbaton
  description: Самоперезаряжающаяся электрошоковая дубинка, встроенная прямо в шасси охранного киборга.
  components:
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: BatterySelfRecharger
    autoRechargeRate: 8
  - type: Unremoveable

# Holographic cuffs integrated into security borg — uses existing holo sprite
# Note: Unremoveable so they can't be dropped. BorgHandcuffComponent enables respawn-on-use
#       and return-to-slot on uncuff. mustBeUsedFromHand: false bypasses the CanDrop check.
- type: entity
  id: BorgHolocuffs
  name: голонаручники
  parent: Handcuffs
  description: Голографические наручники, излучаемые прямо из шасси охранного киборга. Новая пара появляется спустя мгновения после использования и возвращается, когда цель освобождают.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Tools/cyberling.rsi
    state: holorestrainer_powered
  - type: Handcuff
    cuffTime: 3.0
    uncuffTime: 5
    breakoutTime: 30
    cuffedRSI: Objects/Misc/handcuffs.rsi
    bodyIconState: body-overlay
    mustBeUsedFromHand: false
    breakOnCuffingFailed: false
  - type: BorgHandcuff
  - type: Unremoveable

# Integrated flash for security borg — auto-recharges like the interrogation lamp, undroppable
- type: entity
  id: BorgFlashRechargeable
  name: встроенная вспышка
  parent: Flash
  description: Сверхъяркая вспышка, встроенная прямо в шасси охранного киборга. Внутренний конденсатор перезаряжается автоматически.
  components:
  - type: LimitedCharges
    maxCharges: 5
  - type: AutoRecharge
    rechargeDuration: 30
  - type: Unremoveable

# Integrated holobarrier projector for security borg — self-recharging microreactor cell, undroppable
- type: entity
  id: BorgHoloprojectorSecurity
  name: встроенный проектор голобарьера
  parent: HoloprojectorSecurity
  suffix: borg
  description: Проектор голографического барьера, встроенный прямо в шасси охранного киборга. Герметичный микрореактор обеспечивает самозарядку.
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMicroreactor
        disableEject: true
        swap: false
        blacklist:
          tags:
          - MechReactor
  - type: Unremoveable

- type: entity
  name: двойная дубинка
  parent: [ BaseContrabandTier2, Stunbaton, BaseSecurityContraband ] # Blimpuf
  id: DoubleStunbaton
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Melee/doublestunbaton.rsi
    layers:
    - state: stunbaton_on
      visible: true
      map: [ "enum.StunbatonVisualLayers.Stunbaton_on" ]
    - state: stunbaton_off
      visible: false
      map: [ "enum.StunbatonVisualLayers.Stunbaton_off" ]
    - state: stunbaton_nocell
      visible: false
      map: [ "enum.StunbatonVisualLayers.Stunbaton_nocell" ]

- type: entity
  name: фиолетовая дубинка
  parent: [ BaseContrabandTier2, Stunbaton, BaseSecurityContraband ] # Blimpuf
  id: PurpleStunbaton
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Melee/purplestunbaton.rsi
    layers:
    - state: stunbaton_on
      visible: true
      map: [ "enum.StunbatonVisualLayers.Stunbaton_on" ]
    - state: stunbaton_off
      visible: false
      map: [ "enum.StunbatonVisualLayers.Stunbaton_off" ]
    - state: stunbaton_nocell
      visible: false
      map: [ "enum.StunbatonVisualLayers.Stunbaton_nocell" ]
