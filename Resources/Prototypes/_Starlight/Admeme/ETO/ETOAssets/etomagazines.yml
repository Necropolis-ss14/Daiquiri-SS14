- type: entity
  id: MagazinePistolSubMachineGunBottomMountedDDBase
  name: магазин DD-22 (.35 авто, нижний)
  parent: [ BaseItem, BaseSecurityContraband ]
  description: Уникальный магазин на 64 патрона для DD22, держит .35 авто.
  components:
  - type: Tag
    tags:
      - MagazinePistolSubMachineGunBottomMountedDD
  - type: BallisticAmmoProvider
    mayTransfer: true
    proto: null
    whitelist:
      tags:
      - CartridgePistol
    capacity: 64
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag
  - type: Sprite
    sprite: _Starlight/Admeme/ETO/weapons/ammo/bizonmag.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: false
  - type: Appearance
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container

- type: entity
  id: MagazinePistolSubMachineGunBottomMountedDDSP
  name: магазин PS DD-22 (.35 SP, нижний)
