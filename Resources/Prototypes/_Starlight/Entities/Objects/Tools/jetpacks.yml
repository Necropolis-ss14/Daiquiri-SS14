  suffix: Empty
  components:
  - type: Item
    sprite: _Starlight/Objects/Tanks/Jetpacks/ce_void.rsi
    size: Normal
  - type: Sprite
    sprite: _Starlight/Objects/Tanks/Jetpacks/ce_void.rsi
  - type: Clothing
    sprite: _Starlight/Objects/Tanks/Jetpacks/ce_void.rsi
    slots:
      - Back
      - suitStorage
      - Belt
  - type: ClothingSpeedModifier
    walkModifier: 1.0
    sprintModifier: 1.0
