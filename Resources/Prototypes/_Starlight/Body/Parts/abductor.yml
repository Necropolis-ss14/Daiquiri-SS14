- type: entity
  id: PartAbductor
  parent: [BaseItem, BasePart]
  name: часть тела похитителя
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 3
      - ReagentId: Sugar
        Quantity: 10

- type: entity
  id: TorsoAbductor
  name: туловище похитителя
  parent: [PartAbductor, BaseTorso]
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Abductor/parts.rsi
    state: "torso"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
      - ReagentId: Sugar
        Quantity: 20

