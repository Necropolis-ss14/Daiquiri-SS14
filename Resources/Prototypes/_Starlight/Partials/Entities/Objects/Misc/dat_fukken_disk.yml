- type: !PartialOnly entity
  id: NukeDisk
  name: ядерный диск
  description: "Ядерный диск, способный взвести бомбу при использовании вместе с кодом. Записка от НаноТрейзен гласит: ЭТО ВАШЕ САМОЕ ВАЖНОЕ ИМУЩЕСТВО, БЕРЕГИТЕ ЭТОТ ЧЁРТОВ ДИСК!"
  components:
  - type: Tag
    tags:
    - FloppyDisk
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Starlight/Items/Handling/disk_pickup.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Starlight/Items/Handling/disk_drop.ogg

- type: !PartialOnly entity
  id: NukeDiskFake
  name: ядерный диск
  description: "Поддельный ядерный диск. Записка от НаноТрейзен гласит: ЭТО ВАШЕ САМОЕ ВАЖНОЕ ИМУЩЕСТВО, БЕРЕГИТЕ ЭТОТ ЧЁРТОВ ДИСК!"
  components:
  - type: Tag
    tags:
    - FloppyDisk
