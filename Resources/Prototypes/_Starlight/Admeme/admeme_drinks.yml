- type: reagent
  id: Rumizine
  name: reagent-name-rumizine
  parent: BaseAlcohol
  desc: reagent-desc-rumizine
  physicalDesc: reagent-physical-desc-strong-smelling
  flavor: rum
  color: "#f09f4255"
  recognizable: true
  metamorphicSprite:
    sprite: Objects/Consumable/Drinks/rumglass.rsi
    state: icon_empty
  metamorphicMaxFillLevels: 4
  metamorphicFillBaseName: fill-
  metamorphicChangeColor: false
  metabolisms:
    Digestion:
      effects:
      - !type:SatiateThirst
        factor: 2
      - !type:AdjustReagent
        reagent: Ethanol
        amount: 0.2
    Bloodstream:
      effects:
      - !type:EvenHealthChange
        damage:
          Burn: -4
          Brute: -4

- type: entity
  parent: [ DrinkVisualsAllFilled, DrinkBottleGlassBaseFull ]
  id: DrinkRumizineBottleFull
  name: Пушечная отвага дяди Гита
  description: "Потрёпанная янтарная бутылка с черепом и якорем. Выцветший текст: «Пушечная отвага Румизин дяди Гита — пей до боя, не после». Пахнет ромом, порохом и сомнительной медициной."
  components:
  - type: Solution
    id: drink
    solution:
      reagents:
      - ReagentId: Rumizine
        Quantity: 100
  - type: Label
    currentLabel: reagent-name-rumizine
  - type: Sprite
    sprite: Objects/Consumable/Drinks/rumbottle.rsi
  - type: Sealable
  - type: StaticPrice
    price: 300
