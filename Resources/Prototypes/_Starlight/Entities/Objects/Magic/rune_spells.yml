- type: entity
  parent: BaseRuneAction
  id: ActionExplosionRuneWiz
  name: Руна взрыва
  description: Призывает руну, взрывающуюся под ногами.
  components:
  - type: Action
    useDelay: 40
    icon:
        sprite: _Starlight/Objects/Magic/magicactions.rsi
        state: explosionrune
  - type: InstantAction
    event: !type:InstantSpawnSpellEvent
      prototype: ExplosionRuneWiz
  - type: SpeakOnAction
    sentence: action-speech-spell-explosionrune
    tts: action-speech-spell-explosionrune-tts
    modifier: Spell
  - type: EorgPreventAction

- type: entity
  parent: BaseRuneAction
  id: ActionIgniteRuneWiz
  name: зажигательная руна
  description: Призывает руну, поджигающую наступившего.
  components:
  - type: SpeakOnAction
    sentence: action-speech-spell-iginiterune
    tts: action-speech-spell-iginiterune-tts
    modifier: Spell
  - type: Action
    useDelay: 40
    icon:
        sprite: _Starlight/Objects/Magic/magicactions.rsi
        state: ignitionrune
  - type: InstantAction
    event: !type:InstantSpawnSpellEvent
      prototype: IgniteRuneWiz

- type: entity
  parent: CollideRune
  id: IgniteRuneWiz
  name: руна воспламенения
  components:
    - type: TriggerOnCollide
      fixtureID: ignition
      maxTriggers: 1
    - type: Fixtures
      fixtures:
        ignition:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.4,-0.4,0.4,0.4"
          hard: false
          mask:
          - ItemMask
          layer:
          - SlipLayer
    - type: DeleteOnTrigger
    - type: IgniteOnCollide
      fireStacks: 5
    - type: Sprite
      sprite: _Starlight/Objects/Magic/magicactions.rsi
      layers:
        - state: ignitionrune

- type: entity
  parent: ExplosionRune
  id: ExplosionRuneWiz
  name: руна взрыва
  components:
    - type: Explosive
      explosionType: DefaultnoSpace
      totalIntensity: 20
      intensitySlope: 5
      maxIntensity: 4
    - type: Sprite
      sprite: _Starlight/Objects/Magic/magicactions.rsi
      layers:
        - state: explosionrune

- type: entity
  parent: BaseRuneAction
  id: ActionFreezeRune
  name: Руна заморозки
  description: Призывает руну, замораживающую наступившего на месте.
  components:
  - type: Action
    useDelay: 25
    icon:
        sprite: _Starlight/Objects/Magic/magicactions.rsi
        state: icerune
  - type: TargetAction
    range: 10
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:WorldSpawnSpellEvent
      prototypes:
      - id: FreezeRuneWiz
        amount: 1
      - id: FreezeRune2Wiz
        amount: 1
  - type: SpeakOnAction
    sentence: action-speech-spell-freezerune
    tts: action-speech-spell-freezerune-tts
    modifier: Spell
  - type: EorgPreventAction

- type: entity
  parent: StunRune
  id: FreezeRuneWiz
  name: руна заморозки
  components:
    - type: TriggerOnCollide
      fixtureID: rune
      maxTriggers: 1
    - type: StunOnCollide
      stunAmount: 10
      knockdownAmount: 10
      fixture: rune
    - type: Sprite
      sprite: _Starlight/Objects/Magic/magicactions.rsi
      layers:
      - state: icerune

- type: entity
  parent: CollideRune
  id: FreezeRune2Wiz
  name: руна заморозки
  components:
    - type: TriggerOnCollide
      fixtureID: rune
      maxTriggers: 1
    - type: ExplodeOnTrigger
    - type: Explosive
      explosionType: Cryo
      totalIntensity: 1
      intensitySlope: 0.1
      maxIntensity: 7
    - type: Sprite
      sprite: _Starlight/Objects/Magic/magicactions.rsi
      layers:
      - state: icerune


- type: entity
  parent: ActionFreezeRune
  id: ActionEruption
  name: Извержение
  description: "Призыв руны: через 2 секунды шлёт огненную шрапнель по площади (перезарядка 40 секунд)."
  components:
  - type: Action
    useDelay: 40
    icon:
        sprite: _Starlight/Objects/Magic/magicactions.rsi
        state: eruption
  - type: TargetAction
    range: 16
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:WorldSpawnSpellEvent
      prototypes:
      - id: EruptionRuneWiz
        amount: 1
  - type: SpeakOnAction
    sentence: action-speech-spell-eruption
    tts: action-speech-spell-eruption-tts
    modifier: Spell
  - type: EorgPreventAction

- type: entity
  parent: BaseRune
  id: EruptionRuneWiz
  name: руна извержения
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Magic/magicactions.rsi
    layers:
    - state: eruptionrune
  - type: PointLight
    color: "#F5E12C"
    radius: 1.0
    energy: 6.0
  - type: TimedDespawn
    lifetime: 6
  - type: RepeatingTrigger
    delay: 1.5
  - type: SpawnOnTrigger
    proto: EruptionBomb
