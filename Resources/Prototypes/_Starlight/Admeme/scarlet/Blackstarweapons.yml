# Prometheus Battle Rifle
- type: entity
  name: боевая винтовка «Прометеус»
  parent: [WeaponRifleLecter, BaseMajorContraband]
  id: WeaponRiflePrometheus
  suffix: Admeme
  description: "Сильно модифицированная боевая винтовка Lecter для оперативников-дредуокеров Blackstar. Отсечка по 3 патрона делает её смертельной на любой дистанции. Питается от магазинов .20."
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/Scarlet/Prometheus.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Starlight/Admeme/Scarlet/Prometheus.rsi
  - type: Gun
    fireRate: 5
    burstFireRate: 8
    shotsPerBurst: 3
    burstCooldown: 0.6
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    - Burst
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/ltrifle.ogg
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: SpeedModifiedOnWield
    walkModifier: 0.80

# Blackstar MG42-inspired L6 variant. Weapon handling and .30 belt boxes are inherited.
- type: entity
  name: пулемёт MG-42 Blackstar
  parent: WeaponLightMachineGunL6
  id: WeaponLightMachineGunBlackstarMG42
  suffix: Admeme
  description: Ленточный пулемёт Blackstar с длинным вентилируемым кожухом, складными сошками и тёмной деревянной фурнитурой. Питается от стандартных пулемётных коробок .30.
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/Scarlet/blackstar_mg42.rsi
  - type: Item
    sprite: _Starlight/Admeme/Scarlet/blackstar_mg42.rsi
  - type: Clothing
    sprite: _Starlight/Admeme/Scarlet/blackstar_mg42.rsi
  - type: Contraband
    tier: Tier3

