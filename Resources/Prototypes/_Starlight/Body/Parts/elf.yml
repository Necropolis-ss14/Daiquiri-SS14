- type: entity
  id: PartElf
  parent: [BaseItem, BasePart]
  name: часть тела айелита
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: TorsoElf
  name: туловище айелита
  parent: [PartElf, BaseTorso]
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Elf/parts.rsi
    state: "torso_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20

