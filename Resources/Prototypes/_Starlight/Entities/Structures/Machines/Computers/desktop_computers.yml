# region: Custom Computers
# Desktop computers without corresponding console
- type: entity
  parent: [ BaseDesktop, BaseComputerAiAccess, StorePresetUplink ]
  id: ComputerPersonalDesktop
  name: персональный настольный компьютер
  description: Для всех ваших стационарных вычислительных нужд!
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: personal
    - map: ["computerLayerKeys"]
      state: service_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
    - map: [ "enum.PdaVisualLayers.Base" ]
      state: "pda"
      visible: false
    - map: [ "enum.PdaVisualLayers.Flashlight" ]
      state: "pda"
      shader: "unshaded"
      visible: false
    - map: [ "enum.PdaVisualLayers.IdLight" ]
      state: "pda"
      shader: "unshaded"
      visible: false
  - type: Computer
    board: ComputerPersonalCircuitboardDesktop
  - type: DeviceNetworkRequiresPower
  - type: ActivatableUIRequiresVision
  - type: Transform
    anchored: true
  - type: Instrument
    program: 2
    allowPercussion: true
    allowProgramChange: true # Defined in space-station-14.sf2
  - type: ContainerContainer
    containers:
      board: !type:Container
        ents: []
      PDA-id: !type:ContainerSlot {}
      PDA-pen: !type:ContainerSlot {}
      PDA-pai: !type:ContainerSlot {}
      Cartridge-Slot: !type:ContainerSlot {}
      program-container: !type:Container
      pai_slot: !type:ContainerSlot
  - type: Appearance
    appearanceDataInit:
     enum.PdaVisuals.PdaType:
       !type:String
       pda
  - type: Icon
    sprite: _Starlight/Structures/Machines/desktop_computers.rsi
    state: computer
  - type: Pda
    paiSlot:
      priority: -2
      whitelist:
        components:
        - PAI
    penSlot:
      startingItem: Pen
      priority: -1
      whitelist:
        tags:
        - Write
    idSlot:
      name: access-id-card-component-default
      ejectSound: /Audio/Machines/id_swipe.ogg
      insertSound: /Audio/Machines/id_insert.ogg
      whitelist:
        components:
        - IdCard
  - type: PdaVisuals
  - type: ItemSlots
  - type: UnpoweredFlashlight
  - type: PointLight
    enabled: false
    radius: 1.7
    falloff: 3
    softness: 5
    autoRot: true
    castShadows: false #SL lighting optimization
  - type: Ringer
  - type: RingerUplink
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: PDA
    prefix: device-address-prefix-console
    savableAddress: false
  - type: WirelessNetworkConnection
    range: 500
  - type: CartridgeLoader
    uiKey: enum.PdaUiKey.Key
    preinstalled:
      - CrewManifestCartridge
      - NotekeeperCartridge
      - BookWriterCartridge
      - NanoTaskCartridge
      - NewsReaderCartridge
      - GoogolplexCartridge
    cartridgeSlot:
      priority: -1
      name: device-pda-slot-component-slot-name-cartridge
      ejectSound: /Audio/Machines/id_swipe.ogg
      insertSound: /Audio/Machines/id_insert.ogg
      whitelist:
        components:
          - Cartridge
  - type: ActivatableUI
    key: enum.PdaUiKey.Key
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.PdaUiKey.Key:
        type: PdaBoundUserInterface
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
      enum.RingerUiKey.Key:
        type: RingerBoundUserInterface
      enum.InstrumentUiKey.Key:
        type: InstrumentBoundUserInterface
      enum.HealthAnalyzerUiKey.Key:
        type: HealthAnalyzerBoundUserInterface
  - type: Input
    context: "human"
  - type: SentienceTarget # sentient PDA = pAI lite
    flavorKind: station-event-random-sentience-flavor-mechanical
    weight: 0.001 # 1,000 PDAs = as likely to be picked as 1 regular animal
  - type: BlockMovement
    blockInteraction: false # lets the PDA toggle its own flashlight
  - type: TypingIndicator
    proto: robot
  - type: Speech
    speechVerb: Robotic
# endregion: Custom Computers
