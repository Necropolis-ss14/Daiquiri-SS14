- type: entity
  parent: [BaseHypospray, BaseMedTakContraband]
  id: MedTakHypo
  name: гипожет MedTak
  description: Качественный инъектор для быстрого введения химии, подходит к большинству портов скафандров.
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/MedTak/Objects/hypo.rsi
    layers:
      - state: hypo
        map: ["enum.SolutionContainerLayers.Base"]
      - state: hypo_fill1
        map: ["enum.SolutionContainerLayers.Fill"]
        visible: false
  - type: Item
    sprite: _Starlight/Admeme/MedTak/Objects/hypo.rsi
  - type: Solution
    id: hypospray
    solution:
      maxVol: 15
  - type: SolutionContainerVisuals
    maxFillLevels: 3
    fillBaseName: hypo_fill
    solutionName: hypospray
