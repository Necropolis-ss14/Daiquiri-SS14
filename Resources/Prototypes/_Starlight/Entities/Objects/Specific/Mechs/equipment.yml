- type: entity
  id: MechEquipmentBorgPilot
  parent: [ BaseMechEquipment ]
  name: силиконовый маяк управления экзокостюмом
  description: Устройство для передачи данных экзокостюма. Также позволяет активным киборгам брать управление экзокостюмом.
  components:
  - type: MechEquipment
    equipmentType: Passive
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Mechs/equipment.rsi
    state: exosuit_beacon
  - type: Item
  - type: MultiHandedItem
  - type: PilotSupportModule
    pilotWhitelist:
      components:
        - BorgChassis
  - type: Tag
    tags:
    - CombatMech
    - IndustrialMech
    - SpecialMech

- type: entity
  id: MechEquipmentSecGrabber
  parent: [ BaseContrabandTier2, BaseMechEquipment, CombatMechEquipment, BaseSecurityContraband ] # Blimpuf
  name: Гидравлическая клешня
  description: Специализированная гидравлическая клешня для удержания нескольких субъектов. Вмещает до 4 предметов за раз.
  components:
  - type: Sprite
    state: paddy_claw
  - type: Item
  - type: MultiHandedItem
  - type: MechGrabber
    maxContents: 4
    grabDelay: 3
    grabEnergyDelta: -10
    CanGrabMobs: true
  - type: UIFragment
    ui: !type:MechGrabberUi
  - type: ContainerContainer
    containers:
      item-container: !type:Container
  - type: ChildBlockVision
  - type: Retractor
    speed: 1.5
    startSound:
      path: /Audio/Mecha/sound_mecha_hydraulic.ogg
  - type: SurgeryTool
  - type: Tag
    tags:
    - NonLethalMech

- type: entity
  id: MechEquipmentCamera
  parent: [ BaseMechEquipment, CombatMechEquipment ]
  name: камера ночного видения меха
  description: Камера ночного видения, позволяет переключать визор в режим ночного видения для лучшей видимости в плохо освещённых местах.
  components:
  - type: MechEquipment
    equipmentType: Passive
  - type: Sprite
    state: mecha_camera
  - type: MechEquipmentAction
    actionId: ActionMechToggleNightVision
  - type: MechNightVision
