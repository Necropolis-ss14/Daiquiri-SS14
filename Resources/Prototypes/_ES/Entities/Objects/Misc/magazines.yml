# Base prototypes
- type: entity
  parent: BaseItem
  id: BaseMagazine
  name: журнал
  description: Качественно напечатанный журнал. Даже в космосе такие суровые формы распространения медиа никогда вас не подведут.
  abstract: true
  components:
  - type: Sprite
    sprite: _ES/Objects/Misc/magazines.rsi
    state: popular_spacepeople
  - type: Item
    size: Small # SL Start
    inhandVisuals:
      left:
      - state: magazine-inhand-left
        color: "#ffa69b"
      right:
      - state: magazine-inhand-right
        color: "#ffa69b"
  - type: Appearance
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
  - type: ExtinguishableSetCollisionWake
  - type: Flammable
    fireSpread: true
    alwaysCombustible: true
    canExtinguish: true
    damage:
      types:
        Heat: 1
  - type: FireVisuals
    sprite: Effects/fire.rsi
    normalState: fire
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger: # Excess damage, don't spawn entities
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          Ash:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Edible
    delay: 7
    forceFeedDelay: 7
  - type: FlavorProfile
    flavors:
    - paper
  - type: BadFood
  - type: Solution
    id: food
    solution:
      maxVol: 1
      reagents:
      - ReagentId: Fiber
        Quantity: 1
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      SheetPrinter: 100
  - type: Tag
    tags:
    - Paper # SL End

