# A fixed respirator: explicit layered clothing visuals do not support pull-down prefixes.
- type: entity
  parent: [ClothingMaskBase, BaseMajorContraband]
  id: ClothingMaskGasBlackstarAssault
  name: противогаз штурмовика Blackstar
  description: Бронированный респиратор с центральным фильтром и двумя малиновыми линзами, видимыми в темноте. Подключается к подаче воздуха.
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/Scarlet/blackstar_assault/mask.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
  - type: Clothing
    sprite: _Starlight/Admeme/Scarlet/blackstar_assault/mask.rsi
    clothingVisuals:
      mask:
      - sprite: _Starlight/Admeme/Scarlet/blackstar_assault/mask.rsi
        state: equipped-MASK
      - sprite: _Starlight/Admeme/Scarlet/blackstar_assault/mask.rsi
        state: equipped-MASK-unshaded
        shader: unshaded
  - type: Item
    sprite: Clothing/Mask/swat.rsi
  - type: BreathMask
  - type: IngestionBlocker
  - type: IdentityBlocker
  - type: HideLayerClothing
    layers:
      Hair: Mask
      Snout: Mask
      HeadTop: Mask
      HeadSide: Mask
  - type: Pierceable
    level: Metal
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.90
        Slash: 0.90
        Piercing: 0.95
        Heat: 0.95

