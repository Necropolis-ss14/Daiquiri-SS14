# White Turtleneck
- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformTurtleneckSkirtColorWhite
  name: белая водолазка с юбкой
  description: Обычная белая водолазка без знаков различия.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Uniforms/Jumpskirt/color_turtle.rsi
    layers:
    - state: icon
    - state: skirt-icon
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      - state: skirt-inhand-left
      right:
      - state: inhand-right
      - state: skirt-inhand-right
  - type: Clothing
    sprite: _Starlight/Clothing/Uniforms/Jumpskirt/color_turtle.rsi
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING
      - state: skirt-equipped-INNERCLOTHING

