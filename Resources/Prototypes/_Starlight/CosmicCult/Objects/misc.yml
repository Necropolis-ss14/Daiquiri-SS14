- type: entity
  id: CosmicCultLawBoard
  parent: [BaseElectronics, BaseCosmicCultItem] # Starlight Edit: Contraband
  name: злокачественная плата законов
  description: Жуткая микросхема, подходящая для вставки в консоль загрузки законов ИИ. Её схемы переплетены с древовидными нитями, подрагивающими сами собой.
  components:
  - type: Sprite
    sprite: _Starlight/CosmicCult/Objects/lawboard.rsi
    state: icon
  - type: SiliconLawProvider
    lawUploadSound: /Audio/_Starlight/CosmicCult/antag_cosmic_AI_briefing.ogg
    subverted: true
    laws: CosmicCultLaws

- type: entity
  id: CosmicCultMindSink
  parent: [PositronicBrain, BaseCosmicCultItem] # Starlight Edit: Contraband
  name: астральный приёмник разума
  description: Странный артефакт. Хотя он состоит из злокачественных материалов, он не вызывает чувства дискомфорта.
  components:
  - type: Sprite
    sprite: _Starlight/CosmicCult/Objects/mindsink.rsi
    layers:
    - state: base
    - state: fg_idle
      shader: unshaded
      map: ["overlay"]
  - type: GenericVisualizer
    visuals:
      enum.ToggleableGhostRoleVisuals.Status:
        overlay:
          Off: { state: fg_idle }
          Searching: { state: fg_searching }
          On: { state: fg_occupied }
  - type: ToggleableGhostRole
    mindRoles:
    - MindRoleGhostRoleSilicon
    examineTextMindPresent: ghost-role-mindsink-installed
    examineTextMindSearching: ghost-role-mindsink-still-searching
    examineTextNoMind: ghost-role-mindsink-off
    beginSearchingText: ghost-role-mindsink-searching
    roleName: ghost-role-mindsink-role-name
    roleDescription: ghost-role-mindsink-role-description
    roleRules: ghost-role-information-silicon-rules
    wipeVerbText: ghost-role-mindsink-wipe-device-verb-text
    wipeVerbPopup: ghost-role-mindsink-wiped-device
    stopSearchVerbText: ghost-role-mindsink-stop-searching-verb-text
    stopSearchVerbPopup: ghost-role-mindsink-stopped-searching
    job: Borg
  - type: TypingIndicator
    proto: CosmicTyping
  - type: Speech
    speechSounds: ColossusSpeech
  - type: NameIdentifier
    group: CosmicPositronicBrain
