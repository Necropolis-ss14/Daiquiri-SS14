- type: entity
  parent: [ClothingEyesBase, BaseToggleClothing]
  id: ClothingEyesWeldingGoggles
  name: сварочные гогглы
  description: Защищает глаза от сварочников, одобрено ассоциацией безумных учёных.
  components:
    - type: Sprite
      sprite: Clothing/Eyes/Glasses/welding.rsi
      layers:
      - state: icon
        map: [ "enum.ToggleableVisuals.Layer" ]
    - type: Clothing
      sprite: Clothing/Eyes/Glasses/welding.rsi
    - type: ItemToggle # Welding mask starts in an activated state
      activated: true
    - type: ToggleClothing
      action: ActionToggleWeldingMask
    - type: Appearance
    - type: WeldingMask
    - type: GenericVisualizer
      visuals:
        enum.ToggleableVisuals.Enabled:
          enum.ToggleableVisuals.Layer:
            True: {state: icon}
            False: {state: icon-up}
    - type: ComponentToggler
      components:
      - type: IdentityBlocker
        coverage: EYES
      - type: FlashImmunity
      - type: EyeProtection
      - type: VisionDarkener
        strength: 3
    - type: StaticPrice
      price: 8
