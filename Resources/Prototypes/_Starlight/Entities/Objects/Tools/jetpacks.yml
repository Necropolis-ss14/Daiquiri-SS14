#USSP
- type: entity
  id: JetpackSSFMarine
  parent: [BaseJetpack, BaseSovietContraband]
  name: джетпак морпеха SSF
  suffix: Empty
  description: Стандартный джетпак советского производства для космоса.
  components:
    - type: Contraband # Blimpuf
      tier: Tier3
    - type: Item
      sprite: _Starlight/Objects/Tanks/Jetpacks/marine_jetpack.rsi
    - type: Sprite
      sprite: _Starlight/Objects/Tanks/Jetpacks/marine_jetpack.rsi
    - type: Clothing
      sprite: _Starlight/Objects/Tanks/Jetpacks/marine_jetpack.rsi
      slots:
        - Back
        - suitStorage
        - Belt
    - type: ClothingSpeedModifier
      walkModifier: 1.0
      sprintModifier: 1.0
    - type: HeldSpeedModifier

- type: entity
  id: JetpackSSFMarineFilled
  parent: [JetpackSSFMarine, BaseSovietContraband]
  name: джетпак морпеха SSF
  description: Стандартный джетпак советского производства для космоса.
  components:
    - type: Item
      sprite: _Starlight/Objects/Tanks/Jetpacks/marine_jetpack.rsi
    - type: Sprite
      sprite: _Starlight/Objects/Tanks/Jetpacks/marine_jetpack.rsi
    - type: Clothing
      sprite: _Starlight/Objects/Tanks/Jetpacks/marine_jetpack.rsi
      slots:
        - Back
        - suitStorage
        - Belt
    - type: GasTank
      outputPressure: 42.6
      air:
        volume: 5
        temperature: 293.15
        moles:
          - 1.025689525 # oxygen
          - 1.025689525 # nitrogen

#Improvised Empty
- type: entity
  id: JetpackImprovised
  parent: [ BaseJetpack, BaseMinorContraband ]
  name: импровизированный джетпак
  description: Это джетпак. Вмещает 1,5 л газа.
  suffix: Empty
  components:
    - type: Item
      sprite: _Starlight/Objects/Tanks/Jetpacks/improvised.rsi
    - type: Sprite
      sprite: _Starlight/Objects/Tanks/Jetpacks/improvised.rsi
    - type: Clothing
      sprite: _Starlight/Objects/Tanks/Jetpacks/improvised.rsi
      slots:
        - Back
        - suitStorage
        - Belt
    - type: GasTank
      outputPressure: 42.6
      air:
        volume: 1.5
    - type: Tag
      tags:
      - CorgiWearable
    - type: Construction
      graph: JetpackImprovisedGraph
      node: jetpack

#Improvised Filled
- type: entity
  id: JetpackImprovisedFilled
  parent: JetpackImprovised
  name: импровизированный джетпак
  suffix: Filled
  components:
  - type: GasTank
    outputPressure: 42.6
    air:
      # 4 minutes of thrust
      volume: 1.5
      temperature: 293.15
      moles:
        Oxygen: 0.307706858 # oxygen
        Nitrogen: 0.307706858 # nitrogen

#Empty CE void
- type: entity
