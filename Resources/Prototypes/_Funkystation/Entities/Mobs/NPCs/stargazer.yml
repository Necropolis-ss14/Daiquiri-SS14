- type: entity
  parent: FoodSnackSwirlLollipop
  id: FoodSnackStargazerLollipop
  name: леденец звездочёта
  description: Сладкий мясистый леденец, сделанный из туши звездочёта. Отдаёт слабым арбузом.
  suffix: DO NOT MAP
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/XenoArch/stargazer_lollipop.rsi
    state: icon
  - type: Item
    sprite: _Funkystation/Objects/XenoArch/stargazer_lollipop.rsi
    size: Small
    heldPrefix: icon
    storedRotation: 0
    storedOffset: 1,0
  - type: Construction
    graph: StargazerLollipop
    node: icon
