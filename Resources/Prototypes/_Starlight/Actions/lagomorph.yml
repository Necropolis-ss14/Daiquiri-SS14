- type: entity
  id: StaminaSurge
  name: "[color=yellow]Прилив выносливости[/color]"
  description: Даёт реген выносливости и сопротивление ценой лютого голода.
  components:
    - type: Action
      useDelay: 20
      itemIconStyle: BigAction
      icon:
        sprite: _Starlight/Interface/Actions/actions_lagomorph.rsi
        state: stamina-active
    - type: LimitedCharges
      maxCharges: 1
    - type: AutoRecharge
      rechargeDuration: 50
    - type: InstantAction
      event: !type:StaminaSurgeActionEvent

- type: entity
  id: Zoomies
  name: "[color=lightblue]Зуми!![/color]"
  description: Повышает скорость бега ценой резко возросшей жажды.
  components:
    - type: Action
      useDelay: 15
      itemIconStyle: BigAction
      icon:
        sprite: _Starlight/Interface/Actions/actions_lagomorph.rsi
        state: zoomies-btn
    - type: LimitedCharges
      maxCharges: 1
    - type: AutoRecharge
      rechargeDuration: 50
    - type: InstantAction
      event: !type:ZoomiesActionEvent
