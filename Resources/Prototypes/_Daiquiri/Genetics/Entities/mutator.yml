- type: entity
  parent: BaseItem
  id: GeneticsMutator
  name: mutator
  suffix: Empty
  description: A single-use injector of a mutagen designed to replicate a specific gene throughout the body.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/medipen.rsi
    layers:
    - state: medipen
      map: [ enum.MutatorVisuals.Layer ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.MutatorVisuals.Spent:
        enum.MutatorVisuals.Layer:
          True: { state: medipen_empty }
          False: { state: medipen }
  - type: Mutator

- type: entity
  parent: GeneticsMutator
  id: GeneticsActivator
  name: activator
  description: A single-use injector of a mutagen which can activate a dormant mutation without increasing instability.
  components:
  - type: Mutator
    activator: true

- type: entity
  parent: GeneticsMutator
  id: GeneticsCleanser
  name: cleanser
  description: A single-use injector of a mutagen designed to remove and de-express a specific gene from the body.
  components:
  - type: Mutator
    remove: true

- type: entity
  parent: GeneticsMutator
  id: MutationReverter
  name: mutation reverter
  description: A single-use injector that rolls a subject's genome back to the factory defaults of its species.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/medipen.rsi
    layers:
    - state: morphen
      map: [ enum.MutatorVisuals.Layer ]
  - type: GenericVisualizer
    visuals:
      enum.MutatorVisuals.Spent:
        enum.MutatorVisuals.Layer:
          True: { state: morphen_empty }
          False: { state: morphen }
  - type: Item
    inhandVisuals:
      left:
      - state: base-needle-inhand-left
      - state: base-colorA-inhand-left
        color: "#5bcaca"
      - state: base-colorB-inhand-left
        color: "#5bcaca"
      right:
      - state: base-needle-inhand-right
      - state: base-colorA-inhand-right
        color: "#5bcaca"
      - state: base-colorB-inhand-right
        color: "#5bcaca"
  - type: Mutator
    reset: true
    injectTime: 15
