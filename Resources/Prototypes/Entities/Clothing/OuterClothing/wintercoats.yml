- type: entity
  parent: [ClothingOuterStorageEdible, ClothingOuterBaseWinter] # Starlight
  id: ClothingOuterWinterCoat
  name: winter coat
  description: A heavy jacket made from 'synthetic' animal furs.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/WinterCoats/coat.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/WinterCoats/coat.rsi
  #region Starlight - inherit from ClothingOuterBaseWinter instead
  #- type: TemperatureProtection
  #  heatingCoefficient: 1.1
  #  coolingCoefficient: 0.1
  #endregion Starlight
  - type: Pierceable
    level: Metal
  - type: Armor
    modifiers:
      coefficients:
        Slash: 0.95
        Heat: 0.90
        Cold: 0.85 # Starlight, I mean, that's literally what they're for...
    priceMultiplier: 0
  #region Starlight - inherit from ClothingOuterBaseWinter instead
  #- type: ZombificationResistance
  #  zombificationResistanceCoefficient: 0.55
  #endregion Starlight
  - type: Edible
    requiresSpecialDigestion: true
  - type: Tag
    tags:
    - ClothMade
    - Recyclable
    - WhitelistChameleon
    - MonkeyWearable #Starlight Edit
  - type: StaticPrice
    price: 50

