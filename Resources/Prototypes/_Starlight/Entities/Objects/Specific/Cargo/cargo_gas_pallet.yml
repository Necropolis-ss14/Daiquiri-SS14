- type: entity
  parent: GasUnaryBase
  id: CargoGasPalletSell
  name: грузовой газовый бак продажи
  description: Хранит газы, закачанные по трубам, для продажи. Сделан из пластитания, чтобы отвадить надоедливых вандалов.
  components:
  - type: Anchorable
    flags:
    - Anchorable
  - type: SubFloorHide
    subfloorLayer: Pipes
    visibleLayers:
    - enum.SubfloorLayers.FirstLayer
  - type: CargoGasPallet
    palletType: Sell
    gasMixture:
      volume: 15000
  - type: Sprite
    drawdepth: FloorObjects
    sprite: _Starlight/Structures/cargo_gas_pallet.rsi
    layers:
      - sprite: Structures/Piping/Atmospherics/pipe.rsi
        state: pipeUnaryConnectors
        map: [ "enum.PipeVisualLayers.Pipe" ]
      - state: gas_sell_tank
        map: [ "enum.SubfloorLayers.FirstLayer" ]
  - type: AtmosPipeLayers
    spriteRsiPaths: {}
  - type: Appearance
  - type: PipeColorVisuals
  - type: AtmosMonitoringConsoleDevice
    navMapBlip: GasVentOpening

- type: entity
  parent: CargoGasPalletSell
  id: CargoGasPalletBuy
  name: грузовой газовый бак покупки
  description: Хранит газы, закупленные оптом, готовые к закачке. Сделан из пластитания, чтобы отвадить надоедливых вандалов.
  components:
    - type: CargoGasPallet
      palletType: Buy
    - type: Sprite
      layers:
        - sprite: Structures/Piping/Atmospherics/pipe.rsi
          state: pipeUnaryConnectors
          map: [ "enum.PipeVisualLayers.Pipe" ]
        - state: gas_buy_tank
          map: [ "enum.SubfloorLayers.FirstLayer" ]
