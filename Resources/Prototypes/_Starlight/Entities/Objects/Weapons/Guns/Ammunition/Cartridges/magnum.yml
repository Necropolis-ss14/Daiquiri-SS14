- type: entity
  id: CartridgeMagnumRubber
  name: патрон (.45 magnum резиновый)
  parent: BaseCartridgeMagnum
  components:
  - type: CartridgeAmmo
    proto: RubberBulletTrace
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#43c4f7"

- type: entity
  id: CartridgeMagnumImprovised
  name: самодельный патрон (.45 magnum)
  description: Самодельная револьверная пуля, набита фосфором для мощности. Всё равно хуже обычного магнума.
  parent: [BaseCartridgePistol, BaseMinorContraband]
  components:
  - type: CartridgeAmmo
    proto: BulletMagnumTraceImprovised
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Ammunition/Casings/improvised_casing.rsi
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#717171"
  - type: Tag
    tags:
      - Cartridge
      - CartridgeMagnumImprovised
  - type: Construction
    graph: ImprovisedMagnumBulletGraph
    node: shell

