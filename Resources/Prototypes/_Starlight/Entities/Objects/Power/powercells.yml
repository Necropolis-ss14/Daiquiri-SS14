- type: entity
  id: MechReactorShielded
  name: реактор меха класса «паладин»
  description: Миниатюрное реакторное ядро более цивилизованной эпохи. Эффективно, но часть охлаждения отдана энергощиту. Порты не стыкуются с современными мехами, но мультитул решает.
  parent: MechReactorBase
  components:
  - type: Sprite
    layers:
    - map: [ "enum.PowerCellVisualLayers.Base" ]
      state: paladin
    - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
      state: o2
      shader: unshaded
  - type: Battery
    maxCharge: 1200
    startingCharge: 1200
  - type: BatterySelfRecharger
    autoRechargeRate: 40
    autoRechargePauseTime: 0
  - type: EnergyDomeGenerator
    damageEnergyDraw: 2
    domePrototype: EnergyDomeSmallPink
    canInteractUse: false
    canDeviceNetworkUse: true
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 100
  - type: DeviceLinkSink
    ports:
    - Toggle
    - On
    - Off

