    requirement:
    - SurgeryOpenIncision
    priority: 100
    steps:
    - SurgeryStepRejoinBloodVessels
    - SurgeryStepRestoreCartilage
    - SurgeryStepCloseIncision
  - type: SurgerySpeciesCondition
    speciesBlacklist:
    - SlimePerson
    - NeoSlimePerson
    - IPC
  - type: SurgeryPartCondition
    parts:
    - Arm
    - Leg
    - Hand
    - Foot

- type: entity
  parent: SurgeryCloseIncision
  id: SurgeryCloseIncisionSlime
  components:
