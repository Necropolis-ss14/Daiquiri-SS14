- type: entity
  id: OrganThavenBrain
  parent: [BaseItem, OrganHumanBrain]
  name: ent-OrganThavenBrain
  suffix: Thaven
  description: ent-OrganThavenBrain-desc
  components:
    - type: BorgBrain
    - type: Sprite
      sprite: _Starlight/Mobs/Species/Thaven/organs.rsi
      state: brain-thaven

- type: entity
  id: OrganThavenEyes
  parent: OrganHumanEyes
  name: ent-OrganThavenEyes
  suffix: Thaven
  description: ent-OrganThavenEyes-desc
  components:
  - type: OrganVisualization
    layer: Eyes
    prototypes:
      Default: MobThavenEyes

- type: entity
  id: OrganThavenTongue
  parent: OrganHumanTongue
  suffix: Thaven
  components:
  - type: OrganTongue
    allowedEmotes: ["ThavenHum", "ThavenGlub"]
    sounds:
      Male: MaleThaven
      Female: FemaleThaven
      Unsexed: MaleThaven
