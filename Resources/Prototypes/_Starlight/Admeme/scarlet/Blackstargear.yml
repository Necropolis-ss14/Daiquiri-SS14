- type: entity
  parent: [ClothingBackpackSatchel, BaseMajorContraband]
  id: ClothingBackpackRadioBlackstar
  name: радиорюкзак Blackstar
  description: Матовый чёрный полевой телефонный ранец с коричневыми ремнями, трубкой сбоку и длинной антенной, для штурмовиков Blackstar.
