- type: entity
  name: телебонд
  parent: [BaseItem, BaseSovietContraband]
  id: Telebond
  suffix: 20 TB
  description: Устаревшие билеты с микрокристаллическим узором, используемые для вызова припасов через старый радио-аплинк, по старинке. «НЕ ЕШЬ!» — Борис
  components:
  - type: Contraband # Blimpuf
    tier: Tier3
  - type: Sprite
    sprite: _Starlight/Objects/Specific/USSP/telebond.rsi
    state: telebond
  - type: Item
    sprite: _Starlight/Objects/Specific/USSP/telebond.rsi
    size: Tiny
  # Starlight start
  - type: UserInterface
    interfaces:
      enum.StackCustomSplitUiKey.Key:
        type: StackCustomSplitBoundUserInterface
  - type: Stack
    stackType: Telebond
    count: 20
  # Starlight end
  - type: StaticPrice
    price: 0
  - type: StackPrice
    price: 200
  - type: Currency
    price:
      Telebond: 1
  - type: Edible
    solution: food
    delay: 2
    forceFeedDelay: 2
    useSound:
      collection: eating
  - type: FlavorProfile
    flavors:
    - paper
    - metallic
    - chemical
  - type: BadFood
  - type: Solution
    id: food
    solution:
      maxVol: 16
      reagents:
      - ReagentId: Razorium
        Quantity: 2
      - ReagentId: Ephedrine
        Quantity: 3
      - ReagentId: Silicon
        Quantity: 4
      - ReagentId: Vodka
        Quantity: 5
      - ReagentId: Tazinide
        Quantity: 2

- type: entity
  parent: Telebond
  id: Telebond1
  suffix: 1 TB
  components:
  - type: Stack
    count: 1

- type: entity
  parent: Telebond
  id: Telebond5
  suffix: 5 TB
  components:
  - type: Stack
    count: 5

- type: entity
  parent: Telebond
  id: Telebond10
  suffix: 10 TB
  components:
  - type: Stack
    count: 10

# Uplinks
- type: entity
  parent: [BaseItem, BaseSovietContraband]
  id: BaseRevUplinkRadio
  name: рация Связь-УЗЛ
  description: Советский узел связи широкого применения в войсках СССП. Этот модифицирован для агентов СКБ и их активов. Несанкционированное использование строго не рекомендуется, потому что мы вас найдём.
  suffix: Empty
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Devices/ussp-radio.rsi
    layers:
    - state: ussp-radio
  - type: Item
    sprite: _Starlight/Objects/Devices/ussp-radio.rsi
    heldPrefix: ussp-radio-inhand-left
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
  - type: RemoteStore

