- type: entity
  id: BaseNeocyteOrgan
  parent: BaseItem
  abstract: true
  components:
  - type: Sprite
    sprite: _FarHorizons/Mobs/Species/Protogen/organs.rsi
  - type: Organ
  - type: Edible
  - type: Extractable
    grindableSolutionName: organ
  - type: SolutionManager
    solutions:
    - SolutionOrganNutriment
    - SolutionOrganFoodMeat
  - type: FlavorProfile
    flavors:
      - people
  - type: Tag
    tags:
      - Meat



- type: entity
  id: OrganNeocyteBrain
  parent: [BaseOrganBrain, BaseNeocyteOrgan]
  name: ent-OrganNeocyteBrain
  suffix: Neocyte
  description: ent-OrganNeocyteBrain-desc
  components:
  - type: Sprite
    state: brain

- type: entity
  id: OrganNeocyteEyes
  parent: [BaseNeocyteOrgan, BaseOrganEyes]
  name: ent-OrganNeocyteEyes
  suffix: Neocyte
  description: ent-OrganNeocyteEyes-desc
  components:
  - type: Sprite
    layers:
    - state: eyeball-l
    - state: eyeball-r
  - type: Item
    size: Small
    heldPrefix: eyeballs
  - type: OrganVisualization
    layer: Eyes
    prototypes:
          Default: MobHumanoidEyes
  - type: OrganDamage
    damage:
      types:
        Poison: 10
        Cellular: 15 # 1.5x cellular, since it can make it impossible to revive them with the half healing they get
        Bloodloss: 10
        Radiation: 10
        Caustic: 10

- type: entity
  id: OrganNeocyteTongue
