- type: entity
  id: BasePart
  parent: BaseItem
  name: часть тела
  abstract: true
  components:
  - type: SurgeryTarget
  - type: BaseLayerId
  - type: Damageable
    damageContainer: Biological
  - type: BodyPart
  - type: ContainerContainer
    containers:
      bodypart: !type:Container
        ents: []
  - type: StaticPrice
    price: 100
  - type: Tag
    tags:
      - Trash
  - type: UserInterface
    interfaces:
      enum.SurgeryUIKey.Key:
        type: SurgeryBui

- type: entity
  id: BaseTorso
  name: "torso"
  parent: BasePart
  abstract: true
  components:
  - type: BodyPart
    partType: Torso

- type: entity
  id: BaseHead
  name: "head"
  parent: BasePart
  abstract: true
  components:
  - type: BodyPart
    partType: Head
    vital: true
  - type: Input
    context: "ghost"

- type: entity
  id: BaseLeftArm
  name: левая рука
  parent: BasePart
  abstract: true
  components:
  - type: BodyPart
    partType: Arm
    symmetry: Left
  - type: LeftArm #Starlight

- type: entity
  id: BaseRightArm
  name: правая рука
  parent: BasePart
  abstract: true
  components:
  - type: BodyPart
    partType: Arm
    symmetry: Right
  - type: RightArm #Starlight

- type: entity
  id: BaseLeftHand
  name: левая кисть
  parent: BasePart
  abstract: true
  components:
  - type: BodyPart
    partType: Hand
    symmetry: Left

- type: entity
  id: BaseRightHand
  name: правая кисть
  parent: BasePart
  abstract: true
  components:
  - type: BodyPart
    partType: Hand
    symmetry: Right

- type: entity
  id: BaseLeftLeg
  name: левая нога
  parent: BasePart
  abstract: true
  components:
  - type: BodyPart
    partType: Leg
    symmetry: Left
  - type: MovementBodyPart

- type: entity
  id: BaseRightLeg
  name: правая нога
  parent: BasePart
  abstract: true
  components:
  - type: BodyPart
    partType: Leg
    symmetry: Right
  - type: MovementBodyPart

- type: entity
  id: BaseLeftFoot
  name: левая стопа
  parent: BasePart
  abstract: true
  components:
  - type: BodyPart
    partType: Foot
    symmetry: Left

- type: entity
  id: BaseRightFoot
  name: правая стопа
  parent: BasePart
  abstract: true
  components:
  - type: BodyPart
    partType: Foot
    symmetry: Right
