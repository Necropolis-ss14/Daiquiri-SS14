- type: entity
  id: CrateArmoryLr30
  parent: [ CrateWeaponSecure, BaseRestrictedContraband ]
  name: ящик lr30
  description: Два автоматических энергооружия LR-30 и два запасных магазина. Нужен доступ в оружейную.
  components:
  - type: Contraband
    allowedDepartments: [ Security ]
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: WeaponRifleLr30
          amount: 2
        - id: MagazineBatteryLr30
          amount: 2

- type: entity
  id: CrateArmoryLr30Magazines
  parent: [ CrateWeaponSecure, BaseRestrictedContraband ]
  name: ящик магазинов lr30
  description: Шесть магазинов для энергооружия LR-30. Нужен доступ в оружейную.
  components:
  - type: Contraband
    allowedDepartments: [ Security ]
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: MagazineBatteryLr30
          amount: 6

