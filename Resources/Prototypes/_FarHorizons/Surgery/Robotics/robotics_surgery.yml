- type: entity
  parent: SurgeryBase
  id: SurgeryRemovePlating
  name: Снять внешнюю обшивку
  description: Снимает защитную внешнюю обшивку.
  components:
  - type: Surgery
    priority: -100
    steps:
    - SurgeryStepRemoveScrews
    - SurgeryStepUnweldJoints
    - SurgeryStepPryPlating
  - type: SurgerySpeciesCondition
    speciesBlacklist: []
    speciesWhitelist:
    - IPC

- type: entity
  parent: SurgeryBase
  id: SurgeryRestorePlating
  name: Восстановить внешнюю обшивку
  description: Восстанавливает защитную внешнюю обшивку.
  components:
  - type: Surgery
    priority: 100
    requirement:
    - SurgeryRemovePlating
    steps:
    - SurgeryStepPositionPlating
    - SurgeryStepRestoreScrews
    - SurgeryStepWeldJoints
  - type: SurgerySpeciesCondition
    speciesBlacklist: []
    speciesWhitelist:
    - IPC

- type: entity
  parent: SurgeryBase
  id: SurgeryAmputationRobot
  name: Ампутация
  description: Хирургическое удаление конечности.
  components:
  - type: Surgery
    requirement:
    - SurgeryRemovePlating
    steps:
    - SurgeryStepRemoveInnerScrews
    - SurgeryStepExposeWiringConnections
    - SurgeryStepExposeCoolantChannels
    - SurgeryStepRobotAmputation
  - type: SurgerySpeciesCondition
    speciesBlacklist: []
    speciesWhitelist:
    - IPC
  - type: SurgeryPartCondition
    parts:
    - Arm
    - Hand
    - Leg
    - Foot
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/saw.rsi
    state: saw

- type: entity
  parent: SurgeryAmputationRobot
  id: SurgeryAmputationHeadRobot
