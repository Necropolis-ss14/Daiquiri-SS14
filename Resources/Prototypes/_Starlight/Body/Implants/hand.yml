- type: entity
  id: BaseEntityHandImplant
  abstract: true
  parent: [ BaseItem, BaseImplant ]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/implants.rsi
  - type: Organ
  - type: HandImplant
  - type: FlavorProfile
    flavors:
      - people

- type: entity
  id: HandImplantInsulated
  name: изолирующий имплант
  description: Защищает ваши руки от электрического тока!
  parent: BaseEntityHandImplant
  components:
  - type: Sprite
    state: hand_implant_insulated
  - type: FunctionalOrgan
    comps:
    - type: Insulated

- type: entity
  id: HandImplantForensics
  name: криминалистический имплант
  description: Удаляет ваши отпечатки пальцев! Отлично для криминалистики, ценой вашей почты.
  parent: BaseEntityHandImplant
  components:
  - type: Sprite
    state: hand_implant_forensics
  - type: FunctionalOrgan
    comps:
    - type: FingerprintMask

- type: entity
  id: HandImplantClaws
  name: имплант-когти
  description: Даёт вам выдвижные когти!
  parent: BaseEntityHandImplant
  components:
  - type: Sprite
    state: hand_implant_claws
  - type: FunctionalOrgan
    comps:
    - type: InherentAction
      action: ActionRetractableItemAdvancedClaws

- type: entity
  id: HandImplantThrusters
  name: имплант-двигатель
  description: Наручные микродвигатели, помогающие маневрировать в космосе.
  parent: BaseEntityHandImplant
  components:
  - type: Sprite
    state: hand_implant_thrusters
  - type: FunctionalOrgan
    comps:
    - type: MovementAlwaysTouching
