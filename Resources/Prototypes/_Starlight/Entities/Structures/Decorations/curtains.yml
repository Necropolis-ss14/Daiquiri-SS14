- type: entity
  id: WindowBlinds
  parent: BaseCurtains
  suffix: Closed
  description: Содержит менее 1% ртути.
  components:
  - type: Sprite
    snapCardinals: true
    sprite: _Starlight/Structures/Furniture/blinds.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: Construction
    graph: WindowBlinds
    node: WindowBlinds

- type: entity
  id: WindowBlindsOpen
  parent: WindowBlinds
  suffix: Open
  components:
  - type: Door
    state: Open
  - type: Occluder
    enabled: false
  - type: Physics
    canCollide: false
