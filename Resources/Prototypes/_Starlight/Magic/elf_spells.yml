# Luminous Orb

- type: entity
  parent: BaseAction
  id: ActionCantripGlow
  name: Светящаяся сфера
  description: Создаёт недолговечный светящийся шар света. Исчезает через 25 секунд.
  components:
  - type: Magic
    requiresClothes: false
  - type: Action
    useDelay: 45
    itemIconStyle: BigAction
    icon:
      sprite: _Starlight/Objects/Magic/luminous_orb.rsi
      state: icon
  - type: InstantAction
    event: !type:SpawnItemInHandEvent
      spawned: ElfLuminousOrb
      requiresFreeHand: false
  - type: SpeakOnAction
    sentence: action-speech-cantrip-glow
    whisper: true
    tts: action-speech-cantrip-glow-tts
    modifier: Spell
  - type: ColorObjectToEyeColor

