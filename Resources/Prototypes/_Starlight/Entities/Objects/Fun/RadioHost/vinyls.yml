- type: entity
  parent: BaseVinylDisc
  id: VinylCrazyBot
  name: "винил: Crazy Bot"
  description: "Довольно медленный инструментальный хип-хоп диджей-микс. Автор: Andrew R Codeman"
  components:
  - type: Sprite
    state: default
    layers:
    - state: default
    - state: label
      color: "#8b5cf6"
  - type: Vinyl
    song:
      path: /Audio/_Starlight/RadioStation/Vinyls/music/CrazyBot.ogg

