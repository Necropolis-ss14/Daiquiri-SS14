## Surgical Cases
- type: entity
  id: SurgicalKitMedical
  parent: [ BaseSurgicalKit, BaseMedicalContraband ]
  name: хирургический набор
  suffix: Medical
  description: Компактный набор хирургических инструментов.

- type: entity
  name: хирургический набор
  suffix: Medical, Filled
  parent: [SurgicalKitMedical, SurgicalKitFill]
  id: SurgicalKitMedicalFilled

- type: entity
  id: SurgicalKitRobotics
  parent: [ BaseSurgicalKit, BaseRoboticistContraband ]
  name: хирургический набор
  suffix: Robotics
  description: Компактный набор хирургических инструментов.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Robotics/cases.rsi
    state: surgerykit
  - type: Item
    size: Large
    shape:
    - 0,0,2,1
    sprite: _Starlight/Objects/Specific/Robotics/cases.rsi

- type: entity
  name: хирургический набор
  suffix: Robotics, Filled
  parent: [SurgicalKitRobotics, SurgicalKitFill]
  id: SurgicalKitRoboticsFilled

- type: entity
  abstract: true
  id: SurgicalKitFill
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: Hemostat
        - id: Saw
        - id: Drill
        - id: Cautery
        - id: Retractor
        - id: Scalpel
        - id: BoneGel
        - id: BoneSetter
