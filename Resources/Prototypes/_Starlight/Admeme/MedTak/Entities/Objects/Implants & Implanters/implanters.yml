- type: entity
  id: MedTakImplanter
  parent: BaseImplantOnlyImplanter
  description: Компактный одноразовый имплантер для быстрого и (почти) безболезненного введения импланта под кожу.
  abstract: true
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/MedTak/Objects/implanter.rsi
    state: implanter0
    layers:
    - state: implanter1
      map: [ "implantFull" ]
      visible: true
    - state: implanter0
      map: [ "implantOnly" ]
  - type: Item
    sprite: _Starlight/Admeme/MedTak/Objects/implanter.rsi
    heldPrefix: implanter
  - type: Implanter
    implantTime: 2.5

- type: entity
  id: MedTakImplanterMindShield
  name: имплантер «Щита разума» МедТак
  parent: MedTakImplanter
  components:
  - type: Implanter
    implant: MedTakMindShieldImplant

# Tracker tiers
