- type: entity
  name: самодельный ломик
  parent: BaseItem
  id: CrowbarMakeshift
  description: Едва лучше, чем ничего. Впрочем, с помощью сварочника можно сделать что-то большее.
  components:
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/crowbar_drop.ogg
  - type: Sprite
    sprite: _Starlight/Objects/Tools/makeshift_omnitool.rsi
    state: base
  - type: Item
    sprite: _Starlight/Objects/Tools/makeshift_omnitool.rsi
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 8
  - type: Tool
    qualities:
    - Prying
  - type: ToolTileCompatible
    delay: 4
  - type: Prying
    speedModifier: 0.25
  - type: ToolRefinable
    refineResult:
    - id: CrowbarWrenchMakeshift
  - type: Construction
    graph: MakeshiftCrowbarGraph
    node: tool
  - type: Tag
    tags:
      - Crowbar
  #FarHorizons Start
  - type: CrowbarSurgery
    startSound:
      path: /Audio/Items/crowbar.ogg
    speed: 1.5
  - type: SurgeryTool
  #FarHorizons End

- type: entity
  name: импровизированный ломик
  parent: CrowbarMakeshift
  id: CrowbarImprovised
  description: Несколько кусков металла, сваренных вместе и заточенных по краям. Не лучший инструмент, но сойдёт.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Tools/improvised_crowbar.rsi
    state: icon
  - type: Item
    sprite: _Starlight/Objects/Tools/improvised_crowbar.rsi
    storedSprite:
      sprite: _Starlight/Objects/Tools/improvised_crowbar.rsi
      state: storage
  - type: ToolTileCompatible
    delay: 2
  - type: Prying
    speedModifier: 0.50
  - type: Tag
    tags:
      - ImprovisedCrowbar
