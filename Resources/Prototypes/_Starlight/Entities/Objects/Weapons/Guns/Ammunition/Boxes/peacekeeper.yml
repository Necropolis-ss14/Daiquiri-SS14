- type: entity
  id: BasePeacekeeperBox
  name: гранатный патрон
  parent: [ BaseContrabandTier3, BaseItem, BaseSecurityContraband ] # Blimpuf
  abstract: true
  components:
  - type: Tag
    tags:
    - MagazineGrenade
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - Grenade
    capacity: 4
  - type: Item
    size: Normal
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Ammunition/Boxes/peacekeeper.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false
  - type: Appearance
  - type: PhysicalComposition
    materialComposition:
      Cardboard: 200

- type: entity
  parent: BasePeacekeeperBox
  id: BoxPeacekeeperFlash
  name: коробка светошумовых патронов миротворца
  description: Коробка светошумовых гранат для «Миротворца», чтобы догнать убегающего или разогнать толпу.
  components:
    - type: BallisticAmmoProvider
      proto: GrenadeFlash
      mayTransfer: true
    - type: Sprite
      layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-1
        map: ["enum.GunVisualLayers.Mag"]
      - state: flash

- type: entity
  parent: BasePeacekeeperBox
  id: BoxPeacekeeperStinger
  name: коробка стингер-патронов миротворца
  description: Коробка стингер-гранат для «Миротворца», отлично разгоняет толпу и собирает иски.
  components:
    - type: BallisticAmmoProvider
      proto: GrenadeStingerlauncher
      mayTransfer: true
    - type: Sprite
      layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-1
        map: ["enum.GunVisualLayers.Mag"]
      - state: stinger

- type: entity
  parent: BasePeacekeeperBox
  id: BoxPeacekeeperGas
  name: коробка слезоточивых патронов миротворца
  description: Коробка слезоточивых гранат для «Миротворца», на этикетке красным написано «НЕ ЗАБУДЬ ВНУТРЯНКУ».
  components:
    - type: BallisticAmmoProvider
      proto: GrenadeGaslauncher
      mayTransfer: true
    - type: Sprite
      layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-1
        map: ["enum.GunVisualLayers.Mag"]
      - state: gas

- type: entity
  parent: BasePeacekeeperBox
  id: BoxPeacekeeperBaton
  name: коробка патронов дубинки миротворца
  description: Коробка дубиночных гранат пониженной летальности для «Миротворца», помни, «пониженная» не значит безопасная.
  components:
    - type: BallisticAmmoProvider
