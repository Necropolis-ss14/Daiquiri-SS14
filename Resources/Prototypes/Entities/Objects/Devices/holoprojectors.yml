- type: entity
  parent: HolofanProjector
  id: HolofanProjectorBorg
  name: встроенный голо-вентилятор
  description: Не даёт идиотам причинить ещё больше вреда экипажу во время атмосферных аварий. Установлен прямо в инженерного киборга, со временем перезаряжается.
  components:
  - type: ItemSlots
    slots:
      cell_slot:
