- type: entity
  id: CrateFoodSoftdrinksLarge
  parent: CratePlastic
  name: оптовый ящик газировки
  description: Куча газировки прямо из автоматов Центкома — отдел же не покинешь. Внутри 32 банки.
  components:
  - type: EntityStorage
    capacity: 32 # Slightly over-sized CratePlastic to accomodate over 30 drink cans at once.
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: DrinkColaCan
          amount: 8
        - id: DrinkGrapeCan
          amount: 4
        - id: DrinkRootBeerCan
          amount: 4
        - id: DrinkIcedTeaCan
          amount: 4
        - id: DrinkLemonLimeCan
          amount: 4
        - id: DrinkLemonLimeCranberryCan
          amount: 4
        - id: DrinkFourteenLokoCan
          amount: 4


- type: entity
  id: CrateFoodPizzaLarge
  parent: CratePlastic
  name: аварийная доставка пиццы
  description: "Когда всё пропало — утешься: больше пиццы решает всё. Внутри 16 пицц."
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: FoodBoxPizzaFilled
          amount: 15
        - id: FoodBoxPizzaCotton
        - id: LidSalami
          prob: 0.04
