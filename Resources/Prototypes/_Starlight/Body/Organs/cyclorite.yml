- type: entity
  id: BaseCycloriteOrgan
  parent: BaseItem
  abstract: true
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Cyclorite/organs.rsi
  - type: Organ
  - type: Edible
  - type: Extractable
    grindableSolutionName: organ
  - type: SolutionManager
    solutions:
    - SolutionOrganNutriment
    - SolutionOrganFoodMeat
  - type: FlavorProfile
    flavors:
      - people
  - type: Tag
    tags:
      - Meat


- type: entity
  id: OrganCycloriteBrain
  parent: [BaseOrganBrain, BaseCycloriteOrgan]
  name: мозг циклорита
  suffix: Cyclorite
  description: Источник невероятного, бесконечного интеллекта. Хонк.
  components:
  - type: Sprite
    state: brain

- type: entity
  id: OrganCycloriteEye
  parent: [BaseCycloriteOrgan, BaseOrganEyes]
  name: глаз циклорита
  suffix: Cyclorite
  description: Циклориты видят мир немного иначе.
  components:
  - type: Sprite
    layers:
      - state: eyeball
  - type: FunctionalOrgan
    comps:
    # - type: CycloriteVision
    - type: NightVision
      disabilityBlockable: true
  - type: OrganVisualization
    layer: Eyes
    prototypes:
      Default: MobCycloriteEyes

- type: entity
  id: OrganCycloriteTongue
  parent: [BaseCycloriteOrgan, BaseOrganTongue]
  name: язык циклорита
  suffix: Cyclorite
  description: Мясистая мышца, в основном используемая для лжи.
  components:
  - type: OrganTongue
    sounds:
      Male: MaleCyclorite
      Female: FemaleCyclorite
      Unsexed: MaleCyclorite
  - type: Sprite
    state: tongue

- type: entity
  id: OrganCycloriteEars
  parent: [BaseCycloriteOrgan, BaseOrganEars]
  name: уши циклорита
  suffix: Cyclorite
  description: "У уха три части: внутренняя, средняя и наружная. В норме видимой должна быть только одна из них."
  components:
  - type: Sprite
    state: ears

- type: entity
  id: OrganCycloriteLungs
  parent: [BaseCycloriteOrgan, BaseOrganLungs]
  name: лёгкие циклорита
  suffix: Cyclorite
  description: Лёгкие циклорита фильтруют азот из атмосферы для дыхания.
  components:
  - type: Sprite
    layers:
      - state: lung-l
      - state: lung-r
  - type: Lung
    alert: LowNitrogen
  - type: Metabolizer
    metabolizerTypes: [ Slime, Cyclorite ]
    stages: [ Respiration ]
  - type: SolutionManager
    solutions:
    - SolutionOrganNutriment
    - SolutionOrganFoodMeat
    - SolutionOrganLung

- type: entity
  id: OrganCycloriteHeart
  parent: [BaseCycloriteOrgan, BaseOrganHeart]
  name: сердце циклорита
  suffix: Cyclorite
  description: Жаль этого бессердечного ублюдка, потерявшего его.
  components:
  - type: Sprite
    state: heart-on
  # The heart 'metabolizes' medicines and poisons that aren't filtered out by other organs.
  # This is done because these chemicals need to have some effect even if they aren't being filtered out of your body.
  # You're technically 'immune to poison' without a heart, but.. uhh, you'll have bigger problems on your hands.
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [ Cyclorite ]
    stages: [ Bloodstream ]
- type: entity
  id: OrganCycloriteStomach
  parent: [BaseCycloriteOrgan, BaseOrganStomach]
  name: желудок циклорита
  suffix: Cyclorite
  description: Мерзость. Такое тяжело переварить.
  components:
  - type: Sprite
    state: stomach
  - type: SolutionManager
    solutions:
    - SolutionOrganNutriment
    - SolutionOrganFoodMeat
    - SolutionOrganStomach50
  - type: Stomach
  # The stomach metabolizes stuff like foods and drinks.
  # TODO: Have it work off of the ent's solution container, and move this
  # to intestines instead.
  - type: Metabolizer
    # mm yummy
    maxReagents: 3
    metabolizerTypes: [ Slime ]
    stages: [ Digestion ]

- type: entity
  id: OrganCycloriteLiver
  parent: [BaseCycloriteOrgan, BaseOrganLiver]
  name: печень циклорита
  suffix: Cyclorite
  description: "Рекомендуемое сочетание: кьянти и бобы."
  components:
  - type: Sprite
    state: liver
  - type: Metabolizer # The liver metabolizes certain chemicals only, like alcohol.
    maxReagents: 1
    metabolizerTypes: [ Slime ]
    stages: [ Metabolites ]
- type: entity
  id: OrganCycloriteKidneys
  parent: [BaseCycloriteOrgan, BaseOrganKidneys]
  name: почки циклорита
  suffix: Cyclorite
  description: Фильтруют токсины из кровотока.
  components:
  - type: Sprite
    layers:
      - state: kidney-l
      - state: kidney-r
  # The kidneys just remove anything that doesn't currently have any metabolisms, as a stopgap.
  - type: Metabolizer
    maxReagents: 5
    metabolizerTypes: [ Slime ]
