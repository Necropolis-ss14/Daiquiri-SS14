# Cargo Legs
- type: entity
  id: LeftLegCyberCargo
  name: левая грузовая кибернетическая нога
  parent: [PartCyber, LeftLegCyberBase]
  description: Погодите-ка... Это просто старая модель киберноги, к которой кто-то пришил подсумок!
  components:
    - type: BaseLayerId
      layers:
        Default: CyberLLegCargo
        Rodentia: RodentiaCyberLLegCargo
        Resomi: ResomiCyberLLegCargo
        Experiment: ExperimentCyberLLegCargo
    - type: Sprite
      sprite: _Starlight/Mobs/Species/Cyberlimbs/parts.rsi
      state: "l_leg_cargo"
    - type: Icon
      sprite: _Starlight/Mobs/Species/Cyberlimbs/parts.rsi
      state: "l_leg_cargo"
    - type: MovementBodyPart
      sprintSpeed : 4.05
      maxDensity: 155
    - type: FootstepModifier
      footstepSoundCollection:
        path: /Audio/Mecha/sound_mecha_powerloader_step.ogg
        params:
          volume: 0.1
    - type: LimbWithAction
      action: ActionOpenStorageLeftLeg
    - type: StorageOrgan
      organAction: ActionOpenStorageLeftLeg
      actionKey: LeftLeg
    - type: Storage
      clickInsert: false
      showVerb: false
      openOnActivate: false
      grid:
      - 0,0,1,2
      maxItemSize: Large
      blacklist:
        components:
          - BodyPart
          - Organ
    - type: PrivateStorage
      accessDelay: 3.0
      accessPopup: "cargo-leg-left-storage-accessing"
    - type: ContainerContainer
      containers:
        storagebase: !type:Container
          ents: []
    - type: UserInterface
      interfaces:
        enum.StorageUiKey.Key:
          type: StorageBoundUserInterface

