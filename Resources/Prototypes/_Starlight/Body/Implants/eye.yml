- type: entity
  id: BaseEntityEyeImplant
  abstract: true
  parent: [ BaseItem, BaseImplant ]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/implants.rsi
  - type: Organ
  - type: EyeImplant
  - type: FlavorProfile
    flavors:
      - people

- type: entity
  id: EyeImplantWelding
  name: ent-EyeImplantWelding
  description: ent-EyeImplantWelding-desc
  parent: BaseEntityEyeImplant
  components:
  - type: Sprite
    state: eye_implant_welding
  - type: FunctionalOrgan
    comps:
    - type: EyeProtection
    - type: WeldingMask

- type: entity
  id: EyeImplantDiagnostic
  name: ent-EyeImplantDiagnostic
  description: ent-EyeImplantDiagnostic-desc
  parent: BaseEntityEyeImplant
  components:
  - type: Sprite
    state: eye_implant_diagnostic
  - type: FunctionalOrgan
    comps:
    - type: ShowAccessReaderSettings
    - type: ShowHealthBars
      damageContainers:
      - Inorganic
      - Silicon
      - IPC
      - Hybrid

- type: entity
  id: EyeImplantMedical
  name: ent-EyeImplantMedical
  description: ent-EyeImplantMedical-desc
  parent: BaseEntityEyeImplant
  components:
  - type: Sprite
    state: eye_implant_medical
  - type: FunctionalOrgan
    comps:
    - type: ShowHealthBars
      damageContainers:
      - Biological
      - Hybrid # Neocytes
    - type: ShowHealthIcons
      damageContainers:
        - Biological
        - Hybrid

- type: entity
  id: EyeImplantChemistry
  name: ent-EyeImplantChemistry
  description: ent-EyeImplantChemistry-desc
  parent: BaseEntityEyeImplant
  components:
  - type: Sprite
    state: eye_implant_chemistry
  - type: FunctionalOrgan
    comps:
    - type: SolutionScanner

- type: entity
  id: EyeImplantSecurity
  name: ent-EyeImplantSecurity
  description: ent-EyeImplantSecurity-desc
  parent: BaseEntityEyeImplant
  components:
  - type: Sprite
    state: eye_implant_security
  - type: FunctionalOrgan
    comps:
    - type: ShowJobIcons
    - type: ShowMindShieldIcons
    - type: ShowCriminalRecordIcons

- type: entity
  id: EyeImplantSyndie
  name: ent-EyeImplantSyndie
  description: ent-EyeImplantSyndie-desc
  parent: [ BaseEntityEyeImplant, BaseSyndicateContraband ]
  components:
  - type: Sprite
    state: eye_implant_syndicate
  - type: FunctionalOrgan
    comps:
    - type: ShowHealthBars
      damageContainers:
      - Biological
      - Hybrid # Neocytes
    - type: ShowHealthIcons
      damageContainers:
        - Biological
        - Hybrid
    - type: ShowJobIcons
    - type: ShowMindShieldIcons
    - type: ShowCriminalRecordIcons
    - type: ShowSyndicateIcons
