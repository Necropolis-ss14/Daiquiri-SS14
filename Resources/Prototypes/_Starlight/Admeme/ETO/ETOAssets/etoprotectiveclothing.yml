- type: entity
  parent: [ClothingHeadHelmetBase, BaseETOContraband]
  id: ClothingHeadHelmetETO
  name: шлем оперативника ETO
  description: Шлем для оперативников ETO, базовая защита.
  components:
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.90
        Piercing: 0.9
        Heat: 0.9
  - type: Sprite
    sprite: _Starlight/Admeme/ETO/clothing/armour/etohelmet.rsi
  - type: Clothing
    sprite: _Starlight/Admeme/ETO/clothing/armour/etohelmet.rsi

- type: entity
  parent: [ClothingHeadBase, BaseETOContraband]
  id: ClothingHeadETOEvaHelmet
  name: шлем космической опасности ETO
  description: Сертифицированный для космоса шлем с баллистической защитой.
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/ETO/clothing/armour/etoevahelmet.rsi
    layers:
    - state: icon
  - type: Clothing
    sprite: _Starlight/Admeme/ETO/clothing/armour/etoevahelmet.rsi
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    equipDelay: 1
    unequipDelay: 1
  - type: BreathMask
  - type: Item
    size: Normal
  - type: PressureProtection
    highPressureMultiplier: 0.1
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.01
    coolingCoefficient: 0.01
  - type: IngestionBlocker
  - type: Tag
    tags:
    - HelmetEVA
  - type: StaticPrice
    price: 1000
  - type: Pierceable
    level: Metal
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.90
        Piercing: 0.85
        Heat: 0.9
        Radiation: 0.95

