- type: gameMap
  id: WhimsRelictnew # айди прототипа вашей карты
  mapName: 'Relict' # название карты
  mapPath: /Maps/_Daiquiri/Relictnew/Relict.yml # путь до файла карты
  minPlayers: 10 # минимальное количество игроков для появления карты в голосовании
  maxPlayers: 55 # максимально количество игроков для карты
  stations:
    relictnew: # айди карты, которое вы прописывали в BecomeStationComponent
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Реликт {1}' # шаблон для названия станции в раунде
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'WSRG' # префикс автора для карты
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency.yml # путь до шаттла эвакуации, который будет использоваться на этой карте
        - type: StationJobs
          availableJobs:
            # service
            HeadOfPersonnel: [ 1, 1 ] # первая цифра - количество раундстарт мест для данной роли, вторая цифра - количество мест для позднего присоединения.
            Passenger: [ -1, -1 ]
            ServiceWorker: [ 3, 3 ]
            Bartender: [ 1, 1 ]
            Botanist: [ 2, 2 ]
            Chef: [ 2, 2 ]
            Clown: [ 1, 1 ]
            Janitor: [ 2, 2 ]
            Mime: [ 1, 1 ]
            Chaplain: [ 1, 1 ]
            Librarian: [ 1, 1 ]
            Musician: [ 1, 1 ]
            # command
            Captain: [ 1, 1 ]
            IAA: [ 1, 1 ]
            # engineering
            ChiefEngineer: [ 1, 1 ]
            AtmosphericTechnician: [ 2, 2 ]
            StationEngineer: [ 4, 4 ]
            TechnicalAssistant: [ 3, 3 ]
            # medical
            ChiefMedicalOfficer: [ 1, 1 ]
            Paramedic: [ 1, 1 ]
            Chemist: [ 2, 2 ]
            MedicalDoctor: [ 4, 4 ]
            MedicalIntern: [ 3, 3 ]
            # science
            ResearchDirector: [ 1, 1 ]
            Scientist: [ 3, 3 ]
            ResearchAssistant: [ 3, 3 ]
            Borg: [ 4, 4 ]
            # security
            HeadOfSecurity: [ 1, 1 ]
            Warden: [ 1, 1 ]
            Detective: [ 1, 1 ]
            SecurityOfficer: [ 4, 4 ]
            Psychologist: [ 1, 1 ]
            SecurityCadet: [ 3, 3 ]
            # cargo
            Quartermaster: [ 1, 1 ]
            SalvageSpecialist: [ 3, 3 ]
            CargoTechnician: [ 3, 3 ]
            #Adventure
            BlueShield: [ 1, 1 ]
            Brigmedic: [ 1, 1 ]
            StationAi: [ 1, 1 ]

            # Our roles
            MailTech: [ 2, 2 ]
            GunnerySergeant: [ 1, 1 ]
            DutyOfficer: [ 1, 1 ]
            Performer: [ 2, 2 ]
            Magistrate: [ 1, 1 ]
            Roboticist: [ 2, 2 ]
            K9: [ 1, 1 ]
            NanotrasenCareerTrainer: [ 1, 2 ]
            RadioHost: [ 1, 1 ]
            Boxer: [ 2, 2 ]
            Geneticist: [ 1, 1 ]
            MiningSpecialist: [ 3, 3 ]
            SalvageLead: [ 1, 1 ]
            Surgeon: [ 1, 2 ]
            NanoTrasenRepresentative: [ 1, 1 ]
            AssistantManager: [ 1, 1 ]
            SalvageMedic: [ 1, 1 ]

