- type: entity
  id: OrganCyber
  parent: BaseItem
  name: киберорган
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
  - type: Organ
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Iron
        Quantity: 30
  - type: HumanoidEMPCompositeElement
    effect:
      damageAmount:
        types:
          Shock: 5

- type: entity
  id: CyberEyeNightVision
  name: киберглаза ночного видения
  description: Позволяют видеть в темноте.
  parent: [OrganCyber, BaseOrganEyes]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/implants.rsi
    state: eyes_night
  - type: FunctionalOrgan
    comps:
    - type: NightVision
  - type: OrganVisualization
    layer: Eyes
    prototypes:
      Default: CyberEyesNightVision
      Resomi: ResomiCyberEyesNightVision
      Experiment: ExperimentCyberEyesNightVision
  - type: HumanoidEMPCompositeElement
    effect:
      glitchDuration: 10.0
      additionalEffects:
        StatusEffectTemporaryBlindness: 2.0
      damageAmount:
        types:
          Shock: 5

- type: entity
  id: CyberEyeThermal
  name: киберглаза теплового видения
  description: Позволяют видеть в темноте и обнаруживать тёплые объекты сквозь стены.
  parent: [OrganCyber, BaseOrganEyes]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/implants.rsi
    state: eyes_thermal
  - type: FunctionalOrgan
    comps:
    - type: ThermalVision
  - type: OrganVisualization
    layer: Eyes
    prototypes:
      Default: CyberEyesThermalVision
      Resomi: ResomiCyberEyesThermalVision
      Experiment: ExperimentCyberEyesThermalVision
  - type: HumanoidEMPCompositeElement
    effect:
      glitchDuration: 10.0
      additionalEffects:
        StatusEffectTemporaryBlindness: 2.0
      damageAmount:
        types:
          Shock: 5

- type: entity
  id: BudgetCyberEyes
  name: бюджетные киберглаза
  description: Холодные и бездушные. Смотреть сквозь них так же тоскливо, как и в них.
  parent: [OrganCyber, BaseOrganEyes]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/budget_cyber_organs.rsi
    layers:
      - state: eyeball-l
      - state: eyeball-r
  - type: FunctionalOrgan
    comps:
    - type: NoirOverlay
  - type: OrganVisualization
    layer: Eyes
    prototypes:
      Default: MobHumanoidEyes
      Resomi: MobResomiEyes
      Moth: MobMothEyes
      Felionoid: MobFelionoidEyes
      Thaven: MobThavenEyes
      Avali: MobAvaliEyes
      Shadekin: MobShadekinEyes
      Arachnid: MobArachnidEyes
      Diona: MobDionaEyes
      Vox: MobVoxEyes
      Cyclorite: MobCycloriteEyes
      Abductor: MobAbductorEyes
      Experiment: MobExperimentEyes
  - type: HumanoidEMPCompositeElement
    effect:
      glitchDuration: 10.0
      additionalEffects:
        StatusEffectTemporaryBlindness: 2.0
      damageAmount:
        types:
          Shock: 5

- type: entity
  id: BudgetCyberTongue
  name: бюджетный киберъязык
  description: Искусственный язык с полной подвижностью. Вкусовые рецепторы не включены.
  parent: [OrganCyber, BaseOrganTongue]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/budget_cyber_organs.rsi
    state: tongue
  - type: FunctionalOrgan
    comps:
    - type: UnableToTaste

- type: entity
  id: VocalCyberTongue
  name: вокальный киберъязык
  description: Искусственный язык с полной подвижностью. Позволяет издавать все голосовые звуки.
  parent: [OrganCyber, BaseOrganTongue]
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Specific/Medical/budget_cyber_organs.rsi
      state: tongue
    - type: OrganTongue
      allowAllVocalEmotes: true
      sounds:
        Male: MaleAllEmotes
        Female: FemaleAllEmotes
        Unsexed: MaleAllEmotes

- type: entity
  id: BudgetCyberLiver
  name: бюджетная киберпечень
  description: "Конструкция настолько надёжна, что не менялась последние 237 лет! Внимание: продукт не предназначен для увеселительного распития алкоголя!"
  parent: [OrganCyber, OrganHumanLiver]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/budget_cyber_organs.rsi
    state: liver
  - type: Metabolizer # The liver metabolizes certain chemicals only, like alcohol.
    maxReagents: 1
    metabolizerTypes: [BudgetCyber]
    stages: [ Metabolites ]
- type: entity
  id: BudgetCyberStomach
  name: бюджетный кибержелудок
  description: Искусственный желудок. Отсутствие эластичности — желанная особенность для тех, кто хочет контролировать пищевые привычки.
  parent: [OrganCyber, OrganHumanStomach]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/budget_cyber_organs.rsi
    state: stomach
  - type: SolutionManager
    solutions:
    - SolutionOrganNutriment
    - SolutionOrganFoodMeat
    - SolutionOrganStomach30
  - type: Metabolizer
    maxReagents: 3
    metabolizerTypes: [BudgetCyber]
    stages: [ Digestion ]

- type: entity
  id: BudgetCyberKidneys
  name: бюджетные киберпочки
  description: Пара искусственных почек. Из-за дешёвых материалов тратят значительно больше воды, чем органические.
  parent: [OrganCyber, OrganHumanKidneys]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/budget_cyber_organs.rsi
    layers:
      - state: kidney-l
      - state: kidney-r
  - type: FunctionalOrgan
    comps:
    - type: ThirstRateMultiplier
      multiplier: 1.25

- type: entity
  id: CyberRebreather
  name: киберреспиратор
  description: Искусственные лёгкие со встроенной системой газового баллона. Можно заправлять любой дыхательной газовой смесью.
  parent: [OrganCyber, OrganHumanLungs]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/breathable_cyber_lungs.rsi
    layers:
      - state: lung-l
      - state: lung-r
  - type: Metabolizer
    metabolizerTypes: [ Human ]
  - type: Lung
    alert: LowOxygen
  - type: Item
    size: Normal
    heldPrefix: lungs
    sprite: _Starlight/Objects/Specific/Medical/breathable_cyber_lungs.rsi
    shape:
    - 0,0,3,3
  - type: BreathMask
  - type: OrganBreathTool
    startActivated: false
  - type: GasTank
    air:
      volume: 2.5
      temperature: 293.15
    outputPressure: 21.3
  - type: OrganGasTankFillable
    targetPressure: 1000.0
  - type: UseDelay
    delays:
      gasTank:
        length: 1.0
  - type: ActivatableUI
    key: enum.SharedGasTankUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SharedGasTankUiKey.Key:
        type: GasTankBoundUserInterface
      enum.SharedGasTankUiKey.OrganKey:
        type: BreathableOrganBoundUserInterface
  - type: Tag
    tags:
    - GasTank
