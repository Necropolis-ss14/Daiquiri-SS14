- type: entity
  parent: [ BaseContrabandTier3, BaseItem, BaseSecurityContraband ] # Blimpuf
  id: FiringPin
  name: ударник
  description: Кому-то это сейчас очень нужно...
  components:
  - type: Item
    size: Small
  - type: Appearance
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Pins/firing_pins.rsi
    state: rifle
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Weapons/Guns/Casings/casing_fall_2.ogg
      params:
        volume: -1
  - type: StaticPrice
    price: 500
  - type: FiringPin
    pinType: Rifle
  - type: StealTarget
    stealGroup: FiringPin

- type: entity
  parent: FiringPin
  id: FiringPinPistol
  name: пистолетный ударник
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Pins/firing_pins.rsi
    state: pistol
  - type: FiringPin
    pinType: Pistol

- type: entity
  parent: FiringPin
  id: FiringPinMakeshift
  name: самодельный ударник
  description: Это гвоздь. Приваренный к крышке от бутылки.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Pins/firing_pins.rsi
    state: makeshift
  - type: FiringPin
    pinType: Makeshift
  - type: StaticPrice
    price: 10

- type: entity
  parent: FiringPin
  id: FiringPinSmartLMG
  name: затворный механизм смартгана
  description: Единственный в своём роде, незаменимый. Со счётчиком патронов.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Pins/firing_pins.rsi
    state: lmg
  - type: FiringPin
    pinType: SmartLMG
  - type: FiringPinShotCounter

- type: entity
  parent: FiringPin
  id: FiringPinLaser
  name: лазерный кристалл
  description: Хрупкий, как и ассистенты, убитые им.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Pins/firing_pins.rsi
    state: laser
  - type: FiringPin
    pinType: Laser
    meltedPrototype: FiringPinLaserCracked
    meltedPopup: gun-heat-crystal-cracked
    meltedSound:
      collection: GlassBreak
  - type: StaticPrice
    price: 50
  - type: Damageable
    damageContainer: Inorganic
  - type: DamageOnLand
    damage:
      types:
        Blunt: 5
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 5
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -8
      - !type:DoActsBehavior
        acts: [ "Breakage" ]
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -8
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: FiringPinLaser
  id: FiringPinAdvancedLaser
  name: прототип лазерного кристалла
  description: На боку написано НЕ РОНЯТЬ. Ну ладно.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Pins/firing_pins.rsi
    state: adv-laser
  - type: FiringPin
    pinType: AdvancedLaser
    meltedPrototype: FiringPinAdvancedLaserCracked
    meltedPopup: gun-heat-crystal-cracked
    meltedSound:
      collection: GlassBreak
  - type: StealTarget
    stealGroup: FiringPinAdvancedLaser
  - type: Explosive
    explosionType: Default
    totalIntensity: 100 # slightly more impressive than a welding tank explosion
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:ExplodeBehavior
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -8
      - !type:DoActsBehavior
        acts: [ "Breakage" ]
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -8
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassPlasma:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:ExplodeBehavior

# cool functionality ish pins
- type: entity
  parent: FiringPin
  id: FiringPinExpedition
  name: экспедиционный ударник
  description: Универсальный ударник не даёт пушке стрелять на станции, удобно для оружия внестанционных экспедиций.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Pins/firing_pins.rsi
    state: exped
  - type: FiringPin
    pinType: GunUpgrade
  - type: FiringPinExpedition

- type: entity
  parent: BaseItem
  id: FiringPinMelted
  name: расплавленный ударник
  description: Комок металла, бывший ударником, пока кто-то не продолжил стрелять.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Pins/firing_pins.rsi
    state: rifle
    color: "#8a5a3c"
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Weapons/Guns/Casings/casing_fall_2.ogg
      params:
        volume: -1
  - type: Tag
    tags:
    - Trash
  - type: StaticPrice
    price: 0

- type: entity
  parent: FiringPinMelted
  id: FiringPinLaserCracked
  name: треснувший лазерный кристалл
  description: Линза энергопушки, треснувшая от жара. Луч уже не сфокусирует.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Pins/firing_pins.rsi
    state: laser-cracked
    color: "#ffffff"
  - type: EmitSoundOnLand
    sound:
      collection: GlassBreak
      params:
        volume: -8

- type: entity
  parent: FiringPinLaserCracked
  id: FiringPinAdvancedLaserCracked
  name: треснувший прототип лазерного кристалла
  description: Остатки прототипного лазерного кристалла после того, как кто-то продолжил стрелять. Хоть не взорвался.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Pins/firing_pins.rsi
    state: adv-laser-cracked
    color: "#ffffff"

- type: entity
  parent: FiringPinAdvancedLaser
  id: FiringPinAdvancedLaserReplacement
  name: выращенный в лаборатории прототип лазерного кристалла
  description: Лабораторная копия прототипного лазерного кристалла. Такая же хрупкая, как оригинал.
  components:
  - type: StealTarget
    stealGroup: FiringPin
  - type: StaticPrice
    price: 300

- type: entity
  parent: FiringPinSmartLMG
  id: FiringPinSmartLMGReplacement
  name: запасной затворный механизм смартгана
  description: Фрезерованная копия затворного механизма смартгана. Со счётчиком патронов.
  components:
  - type: StealTarget
    stealGroup: FiringPin
