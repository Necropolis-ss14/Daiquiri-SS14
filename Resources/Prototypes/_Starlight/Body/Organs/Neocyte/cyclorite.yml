- type: entity
  id: OrganNeoCycloriteLungs
  parent: OrganNeocyteLungs
  name: кибернетические лёгкие циклорита
  suffix: Neo-Cyclorite
  description: Фильтруют азот из атмосферы, который затем поступает в кровоток и используется как переносчик электронов. Полностью кибернетические по природе, работают в паре с системой фильтрации визора.
  components:
  - type: Lung
    alert: LowNitrogen
  - type: Metabolizer
    metabolizerTypes: [ Slime, Cyclorite ]
    stages: [ Respiration ]
- type: entity
  id: OrganNeoCycloriteEye
  parent: OrganNeocyteEyes
  name: кибернетический глаз циклорита
  suffix: Neo-Cyclorite
  description: Циклориты видят мир немного иначе.
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Cyclorite/organs.rsi
    layers:
      - state: eyeball
  - type: FunctionalOrgan
    comps:
    # - type: CycloriteVision
    - type: NightVision
      disabilityBlockable: true
  - type: OrganVisualization
    layer: Eyes
    prototypes:
      Default: MobCycloriteEyes

- type: entity
  id: OrganNeoCycloriteHeart
  parent: OrganNeocyteHeart
  name: кибернетическое сердце циклорита
  suffix: Neo-Cyclorite
  components:
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [Cyclorite, Neocyte]
    stages: [ Bloodstream ]

- type: entity
  id: OrganNeoCycloriteTongue
  parent: OrganNeocyteTongue
  suffix: Neo-Cyclorite
  components:
  - type: OrganTongue
    sounds:
      Male: NeoCycloriteMSounds
      Female: NeoCycloriteFSounds
      Unsexed: NeoCycloriteMSounds
