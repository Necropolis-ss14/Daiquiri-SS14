- type: entity
  parent: [ClothingNeckBase, BaseCommandContraband]
  id: ClothingNeckCloakBoat
  name: captain's boat cloak
  description: A regal blue durathread boat cloak with a red felt lining and gold trim. Somehow, it's even more expensive than it looks.
  components:
    - type: Sprite
      sprite: DeltaV/Clothing/Neck/Cloaks/boatcloak.rsi
    - type: StealTarget
      stealGroup: HeadCloak

- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckCloakBoatCC
  name: плащ-накидка Центрального командования
  description: Изумрудно-зелёная накидка-плащ из дуровой ткани с красной фетровой подкладкой и золотой окантовкой. Почему-то стоит даже дороже, чем выглядит.
  components:
    - type: Sprite
      sprite: DeltaV/Clothing/Neck/Cloaks/boatcloakcc.rsi

- type: entity
  parent: [ClothingNeckBase, BaseCommandContraband]
  id: ClothingNeckCloakBoatHos
  name: плащ-накидка главы службы безопасности
  description: Светло-серая накидка-плащ из дуровой ткани с красной фетровой подкладкой и золотой окантовкой. Почему-то стоит даже дороже, чем выглядит.
  components:
    - type: Sprite
      sprite: DeltaV/Clothing/Neck/Cloaks/boatcloakhos.rsi
    - type: StealTarget
      stealGroup: HeadCloak

- type: entity
  parent: [ClothingNeckBase, BaseCommandContraband]
  id: ClothingNeckCloakNtr
  name: плащ представителя NT
  description: Тяжёлый плащ, украшенный скромной эмблемой и пышной меховой отделкой.
  components:
    - type: Sprite
      sprite: DeltaV/Clothing/Neck/Cloaks/cjcloak.rsi

- type: entity
  parent: [ClothingNeckBase, BaseCommandContraband]
  id: ClothingNeckHosRobe
  name: роскошный халат главы службы безопасности
  description: Уютный парадный халат, выдаваемый ветеранам службы безопасности.
  components:
    - type: Sprite
      sprite: DeltaV/Clothing/Neck/Cloaks/hosrobe.rsi
    - type: StealTarget
      stealGroup: HeadCloak

- type: entity
  parent: [ClothingNeckBase, BaseCommandContraband]
  id: ClothingNeckCmoOverShoulder
  name: пальто через плечо главного врача
  description: Пальто для главных врачей, которые умеют носить пальто, но предпочитают делать это иначе — ради эффекта.
  components:
    - type: Sprite
      sprite: DeltaV/Clothing/Neck/Cloaks/cmo_over_shoulder.rsi
    - type: StealTarget
      stealGroup: HeadCloak

- type: entity
  parent: [ClothingNeckBase, BaseCommandContraband]
