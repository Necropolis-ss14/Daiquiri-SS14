- type: entity
  id: MobStargazer
  parent: [ BaseMobAsteroid, MobBloodstream ]
  name: звездочёт
  description: Таинственное существо из другого измерения; его пылающий взгляд расплавляет тех, кто его раздражает. Его внешняя оболочка сделана из карамелановых полимеров, смешанных с этилбутиратом, что придаёт ей липкий, но прочный защитный слой. Говорят, из него получается отличный арбузный леденец.
  components:
  - type: Sprite
    sprite: _Funkystation/Mobs/XenoArch/stargazer.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: eyething
  - type: DamageStateVisuals
    states:
      Alive:
        Base: eyething
      Dead:
        Base: eyething
  - type: MovementSpeedModifier
    baseWalkSpeed : 2
    baseSprintSpeed : 3
  - type: MobThresholds
    thresholds:
      0: Alive
      75: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/gib1.ogg
          params:
            volume: -4
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          StargazerShell1:
            min: 1
            max: 1
          StargazerShell2:
            min: 1
            max: 1
          StargazerShell3:
            min: 1
            max: 1
  - type: FireProtection
    reduction: 1 # Gotta keep it from killing itself lol
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: Gun
    fireRate: 0.5
    projectileSpeed: 8.5
    selectedMode: SemiAuto
    showExamineText: false
    availableModes: [ SemiAuto ]
    soundGunshot: /Audio/Weapons/Guns/Gunshots/syringe_gun.ogg
  - type: RechargeBasicEntityAmmo
    showExamineText: false
    rechargeCooldown: 0
    rechargeSound: null
  - type: BasicEntityAmmoProvider
    proto: ProjectileWeakFireball
    capacity: 1
    count: 1
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 200
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: BasiliskCompound
    blackboard:
      VisionRadius: !type:Single
        7
      AggroVisionRadius: !type:Single
        12
      NavSmash: !type:Bool
        true

- type: entity
  parent: BaseItem
  id: StargazerShell1
  name: осколок
  description: Странный осколок панциря. Останки звездочёта.
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/XenoArch/stargazer_shell.rsi
    state: shell1
  - type: Item
    size: Tiny
  - type: EmbeddableProjectile
    offset: 0.0,0.0
    removalTime: 1.5
  - type: ThrowingAngle
    angle: 0
  - type: LandAtCursor
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 10
  - type: Tag
    tags:
    - StargazerShellTag

