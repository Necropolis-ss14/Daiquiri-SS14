- type: entity
  id: BaseLanguageTranslator
  parent: Translator
  name: language-translator-base-name
  description: language-translator-base-desc
  components:
  - type: Sprite
    sprite: _Daiquiri/Objects/Devices/translator.rsi
    layers:
    - state: icon
    - state: translator
      shader: unshaded
      visible: false
      map: ["translator"]
  - type: HandheldTranslator
    spoken:
    - GalacticCommon
    understood:
    - GalacticCommon
    requires:
    - GalacticCommon
  - type: Item
    size: Small

