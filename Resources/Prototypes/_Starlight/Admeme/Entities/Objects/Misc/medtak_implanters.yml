- type: entity
  id: MedTakImplanter
  parent: BaseImplantOnlyImplanter
  description: ent-MedTakImplanter-desc
  abstract: true
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/Objects/Misc/implanter.rsi
    state: implanter0
    layers:
    - state: implanter1
      map: [ "implantFull" ]
      visible: true
    - state: implanter0
      map: [ "implantOnly" ]
  - type: Item
    sprite: _Starlight/Admeme/Objects/Misc/implanter.rsi
    heldPrefix: implanter
  - type: Implanter
    implantTime: 2.5

- type: entity
  id: MedTakImplanterMindShield
  name: ent-MedTakImplanterMindShield
  parent: MedTakImplanter
  components:
  - type: Implanter
    implant: MedTakMindShieldImplant

