  name: бомбер сердца рокера
  description: Было приятно знать тебя...
  components:
    - type: Sprite
      sprite: _Starlight/Clothing/OuterClothing/Coats/rockersheartbomber.rsi
      layers:
        - state: icon
    - type: Clothing
      sprite: _Starlight/Clothing/OuterClothing/Coats/rockersheartbomber.rsi
      clothingVisuals:
        outerClothing:
          - state: equipped-OUTERCLOTHING
          - state: equipped-OUTERCLOTHING-unshaded
            shader: unshaded

