- type: entity
  parent: Paper
  id: TapeRecorderTranscript
  name: стенограмма записи
  # TODO: could have a unique sprite in the future

- type: entity
  name: бумага НТ-ЦК
  parent: Paper
  id: PaperNTCC
  description: Единица бюрократии с логотипами NanoTrasen и Центрального командования.
  components:
  - type: Sprite
    sprite: Objects/Misc/bureaucracy.rsi
    layers:
    - state: paper_ntcc
    - state: paper_ntcc_words
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: PaperVisuals
    backgroundPatchMargin: 16.0, 16.0, 16.0, 16.0
    contentMargin: 0.0, 0.0, 0.0, 0.0
    headerImagePath: "/Textures/_Starlight/Interface/Paper/paper_heading_nt_cc_logos.svg.96dpi.png"
    headerMargin: 0.0, 0.0, 0.0, 0.0

- type: entity
  parent: NukeCodePaper
  id: NukeCodePaperAllNukes
  suffix: All Nukes
  components:
  - type: NukeCodePaper
    allNukesAvailable: true
    printAll: true

- type: entity
  parent: BaseItem
  id: JailFree
  name: карта «выход из тюрьмы»
  description: "На карте написано «Выйди из тюрьмы бесплатно!», справа — рисунок мелком: человек в маске клоуна и с моноклем сбегает из клетки. И текст, и рисунок — мелком."
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Misc/paper.rsi
    layers:
    - state: jailfree
  - type: Edible
    delay: 7
    forceFeedDelay: 7
  - type: FlavorProfile
    flavors:
    - paper
  - type: BadFood
  - type: Solution
    id: food
    solution:
      maxVol: 1
      reagents:
      - ReagentId: Fiber
        Quantity: 1
  - type: Item
    size: Tiny

- type: entity
  name: бумага ITG
  parent: Paper
  id: PaperITG
  description: Единица бюрократии с логотипом Межзвёздной торговой гильдии.
  components:
  - type: Sprite
    sprite: Objects/Misc/bureaucracy.rsi
    layers:
    - state: paper_ntcc
    - state: paper_ntcc_words
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: PaperVisuals
    backgroundPatchMargin: 16.0, 16.0, 16.0, 16.0
    contentMargin: 0.0, 0.0, 0.0, 0.0
    headerImagePath: "/Textures/_Starlight/Interface/Paper/paper_heading_itg_logo.png"
    headerMargin: 0.0, 0.0, 0.0, 0.0
