- type: entity
  parent: [ BaseMob, MobCombat ]
  id: UristMcStone
  name: Перворождённый
  description: Извлечённые обломки были радиометрически датированы возрастом, превышающим текущие оценки возраста Вселенной. Швы и трещины на его теле — не следствие естественной эрозии, а повторяющиеся узоры, будто язык, вырезанный в камне.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Funkystation/Mobs/XenoArch/urist_mc_stone.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: urist_mc_stone
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: urist_mc_stone_unshaded
      shader: unshaded
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 250
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: FloorOcclusion
  - type: ComplexInteraction
  - type: MobState
  - type: Pullable
  - type: ZombieImmune
  - type: Climbing
  - type: Damageable
    damageModifierSet: Rock
  #- type: Injurable # Starlight, no Injurable component for now
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -4
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageStateVisuals
    states:
      Alive:
        Base: urist_mc_stone
      Dead:
        Base: urist_mc_stone
  - type: MobThresholds
    thresholds:
      0: Alive
      190: Critical
      200: Dead
  - type: MeleeWeapon
    altDisarm: false
    soundHit:
      path: /Audio/Weapons/punch3.ogg
    angle: 0
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 20
        Structural: 20
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      NavSmash: !type:Bool
        true
  - type: MovementSpeedModifier
    baseWalkSpeed: 0.7
    baseSprintSpeed: 0.7
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepStoneScrape
  - type: Tag
    tags:
    - CannotSuicide
    - DoorBumpOpener
    - FootstepSound
