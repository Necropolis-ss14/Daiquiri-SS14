- type: entity
  parent: [ BorgHypo, BaseXenoborgContraband ]
  id: LicoxideHypo
  name: гипо ликоксид
  description: Самозаполняющийся инъектор для быстрого введения ликоксида жертвам.
  components:
  - type: Solution
    id: hypospray
    solution:
      maxVol: 8
      reagents:
      - ReagentId: Licoxide
        Quantity: 8
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: Licoxide
        Quantity: 0.2

