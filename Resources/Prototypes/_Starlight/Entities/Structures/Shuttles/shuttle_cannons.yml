      - Magazine60mmRocket

# M321-CHARYBDIS 'Thanatos' 280mm Railgun - Single-shot, manually loaded, extreme damage
- type: entity
  id: ShuttleGunCharon
  parent: ShuttleGunBase
  name: Рельсотрон M321-CHARYBDIS «Танатос» 280 мм
  description: Однозарядный электромагнитный рельсотрон с непревзойдённой разрушительной мощью. Разгоняет 280-мм снаряд до сокрушительных скоростей. Штатный кинетический снаряд пробивает слоистую броню и конструкции с минимальным взрывом — хирургически точный бронебойный снаряд. Зарядите субъядерный снаряд, чтобы обменять пробитие на уничтожающий корабль ядерный взрыв. Требует ручного заряжания каждого выстрела. Назван в честь поглощающего водоворота из легенд.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Shuttleguns/Charon.rsi
    state: space_artillery
  - type: ContainerContainer
    containers:
      ballistic_chamber: !type:ContainerSlot
      ballistic-ammo: !type:Container
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 500
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Anchorable
    delay: 120
  - type: Pullable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
        - !type:ChangeConstructionNodeBehavior
          node: machineFrame
        - !type:DoActsBehavior
          acts: ["Destruction"]
  - type: Gun
    projectileSpeed: 170    # railgun slug velocity
    fireRate: 100           # instant fire when loaded - delay is the manual reload
    burstCooldown: 180      # Starlight: 3-minute cooldown after firing
    selectedMode: SemiAuto
    angleDecay: 90
    minAngle: 0
    maxAngle: 0             # perfect accuracy
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_Starlight/Weapons/Shuttleguns/leviathan_fire.ogg
      params:
        variation: 0.05
        volume: 15
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: BallisticAmmoProvider
    mayTransfer: false
    whitelist:
      tags:
      - Cartridge280mmSlug
    proto: CartridgeCharon280mmSlug
    capacity: 1
    soundRack:
      path: /Audio/Weapons/Guns/Bolt/lmg_bolt_closed.ogg
      params:
        variation: 0.05
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg
      params:
        pitch: 0.6
        volume: 3
  - type: RadarBlip
    color: "#FF6600"
    scale: 2.0
    shape: Triangle
    requireInSpace: false
  - type: GunneryTrackable
    category: Ballistic
  - type: StaticPrice
    price: 25000

