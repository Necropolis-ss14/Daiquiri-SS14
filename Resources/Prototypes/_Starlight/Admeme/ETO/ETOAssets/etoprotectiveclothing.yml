    unequipSound: /Audio/Mecha/mechmove03.ogg
    equipDelay: 1
    unequipDelay: 1
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.5
