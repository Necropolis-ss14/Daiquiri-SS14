- type: entity
  name: дробовик для разгона толпы
  parent: [ BaseContrabandTier3, BaseWeaponShotgunAny, BaseGunWieldable, BaseSecurityContraband ] # Blimpuf
  id: WeaponShotgunRiot
  description: Крепкий дробовик с удлинённым магазином и фиксированной тактической рукоятью для нелетального разгона беспорядков.
  components:
  - type: Item
    sprite: _Starlight/Objects/Weapons/Guns/Shotguns/riot_inhands_64x.rsi
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Shotguns/riot.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Gun
    spread: 35
    fireRate: .7
    selectedMode: FullAuto
    availableModes:
    - FullAuto
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Guns/Shotguns/riot.rsi
  - type: GunRequiresWield
# - type: Construction
#   graph: ShotgunRiotSawn
#   node: start
#   deconstructionTarget: null
  - type: ItemSlots
    slots:
      gun_magazine:
        name: item-slot-component-slot-name-magazine
        startingItem: MagazineShotgun
        priority: 2
        whitelist:
          tags:
          - MagazineShotgun
        whitelistFailPopup: gun-magazine-whitelist-fail
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
      firing_pin: !type:Container # starlight
  - type: ChamberMagazineAmmoProvider
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

