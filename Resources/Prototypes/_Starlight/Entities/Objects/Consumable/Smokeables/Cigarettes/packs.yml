- type: entity
  id: CigPackSoviet
  parent: CigPackBase
  name: пачка песчаного червя Герата
  description: For when a sandworm has managed to eat your nuclear MRV supply.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Consumable/Smokeables/Cigarettes/Packs/soviet.rsi
  - type: Item
    sprite: _Starlight/Objects/Consumable/Smokeables/Cigarettes/Packs/soviet.rsi

- type: entity
  id: CigPackRollie
  parent: PackPaperRolling
  name: пачка самокруток
  description: Старая пачка бумаги для самокруток со всем необходимым для скручивания самокруток.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: CigaretteFilter
          amount: 2
        - id: PaperRolling
          amount: 2
        - id: GroundTobacco5
          amount: 2
        - id: CigaretteSyndicate
          amount: 2

- type: entity
  id: CigPackMedRollie
  parent: PackPaperRolling
  name: пачка лечебных блантов
  description: Старая пачка бумаги для самокруток со всем для блантов. Это чисто в лечебных целях, чувак..
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: LeavesTobaccoDried5
          amount: 2
        - id: GroundCannabis10
          amount: 1
        - id: Blunt
          amount: 2

- type: entity
  id: CigPackBub
  parent: PackPaperRolling
  name: пачка особых Греймена
  description: Старая пачка бумаги для самокруток с особыми сигаретами Греймена. Пока куришь, тянет к хирургии.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: CigaretteBub
          amount: 10

