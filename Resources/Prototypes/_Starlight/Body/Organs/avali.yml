- type: entity
  id: OrganAvaliStomach
  parent: OrganAnimalStomach
  name: желудок авали
  suffix: Avali
  description: При ближайшем рассмотрении вообще-то состоит из двух желудков.
  components:
  - type: Stomach
    specialDigestible:
      tags:
      - Meat
      - Pill
      - Crayon
      - Paper
      - AvianFood
      - IceCream
      - Birthday
  - type: SolutionManager
    solutions:
    - SolutionOrganFoodMeat
    - SolutionOrganStomach50
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Avali/organs.rsi
    state: stomach


- type: entity
  id: OrganAvaliHeart
  parent: OrganHumanHeart
  name: сердце авали
  suffix: Avali
  description: Сердце авали.
  components:
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [Avali]
    stages: [ Bloodstream ]
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Avali/organs.rsi
    state: heart-on

- type: entity
  id: OrganAvaliLiver
  parent: OrganHumanLiver
  name: печень авали
  suffix: Avali
  description: Печень авали.
  components:
  - type: Metabolizer # The liver metabolizes certain chemicals only, like alcohol.
    maxReagents: 1
    metabolizerTypes: [Avali]
    stages: [ Metabolites ]
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Avali/organs.rsi
    state: liver

- type: entity
  id: OrganAvaliKidneys
  parent: OrganHumanKidneys
  name: почки авали
  suffix: Avali
  description: Почки авали.
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Avali/organs.rsi
    layers:
      - state: kidney-l
      - state: kidney-r

- type: entity
  id: OrganAvaliLungs
  parent: OrganHumanLungs
  name: лёгкие авали
  suffix: Avali
  description: Лёгкие авали.
  components:
  - type: Metabolizer
    metabolizerTypes: [ Resomi, Human ] #They get both so they can still breathe oxygen without us needing to add Resomi everywhere Human is listed
    stages: [ Respiration ]
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Avali/organs.rsi
    layers:
      - state: lung-l
      - state: lung-r

- type: entity
  id: OrganAvaliEyes
  parent: OrganHumanEyes
  name: глаза авали
  suffix: Avali
  description: Глаза авали.
  components:
  - type: OrganVisualization
    layer: Eyes
    prototypes:
      Default: MobAvaliEyes

- type: entity
  id: OrganAvaliBrain
  parent: OrganHumanBrain
  name: мозг авали
  suffix: Avali
  description: Здесь авали вынашивают злобные мысли.
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Avali/organs.rsi
    state: brain

- type: entity
  id: OrganAvaliTongue
  parent: OrganHumanTongue
  suffix: Avali
  components:
  - type: OrganTongue
    allowedEmotes: ['Chirp', 'Hisses', 'Purr', 'Growl', 'Trill', 'Scree', 'Call', 'Squawk']
    sounds:
      Male: MaleAvali
      Female: FemaleAvali
      Unsexed: MaleAvali
