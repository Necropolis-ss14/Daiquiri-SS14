- type: entity
  parent: BaseMagazineLightRifle
  id: MagazineLightRifleIncendiary
  name: "magazine (.30 rifle incendiary)"
  description: Изогнутый двухрядный магазин на 30 патронов для боевых винтовок. Подходит для самовоспламеняющихся зажигательных боеприпасов.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeLightRifleIncendiary
  - type: Sprite
    layers:
    - state: incendiary
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
