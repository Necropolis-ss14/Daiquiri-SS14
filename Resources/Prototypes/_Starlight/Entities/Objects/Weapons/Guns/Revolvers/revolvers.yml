- type: entity
  name: самодельный револьвер
  parent: [BaseWeaponRevolver, BaseMinorContraband]
  id: WeaponRevolverMakeshift
  description: Чуть больше чем ручная пушка с высоким шансом взорваться в руках.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Revolvers/makeshift_revolver.rsi
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Guns/Revolvers/makeshift_revolver.rsi
  - type: RevolverAmmoProvider
    whitelist:
      tags:
        - CartridgeMagnum
        - CartridgeMagnumImprovised
        - SpeedLoaderMagnum
        - SpeedLoaderMagnumImprovised
    proto: null
    capacity: 1
    chambers: [ null ]
    ammoSlots: [ null ]
  - type: Construction
    graph: MakeshiftRevolverGraph
    node: shotgun
  - type: WeaponDismantleOnShoot
    dismantleChance: 0.30
    selfDamage:
      types:
        Blunt: 8
        Heat: 8
    items:
      - id: ModularBarrel
        launchAngle: 0
        prob: 1
      - id: ModularReceiver
        launchAngle: 90
        prob: 0.10
      - id: RifleStock
        launchAngle: 180
        prob: 0.80

- type: entity
  name: самодельный револьвер
  parent: WeaponRevolverMakeshift
  id: WeaponRevolverImprovised
  description: Револьвер с двумя стволами и без барабана. Это вообще можно назвать револьвером?
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Revolvers/improvised_revolver.rsi
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Guns/Revolvers/improvised_revolver.rsi
  - type: RevolverAmmoProvider
    capacity: 2
    chambers: [ null, null]
    ammoSlots: [ null, null]
  - type: Construction
    graph: ImprovisedRevolverGraph
    node: shotgun
  - type: WeaponDismantleOnShoot
    dismantleChance: 0.10
    items:
      - id: ModularBarrel
        launchAngle: 0
        prob: 1
      - id: ModularReceiver
        launchAngle: 90
        prob: 0.10
      - id: SheetSteel1
        launchAngle: 67
        prob: 0.70
      - id: RifleStock
        launchAngle: 180
        prob: 0.80

- type: entity
  name: кустарный револьвер
  parent: WeaponRevolverImprovised
  id: WeaponRevolverForged
  description: Лучшее, что может предложить инженерия тайдеров, револьвер аж на 4 патрона!
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Revolvers/forged_revolver.rsi
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Guns/Revolvers/forged_revolver.rsi
  - type: RevolverAmmoProvider
    capacity: 4
    chambers: [ null, null, null, null]
    ammoSlots: [ null, null, null, null]
  - type: WeaponDismantleOnShoot
    dismantleChance: 0

- type: entity
  name: диспетчер
  parent: [ BaseContrabandTier3, BaseWeaponRevolver, BaseSecurityContraband ] # Blimpuf
  id: WeaponRevolverDispatcher
  description: Служебный револьвер NT Model 7, неофициально «Диспетчер». Под .45 Magnum с отличным останавливающим действием против любого неподчинения. Настоящая вневременная классика элиты охраны NanoTrasen.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Revolvers/Dispatcher.rsi
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Guns/Revolvers/Dispatcher.rsi
  - type: Item
    storedOffset: 0,-2
  - type: Gun
    fireRate: 2.0
    selectedMode: Burst
    availableModes:
    - SemiAuto
    - Burst
    shotsPerBurst: 3
    burstCooldown: 1.2
    burstFireRate: 3.5
    soundGunshot:
      path: /Audio/_Starlight/Weapons/Guns/Gunshots/revolver_stronger.ogg
  - type: RevolverAmmoProvider
    capacity: 6
    chambers: [ True, True, True, True, True, True ]
    ammoSlots: [ null, null, null, null, null, null ]
  - type: StealTarget
    stealGroup: OfficerHandgun
  - type: SentienceTarget
    flavorKind: station-event-random-sentience-flavor-inanimate
    weight: 0.01

- type: entity
  name: ТОЗ-82 «Юпитер»
  parent: [ BaseContrabandTier3, BaseWeaponRevolver, BaseSecurityContraband, BaseSalvageContraband ] # Blimpuf
  id: WeaponRevolverZOZ
  description: Огромный буллпап-револьвер, чей чертёж выкрали из СССП. Могут понадобиться обе руки. Есть откидной штык, но он намертво заклинил. На 6 патронов .45 магнум.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Revolvers/ZOZ82.rsi
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Guns/Revolvers/ZOZ82.rsi
  - type: Item
    storedOffset: 0,-2
  - type: Wieldable
    unwieldOnUse: false
  - type: GunWieldBonus
  - type: Gun
    minAngle: 3
    maxAngle: 18
    fireRate: 2.3
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/revolver.ogg
      params:
        volume: 2.25
    angleIncrease: 8
    angleDecay: 16
