# Starlight Combat Remote Signaller

- type: entity
  parent: RemoteSignaller
  id: RemoteSignallerCombat
  name: боевой дистанционный сигнализатор
  description: Ручное устройство военного класса для дистанционной отправки сигналов системам вооружения в радиусе 100 метров. Обычно используется для активации оружия, установленного на шаттлах.
  components:
  - type: Sprite
    sprite: Objects/Devices/signaller.rsi
    state: advanced
  - type: Item
    inhandVisuals:
      left:
      - state: advanced-inhand-left
      right:
      - state: advanced-inhand-right
  - type: WirelessNetworkConnection
    range: 100
  - type: StaticPrice
    price: 75
  - type: Tag
    tags:
    - Payload
    - RemoteSignaller
    - CombatRemote
