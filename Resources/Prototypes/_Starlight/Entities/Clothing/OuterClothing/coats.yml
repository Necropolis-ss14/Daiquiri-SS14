  id: ClothingOuterCoatChefCentComm
  name: куртка повара Центкома
  description: Характерная бело-зелёная куртка поваров Центрального командования. Превращает вас в ходячую рекламу.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/OuterClothing/Coats/chef-centcomm.rsi
  - type: Clothing
    sprite: _Starlight/Clothing/OuterClothing/Coats/chef-centcomm.rsi

- type: entity
  parent: ClothingOuterStorageBase
