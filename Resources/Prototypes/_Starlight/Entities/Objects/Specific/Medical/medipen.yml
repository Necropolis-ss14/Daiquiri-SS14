- type: entity
  parent: [ChemicalMedipen]
  id: AdvancedMedipen
  name: продвинутая медиручка
  description: Одноразовая незаправляемая медиручка с большой дозой полипирилия для долгой стабилизации.
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: base-needle-inhand-left
      - state: base-colorA-inhand-left
        color: "#9423FF"
      - state: base-colorB-inhand-left
      right:
      - state: base-needle-inhand-right
      - state: base-colorA-inhand-right
        color: "#9423FF"
      - state: base-colorB-inhand-right
  - type: Sprite
    sprite: /Textures/_Starlight/Objects/Specific/Medical/medical.rsi
    layers:
    - state: polypen
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: polypen_empty
  - type: Solution
    solution:
      maxVol: 30
      reagents:
      - ReagentId: PolypyryliumOligomers
        Quantity: 30
  - type: StaticPrice
    price: 1000
