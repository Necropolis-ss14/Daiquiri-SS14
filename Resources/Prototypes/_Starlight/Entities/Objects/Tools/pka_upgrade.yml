  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#2decec"
    - state: overlay-2
      color: "#1012a7"
    - state: overlay-3
      color: "#1373eb"
  - type: GunUpgrade
    tags: [ GunUpgradeRangeExp ]
    examineText: gun-upgrade-examine-text-range
  - type: GunUpgradeSpeed
    coefficient: 2
  - type: GunUpgradeDamage
    damage:
      types:
        Blunt: 7
    damageMultiplier:
      types:
        Structural: 0

