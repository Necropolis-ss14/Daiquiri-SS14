- type: entity
  name: самодельный дробовик
  parent: [WeaponFlareGun, BaseMinorContraband]
  id: WeaponShotgunMakeshift
  description: Малая ручная пушка под патроны 12 калибра. Тряпок нет, так что с каждым выстрелом высокий шанс развалиться.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Shotguns/makeshift_shotgun.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
  - type: Item
    size: Small
    sprite: _Starlight/Objects/Weapons/Guns/Shotguns/makeshift_shotgun.rsi
  - type: Construction
    graph: MakeshiftShotgunGraph
    node: shotgun
  - type: ItemSlots
    slots:
      gun_chamber:
        name: item-slot-component-slot-name-chamber
        priority: 1
        whitelist:
          tags:
            - ShellShotgun
  - type: Tag
    tags:
    - Sidearm
  - type: WeaponDismantleOnShoot
    dismantleChance: 0.50
    selfDamage:
      types:
        Blunt: 5
        Heat: 5
    items:
      - id: ModularBarrel
        launchAngle: 0
        prob: 1
      - id: ModularReceiver
        launchAngle: 90
        prob: 0.10
      - id: RifleStock
        launchAngle: 180
        prob: 0.80
  - type: ContainerContainer
    containers:
      gun_chamber: !type:ContainerSlot
      firing_pin: !type:Container
  - type: ContainerFill
    containers:
      firing_pin:
      - FiringPinMakeshift
  - type: FiringPinHolder
    supportedPins: [ Makeshift, GunUpgrade ]

