- type: entity
  id: CrateSupermatterFlatpack
  parent: CrateEngineeringSecure
  name: ящик суперматерии
  description: Суперматерия — решение там, где обычная не справляется.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: SupermatterFlatpack

- type: entity
  id: CrateTEGFlatpack
  parent: CrateEngineeringSecure
  name: ящик ТЭГ
  description: Ящик с разобранным термоэлектрогенератором.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: TEGCenterFlatpack
        - id: TEGCirculatorFlatpack
          amount: 2

- type: entity
  id: CrateEngineeringReflector
  parent: CrateEngineeringSecure
  name: ящик рефлектора
  description: Рефлектор, когда проблемы надо отражать.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ReflectorFlatpack

- type: entity
  parent: CrateEngineeringSecure
  id: CrateRPD
  name: ящик РПД
  description: Ящик с одним быстрым устройством для труб.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: RPD

- type: entity
  parent: CrateMedicalSecure
  id: CrateRPLD
  name: ящик РПСЖ
  description: Ящик с одним быстрым сантехническим устройством.
  components:
  - type: AccessReader
    access: [["Engineering"], ["Medical"]]
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: RPLD

