- type: entity
  parent: [ClothingNeckBase, BaseSyndicateContraband]
  id: ClothingNeckExplosiveCollar
  name: взрывной ошейник
  description: Юридически отличный обратный капкан из определённой кинофраншизы.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Neck/Misc/explosivecollar.rsi
  - type: Clothing
    sprite: _Starlight/Clothing/Neck/Misc/explosivecollar.rsi
    stripDelay: 10
    equipDelay: 5
  - type: SelfUnremovableClothing
  - type: AmputatateOnTrigger
    targetContainer: true
    parts:
    - HeadHuman
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    # Cosmetic explosion :tf:
    maxIntensity: 0.01
    intensitySlope: 1
    totalIntensity: 0.01
  - type: TriggerOnSignal
  - type: DeviceLinkSink
    ports:
      - Trigger

- type: entity
  parent: [ClothingNeckBase, BaseTSFContraband]
  id: ClothingNeckTSFBadge
  name: значок ТСФ
  description: Официальный значок Транс-Солнечной Федерации. Этот начищенный предмет снаряжения несёт орла ТСФ, символ власти, признанный в известном космосе.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Neck/Misc/tsf_badge.rsi
    state: icon
  - type: Clothing
    sprite: _Starlight/Clothing/Neck/Misc/tsf_badge.rsi
  - type: Item
    size: Tiny

- type: entity
  parent: ClothingScarfBase
