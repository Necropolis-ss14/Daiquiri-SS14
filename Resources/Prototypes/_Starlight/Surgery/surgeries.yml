- type: entity
  parent: SurgeryBase
  id: SurgeryOpenRibcage
  name: Открыть грудную клетку
  components:
  - type: Surgery
    requirement:
    - SurgeryOpenIncision
    - SurgeryOpenIncisionDoll
    priority: -50
    steps:
    - SurgeryStepSawBones
    - SurgeryStepPriseOpenBones
  - type: SurgeryPartCondition
    parts:
    - Torso
  - type: SurgerySpeciesCondition
    speciesBlacklist:
    - SlimePerson
    - NeoSlimePerson
    - IPC
  - type: Sprite
    sprite: Mobs/Species/Skeleton/parts.rsi
    state: torso_m

- type: entity
  parent: SurgeryBase
  id: SurgeryOpenAbdomen
  name: Вскрыть брюшную полость
  components:
  - type: Surgery
    requirement:
    - SurgeryOpenIncision
    - SurgeryOpenIncisionSlime
    - SurgeryOpenIncisionDoll
    priority: -50
    steps:
    - SurgeryStepCutAbdominalMuscles
    - SurgeryStepRetractAbdominalWalls
  - type: SurgeryPartCondition
    parts:
    - Torso
  - type: SurgerySpeciesCondition
    speciesBlacklist:
    - IPC
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
    state: torso_m

- type: entity
  parent: SurgeryBase
  id: SurgeryEliminateVocalCordDefects
  name: Устранить дефекты голосовых связок
  description: Remove speech defects, accents.
  components:
  - type: Surgery
    requirement:
    - SurgeryOpenIncision
    - SurgeryOpenIncisionSlime
    - SurgeryOpenIncisionDoll
    steps:
    - SurgeryStepExposeVocalCords
    - SurgeryStepAdjustVocalCords
    - SurgeryStepSutureIncision
  - type: SurgeryAnyAccentCondition
  - type: SurgeryPartCondition
    parts:
    - Head
  - type: SurgerySpeciesCondition
    speciesBlacklist:
    - IPC
  - type: Sprite
    sprite: Objects/Fun/Instruments/microphone.rsi
    state: icon


