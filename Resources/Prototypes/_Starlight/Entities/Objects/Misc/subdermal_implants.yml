# Gear Acidifier
- type: entity
  parent: BaseSubdermalImplant
  id: GearAcidifierImplant
  name: имплант-растворитель снаряжения
  description: Этот имплант при смерти расплавляет снаряжение пользователя, оставляя тело целым.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    permanent: true
    implantAction: ActionActivateGearAcidifier
  - type: TriggerOnMobstateChange
    mobState:
    - Dead
  - type: TriggerOnActivateImplant
  - type: GibOnTrigger
    targetUser: true
    deleteItems: true
    gibBody: false
  - type: PopupOnTrigger
    targetUser: true
    text: death-acidifier-implant-activate-gear
  - type: SpawnOnTrigger
    targetUser: true
    proto: GearAcidifier
    predicted: true
  - type: DeleteOnTrigger
    targetUser: false
  - type: Tag
    tags:
    - SubdermalImplant
    - HideContextMenu
    - GearAcidifier

#SELF
- type: entity
  parent: BaseSubdermalImplant
  id: BluespaceStorageImplant
  name: блюспейс-имплант «хранилище»
  description: Этот имплант обеспечивает скрытое хранилище в теле человека с помощью блюспейс-технологий.
  categories: [ HideSpawnMenu ]
  components:
    - type: StorageImplant
    - type: SubdermalImplant
      implantAction: ActionOpenStorageImplant
      whitelist:
        components:
        - Hands # no use giving a mouse a storage implant, but a monkey is another story...
    - type: Storage
      grid:
      - 0,0,4,3
    - type: ContainerContainer
      containers:
        storagebase: !type:Container
          ents: [ ]
    - type: UserInterface
      interfaces:
        enum.StorageUiKey.Key:
          type: StorageBoundUserInterface

# death acidifier for terminator phase 1, only manual activation (no death trigger to avoid phase 2 transformation issues)
- type: entity
  parent: BaseSubdermalImplant
  id: TerminatorDeathAcidifierImplant
  name: терминаторский имплант самоуничтожения
  description: Этот имплант расплавляет пользователя и его снаряжение при ручной активации. Не срабатывает во время трансформации.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    permanent: true
    implantAction: ActionActivateTerminatorDeathAcidifier
  - type: TriggerOnActivateImplant
  - type: GibOnTrigger
    targetUser: true
    deleteItems: true
  - type: SpawnOnTrigger
    proto: Acidifier
    predicted: true
  - type: Tag
    tags:
    - SubdermalImplant
    - HideContextMenu

# microbomb that gibs but does less collateral damage, for terminator
- type: entity
  parent: MicroBombImplant
  id: TerminatorMicroBombImplant
  name: терминаторский имплант-микробомба
  description: Этот имплант взрывает пользователя при активации или после смерти.
  categories: [ HideSpawnMenu ]
  components:
  - type: Explosive
    explosionType: MicroBomb
    totalIntensity: 40
    intensitySlope: 3
    maxIntensity: 15
    canCreateVacuum: false

