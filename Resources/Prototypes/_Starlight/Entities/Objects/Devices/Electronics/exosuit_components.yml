- type: entity
  id: BaseExosuitParts
  parent: BaseItem
  name: базовые компоненты
  abstract: true
  components:
  - type: Item
    storedRotation: -90
    size: Ginormous
  - type: Sprite
    sprite: Objects/Specific/Mech/mecha_equipment.rsi
    state: mecha_camera
  - type: StaticPrice
    price: 100
  - type: PhysicalComposition
    materialComposition:
      Steel: 200

- type: entity
  id: DurandArmorPlate
  parent: BaseExosuitParts
  name: бронепластины «Дюранда»
  description: Бронепластины из пластали для экзокостюма «Дюранд».
  components:
    - type: Item
      storedRotation: 0
    - type: Sprite
      sprite: _Starlight/Objects/Specific/Mechs/Mechs/durand.rsi
      state: durand_armor
    - type: Tag
      tags:
      - DurandArmor
    - type: GuideHelp
      guides:
      - Robotics

- type: entity
  id: GygaxArmorPlate
  parent: BaseExosuitParts
  name: бронепластины «Гигакс»
  description: Бронепластины из стали для экзокостюма «Гигакс».
  components:
    - type: Item
      storedRotation: 0
    - type: Sprite
      sprite: _Starlight/Objects/Specific/Mechs/Mechs/gygax.rsi
      state: gygax_armor
    - type: Tag
      tags:
      - GygaxArmor
    - type: GuideHelp
      guides:
      - Robotics

- type: entity
  id: RipleyUpgradeKit
  parent: BaseExosuitParts
  name: набор улучшения экзокостюма
  description: Этот набор позволяет собрать экзокостюм «Рипли» MK-II.
  components:
    - type: Item
      storedRotation: 0
    - type: Sprite
      state: ripleyupgrade
    - type: Tag
      tags:
      - RipleyMKIIUpgradeKit
    - type: GuideHelp
      guides:
      - Robotics

- type: entity
  id: PaddyUpgradeKit
  parent: BaseExosuitParts
  name: набор для конверсии Падди
  description: Этот набор позволяет превратить «Рипли» MK-II в «Падди».
  components:
    - type: Item
      storedRotation: 0
    - type: Sprite
      state: paddyupgrade
    - type: Tag
      tags:
      - PaddyUpgradeKit
    - type: GuideHelp
      guides:
      - Robotics

- type: entity
  id: MechAirTank
  parent: BaseExosuitParts
  name: воздушный баллон экзокостюма
  description: Специальный воздушный баллон, способный удерживать большое количество воздуха.
  components:
    - type: Item
      storedRotation: 0
    - type: Sprite
      state: mecha_air_tank
    - type: Tag
      tags:
      - MechAirTank
    - type: GuideHelp
      guides:
      - Robotics
    - type: ActivatableUI
      key: enum.SharedGasTankUiKey.Key
    - type: UserInterface
      interfaces:
        enum.SharedGasTankUiKey.Key:
          type: GasTankBoundUserInterface
    - type: GasTank
      outputPressure: 21.3
      air:
        volume: 100
        temperature: 293.15
      tankLowPressure: 30.0

- type: entity
  id: MechThruster
  parent: BaseExosuitParts
  name: двигатель экзокостюма
  description: Двигатель, с помощью которого экзокостюм может безопасно перемещаться в отсутствие гравитации.
  components:
    - type: Item
      storedRotation: 0
    - type: Sprite
      state: mecha_bin
    - type: Tag
      tags:
      - MechThruster
    - type: GuideHelp
      guides:
      - Robotics
