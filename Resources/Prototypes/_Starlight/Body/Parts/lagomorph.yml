- type: entity
  id: PartLagomorph
  parent: [BaseItem, BasePart]
  name: часть тела лагоморфа
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: TorsoLagomorph
  name: туловище лагоморфа
  parent: [PartLagomorph, BaseTorso]
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Lagomorph/parts.rsi
    state: "torso_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20

