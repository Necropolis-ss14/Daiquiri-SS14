#liver
- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepLocateLiver
  name: Найти печень
  components:
  - type: SurgeryStep
    duration: 3
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    state: liver

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepClampLiverVessels
  name: Пережать сосуды печени
  components:
  - type: SurgeryStep
    duration: 4
    tools:
    - type: Hemostat
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/scissors.rsi
    state: hemostat

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRemoveLiver
  name: Удалить печень
  components:
  - type: SurgeryStep
    duration: 4
    tools:
    - type: Scalpel
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel
  - type: SurgeryStepEmoteEffect
  - type: SurgeryStepOrganExtract
    organ:
    - type: OrganLiver

