- type: entity
  parent: CrateSecgear
  id: CrateEmergencyExplosive
  name: bomb suit crate
  description: Science gone bonkers? Beeping behind the airlock? Buy now and be the hero the station des... I mean needs! (time not included)
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClothingHeadHelmetBombSuit
        - id: ClothingMaskGas
        - id: Screwdriver
        - id: Wirecutter
        - id: Multitool
        - id: ClothingOuterSuitBomb

- type: entity
  parent: CrateGenericSteel
  id: CrateEmergencyFire
  name: firefighting crate
  description: Only you can prevent station fires. Partner up with two firefighter suits, gas masks, flashlights, large oxygen tanks, extinguishers, hardhats, and emergency cooling units!
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: FlashlightLantern
          amount: 2
        - id: FireExtinguisher
          amount: 2
        - id: ClothingHeadHatHardhatRed
          amount: 2
        - id: ClothingMaskGas
          amount: 2
        - id: ClothingOuterSuitFire
          amount: 2
        - id: OxygenTankFilled
          amount: 2
        - id: EmergencyNitrogenTankFilled # Starlight - vox gang
          amount: 2
        - id: EmergencyCoolingUnit # Starlight
          amount: 2
        - id: ClothingUniformJumpsuitFirefighter # SL Edit
          amount: 2 # SL Edit

- type: entity
  parent: CrateInternalsO2N2 # Starlight - sprite change
  id: CrateEmergencyInternals
  name: ящик аварийного снаряжения
  description: Освойте свою жизненную энергию и контролируйте дыхание с тремя дыхательными масками, тремя противогазами, тремя аварийными костюмами EVA, тремя кислородными баллонами, тремя азотными баллонами и 3 охлаждающими блоками.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClothingMaskGas
          amount: 3
        - id: ClothingMaskBreath
          amount: 3
        - id: OxygenTankFilled
          amount: 3
        - id: NitrogenTankFilled
          amount: 3
        - id: CoolingUnit # Starlight
          amount: 3
        - id: ClothingOuterSuitEmergency
          amount: 3

- type: entity
  parent: CrateInternalsO2N2 # Starlight - sprite change
  id: CrateEmergencyInternalsLarge
  name: ящик аварийного снаряжения (большой)
  description: Освойте свою жизненную энергию и контролируйте дыхание с шестью дыхательными масками, шестью противогазами, шестью аварийными костюмами EVA, шестью кислородными баллонами, шестью азотными баллонами и шестью охлаждающими блоками.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClothingMaskGas
          amount: 6
        - id: ClothingMaskBreath
          amount: 6
        - id: OxygenTankFilled
          amount: 6
        - id: NitrogenTankFilled
          amount: 6
        - id: CoolingUnit # Starlight
          amount: 6
        - id: ClothingOuterSuitEmergency
          amount: 6

- type: entity
  parent: CrateInternals
  id: CrateNitrogenInternals
  name: ящик аварийного снаряжения (азот)
  description: Содержит две дыхательные маски, два противогаза и четыре азотных баллона. Предназначен для рас, дышащих азотом.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClothingMaskGas
          amount: 2
        - id: ClothingMaskBreath
          amount: 2
        - id: NitrogenTankFilled
          amount: 4

- type: entity
  parent: CrateRadiation
  id: CrateEmergencyRadiation
  name: radiation protection crate
  description: Survive the Nuclear Apocalypse and Supermatter Engine alike with two sets of Radiation suits. Each set contains a helmet, suit, and Geiger counter. We'll even throw in a bottle of vodka and some glasses too, considering the life-expectancy of people who order this.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClothingOuterSuitRad
          amount: 2
        - id: GeigerCounter
          amount: 2
        - id: DrinkVodkaBottleFull
        - id: DrinkShotGlass
          amount: 2
        - id: RadiationBlockingProjector # Far Horizons

- type: entity
  parent: CratePlastic
  id: CrateEmergencyInflatablewall
  name: inflatable wall crate
  description: Three stacks of inflatable walls for when the stations metal walls don't want to hold atmosphere anymore.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: BoxInflatable

- type: entity
  parent: CratePlastic
  id: CrateGenericBiosuit
  name: emergency bio suit crate
  description: Contains 2 biohazard suits to ensure that no disease will distract you from what you're doing there.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: FillBiohazardGearGeneric
          rolls: 2
        - id: ClothingMaskGas
          amount: 2
