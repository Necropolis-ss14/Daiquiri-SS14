- type: entity
  parent: MobMoproach
  id: MobMoproachHat
  suffix: hat
  components:
  - type: Loadout
    prototypes: [ MoproachGear ]

- type: startingGear
  id: MoproachGear
  equipment:
    head: ClothingHeadHatPurplesoft

- type: entity
  parent: BoxCardboard
  name: набор таракамоля
  id: MoproachBox
  description: Набор, позволяющий быстро подготовить двух таракамолей к работе.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: MoproachCubeWrapped
          amount: 2
        - id: ClothingHeadHatPurplesoft
          amount: 2
        - id: PaperMoproachManual
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi
    state: box_moproach

- type: entity
  parent: MonkeyCubeWrapped
  name: куб таракамоля
  suffix: Wrapped
  id: MoproachCubeWrapped
  description: Разверните, чтобы получить куб таракамоля.
  components:
  - type: SpawnItemsOnUse
    items:
    - id: MoproachCube

- type: entity
  parent: Paper
  id: PaperMoproachManual
  suffix: moproach manual
  components:
  - type: Paper
    content: book-text-moproach
