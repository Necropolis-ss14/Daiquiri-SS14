- type: entity
  id: StationRadioServer
  name: сервер станционного радио
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  description: Стойка серверов, определяет, транслируется ли ваш голос
  components:
  - type: Appearance
  - type: Sprite
    sprite: _Goobstation/Structures/Machines/StationRadio/stationradioserver.rsi
    drawdepth: SmallObjects
    layers:
    - state: icon
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: mic_on # Starlight
      shader: unshaded
      visible: false
      map: ["micOn"]
    - state: mic_off # Starlight
      shader: unshaded
      map: ["micOff"]
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
      enum.RadioDeviceVisuals.Broadcasting: # Starlight
        micOn:
          True: { visible: true }
          False: { visible: false }
        micOff:
          True: { visible: false }
          False: { visible: true }
  - type: StationRadioServer
  - type: DeviceLinkSource
    ports:
    - StationRadioServerPort
    # TODO: unlit & maints panel sprite
  - type: Transform
    noRot: false
  - type: Rotatable
  - type: Machine
    board: StationRadioServerCircuitboard
  - type: TelecomExempt
  - type: RadioMicrophone
    powerRequired: true
    broadcastChannel: RadioShow
    unobstructedRequired: true
  - type: ApcPowerReceiver

- type: entity
  id: StationRadioRig
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: радиоустановка станции
  description: Всё необходимое для трансляции музыки по станции.
  components:
  - type: Appearance
  - type: Sprite
    sprite: _Goobstation/Structures/Machines/StationRadio/radiostationrig.rsi
    drawdepth: SmallObjects
    layers:
    - state: icon
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: DeviceLinkSink
    ports:
    - StationRadioRigPort
  - type: Transform
    noRot: false
  - type: Rotatable
  - type: Machine
    board: StationRadioRigCircuitboard
  - type: RadioRig
