
- type: entity
  parent: [ ParamedicPDA ]
  id: ETOCorpsmanPDA
  name: КПК санитара ETO
  description: Никто не умрёт на твоей вахте, по крайней мере не твоя команда.
  components:
  - type: Appearance
    appearanceDataInit:
     enum.PdaVisuals.PdaType:
       !type:String
       pda-ETOCorpsman
  - type: Pda
    id: ETOIDCardCorpsman
  - type: PdaBorderColor
    accentVColor: "#b19f21"
    borderColor: "#3b2905"
  - type: Sprite
    sprite: _Starlight/Admeme/ETO/pda.rsi
    state: pda-ETOCorpsman
  - type: Icon
    sprite: _Starlight/Admeme/ETO/pda.rsi
    state: pda-ETOCorpsman

