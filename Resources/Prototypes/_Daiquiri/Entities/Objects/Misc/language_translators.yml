- type: entity
  id: BaseLanguageTranslator
  parent: Translator
  name: handheld translator
  description: A portable device that translates speech into Galactic Common.
  components:
  - type: Sprite
    sprite: _Daiquiri/Objects/Devices/translator.rsi
    layers:
    - state: icon
    - state: translator
      shader: unshaded
      visible: false
      map: ["translator"]
  - type: HandheldTranslator
    spoken:
    - GalacticCommon
    understood:
    - GalacticCommon
    requires:
    - GalacticCommon
  - type: Item
    size: Small

# Vox Pidgin -> GalacticCommon
- type: entity
  id: LanguageTranslatorVoxPidgin
  parent: BaseLanguageTranslator
  name: "Vox-Pidgin → Galactic Common translator"
  description: Translates Vox-Pidgin speech into Galactic Common. Requires knowledge of Vox-Pidgin.
  components:
  - type: HandheldTranslator
    requires:
    - VoxPidgin

