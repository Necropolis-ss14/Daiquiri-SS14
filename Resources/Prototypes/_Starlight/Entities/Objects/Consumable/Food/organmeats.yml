# meaty dishes derived from grinding organs

- type: entity
  name: хаггис
  parent: FoodMealBase
  id: FoodHaggis
  description: Деликатес среди дворфов, шотландцев и больше никого. Необъяснимо питательный.
  components:
    - type: FlavorProfile
      flavors:
        - meaty
        - terrible
    - type: Edible
      transferAmount: 3
    - type: Sprite
      sprite: _Starlight/Objects/Consumable/Food/organmeats.rsi
      layers:
        - state: haggis
    - type: Solution
      id: food
      solution:
        reagents:
          - ReagentId: Nutriment
            Quantity: 5
          - ReagentId: Protein
            Quantity: 25
    - type: Tag
      tags:
        - Meat

- type: entity
  name: кровяная колбаса
  parent: FoodMealBase
  id: FoodBlackPudding
  description: Когда казалось, что английская кухня уже не станет хуже...
  components:
    - type: FlavorProfile
      flavors:
        - savory
        - metallic
        - salty
    - type: Edible
      transferAmount: 3
    - type: Sprite
      sprite: _Starlight/Objects/Consumable/Food/organmeats.rsi
      layers:
        - state: black-pudding
    - type: Solution
      id: food
      solution:
        reagents:
          - ReagentId: Nutriment
            Quantity: 5
          - ReagentId: Protein
            Quantity: 15
    - type: Tag
      tags:
        - Meat
        - Sausage

- type: entity
  name: сырая колбаса
  parent: FoodMeatBase
  id: FoodSausage
  description: Не недожарь её.
  components:
    - type: FlavorProfile
      flavors:
        - meaty
        - cold
    - type: Sprite
      sprite: _Starlight/Objects/Consumable/Food/organmeats.rsi
      layers:
        - state: sausage-raw
    - type: Solution
      id: food
      solution:
        reagents:
          - ReagentId: UncookedAnimalProteins
            Quantity: 5
    - type: InternalTemperature # same as bacon
      conductivity: 0.44
      thickness: 0.004
      area: 0.0075
    - type: Construction
      graph: MeatSausage
      node: start
      defaultTarget: sausage
    - type: Tag
      tags:
        - Meat
        - Sausage
        - Raw

- type: entity
  name: жареная колбаса
  parent: FoodMeatBase
  id: FoodSausageCooked
  description: Если не знаешь, как их делают, — вкусно. А после — совсем другое дело.
  components:
    - type: FlavorProfile
      flavors:
        - meaty
        - salty
    - type: Edible
      transferAmount: 4
    - type: Sprite
      sprite: _Starlight/Objects/Consumable/Food/organmeats.rsi
      layers:
        - state: sausage-cooked
    - type: Solution
      id: food
      solution:
        reagents:
          - ReagentId: Nutriment
            Quantity: 8
          - ReagentId: Protein
            Quantity: 9
    - type: Construction
      graph: MeatSausage
      node: sausage
    - type: FoodSequenceElement
      entries:
        Burger: MeatSausage
    - type: Tag
      tags:
        - Cooked
        - Meat
        - Sausage

- type: entity
  name: сосиска в булке
  parent: FoodMealBase
  id: FoodSausageBun
  description: Не забудь про соусы!
  components:
    - type: FlavorProfile
      flavors:
        - meaty
        - salty
        - bun
    - type: Edible
      transferAmount: 4
    - type: Sprite
      sprite: _Starlight/Objects/Consumable/Food/organmeats.rsi
      layers:
        - state: sausage-bun
    - type: Solution
      id: food
      solution:
        reagents:
          - ReagentId: Nutriment
            Quantity: 18
          - ReagentId: Protein
            Quantity: 9
    - type: Tag
      tags:
        - Meat
        - Cooked
        - SausageBun
