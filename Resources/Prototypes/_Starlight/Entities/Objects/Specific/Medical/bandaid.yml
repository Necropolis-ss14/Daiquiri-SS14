- type: entity
  name: пластырь
  description: Введение химии прикосновением.
  parent: BaseStarlightHealingItem
  id: BasePatch
  abstract: true
  components:
  - type: Sprite
    state: bandaid
  - type: Solution
    id: patch
    solution:
      maxVol: 20
  - type: Item
    size: Tiny
  - type: Appearance
  - type: Patch
  - type: Tag
    tags:
      - Patch
  - type: Extractable
    grindableSolutionName: patch

- type: entity
  id: Patch
  parent: BasePatch

- type: entity
  id: PatchBrute
  name: грубый пластырь
  parent: BasePatch
  components:
  - type: Sprite
    state: bandaid-brute
  - type: Solution
    id: patch
    solution:
      maxVol: 20
      reagents:
      - ReagentId: Bicaridine
        Quantity: 15

- type: entity
  id: PatchBurnSmall
  name: малый ожоговый пластырь
  parent: BasePatch
  components:
  - type: Sprite
    state: bandaid-burn-small
  - type: Solution
    id: patch
    solution:
      maxVol: 20
      reagents:
      - ReagentId: Dermaline
        Quantity: 10

- type: entity
  id: PatchBurn
  name: ожоговый пластырь
  parent: BasePatch
  components:
  - type: Sprite
    state: bandaid-burn
  - type: Solution
    id: patch
    solution:
      maxVol: 20
      reagents:
      - ReagentId: Omnizine
        Quantity: 20

- type: entity
  id: PatchMedical
  name: медицинский пластырь
  parent: BasePatch
  components:
  - type: Sprite
    state: bandaid-med
  - type: Solution
    id: patch
    solution:
      maxVol: 20
      reagents:
      - ReagentId: Dermaline
        Quantity: 10
      - ReagentId: Bicaridine
        Quantity: 10

- type: entity
  id: PatchClown
  name: клоунский пластырь
  parent: BasePatch
  components:
  - type: Sprite
    state: bandaid-clown
  - type: Solution
    id: patch
    solution:
      maxVol: 20
      reagents:
      - ReagentId: Bananadine
        Quantity: 5
      - ReagentId: Happiness
        Quantity: 5
      - ReagentId: MuteToxin
        Quantity: 10

- type: entity
  name: patch pack
  id: PatchPack
  parent: BaseStorageItem
  description: Компактно хранит несколько пластырей.
  components:
  - type: Item
    size: Small
    sprite: _Starlight/Objects/Specific/Chemistry/patch_pack.rsi
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Chemistry/patch_pack.rsi
    state: icon
  - type: Tag
    tags:
      - PatchPack
  - type: Storage
    maxItemSize: Tiny
    grid:
    - 0,0,4,1
    quickInsert: true
    areaInsert: true
    areaInsertRadius: 1
    whitelist:
      tags:
      - Patch
