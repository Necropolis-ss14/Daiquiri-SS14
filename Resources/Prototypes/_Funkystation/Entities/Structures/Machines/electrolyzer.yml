- type: entity
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  id: Electrolyzer
  categories: [ ShouldMapStation ] # Starlight
  name: электролизёр
  description: Машина, обрабатывающая и преобразующая газы методом электролиза. Работает на огромных объёмах электричества, но может быть форсирована плазменными листами. # Starlight
  components:
  - type: Electrolyzer
    efficiency: 0.95 # Starlight
    onSound:
      path: /Audio/Weapons/click.ogg
  - type: AtmosDevice
  - type: Sprite
    sprite: _Funkystation/Structures/Machines/electrolyzer.rsi
    noRot: true
    layers:
    - state: electrolyzerOff
      map: ["enum.ElectrolyzerVisualLayers.Main"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ElectrolyzerVisuals.State:
        ElectrolyzerVisualLayers.Main:
          Off: { state: electrolyzerOff }
          On: { state: electrolyzerOn }
  - type: Machine
    board: ElectrolyzerMachineCircuitboard
  - type: WiresPanel
  - type: ItemSlots
    slots:
      fuel:
        name: item-slot-component-slot-name-fuel
        insertOnInteract: false
        ejectOnInteract: false
        whitelist:
          tags:
          - SheetPlasma
        swap: false
  - type: DeviceLinkSink
    ports:
      - On
      - Off
      - Toggle
  - type: ContainerContainer
    containers:
      fuel: !type:ContainerSlot
      machine_board: !type:Container
      machine_parts: !type:Container
      hidden_slot: !type:ContainerSlot
  # Starlight-start
  - type: PowerConsumer
  - type: NodeContainer
    examinable: true
    nodes:
     input:
      !type:CableDeviceNode
      nodeGroupID: HVPower
  - type: Battery
    netsync: false
    maxCharge: 10000000
    startingCharge: 0
  # Starlight-end
