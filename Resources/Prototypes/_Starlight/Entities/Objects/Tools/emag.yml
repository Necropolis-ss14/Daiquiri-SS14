      sprite: _Starlight/Objects/Specific/SELF/freemag.rsi
    - type: LimitedCharges
    - type: AutoRecharge
    - type: StaticPrice
      price: 2500
    - type: Tag
      tags:
        - CanAffectLawBoards

- type: entity
  parent: [BaseItem, BaseSovietContraband]
  id: EmagCommie
  suffix: ""
  name: деревянный криптографический секвенсор
  description: Дешёвое универсальное решение для взлома. Друг любого советского человека. Легендарный EMAG.
  components:
  - type: Contraband
    tier: Tier3
  - type: Emag
    lawset: CommiemovLawset
    owningFaction: Revolutionary
    components:
      - type: Revolutionary # behold. you can now see revs.
    channelAdd:
      - Soviet # Report in comrade.
  - type: Sprite
    sprite: _Starlight/Objects/Tools/emag.rsi
    state: icon
  - type: Item
    sprite: _Starlight/Objects/Tools/emag.rsi
  - type: LimitedCharges

- type: entity
  parent: [BaseItem, BaseCentcommContraband]
  id: CCEmagUnlimited
  suffix: Unlimited
  name: криптографический шифратор
  description: Модифицированный криптографический секвенсор для операций ОБР по штурму и зачистке станций NanoTrasen.
  components:
    - type: Emag
      owningFaction: NanoTrasen
      accessGroups: [CentralCommand]
      channelAdd: [CentCom]
      lawset: CCLawset
      doEmaggedSound: false
    - type: Sprite
      sprite: _Starlight/Objects/Tools/ccemag.rsi
      state: icon
    - type: Item
      sprite: _Starlight/Objects/Tools/ccemag.rsi
      storedRotation: -90

- type: entity
  parent: CCEmagUnlimited
  id: CCEmag
  suffix: Limited
  components:
    - type: LimitedCharges
    - type: AutoRecharge
    - type: StaticPrice
      price: 2500

- type: entity
  parent: [BaseItem, BaseSalvageContraband]
  id: EmagSalvage # dont use, emag hasnt been differentiated yet
  suffix: ""
  name: силиконовый кодировщик ITG
  description: Юридически одобренное устройство переопределения силиконового свода законов, настраивающее силиконовых на ITG.
  categories: [ DoNotMap ]
  components:
  - type: Emag
    lawset: SalvageLawset
    components:
    owningFaction: NanoTrasen
    channelAdd:
      - Expedition
  - type: Sprite
    sprite: _Starlight/Objects/Tools/emag.rsi
    state: icon
  - type: Item
    sprite: _Starlight/Objects/Tools/emag.rsi
  - type: LimitedCharges
