    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.ToggleableVisuals.Enabled:
          enum.ToggleableVisuals.Layer:
            True: { visible: true }
            False: { visible: false }
    - type: Tag
      tags:
        - CyberHandItem

# Persephone
- type: entity
  id: CyberReagentGrinder
  parent: BaseItem
  name: встроенный измельчитель реагентов
  description: От BlenderTech. Смешает ли он? Давайте узнаем!
  suffix: grinder/juicer
  components:
    - type: ReagentGrinder
      needsPower: false
      storageMaxEntities: 2
    - type: ActivatableUI
      key: enum.ReagentGrinderUiKey.Key
    - type: UserInterface
      interfaces:
        enum.ReagentGrinderUiKey.Key:
          type: ReagentGrinderBoundUserInterface
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.ReagentGrinderVisualState.BeakerAttached:
          grinder:
            True: {state: "handheldgrinder-beaker-attached"}
            False: {state: "handheldgrinder-empty"}
    - type: Physics
    - type: Sprite
      sprite: _Starlight/Objects/Tools/cyberling.rsi
      layers:
        - state: handheldgrinder
        - state: handheldgrinder-empty
          map: [ "enum.ToggleableVisuals.Layer" ]
    - type: ItemSlots
      slots:
        beakerSlot:
          whitelist:
            components:
            - FitsInDispenser
    - type: Machine
      board: ReagentGrinderMachineCircuitboard
    - type: ContainerContainer
      containers:
        beakerSlot: !type:ContainerSlot
        inputContainer: !type:Container
        machine_board: !type:Container
        machine_parts: !type:Container
    - type: Tag
      tags:
        - CyberHandItem

- type: entity
