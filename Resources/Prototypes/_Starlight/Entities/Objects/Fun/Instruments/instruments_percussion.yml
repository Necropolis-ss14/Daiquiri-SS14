- type: entity
  parent: BaseHandheldInstrument
  id: SuperSynthesizerInstrument
  name: суперсинтезатор
  description: Качаем гетто мидишками Touhou с 2020 года.
  components:
  - type: Instrument
    allowPercussion: true
    allowProgramChange: true
    respectMidiLimits: true
  - type: Sprite
    sprite: Objects/Fun/Instruments/h_synthesizer.rsi
    state: supersynth
  - type: ActivatableUI
    inHandsOnly: false
  - type: Clothing
    quickEquip: false
    slots:
    - neck
    sprite: Objects/Fun/Instruments/h_synthesizer.rsi
  - type: Item
    heldPrefix: super
    size: Normal
    sprite: Objects/Fun/Instruments/h_synthesizer.rsi

- type: entity
  parent: SuperSynthesizerInstrument
  id: SuperSynthesizerInstrumentAdmeme
  name: суперсинтезатор
  suffix: Admeme
  components:
  - type: Instrument
    respectMidiLimits: false
