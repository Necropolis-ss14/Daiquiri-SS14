- type: entity
  id: SurgeryBase
  categories:
  - HideSpawnMenu

- type: entity
  parent: SurgeryBase
  id: SurgeryOpenIncision
  name: Открыть разрез
  components:
  - type: Surgery
    priority: -100
    steps:
    - SurgeryStepOpenIncisionScalpel
    - SurgeryStepClampBleeders
    - SurgeryStepRetractSkin
  - type: SurgerySpeciesCondition
    speciesBlacklist:
    - SlimePerson
    - NeoSlimePerson
    - IPC
    - Doll

- type: entity
  parent: SurgeryOpenIncision
  id: SurgeryOpenIncisionSlime
  components:
  - type: Surgery
    priority: -100
    steps:
    - SurgeryStepOpenIncisionScalpel
    - SurgeryStepCoagulateJellyFlow
    - SurgeryStepRetractMembrane
  - type: SurgerySpeciesCondition
    speciesBlacklist: []
    speciesWhitelist:
    - SlimePerson
    - NeoSlimePerson

- type: entity
  parent: SurgeryBase
  id: SurgeryCloseIncision
  name: Закрыть разрез
  components:
  - type: Surgery
    requirement:
    - SurgeryOpenIncision
    priority: 100
    steps:
    - SurgeryStepCloseBones
    - SurgeryStepMendRibcage
    - SurgeryStepCloseIncision
  - type: SurgerySpeciesCondition
    speciesBlacklist:
    - SlimePerson
    - NeoSlimePerson
    - IPC
    - Doll
  - type: SurgeryPartCondition
    parts:
    - Torso

- type: entity
  parent: SurgeryCloseIncision
  id: SurgeryCloseIncisionHead
  name: Закрыть разрез
  components:
