  - type: Appearance
  - type: SpentAmmoVisuals
    state: blast
    suffix: false
  - type: Tag
    tags:
    - GrenadeLessLethal

- type: entity
  id: GrenadeBola
  name: граната-бола
  description:
  parent: [BaseGrenade, BaseSecurityContraband]
  components:
  - type: CartridgeAmmo
    proto: BulletGrenadeBola
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    layers:
    - state: bola
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: bola
    suffix: false
  - type: Tag
    tags:
    - GrenadeLessLethal
