- type: entity
  name: спавнер сервисного ЦентКом
  suffix: End of Round
  id: CCServiceWorkerSpawnerPostRound
  parent: MarkerBase
  components:
    - type: Sprite
      layers:
        - state: red
        - sprite: Structures/Decoration/banner.rsi
          state: banner
    - type: TriggerOnRoundEnd
    - type: AddComponentsOnTrigger
      components:
        - type: GhostRole
          name: ghost-role-information-cc-serviceworker-name
          description: ghost-role-information-cc-serviceworker-description
          rules: ghost-role-information-nonantagonist-rules
          raffle:
            settings: short
        - type: GhostRoleMobSpawner
          prototype: MobHumanCCServiceWorkerEOR

