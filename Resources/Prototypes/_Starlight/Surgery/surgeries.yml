    speciesBlacklist:
    - SlimePerson
    - NeoSlimePerson
    - IPC
  - type: SurgeryPartCondition
    parts:
    - Head

- type: entity
  parent: SurgeryCloseIncision
  id: SurgeryCloseIncisionLimb
  name: Закрыть разрез
  components:
