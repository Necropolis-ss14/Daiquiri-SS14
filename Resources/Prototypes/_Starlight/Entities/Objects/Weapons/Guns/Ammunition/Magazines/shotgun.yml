# TOZ magazines are also garbage

- type: entity
  id: BaseMagazineShotgunToz
  name: магазин (20 gauge shells)
  description: "Piotr, what am I supposed to do with this? The magazine won't come out of the gun!"
  parent: [ BaseContrabandTier3, BaseItem, BaseSecurityContraband ] # Blimpuf
  abstract: true
  components:
  - type: Tag
    tags:
    - MagazineShotgunToz
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - ShellShotgunToz
    capacity: 2
  - type: Item
    size: Small
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Ammunition/Magazine/Shotgun/toz.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

- type: entity
  id: MagazineShotgunTozEmpty
  name: magazine, 20 gauge калибра
  suffix: empty
  parent: BaseMagazineShotgunToz
  components:
  - type: BallisticAmmoProvider
    proto: null

- type: entity
  id: MagazineShotgunToz
  name: pellet magazine, 20 gauge калибра
  parent: BaseMagazineShotgunToz
  components:
  - type: BallisticAmmoProvider
    proto: ShellShotgunToz
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  id: MagazineShotgunTozExtendedEmpty
  name: extended magazine, 20 gauge калибра
  suffix: empty
  parent: BaseMagazineShotgunToz
  components:
  - type: BallisticAmmoProvider
    proto: null
    capacity: 5
  - type: Sprite
    layers:
    - state: extended
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  id: MagazineShotgunTozExtended
  name: pellet extended magazine, 20 gauge калибра
  parent: BaseMagazineShotgunToz
  components:
  - type: BallisticAmmoProvider
    proto: ShellShotgunToz
    capacity: 5
  - type: Sprite
    layers:
    - state: extended
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  id: MagazineShotgunBreach
  name: breaching drum, 12 gauge калибра
  parent: BaseMagazineShotgun
  components:
  - type: BallisticAmmoProvider
    proto: ShellShotgunBreaching
  - type: Sprite
    layers:
    - state: breach
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      - state: inhand-left-stripe
        color: "#0096FF"
      right:
      - state: inhand-right-mag
      - state: inhand-right-stripe
        color: "#0096FF"
