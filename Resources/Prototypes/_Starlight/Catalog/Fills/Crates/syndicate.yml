- type: entity
  id: CrateSyndicateChameleonBundle
  suffix: Filled
  parent: [ CrateSyndicate, StorePresetUplink, BaseSyndicateContraband ]
  name: ящик хамелеон-набора
  description: "Рюкзак с хамелеон-техникой: маскируйся почти подо всё на станции и не только!"
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClothingBackpackChameleonFillAgent
        - id: ChameleonControllerImplanter

