- type: entity
  parent: WeatherBase
  id: WeatherRadStorm
  name: радшторм
  components:
    - type: WeatherStatusEffect
      sprite:
        sprite: /Textures/Effects/weather.rsi
        state: ashfall
      color: green
      sound:
        path: /Audio/_Starlight/Effects/Weather/blobalarm.ogg
        params:
          loop: true
          volume: -16
    - type: WeatherEffects
    - type: WeatherEntityEffect
      effects:
      - !type:HealthChange
        ignoreResistances: false
        damage:
          types:
            Radiation: 2

- type: entity
  parent: WeatherBase
  id: WeatherSolarFlare
  name: солнечная вспышка
  components:
    - type: WeatherStatusEffect
      sprite:
        sprite: /Textures/Effects/weather.rsi
        state: ashfall_light
      color: yellow
      sound:
        path: /Audio/_Starlight/Effects/Weather/blobalarm.ogg
        params:
          loop: true
          volume: -16
    - type: WeatherEffects
    - type: WeatherEntityEffect
      effects:
      - !type:HealthChange
        ignoreResistances: false
        damage:
          types:
            Heat: 3
      - !type:AdjustTemperature
        amount: 5500

- type: entity
  parent: WeatherBase
  id: WeatherAuroraCaelus
  name: аврора келус
  components:
    - type: WeatherStatusEffect
      sprite:
        sprite: /Textures/_Starlight/Effects/weather.rsi
        state: starry_night
      sound:
        path: /Audio/_Starlight/Effects/Weather/aurora_caelus.ogg
        params:
          volume: 0
    - type: ParallaxStatusEffect
      parallax: AuroraCaelus

- type: entity
  parent: WeatherBase
  id: WeatherSpaceWhale
  name: космический кит
  components:
    - type: ParallaxStatusEffect
      parallax: SpaceWhale

- type: entity
  parent: WeatherBase
  id: WeatherCosmic
  name: космос
  components:
    - type: ParallaxStatusEffect
      parallax: CosmicFinaleParallax

# a version of WeatherSnowfallHeavy with a LOT less fog
- type: entity
  parent: WeatherBase
  id: WeatherSnowfallLobster
  name: сильный снегопад с лёгким туманом
  components:
  - type: WeatherStatusEffect
    sprite:
      sprite: /Textures/_Starlight/Effects/weather.rsi
      state: snowfall_lobster
    sound:
      path: /Audio/Effects/Weather/snowstorm.ogg
      params:
        loop: true
        volume: -10 # quiet ambience rather than in-your-face wind
  - type: SpriteQuality
    variants:
      Low:
        base:
          sprite: _Starlight/Effects/weather.rsi
          state: snowfall_lobster
      Medium:
        base:
          sprite: _Starlight/Effects/weather.rsi
          state: snowfall_lobster
      High:
        base:
          sprite: _Starlight/Effects/weather.rsi
          state: snowfall_lobster
