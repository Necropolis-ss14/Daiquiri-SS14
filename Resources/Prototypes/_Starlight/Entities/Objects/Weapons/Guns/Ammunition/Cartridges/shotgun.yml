- type: entity
  parent: AmmoProviderShotgunShell
  id: BoxShotgunBirdshot
  name: коробка 12 gauge birdshot
  description: Картонная коробка патронов 12 калибра с мелкой дробью. Широкий разброс, малая дальность, любимец GA-6 Fang.
  components:
    - type: BallisticAmmoProvider
      proto: ShellShotgunBirdshot
    - type: Sprite
      layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-1
        map: ["enum.GunVisualLayers.Mag"]
      - state: lethal

- type: entity
  parent: [ BaseContrabandTier3, BaseShellShotgun, BaseSecurityContraband, BaseSalvageContraband ] # Blimpuf
  id: ShellShotgunBirdshot
  name: birdshot, 12 gauge калибра
  description: Дробовой патрон с десятками мелких дробин. Смертелен вблизи, бесполезен вдали. Штатный для GA-6 Fang.
  components:
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#B87333"
      - state: spent
        map: [ "enum.AmmoVisualLayers.Spent" ]
        visible: false
  - type: CartridgeAmmo
    soundEject:
      collection: ShellEject
    proto: PelletShotgunBirdshotSpreadTrace

# the ZOZ is too shitty to fire real ammo

- type: entity
  id: BaseShellShotgunToz
  name: shell, 20 gauge калибра
  parent: BaseCartridge
  abstract: true
  components:
  - type: Tag
    tags:
    - ShellShotgunToz
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Ammunition/Casings/shotgun_shell_toz.rsi
    layers:
    - state: base
      map: [ "enum.AmmoVisualLayers.Base" ]
  - type: Appearance
  - type: SpentAmmoVisuals
    revealSpent: true # Starlight
    tip: true

- type: entity
  id: ShellShotgunToz
  name: shell, 20 gauge калибра
  parent: [ BaseContrabandTier3, BaseShellShotgunToz, BaseSovietContraband ] # Blimpuf
  components:
  - type: Sprite
    layers:
    - state: base
      map: [ "enum.AmmoVisualLayers.Base" ]
    - state: tip
      map: [ "enum.AmmoVisualLayers.Tip" ]
      color: "#FFFFFF"
    - state: spent
      map: [ "enum.AmmoVisualLayers.Spent" ]
      visible: false
  - type: CartridgeAmmo
    soundEject:
      collection: ShellEject
    proto: PelletShotgunTozSpreadTrace

- type: entity
  id: ShellShotgunBreaching
  name: breaching shell, 12 gauge калибра
  parent: [ BaseShellShotgun, BaseSyndicateContraband ]
  components:
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip-long
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#0096FF"
      - state: spent
        map: [ "enum.AmmoVisualLayers.Spent" ]
        visible: false
  - type: CartridgeAmmo
    soundEject:
      collection: ShellEject
    proto: PelletShotgunBreachSpreadTrace
