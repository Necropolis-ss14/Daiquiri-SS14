- type: entity
  parent: BaseAction
  id: ActionToggleDome
  name: Переключить энергокупол
  description: "Включить или выключить энергетический барьер."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -10
    icon:
      sprite: Objects/Weapons/Melee/e_shield.rsi
      state: eshield-on
    useDelay: 1
  - type: InstantAction
    event: !type:ToggleActionEvent

- type: entity
  parent: [BaseSuicideAction, BaseImplantAction]
  id: ActionActivatePicoBomb
  name: "Активировать пикобомбу"
  description: "Активирует вашу внутреннюю пикобомбу, полностью уничтожая вас и ваше снаряжение"
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: Interface/Actions/Implants/implants.rsi
      state: explosive
