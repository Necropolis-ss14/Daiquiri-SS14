- type: entity
  name: коробка малых стаканов
  parent: BoxCardboard
  id: BoxBeakerSmall
  description: Коробка с четырьмя малыми стаканами.
  components:
  - type: Storage
    grid:
    - 0,0,3,1
    maxItemSize: Normal
  - type: Item
    shape:
    - 0,0,3,1
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: Beaker
          amount: 4
  - type: Sprite
    layers:
      - state: box
      - state: beaker

