# Not galoshes, but still count towards the goal
- type: entity
  parent: [ ClothingShoesBase, ClothingShoesUnstainable, BaseJanitorContraband ]
  id: ClothingShoesGaloshnt
  name: калоши
  description: Специальные скользкие резиновые сапоги, повышающие травматизм уборщиков; кошмар тайдера.
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Specific/galoshes.rsi
  - type: Clothing
    sprite: Clothing/Shoes/Specific/galoshes.rsi
  - type: StealTarget # Starlight
    stealGroup: GaloshesCollection # Starlight

- type: entity
  parent: ClothingShoesBase
  id: ClothingShoesGreenLizardskin
  name: зелёные туфли из кожи ящерицы
  description: Может, за годы они потеряли блеск, но эти зелёные туфли из ящерокожи сидят идеально.
  components:
    - type: Sprite
      sprite: _Starlight/Clothing/Shoes/Specific/disco.rsi
    - type: Clothing
      sprite: _Starlight/Clothing/Shoes/Specific/disco.rsi

- type: entity
  parent: ClothingShoesBase
  id: ClothingShoesAerostatic
  name: аэростатические ботинки
  description: Чистый опрятный комплект ботинок для долгих часов патрулирования.
  components:
    - type: Sprite
      sprite: _Starlight/Clothing/Shoes/Specific/kim.rsi
    - type: Clothing
      sprite: _Starlight/Clothing/Shoes/Specific/kim.rsi

- type: entity
  parent: ClothingShoesBaseButcherable
  id: ClothingShoesSchoolBlack
  name: чёрные школьные туфли
  description: Стильные удобные школьные туфли тёмного цвета с чулками.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Shoes/Specific/schoolblackshoes.rsi
  - type: Clothing
    sprite: _Starlight/Clothing/Shoes/Specific/schoolblackshoes.rsi

- type: entity
  parent: ClothingShoesBaseButcherable
  id: ClothingShoesSchoolWhite
  name: белые школьные туфли
  description: Стильные удобные школьные туфли светлого цвета с чулками.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Shoes/Specific/schoolwhiteshoes.rsi
  - type: Clothing
    sprite: _Starlight/Clothing/Shoes/Specific/schoolwhiteshoes.rsi

- type: entity
  parent: ClothingShoesSkates
  id: ClothingShoesSkatesCool
  name: крутые роликовые коньки
  description: Они круче остальных.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Shoes/Specific/cool_skates.rsi
  - type: Clothing
    sprite: _Starlight/Clothing/Shoes/Specific/cool_skates.rsi
    clothingVisuals:
      shoes:
      - state: equipped-FEET
        offset: "0, -0.04"
  - type: Item
    sprite: _Starlight/Clothing/Shoes/Specific/cool_skates.rsi

- type: entity
  parent: [ClothingShoesClown, BaseSyndicateContraband]
  id: ClownShoesNoSlip
  name: нескользящие туфли клоуна
  description: Новая линейка одежды Тирании Хонка для узких клоунских ниш. Теперь со 100% меньшим скольжением оператора!
  suffix: No-slip
  components:
  - type: NoSlip
