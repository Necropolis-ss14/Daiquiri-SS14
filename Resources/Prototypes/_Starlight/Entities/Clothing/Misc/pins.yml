- type: entity
  parent: ClothingNeckPinBase
  id: ClothingNeckAngelPin
  name: значок добрых дел
  suffix: DO NOT MAP, Admeme
  description: Для лучших!
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Neck/Misc/angeldevil.rsi
    state: angel
  - type: Clothing
    equippedPrefix: angel
    sprite: _Starlight/Clothing/Neck/Misc/angeldevil.rsi
  - type: PointLight
    enabled: true
    radius: 1.6
    energy: 0.3
    softness: 5
    autoRot: true
    color: "#ffef8b"

- type: entity
  parent: ClothingNeckAngelPin
  id: ClothingNeckDevilPin
  name: значок злых дел
  suffix: DO NOT MAP, Admeme
  description: Для худших!
  components:
  - type: Sprite
    state: devil
  - type: Clothing
    equippedPrefix: devil
  - type: PointLight
    color: "#e90000"
    energy: 0.6
    radius: 1.4

- type: entity
  parent: [BaseItem, BaseToggleClothing, BaseReporterContraband]
  id: HoloReporterPin
  name: холо-значок репортёра
  description: "Электронный значок с кнопкой-микрофоном. Способ яснее сказать: «НЕ СТРЕЛЯЙ!»"
  components:
    - type: Item
      size: Tiny
    - type: Sprite
      sprite: _Starlight/Clothing/Neck/holo_pin_reporter.rsi
      state: icon
    - type: Clothing
      equippedPrefix: holopin
      sprite: _Starlight/Clothing/Neck/holo_pin_reporter.rsi
      quickEquip: true
      slots:
        - neck
    - type: ToggleClothing
      action: ActionHoloPin
      disableOnUnequip: true
    - type: ComponentToggler
      parent: true
      components:
        - type: KillSign
          sprite:
            sprite: _Starlight/Clothing/Neck/holo_pin_reporter.rsi
            state: holopin-sign
    - type: Tag
      tags: [] # ignore "WhitelistChameleon" tag


- type: entity
  parent: BaseToggleAction
  id: ActionHoloPin
  name: активировать холо-пин
  description: ЭКСТРЕННЫЕ НОВОСТИ! НЕ УБИВАЙТЕ МЕНЯ, ПОЖАЛУЙСТА!
