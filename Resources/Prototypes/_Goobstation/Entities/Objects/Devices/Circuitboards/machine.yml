- type: entity
  parent: BaseMachineCircuitboard
  id: VinylPlayerCircuitboard
  name: плата проигрывателя винила
  description: Печатная плата механизма для проигрывателя винила.
  components:
  - type: Sprite
    state: service
  - type: MachineBoard
    prototype: VinylPlayer
    stackRequirements:
      Manipulator: 1
      Steel: 3 # Moffstation - 1 -> 3
      WoodPlank: 1 # Moffstation - 3 -> 1

- type: entity
  parent: BaseMachineCircuitboard
  id: TapeDeckCircuitboard
  name: плата кассетной деки
  description: Печатная плата механизма для кассетной деки.
  components:
  - type: Sprite
    state: service
  - type: MachineBoard
    prototype: TapeDeck
    stackRequirements:
      Manipulator: 2
      Plastic: 3
      WoodPlank: 5

- type: entity
  parent: BaseMachineCircuitboard
  id: StationRadioServerCircuitboard
  name: плата сервера станционного радио
  description: Печатная плата механизма для сервера станционного радио.
  components:
  - type: Sprite
    state: service
  - type: MachineBoard
    prototype: StationRadioServer
    stackRequirements:
      Manipulator: 2 # Moffstation - 1 -> 2
      Steel: 5 # Moffstation - 10 -> 5
      Plastic: 2 # Moffstation - 10 -> 2
      Plasma: 1 # Moffstation - 5 -> 1
      CableMV: 4 # Moffstation - HV -> MV

- type: entity
  parent: BaseMachineCircuitboard
  id: StationRadioRigCircuitboard
  name: плата радиоустановки станции
  description: Печатная плата механизма для радиоустановки станции.
  components:
  - type: Sprite
    state: service
  - type: MachineBoard
    prototype: StationRadioRig
    stackRequirements:
      Manipulator: 3
      Steel: 5
      Glass: 2 # Moffstation - 5 -> 2
      Cable: 2
      WoodPlank: 4 # Moffstation - Add Wood since its mostly made of wood.

- type: entity
  parent: BaseMachineCircuitboard
  id: StationRadioCircuitboard
  name: плата станционного радио
  description: Печатная плата механизма для приёмника станционного радио.
  components:
  - type: Sprite
    state: service
  - type: MachineBoard
    prototype: StationRadioReceiver
    stackRequirements:
      Manipulator: 1
      Cable: 2
  - type: PhysicalComposition
    materialComposition:
      Glass: 125
    chemicalComposition:
      Silicon: 20
