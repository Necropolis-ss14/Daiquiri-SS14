- type: entity
  parent: ClothingBackpack
  id: ClothingBackpackTrunk
  name: сундук
  description: Большой и тяжёлый сундук для хранения ещё большего количества вещей.
  abstract: true
  components:
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,11,3
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 0.85
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 9
    soundHit:
      collection: MetalThud
  - type: HeldSpeedModifier

- type: entity
  parent: ClothingBackpackTrunk
  id: ClothingBackpackTrunkMail
  name: почтовый сундук
  description: Огромный сундук из грёз каждого начинающего почтового техника.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Back/Trunks/mailtrunk.rsi

- type: entity
  parent: ClothingBackpackTrunk
  id: ClothingBackpackTrunkMailSenior
  name: сундук старшего почтальона
  description: Огромный сундук для сильнейших почтовых техников станции.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Back/Trunks/mailseniortrunk.rsi

- type: entity
  parent: [ClothingBackpackTrunk, BaseMinorContraband]
  id: ClothingBackpackTrunkSyndicate
  name: сундук Синдиката
  description: Огромный, металлический и стильный. Все остальные синдикаты захотят заполучить этот сундук.
  components:
  - type: Contraband # Blimpuf
    contrabandType: Syndicate
  - type: Sprite
    sprite: _Starlight/Clothing/Back/Trunks/syndicate.rsi
  - type: ExplosionResistance
    damageCoefficient: 0.1
  - type: Storage
    grid:
    - 0,0,12,3
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 15
    soundHit:
      collection: MetalThud

# Fashion-O-Mat
- type: entity
  parent: ClothingBackpackTrunk
  id: ClothingBackpackTrunkSpaceCourier
  name: сундук космического курьера
  description: Огромный сундук в стиле легендарного космического курьера.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Back/Trunks/space_courier_trunk.rsi

- type: entity
  parent: ClothingBackpackTrunkSpaceCourier
  id: ClothingBackpackTrunkSpaceCourierPAI
  name: сундук космического курьера
  suffix: Ghost Role
  description: Огромный сундук в стиле легендарного космического курьера.
  components:
  - type: GhostRole
    makeSentient: true
    name: ghost-role-information-space-courier-trunk-name
    description: ghost-role-information-space-courier-trunk-description
    rules: ghost-role-information-space-courier-trunk-rules
    mindRoles:
    - MindRoleGhostRoleTrunkPAI
    raffle:
      settings: default
  - type: GhostTakeoverAvailable
  - type: MovementSpeedModifier
    baseWalkSpeed: 0
    baseSprintSpeed: 0
  - type: TextToSpeech
    voice: karma
  - type: AntagImmune
