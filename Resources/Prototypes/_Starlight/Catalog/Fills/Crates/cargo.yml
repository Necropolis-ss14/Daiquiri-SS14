- type: entity
  id: CrateMailBags
  parent: CrateGenericSteel
  name: ящик почтовых мешков
  description: Два почтовых мешка, вдруг ты потерял выданные.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: MailBag
          amount: 2

- type: entity
  id: CrateEmergencySpaceHazard
  parent: CrateGenericSteel
  name: ящик скафандров космической опасности
  description: На все твои катастрофические смены.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClothingOuterHardsuitSpaceHazard
        - id: ClothingMaskBreath
        - id: OxygenTankFilled
        - id: NitrogenTankFilled
        - id: CoolingUnit
