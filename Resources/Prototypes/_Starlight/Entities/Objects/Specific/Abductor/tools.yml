- type: entity
  id: AbductorGizmo
  parent: [ BaseItem, BaseMajorContraband ]
  name: штуковина
  description: Устройство, вставляющее нано-трекер, с помощью которого можно наводить луч телепортации.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Misc/gizmo.rsi
    state: icon
  - type: Item
    sprite: _Starlight/Objects/Misc/gizmo.rsi
  - type: RestrictByUserTag
    contains:
    - AbductorScientist
    messages:
    - abductors-gizmo-restricted
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 0.5
    damage:
      types:
        Shock: 0
    angle: 60
    animation: WeaponArcThrust
  - type: AbductorGizmo

- type: entity
  id: AbductorExtractor
  parent: [ BaseItem, BaseMajorContraband ]
  name: экстрактор
  description: Устройство, извлекающее сердце для более лёгкой имплантации нового сердца.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Misc/extractor.rsi
    state: icon
  - type: Item
    sprite: _Starlight/Objects/Misc/extractor.rsi
  - type: RestrictByUserTag
    contains:
    - AbductorScientist
    messages:
    - abductors-gizmo-restricted
  - type: AbductorExtractor
