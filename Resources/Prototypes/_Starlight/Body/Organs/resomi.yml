- type: entity
  id: OrganResomiEyes
  parent: OrganHumanEyes
  name: глаза резоми
  suffix: Resomi
  description: Глаза резоми отлично видят ночью для охоты на добычу в технических туннелях, но очень чувствительны к ярким вспышкам.
  components:
  - type: OrganVisualization
    layer: Eyes
    prototypes:
      Default: MobResomiEyes
  - type: FunctionalOrgan
    comps:
    - type: NightVision
      disabilityBlockable: true
    - type: FlashModifier
      modifier: 2

- type: entity # Starlight
  id: OrganResomiHeart
  parent: OrganHumanHeart
  name: сердце резоми
  suffix: Resomi
  description: Сердце резоми.
  components:
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [Resomi]
    stages: [ Bloodstream ]
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Resomi/organs.rsi
    state: heart-on

- type: entity
  id: OrganResomiLiver
  parent: OrganHumanLiver
  name: печень резоми
  suffix: Resomi
  description: Печень резоми.
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Resomi/organs.rsi
    state: liver

- type: entity
  id: OrganResomiKidneys
  parent: OrganHumanKidneys
  name: почки резоми
  suffix: Resomi
  description: Почки резоми.
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Resomi/organs.rsi
    layers:
      - state: kidney-l
      - state: kidney-r

- type: entity
  id: OrganResomiLungs
  parent: OrganHumanLungs
  name: лёгкие резоми
  suffix: Resomi
  description: Лёгкие резоми.
  components:
  - type: Metabolizer
    metabolizerTypes: [ Resomi, Human ] #They get both so they can still breathe oxygen without us needing to add Resomi everywhere Human is listed
    stages: [ Respiration ]
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Resomi/organs.rsi
    layers:
      - state: lung-l
      - state: lung-r

- type: entity
  id: OrganResomiBrain
  parent: OrganHumanBrain
  name: мозг резоми
  suffix: Resomi
  description: Здесь резоми вынашивают злобные мысли.
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Resomi/organs.rsi
    state: brain

- type: entity
  id: OrganResomiStomach
  parent: OrganHumanStomach
  name: желудок резоми
  suffix: Resomi
  description: Двухкамерный желудок резоми.
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Resomi/organs.rsi
    state: stomach

- type: entity
  id: OrganResomiTongue
  parent: OrganHumanTongue
  suffix: Resomi
  components:
  - type: OrganTongue
    allowedEmotes: ['Chirp', 'Hisses', 'Purr', 'Growl', 'Trill', 'Scree', 'Call', 'Squawk']
    sounds:
      Male: UnisexResomi
      Female: UnisexResomi
      Unsexed: UnisexResomi
