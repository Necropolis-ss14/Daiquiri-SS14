- type: entity
  abstract: true
  parent: BaseItem # TODO Starlight partial once space-wizards/RobustToolbox/pull/7084 gets fixed
  id: BaseMagazineGrenade
  name: гранатный картридж
  components:
  - type: Tag
    tags:
    - MagazineGrenade
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - Grenade
    capacity: 5
    soundRack:
      path: /Audio/Weapons/Guns/Bolt/lmg_bolt_closed.ogg
      params:
        variation: 0.05
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/rifle_load.ogg
      params:
        variation: 0.05
  - type: Item
    size: Large
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/Grenade/grenade_cartridge.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-5
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: BaseMagazineGrenade
  id: MagazineGrenadeEmpty
  name: гранатный картридж
  components:
  - type: BallisticAmmoProvider

- type: entity
  parent: [ BaseMagazineGrenade, BaseSyndicateContraband ] # TODO Starlight partial once space-wizards/RobustToolbox/pull/7084 gets fixed
