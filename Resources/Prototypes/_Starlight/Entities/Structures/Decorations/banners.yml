- type: entity
  id: BannerBaseAlt
  parent: BaseStructureDynamic
  name: базовый баннер
  description: It's the concept of a banner, you shouldn't be seeing this.
  abstract: true
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Decorations/Banners.rsi
    state: banner
    noRot: true
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 190
        mask:
        - MachineMask
        layer:
        - Opaque
        - MidImpassable
        - HighImpassable
        - BulletImpassable
  - type: InteractionOutline
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: BaseSign
  id: BaseWallBanner
  abstract: true
  components:
  - type: WallMount
    arc: 360
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: _Starlight/Structures/Decorations/Banners.rsi


- type: entity
  parent: [BaseWallBanner, BaseSovietContraband] # Blimpuf
  id: BannerWallHammer
  name: революционный настенный баннер
  description: Долой гнёт и несправедливость к контрактникам! УРАА!
  components:
  - type: Sprite
    state: banner0

- type: entity
  parent: [BaseWallBanner, BaseSovietContraband] # Blimpuf
  id: BannerWallSoviet
  name: настенный баннер СССП
  description: Знамя Объединённых Советских Социалистических Планет. Повесь. Подчинись. Постарайся не отдать честь рефлекторно.
  components:
  - type: Sprite
    state: banner1

- type: entity
  id: BannerSovietRegular
  parent: [BannerBaseAlt, BaseSovietContraband] # Blimpuf
  name: баннер СССП
  description: Знамя Объединённых Советских Социалистических Планет. Славные молот и гаечный ключ — символы труда, прогресса, братства и починки сломанного тобой.
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Decorations/Banners.rsi
    state: banner2

- type: entity
  id: BannerSovietHammer
  parent: [BannerBaseAlt, BaseSovietContraband] # Blimpuf
  name: революционный баннер
  description: Долой гнёт и несправедливость к контрактникам! УРАА!
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Decorations/Banners.rsi
    state: banner3

- type: entity
  id: BannerSNKVD
  parent: [BannerBaseAlt, BaseSovietContraband] # Blimpuf
  name: советский баннер СНКВД
  description: Одно неверное движение — и ты мёртв, товарищ. Навсегда.
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Decorations/Banners.rsi
    state: banner4

- type: entity
  id: BannerSGKB
  parent: [BannerBaseAlt, BaseSovietContraband] # Blimpuf
  name: советский баннер СКБ
  description: Внедряем права рабочих. Да, прямо на ваших станциях. Пожалуйста.
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Decorations/Banners.rsi
    state: banner5
