- type: entity
  parent: BaseItem
  id: PassportGuideBook1
  name: справочник паспортного контроля (издание 1)
  suffix: PapersPlease
  description: Свод правил въезда, издание 1.
  components:
  - type: Sprite
    sprite: Objects/Misc/books.rsi
    layers:
    - state: paper
    - state: cover_base
      color: "#332d27"
  - type: PassportGuide
    version: 1
  - type: ActivatableUI
    key: enum.PassportGuideUiKey.Key
  - type: UserInterface
    interfaces:
      enum.PassportGuideUiKey.Key:
        type: PassportGuideBoundUserInterface
  - type: Tag
    tags:
    - Book

