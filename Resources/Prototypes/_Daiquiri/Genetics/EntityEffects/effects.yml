- type: entityEffect
  id: MutationSeizure
  effects:
  - !type:PopupMessage
    type: Pvs
    visualType: LargeCaution
    messages:
    - entity-effect-popup-seizure
  - !type:Jitter
    amplitude: 20
    time: 29
  - !type:ModifyStatusEffect
    effectProto: StatusEffectForcedSleeping
    time: 20

- type: entityEffect
  id: MutationCough
  effects:
  - !type:Emote
    emote: Cough
    showInChat: true

- type: entityEffect
  id: MutationParanoia
  effects:
  - !type:Emote
    emote: Scream
    showInChat: true

- type: entityEffect
  id: MutationFierySweat
  effects:
  - !type:Flammable
    multiplier: 2
  - !type:Ignite

- type: entityEffect
  id: MutationElvisDance
  effects:
