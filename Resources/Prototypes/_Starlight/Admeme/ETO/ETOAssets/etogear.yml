- type: entity
  parent: [ ClothingMaskGas, BaseETOContraband ]
  id: ClothingMaskGasETOLead
  name: противогаз лидера ETO
  description: "Маска главного террориста. Держит шальные выстрелы, но одна не спасёт. Модифицирована административным и медицинским HUD: показывает здоровье и лояльность окружающих."
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/ETO/clothing/etomask.rsi
  - type: Clothing
    sprite: _Starlight/Admeme/ETO/clothing/etomask.rsi
  - type: ShowJobIcons
  - type: ShowHealthBars
    damageContainers:
      - Biological
      - IPC
      - Hybrid
      - MoffDemonBiological
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    hideOnToggle: true
  - type: FlashImmunity
    blocksSpecialVision: false
  - type: EyeProtection
  - type: Pierceable
    level: Metal
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.90
        Slash: 0.90
        Piercing: 0.95
        Heat: 0.95

