- type: entity
  abstract: true
  parent: BaseItem
  id: PartTerminator
  name: ent-PartTerminator
  components:
  - type: Sprite
    sprite: Mobs/Species/Terminator/parts.rsi
  - type: Icon
    sprite: Mobs/Species/Terminator/parts.rsi
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Cybernetic
  - type: BodyPart
  - type: ContainerContainer
    containers:
      bodypart: !type:Container
        ents: []
  - type: StaticPrice
    price: 200

