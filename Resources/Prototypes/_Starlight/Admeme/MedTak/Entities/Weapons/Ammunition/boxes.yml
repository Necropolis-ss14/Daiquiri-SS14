- type: entity
  parent: BaseItem
  id: BaseMagazineBoxVariable
  abstract: true
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - RoundMVA
    proto: RoundVariableMedium
    capacity: 50
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Starlight/Admeme/MedTak/Weapons/Magazines/ammoboxes.rsi
  - type: MagazineVisuals
    magState: MVA_mag
    steps: 5
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: BaseMagazineBoxVariable
  id: MagazineBoxVariableHeavy
  name: коробка патронов (HVA)
  description: Коробка тяжёлых переменных патронов.
  components:
  - type: BallisticAmmoProvider
    proto: RoundVariableHeavy
    whitelist:
      tags:
        - RoundHVA
    capacity: 75
  - type: Sprite
    layers:
    - state: HVA_box
      map: ["enum.GunVisualLayers.Base"]
    - state: HVA_mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: HVA_mag
    steps: 7
    zeroVisible: false

- type: entity
  parent: BaseMagazineBoxVariable
  id: MagazineBoxVariableMedium
  name: коробка патронов (MVA)
  description: Коробка средних переменных патронов.
  components:
  - type: BallisticAmmoProvider
  - type: Sprite
    layers:
    - state: MVA_box
      map: ["enum.GunVisualLayers.Base"]
    - state: MVA_mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  parent: BaseMagazineBoxVariable
  id: MagazineBoxVariableLight
  name: коробка патронов (LVA)
  description: Коробка лёгких переменных патронов.
  components:
  - type: BallisticAmmoProvider
    proto: RoundVariableLight
    whitelist:
      tags:
        - RoundLVA
    capacity: 60
  - type: Sprite
    layers:
    - state: LVA_box
      map: ["enum.GunVisualLayers.Base"]
    - state: LVA_mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: LVA_mag
    steps: 4
    zeroVisible: false
