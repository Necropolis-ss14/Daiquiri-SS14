- type: entity
  parent: ActionFireball #Remove actionupregadable if spell is put in shop alone
  id: ActionFirebolt
  name: Огненный болт
  description: Выпускает быстрый, но слабый сгусток огня в выбранную точку. (Перезарядка 5 секунд)
  components:
  - type: Action
    useDelay: 5
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/fireball.ogg
    icon:
      sprite: _Starlight/Objects/Magic/magicactions.rsi
      state: firebolt
  - type: TargetAction
    range: 60
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:ProjectileSpellEvent
      prototype: ProjectileFirebolt
  - type: SpeakOnAction
    sentence: action-speech-spell-firebolt
    tts: action-speech-spell-firebolt-tts
    modifier: Spell

