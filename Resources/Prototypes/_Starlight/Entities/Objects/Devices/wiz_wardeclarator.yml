- type: entity
  parent: [BaseItem, BaseMagicalContraband ]
  id: WizardWarTablet
  name: печать войны
  description: В этом камне запечатана сырая магия. Её высвобождение позволит использовать более мощные способности. Однако все с продвинутыми сенсорами поблизости зафиксируют такой магический всплеск как акт агрессии. Если не использовать, камень рассыплется в пыль через 5 минут, навсегда запечатав магию внутри.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Devices/wiz_declarationofwar.rsi
      layers:
        - state: sealofwar
    - type: SpawnItemsOnUse
      items:
       - id: WizardWarTabletdrained
       - id: WizCoin1
    - type: TimedDespawn
      lifetime: 300

- type: entity
  parent: [BaseItem, BaseMagicalContraband ]
  id: WizardWarTabletdrained
  name: пустая печать войны
  description: Опустошённая магическая печать.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Devices/wiz_declarationofwar.rsi
      layers:
        - state: sealofwardrained
    - type: AnnounceOnSpawn
      message: wizard-war
      ignoreASpace: true
      sound:
       path: /Audio/Announcements/attention.ogg
      color: yellow
