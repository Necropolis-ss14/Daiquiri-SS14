#EVA Helmet
- type: entity
  parent: [ BaseCentcommContraband, ClothingHeadEVAHelmetBase ] # Blimpuf
  id: ClothingHeadSoftsuitCBURN
  name: шлем ЦБХОР
  description: Устойчивый к давлению и огнеупорный капюшон специальных уборочных отрядов.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Head/Hardsuits/cburn.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
    - state: light-overlay
      visible: false
      shader: unshaded
      map: [ "light" ]
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-head
      - state: equipped-head-unshaded
        shader: unshaded
      head-vox:
      - state: equipped-head-vox
      - state: equipped-head-unshaded-vox
        shader: unshaded
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    equipDelay: 3
    unequipDelay: 3

- type: entity
  parent: [BaseTSFContraband, ClothingHeadEVAHelmetBase, ClothingHeadHelmetArmoredBase]
  id: ClothingHeadHelmetTSF
  name: боевой шлем морпеха Федерации
  description: Усиленный боевой шлем Корпуса морпехов Транс-Солнечной Федерации. Отлично защищает со всех сторон, а современная матрица OCULUS улучшает зрение владельца.
  components:
    - type: Sprite
      sprite: _Starlight/Clothing/Head/Helmets/tsf.rsi
    - type: Clothing
      sprite: _Starlight/Clothing/Head/Helmets/tsf.rsi
      equipDelay: 3
      unequipDelay: 3
    - type: ShowJobIcons
    - type: ShowMindShieldIcons
    - type: FlashImmunity

- type: entity
  parent: ClothingHeadHelmetTSF
  id: ClothingHeadHelmetTSFLeader
  name: боевой шлем офицера морпехоты Федерации
  description: Усиленный боевой шлем офицеров Корпуса морпехов Транс-Солнечной Федерации. Отлично защищает со всех сторон, а матрица OCULUS нового поколения улучшает зрение владельца.
  components:
    - type: Sprite
      sprite: _Starlight/Clothing/Head/Helmets/tsfleader.rsi
    - type: Clothing
      sprite: _Starlight/Clothing/Head/Helmets/tsfleader.rsi
      equipSound: /Audio/Mecha/mechmove03.ogg
      unequipSound: /Audio/Mecha/mechmove03.ogg
      equipDelay: 3
      unequipDelay: 3

- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadBowlHelmet
  name: шлем-аквариум
  description: Выглядит как аквариум, но каким-то образом работает как шлем ВКД.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Head/Helmets/wizard_bowl.rsi
    layers:
    - state: icon
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HELMET
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    equipDelay: 1
    unequipDelay: 1
  - type: BreathMask
  - type: Item
    size: Normal
  - type: PressureProtection
    highPressureMultiplier: 0.1
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.01
    coolingCoefficient: 0.01
  - type: IngestionBlocker
  - type: Tag
    tags:
    - WhitelistChameleon
    - HelmetEVA
  - type: StaticPrice
    price: 1000
  - type: Pierceable
    level: Metal
  - type: Armor
    modifiers:
      coefficients:
        Heat: 0.95
        Radiation: 0.95

#Wizard "Robes"
- type: entity
  parent:  ClothingHeadEVAHelmetBase #, ClothingHeadSuitWithLightBase ]
  id: ClothingHeadHelmetsoftsuitWizard
  name: капюшон пустоты волшебника
  description: Странный капюшон, инкрустированный самоцветами, излучающий магическую энергию.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Head/Hoods/wizard.rsi
  - type: Clothing
    sprite: _Starlight/Clothing/Head/Hoods/wizard.rsi
    equipSound:
      collection: storageRustle
    unequipSound:
      collection: storageRustle
  # - type: PointLight
  #   color: "#ffadfb"
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: Tag
    tags:
    - CorgiWearable
    - WhitelistChameleon

- type: entity
  parent:  ClothingHeadHardsuitBase
  id: ClothingHeadHelmetsoftsuitWizardFire
  name: капюшон пироманта
  description: Капюшон из живого огня, инферно внутри смотрит на тебя.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Head/Hoods/wizardfire.rsi
  - type: Clothing
    sprite: _Starlight/Clothing/Head/Hoods/wizardfire.rsi
    equipSound:
      collection: storageRustle
    unequipSound:
      collection: storageRustle
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.005
    coolingCoefficient: 0.005
  - type: FireProtection
    reduction: 1 # you have to toggle the suit to be fire protected, having your face melt hurts
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
        Cold: 0.9
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: FlashImmunity

