# From Funky
- type: entity
  parent: [BaseItem, StorePresetUplink]
  id: HiddenUplinkRadioBotany
  name: "анализатор растений"
  description: "Сканер для оценки различных аспектов роста растения, его генетических признаков и химического состава."
  suffix: Uplink
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/plant_analyzer.rsi
    layers:
    - state: icon
    - state: analyzer
      shader: unshaded
  - type: Item
    storedRotation: -90
  - type: GuideHelp
    guides:
    - Botany
    - Chemicals
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
