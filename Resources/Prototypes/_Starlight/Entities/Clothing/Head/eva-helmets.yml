  - type: TemperatureProtection
    heatingCoefficient: 0.05
    coolingCoefficient: 0.05
  - type: FireProtection
    reduction: 0.05
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
        Cold: 0.9
  - type: Tag
    tags:
    - WhitelistChameleon
