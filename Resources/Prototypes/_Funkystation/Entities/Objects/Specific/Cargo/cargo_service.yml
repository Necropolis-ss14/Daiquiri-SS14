- type: entity
  id: BoxServiceCustomSmokable
  parent: CardboardBoxLarge
  name: набор для самостоятельного скручивания
  description: Хотите проявить креативность в том, чем губить свои лёгкие? Тогда этот набор для вас! В нём есть всё для самостоятельного скручивания сигарет.
  components:
  - type: StorageFill
    contents:
    - id: PackPaperRolling
    - id: CigaretteFilter
      amount: 8
    - id: GroundTobacco
      amount: 4
    - id: SmokingPipe
    - id: Matchbox

- type: entity
  id: BoxServiceBlankBooks
  parent: CardboardBoxLarge
  name: коробка пустых книг
  description: Содержит 10 пустых книг случайного вида.
  components:
  - type: StorageFill
    contents:
    - id: BookRandom
      amount: 10

