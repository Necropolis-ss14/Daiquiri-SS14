# Planet storms: the vanilla heavy weather under names of our own, so a planet can point at them
# without depending on the vanilla prototypes staying as they are.
#
# The damage does not live here. The Starlight weather effect pipeline is not ticked by anything,
# so the storms hurt the exposed themselves - see PlanetWeatherSystem, which applies one point of
# cold on Taipan and one point of heat on Lavaland per second. Novo Nihon's weather is harmless,
# its lightning aside.

- type: entity
  parent: WeatherSnowfallHeavy
  id: WeatherPlanetSnowfall
  name: heavy snowfall

- type: entity
  parent: WeatherAshfallHeavy
  id: WeatherPlanetAshfall
  name: heavy ashfall

# Novo Nihon's skies: the only planet so far that gets more than one kind of weather, picked from
# at random each time the sky turns. They are vanilla rain under tints of our own, and none of
# them hurts anyone - the planet's weather damage is set to zero.
#
# Each one says its own line when it arrives and when it leaves, so a drizzle and a thunderstorm do
# not sound the same. A weather with nothing to say falls back to the planet's own wording, which
# is why Taipan and Lavaland need none of this.
- type: entity
  parent: WeatherRain
  id: WeatherPlanetDrizzle
  name: drizzle
  components:
  - type: WeatherStatusEffect
    color: "#CFE4F533"
    scrolling: -0.2,-0.2
    sound:
      path: /Audio/Effects/Weather/rain.ogg
      params:
        loop: true
        volume: -14
  - type: PlanetWeatherAnnouncement
    startMessage: planet-weather-drizzle-start
    endMessage: planet-weather-drizzle-end

- type: entity
  parent: WeatherRain
  id: WeatherPlanetRain
  name: rain
  components:
  - type: WeatherStatusEffect
    color: "#C3D9EC66"
    scrolling: -0.4,-0.4
  - type: PlanetWeatherAnnouncement
    startMessage: planet-weather-rain-start
    endMessage: planet-weather-rain-end

- type: entity
  parent: WeatherRain
  id: WeatherPlanetDownpour
  name: downpour
  components:
  - type: WeatherStatusEffect
    color: "#A9C3DC99"
    scrolling: -0.7,-0.7
    sound:
      path: /Audio/Effects/Weather/rain_heavy.ogg
      params:
        loop: true
        volume: -4
  - type: PlanetWeatherAnnouncement
    startMessage: planet-weather-downpour-start
    endMessage: planet-weather-downpour-end

- type: entity
  parent: WeatherStorm
  id: WeatherPlanetStorm
  name: storm
  components:
  - type: WeatherStatusEffect
    color: "#C0A8E880"
    scrolling: -1.1,-1.1
  - type: PlanetWeatherAnnouncement
    startMessage: planet-weather-storm-start
    endMessage: planet-weather-storm-end

# The bolt the storm drops now and then. Purple, harmless in itself and very short lived: its own
# electrified component is switched off, and PlanetWeatherSystem does the shocking, so the bolt
# only ever hurts whatever it actually came down on and never anything that bumps into it.
- type: entity
  parent: BaseLightning
  id: DaiquiriPurpleLightning
  name: purple lightning
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: /Textures/Effects/lightning.rsi
    drawdepth: Effects
    layers:
    - state: "lightning_3"
      color: "#C08BFF"
      shader: unshaded
  - type: PointLight
    enabled: true
    color: "#B060FF"
    radius: 4
    softness: 1
    autoRot: true
    castShadows: false
  - type: Electrified
    onBump: false
    onAttacked: false
    onHandInteract: false
    onInteractUsing: false
  - type: Lightning
    canArc: false
  - type: TimedDespawn
    lifetime: 0.7