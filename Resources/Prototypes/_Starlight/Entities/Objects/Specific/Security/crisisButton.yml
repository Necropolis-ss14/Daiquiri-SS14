- type: entity
  name: кнопка кризиса
  parent: BaseItem
  id: CrisisButton
  description: Используется для передачи сигнала бедствия в охранные каналы связи.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Security/crisisButton.rsi
    state: icon
  - type: Item
    size: Tiny
  - type: UseDelay
    delay: 120.0
  - type: EmitSoundOnUse
    sound:
        collection: TriggerActivate
  - type: TriggerOnUse
  - type: RattleOnTrigger
    radioChannel:
    - Security
    targetUser: true
    messages:
      Alive: rattle-on-trigger-distress-message
  - type: Tag
    tags:
    - SecBeltEquip
