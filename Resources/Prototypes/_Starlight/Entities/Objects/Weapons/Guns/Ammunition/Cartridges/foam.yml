# Foam dart cartridges — standard-caliber casings with a foam dart projectile.
# Used in second-hand (worn) magazines to create mixed ammo loads.
# These are categorized as HideSpawnMenu so they don't clutter the spawn menu.

- type: entity
  parent: BaseCartridgePistol
  id: CartridgePistolFoam
  categories: [ HideSpawnMenu ]
  name: патрон (.35 auto foam)
  description: Гильза .35 auto с поролоновым дротиком. У заряжавшего своеобразное чувство юмора.
  components:
  - type: CartridgeAmmo
    proto: BulletFoam
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#f7931e"

- type: entity
  parent: BaseCartridgeRifle
  id: CartridgeRifleFoam
  categories: [ HideSpawnMenu ]
  name: патрон (.20 rifle foam)
  description: Винтовочная гильза с поролоновым дротиком внутри. У кого-то были особые взгляды на экономию патронов.
  components:
  - type: CartridgeAmmo
    proto: BulletFoam
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#f7931e"

- type: entity
  parent: BaseCartridgeLightRifleSP # Starlight
  id: CartridgeLightRifleFoam
  categories: [ HideSpawnMenu ]
  name: патрон (.30 light rifle foam)
  description: Патрон лёгкой винтовки с поролоновым наконечником. На такой скорости всё равно оставит ушибы.
  components:
  - type: CartridgeAmmo
    proto: BulletFoam
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#f7931e"

- type: entity
  parent: BaseCartridgeCaselessRifle
  id: CartridgeCaselessRifleFoam
  categories: [ HideSpawnMenu ]
  name: патрон (.25 caseless foam)
  description: Безгильзовый блок с поролоновым дротиком в носике. Инженерия сомнительная, но это технически снаряд.
  components:
  - type: CartridgeAmmo
    proto: BulletFoam
