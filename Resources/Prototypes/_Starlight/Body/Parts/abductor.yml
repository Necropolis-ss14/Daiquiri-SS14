- type: entity
  id: PartAbductor
  parent: [BaseItem, BasePart]
  name: ent-PartAbductor
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 3
      - ReagentId: Sugar
        Quantity: 10

- type: entity
  id: TorsoAbductor
  name: ent-TorsoAbductor
  parent: [PartAbductor, BaseTorso]
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Abductor/parts.rsi
    state: "torso"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
      - ReagentId: Sugar
        Quantity: 20

