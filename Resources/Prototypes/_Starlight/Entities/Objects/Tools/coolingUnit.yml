- type: entity
  parent: BaseItem
  id: CoolingUnit
  name: портативный охладитель
  description: Большой портативный теплоотвод с радиатором жидкостного охлаждения, упакованный в модифицированный рюкзак.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Tanks/coolingunit.rsi
      layers:
        - state: icon
        - state: battery-0
          shader: unshaded
          visible: false
          map: ["power"]
    - type: Appearance
    - type: Item
      size: Large
      shape:
      - 0,0,2,2 # 3x3
    - type: Clothing
      quickEquip: false
      sprite: _Starlight/Objects/Tanks/coolingunit.rsi
      slots:
        - Back
        - suitStorage
    - type: ToggleCellDraw
    - type: UseDelay
      delay: 1
    - type: PowerCellDraw
      drawRate: 2
    - type: ItemToggle
      soundActivate: /Audio/Items/flashlight_on.ogg
      soundDeactivate: /Audio/Items/flashlight_on.ogg
    - type: CoolingUnit
    - type: ToggleableVisuals
      spriteLayer: power
    - type: PowerCellSlot
      cellSlotId: cell_slot
    - type: ContainerContainer
      containers:
        cell_slot: !type:ContainerSlot
    - type: ItemSlots
      slots:
        cell_slot:
          name: power-cell-slot-component-slot-name-default
          startingItem: PowerCellMedium
          blacklist:
            tags:
              - MechReactor
    - type: PhysicalComposition
      materialComposition:
        Steel: 185
    - type: StaticPrice
      price: 30

- type: entity
  parent: CoolingUnit
  id: EmergencyCoolingUnit
  name: аварийный охладитель
  description: Легко переносимый теплоотвод для чрезвычайных ситуаций. Содержит очень мало энергии, рассчитан только на выживание.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Tanks/coolingunit.rsi
      layers:
        - state: eicon
    - type: Item
      size: Normal
      shape:
      - 0,0,1,1 # 2x2
    - type: Clothing
      sprite: null
      slots:
        - Pocket
        - Belt
        - suitStorage
    - type: ItemSlots
      slots:
        cell_slot:
          name: power-cell-slot-component-slot-name-default
          startingItem: PowerCellSmall
          whitelist:
            tags:
              - PowerCellSmall
    - type: PhysicalComposition
      materialComposition:
        Steel: 100
