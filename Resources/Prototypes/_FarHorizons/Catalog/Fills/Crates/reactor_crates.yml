- type: entity
  id: CrateCerenkiteFuelRod
  parent: CrateEngineeringSecure
  name: Fuel Rod Crate
  description: 3 cerenkite fuel rods, for fuelling a nuclear reactor.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: CerenkiteReactorFuelRod
        amount: 3

- type: entity
  id: CrateBohrumControlRod
  parent: CrateEngineeringSecure
  name: ящик управляющих стержней
  description: 2 борумных управляющих стержня для ядерного реактора.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: BohrumReactorControlRod
        amount: 2

- type: entity
  id: CrateSteelGasChannel
  parent: CrateEngineeringSecure
  name: ящик стержней газовых каналов
  description: 4 стальных стержня газовых каналов для ядерного реактора.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: SteelReactorGasChannel
        amount: 4

- type: entity
  id: CrateSteelHeatExhanger
  parent: CrateEngineeringSecure
  name: ящик теплообменных стержней
  description: 4 стальных теплообменных стержня для ядерного реактора.
  components:
  - type: StorageFill
    contents:
      - id: SteelReactorHeatExchanger
        amount: 4

- type: entity
  id: CrateNuclearFissionGenerator
  parent: CrateEngineeringSecure
  name: ящик для строительства ядерного генератора
  description: Ящик, содержащий всё необходимое для строительства собственного ядерного генератора.
  suffix: Mapping
  components:
  - type: AccessReader
    access: [["ChiefEngineer"]] # CE's choice to build the engine
  - type: StorageFill
    contents:
      - id: NuclearReactorFlatpack
        amount: 1
      - id: GasTurbineFlatpack
        amount: 1
      - id: NuclearFabricatorMachineCircuitboard
        amount: 1
      - id: BohrumReactorControlRod
        amount: 2
      - id: CerenkiteReactorFuelRod
        amount: 3
      - id: SheetSteel
        amount: 6 # This is just enough to make 8 steel gas exchangers and 8 steel heat exchangers
