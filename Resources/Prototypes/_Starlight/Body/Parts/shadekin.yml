- type: entity
  id: PartShadekin
  parent: [BaseItem, BasePart]
  name: часть тела шейдкина
  abstract: true
  components:
    - type: Extractable
      juiceSolution:
        reagents:
          - ReagentId: Fat
            Quantity: 3
          - ReagentId: DarkBlood
            Quantity: 10

- type: entity
  id: TorsoShadekin
  name: туловище шейдкина
  parent: [PartShadekin, BaseTorso]
  components:
    - type: Sprite
      sprite: _Starlight/Mobs/Species/Shadekin/parts.rsi
      state: torso_m
    - type: Extractable
      juiceSolution:
        reagents:
          - ReagentId: Fat
            Quantity: 10
          - ReagentId: DarkBlood
            Quantity: 20

