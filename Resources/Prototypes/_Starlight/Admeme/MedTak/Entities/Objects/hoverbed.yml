- type: entity
  id: MedTakHoverBed
  name: ховер-носилки MedTak
  parent: [ RollerBed, BaseMedTakContraband ]
  description: Носилки на репульсорах для перевозки пациентов оперативниками MedTak.
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/MedTak/Objects/hoverbed.rsi
    layers:
    - state: hover_unfolded
      map: ["unfoldedLayer"]
    - state: hover_folded
      map: ["foldedLayer"]
      visible: false
    - state: hover_buckled
      map: ["buckledLayer"]
      visible: false
  - type: Item
    sprite: _Starlight/Admeme/MedTak/Objects/hoverbed.rsi
    heldPrefix:
  - type: Pullable
    ignoreNeedsHands: True

- type: entity
  parent: MedTakHoverBed
  id: MedTakHoverBedSpawnFolded
  suffix: folded
  components:
  - type: Foldable
    folded: true
  - type: Strap
    enabled: False
