- type: entity
  name: медовый батончик
  parent: [SolutionFood, SolutionTiny, BaseItem]
  id: FoodHoneybar
  description: Липкий сладкий злаковый батончик, покрытый мёдом.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Consumable/Food/honey_bar.rsi
    state: honey_bar
  - type: Item
    size: Tiny
  - type: Edible
  - type: FlavorProfile
    flavors:
      - honey
      - sweet
  - type: Solution
    id: food
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
  - type: Tag
    tags:
      - FoodSnack

