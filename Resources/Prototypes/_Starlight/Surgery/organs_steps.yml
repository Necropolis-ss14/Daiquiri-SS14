# brain
- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepPreparePatient
  name: Подготовить пациента
  components:
  - type: SurgeryStep
    duration: 2
    tools:
    - type: Cautery
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/cautery.rsi
    state: cautery

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepShaveHead
  name: Побрить голову
  components:
  - type: SurgeryStep
    duration: 3
    tools:
    - type: Scalpel
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepDisinfectScalp
  name: Продезинфицировать кожу головы
  components:
  - type: SurgeryStep
    duration: 2
    tools:
    - type: Cautery
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/cautery.rsi
    state: cautery
  - type: SurgeryStepEmoteEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepMakeIncisionScalp
  name: Сделать разрез кожи головы
  components:
  - type: SurgeryStep
    duration: 4
    tools:
    - type: Scalpel
  - type: SurgeryStepBleedEffect
    damage:
      types:
        Slash: 10
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel
  - type: SurgeryStepEmoteEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRetractScalp
  name: Оттянуть лоскут скальпа
  components:
  - type: SurgeryStep
    duration: 3
    tools:
    - type: Retractor
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/scissors.rsi
    state: retractor
  - type: SurgeryStepEmoteEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepDrillBurrHoles
  name: Просверлить трепанационные отверстия
  components:
  - type: SurgeryStep
    duration: 6
    tools:
    - type: SurgicalDrill
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/drill.rsi
    state: drill
  - type: SurgeryStepEmoteEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepCutSkull
  name: Распилить череп костной пилой
  components:
  - type: SurgeryStep
    duration: 7
    tools:
    - type: BoneSaw
  - type: SurgeryStepBleedEffect
    damage:
      types:
        Slash: 10
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/saw.rsi
    state: saw
  - type: SurgeryStepEmoteEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRemoveBoneFlap
  name: Удалить костный лоскут
  components:
  - type: SurgeryStep
    duration: 3
    tools:
    - type: Retractor
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/scissors.rsi
    state: retractor
  - type: SurgeryStepEmoteEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepClampDuraMater
  name: Пережать твёрдую мозговую оболочку
  components:
  - type: SurgeryStep
    duration: 4
    tools:
    - type: Hemostat
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/scissors.rsi
    state: hemostat
  - type: SurgeryStepEmoteEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepInciseDuraMater
  name: Надрезать твёрдую мозговую оболочку
  components:
  - type: SurgeryStep
    duration: 5
    tools:
    - type: Scalpel
  - type: SurgeryStepBleedEffect
    damage:
      types:
        Slash: 10
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel
  - type: SurgeryStepEmoteEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRetractDuraMater
  name: Оттянуть твёрдую мозговую оболочку
  components:
  - type: SurgeryStep
    duration: 3
    tools:
    - type: Retractor
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/scissors.rsi
    state: retractor
  - type: SurgeryStepEmoteEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepSeverCranialNerves
  name: Пересечь черепные нервы
  components:
  - type: SurgeryStep
    duration: 6
    tools:
    - type: Scalpel
  - type: SurgeryStepBleedEffect
    damage:
      types:
        Slash: 10
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel
  - type: SurgeryStepEmoteEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepExtractBrain
  name: Извлечь мозг
  components:
  - type: SurgeryStep
    duration: 5
    tools:
    - type: Retractor
    bodyAdd:
    - type: Uncryoable
  - type: SurgeryStepOrganExtract
    organ:
    - type: OrganBrain
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/scissors.rsi
    state: retractor
  - type: SurgeryStepEmoteEffect

