- type: entity
  id: TP14FoodMothSticks
  parent: FoodSnackBase
  suffix: Trieste, Food
  name: моттерелла-палочки
  description: Жареная закуска для мотыльков! Они предпочитают её с мёдом.
  components:
  - type: Edible
    requiresSpecialDigestion: true
  - type: FlavorProfile
    flavors:
      - oily
      - cotton
  - type: Sprite
    sprite: _TP/Objects/Consumable/fried-food.rsi
    state: Motharella_Sticks
  - type: Solution
    id: food
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 2.5
      - ReagentId: Fiber
        Quantity: 2.5
  - type: Tag
    tags:
    - ClothMade
    - FoodSnack #Starlight

