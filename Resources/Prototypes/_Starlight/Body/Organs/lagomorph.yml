- type: entity
  id: OrganLagomorphEyes
  parent: OrganHumanEyes
  name: ent-OrganLagomorphEyes
  suffix: Lagomorph
  description: ent-OrganLagomorphEyes-desc
  components:
  - type: OrganVisualization
    layer: Eyes
    prototypes:
      Default: MobLagomorphEyes

- type: entity
  id: OrganLagomorphStomach
  parent: [OrganAnimalStomach, BaseOrganStomach]
  name: ent-OrganLagomorphStomach
  suffix: Lagomorph
  description: ent-OrganLagomorphStomach-desc
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    state: stomach
  - type: Item
    size: Small
    heldPrefix: stomach
  - type: SolutionManager
    solutions:
    - SolutionOrganFoodMeat
    - SolutionOrganStomach50
  - type: Metabolizer
    updateInterval: 0.75


- type: entity
  id: OrganLagomorphHeart
  parent: OrganAnimalHeart
  name: ent-OrganLagomorphHeart
  suffix: Lagomorph
  description: ent-OrganLagomorphHeart-desc
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    state: heart-on
  - type: Item
    size: Small
    heldPrefix: heart
  - type: Metabolizer
    updateInterval: 0.75

- type: entity
  id: OrganLagomorphTongue
  parent: OrganHumanTongue
  suffix: Lagomorph
  components:
  - type: OrganTongue
    allowedEmotes: ['Squee', 'Snort', 'Sneeze', 'LagomorphSnore', 'LagomorphStomp']
    sounds:
      Male: MaleLagomorph
      Female: FemaleLagomorph
      Unsexed: FemaleLagomorph
