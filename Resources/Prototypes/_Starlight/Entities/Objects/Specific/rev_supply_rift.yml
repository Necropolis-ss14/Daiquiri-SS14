- type: entity
  id: RevSupplyRift
  name: разлом вооружения СКБ
  description: (!) Подозрительный разлом, изрыгающий советские штуки. Это раскрывает их, но также позволяет использовать военное снаряжение! Если разлом уничтожить, комми не смогут открыть новый!
  placement:
    mode: SnapgridCenter
  components:
  - type: RevSupplyRift
  - type: DragonRift
    spawn: CrateSovietArmaments
    maxAccumualator: 1200
    spawnCooldown: 60  # Spawn a crate every minute
    spawnAccumulator: 60  # Spawn a crate immediately upon creation
  - type: RevolutionaryRift
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Fixtures
  - type: Sprite
    layers:
    - sprite: Structures/Specific/carp_rift.rsi
      state: icon
      color: "#ff5555"  # Red color to distinguish from regular carp rifts
      shader: unshaded
  - type: InteractionOutline
  - type: Clickable
  - type: PointLight
    enabled: true
    color: "#b53636"  # Darker red light
    radius: 10.0
    energy: 5.0
    netsync: false
    castShadows: false #SL lighting optimization
  - type: NavMapBeacon
    color: "#ff0000"
    defaultText: nav-beacon-supply-rift
    enabled: true
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/Weapons/Guns/Gunshots/rocket_launcher.ogg
