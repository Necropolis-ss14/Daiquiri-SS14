- type: entity
  id: CrateServiceHydraRefill
  parent: CratePlastic
  name: ящик заправки гидры
  description: Две заправки для клинада-мёта Гидры.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: MagazineGrenadeCleanade
        amount: 2

- type: entity
  id: CrateServiceIceCreamMakerStarter
  parent: CrateFreezer
  name: стартовый ящик мороженщика
  description: Разобранная мороженница, кувшин мороженого, сливки, какао, ягоды, фисташки и стаканы.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: JugIceCream
          amount: 1
        - id: DrinkCreamCarton
          amount: 1
        - id: JugCocoaPowder
          amount: 1
        - id: FoodSnackPistachios
          amount: 5
        - id: FoodBerries
          amount: 9
        - id: IceCreamMakerFlatpack
          amount: 1
        - id: DrinkGlass
          amount: 5

- type: entity
  id: CrateServiceReligious
  parent: CratePlastic
  name: ящик церковных припасов
  description: Святая вода, кадило и библия.
  components:
    - type: StorageFill
      contents:
        - id: Bible
        - id: JugHolywater
          amount: 2
        - id: CosmicCenser

- type: entity
  parent: CrateGenericSteel
  id: CrateServiceDocumentPrinter
  name: ящик принтера документов
  description: Принтер документов.
  components:
    - type: EntityTableContainerFill
      containers:
        entity_storage: !type:AllSelector
          children:
            - id: PrinterDocFlatpack
