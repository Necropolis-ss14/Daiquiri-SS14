- type: entity
  name: упаковка стяжек ТСФ
  parent: [BaseItem, BaseTSFContraband]
  id: TSFZiptiePack
  description: Компактная упаковка с десятью одноразовыми стяжками. Стандартная выдача миротворцев Транс-Солнечной Федерации для быстрого связывания. Выдаёт стяжки по одной.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Misc/ziptie_pack.rsi
    state: icon
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: Storage
    maxItemSize: Tiny
    grid:
    - 0,0,4,1
    whitelist:
      components:
      - Handcuff
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: Zipties
        amount: 10
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface

- type: entity
  name: рамка для картины
  parent: [BaseItem]
  id: PictureFrame
  description: Хлипкое сооружение из обрезков дерева для цветной бумаги.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Misc/desktop_picture_frame.rsi
      state: icon
    - type: Item
      size: Small
    - type: Engraveable
      engraveVerb: "engraving-picture-verb"
      popupMessage: "engraving-picture-Ui-Popup"
      noEngravingText: "engraving-picture-no-message"
      engraveSuccessMessage: "engraving-picture-succeed"
      hasEngravingText: "engraving-picture-has-message"
