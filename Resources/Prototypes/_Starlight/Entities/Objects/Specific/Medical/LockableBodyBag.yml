- type: entity
  id: BodyBagLockable
  parent: BodyBag
  name: закрывающийся мешок для трупов
  description: Мешок покрепче, с ID-замком от вскрытия, для хранения и перевозки трупов без разложения.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/lockablebodybag.rsi
    layers:
    - state: bag
      map: ["unfoldedLayer", "enum.StorageVisualLayers.Base"]
    - state: bag_folded
      map: ["foldedLayer"]
      visible: false
    - state: open_overlay
      map: ["enum.StorageVisualLayers.Door"]
    - state: paper
      map: ["enum.PaperLabelVisuals.Layer"]
    - state: locked
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded
  - type: Icon
    sprite: _Starlight/Objects/Specific/Medical/lockablebodybag.rsi
    state: bag
  - type: Lock
    lockOnClick: false
    autoUnlock: false
    autoLock: false
  - type: LockVisuals
  - type: AccessReader
    access: [["Medical"]]
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Inflatable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 45
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]


- type: entity
  id: BodyBagLockableFolded
  name: закрывающийся мешок для трупов
  description: Мешок покрепче, с ID-замком от вскрытия, для хранения и перевозки трупов без разложения.
  parent: BodyBagLockable
  suffix: folded
  components:
  - type: Foldable
    folded: true

#Green Shield Officer
- type: entity
  id: BodyBagCC
  parent: [ BodyBagLockable, BaseCentcommContraband ]
  suffix: DO NOT MAP
  name: закрывающийся мешок для трупов ЦентКом
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Specific/Medical/cclockablebodybag.rsi
    - type: Icon
      sprite: _Starlight/Objects/Specific/Medical/cclockablebodybag.rsi
      state: bag
    - type: AccessReader
      access: [["BlueShield"]]
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 60
          behaviors:
            - !type:DoActsBehavior
              acts: ["Destruction"]

#Green Shield Officer
- type: entity
  id: BodyBagCCFolded
  parent: BodyBagCC
  suffix: folded
  components:
    - type: Foldable
      folded: true
