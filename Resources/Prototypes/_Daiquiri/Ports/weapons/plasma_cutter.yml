- type: entity
  name: plasma cutter
  parent: BaseWeaponBatterySmall
  id: WeaponPlasmaCutter
  description: A mining weapon that can mine an entire tunnel with a single shot.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Battery/cutter.rsi
    state: icon
  - type: Gun
    fireRate: 1
    soundGunshot:
      path: /Audio/_Goobstation/Weapons/Guns/Gunshots/plasma_cutter.ogg
  - type: Item
    size: Normal
    shape:
    - 0,0,1,1
  - type: Battery
    maxCharge: 1500
    startingCharge: 1500
  - type: BatteryAmmoProvider
    proto: BulletPlasmaCutter
    fireCost: 100
  - type: Appearance
  - type: PhysicalComposition
    materialComposition:
      Steel: 125
      Glass: 75
      Plasma: 75

- type: entity
  parent: WeaponPlasmaCutter
  id: WeaponPlasmaCutterEmpty
  suffix: Empty
  components:
  - type: Battery
    startingCharge: 0

- type: entity
  name: super plasma cutter
  parent: [ WeaponPlasmaCutter, BaseSalvageContraband ]
  id: WeaponSuperPlasmaCutter
  description: A strong mining weapon that can mine even bigger tunnels through rocks.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Battery/super_cutter.rsi
    state: icon
  - type: Gun
    fireRate: 2
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: BatteryAmmoProvider
    proto: BulletSuperPlasmaCutter
    fireCost: 40
  - type: StaticPrice
    price: 2000
  - type: PhysicalComposition
    materialComposition:
      Gold: 400
      Steel: 200
      Glass: 150
      Plasma: 150
      BSCrystal: 100
      Silver: 100
      Diamond: 50

- type: entity
  parent: WeaponSuperPlasmaCutter
  id: WeaponSuperPlasmaCutterEmpty
  suffix: Empty
  components:
  - type: Battery
    startingCharge: 0

- type: entity
  id: BulletPlasmaCutter
  name: cutter bolt
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  description: Not too bad, but you still don't want to get hit by it.
  components:
  - type: Reflective
    reflective:
      - NonEnergy
  - type: Sprite
    noRot: false
    sprite: _Goobstation/Objects/Weapons/Guns/Projectiles/bullet_cutter.rsi
    layers:
    - state: icon
      shader: unshaded
  - type: GatheringProjectile
    amount: 40
  - type: Projectile
    deleteOnCollide: false
    damage:
      types:
        Heat: 5
  - type: StaminaDamageOnCollide
    damage: 20
  - type: PointLight
    radius: 2
    color: purple
    energy: 1

- type: entity
  id: BulletSuperPlasmaCutter
  name: super cutter bolt
  parent: BulletPlasmaCutter
  categories: [ HideSpawnMenu ]
  description: Not too bad, but you still don't want to get hit by it.
  components:
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        hard: false
        mask:
        - Opaque
      fly-by:
        shape: !type:PhysShapeCircle
          radius: 2
        layer:
        - Impassable
        - MidImpassable
        - HighImpassable
        - LowImpassable
        hard: False
  - type: Projectile
    deleteOnCollide: false
    damage:
      types:
        Heat: 10
  - type: StaminaDamageOnCollide
    damage: 10
