- type: entity
  parent: SurgeryStepBase
  id: SurgeryAmputationStep
  name: Распилить конечность
  components:
  - type: SurgeryStep
    duration: 16
    tools:
    - type: BoneSaw
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/saw.rsi
    state: saw
  - type: SurgeryStepEmoteEffect
  - type: SurgeryStepBleedEffect
    damage:
      types:
        Slash: 10
  - type: SurgeryStepAmputationEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepExposeSkull
  name: Обнажить череп
  components:
  - type: SurgeryStep
    duration: 2
    tools:
    - type: BoneSaw
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/saw.rsi
    state: saw
  - type: SurgeryStepBleedEffect
    damage:
      types:
        Slash: 5
  - type: SurgeryStepEmoteEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepLigateVessels
  name: Перевязать сосуды
  components:
    - type: SurgeryStep
      duration: 3
      tools:
        - type: Hemostat
    - type: Sprite
      sprite: _Starlight/Objects/Specific/Medical/scissors.rsi
      state: hemostat

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepSawSkull
  name: Распилить череп
  components:
    - type: SurgeryStep
      duration: 20
      tools:
      - type: BoneSaw
    - type: Sprite
      sprite: Objects/Specific/Medical/Surgery/saw.rsi
      state: saw
    - type: SurgeryStepBleedEffect
      damage:
        types:
          Slash: 15
    - type: SurgeryStepAmputationEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepSeparateSlime
  name: Отделить массу слайма
  components:
    - type: SurgeryStep
      duration: 20
      tools:
      - type: BoneSaw
    - type: Sprite
      sprite: Objects/Specific/Medical/Surgery/saw.rsi
      state: saw
    - type: SurgeryStepBleedEffect
      damage:
        types:
          Slash: 15
    - type: SurgeryStepAmputationEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepInciseCartilage
  name: Надрезать хрящ
  components:
  - type: SurgeryStep
    tools:
      - type: Scalpel
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel


- type: entity
  parent: SurgeryStepSawSkull
  id: SurgeryStepHeadFinalizeSeparation
  name: Завершить отделение
