# Cleanse

- type: entity
  parent: BaseAction
  id: ActionCantripMop
  name: Cleanse
  description: Removes filth around you. Like a tiny cleanade. Only affects tiles adjacent to where you stand.
  components:
  - type: Magic
    requiresClothes: false
  - type: Action
    useDelay: 15
    itemIconStyle: BigAction
    icon:
      sprite: _Starlight/Objects/Magic/mop.rsi
      state: icon
  - type: InstantAction
    event: !type:InstantSpawnSpellEvent
      prototype: ElfCleanseSmoke
  - type: SpeakOnAction
    sentence: action-speech-cantrip-mop
    whisper: true
    tts: action-speech-cantrip-mop-tts
    modifier: Spell

