- type: entity
  abstract: true
  id: BaseBottleCase
  parent: BaseStorageItem
  name: чемодан с химикатами
  description: Пластиковый кейс с гнёздами под бутылки.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/cases.rsi
    layers:
    - state: bottlecase
    - state: bottle1
      map: ["bottle1"]
      visible: false
    - state: bottle2
      map: ["bottle2"]
      visible: false
    - state: bottle3
      map: ["bottle3"]
      visible: false
    - state: bottle4
      map: ["bottle4"]
      visible: false
    - state: bottle5
      map: ["bottle5"]
      visible: false
    - state: bottle6
      map: ["bottle6"]
      visible: false
    - state: bottle7
      map: ["bottle7"]
      visible: false
    - state: bottle8
      map: ["bottle8"]
      visible: false
  - type: Storage
    grid:
    - 0,0,3,1
    hideStackVisualsWhenClosed: false
    whitelist:
      tags:
      - Bottle
  - type: Item
    sprite: _Starlight/Objects/Specific/Medical/cases.rsi
    size: Small
    shape:
    - 0,0,1,1
  - type: ItemCounter
    count:
      tags: [Bottle]
    composite: true
    layerStates:
    - bottle1
    - bottle2
    - bottle3
    - bottle4
    - bottle5
    - bottle6
    - bottle7
    - bottle8
  - type: Appearance

- type: entity
  abstract: true
  id: BasePenPack
  parent: BaseStorageItem
  name: набор автоинжекторов
  description: Подсумок с автоинжекторами.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/cases.rsi
    state: injectorpack
  - type: Storage
    maxItemSize: Tiny
    grid:
    - 0,0,1,2
    whitelist:
       tags:
        - Medipen
  - type: Item
    size: Small
    sprite: _Starlight/Objects/Specific/Medical/cases.rsi
  - type: PhysicalComposition
    materialComposition:
      Cloth: 100

- type: entity
  abstract: true
  id: BaseSurgicalKit
  parent: BaseStorageItem
  name: хирургический набор
  description: Компактный набор хирургических инструментов.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/cases.rsi
    state: surgerykit
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,4,3
    whitelist:
       tags:
        - Brutepack
       components:
        - SurgeryTool
  - type: Item
    size: Large
    shape:
    - 0,0,2,1
    sprite: _Starlight/Objects/Specific/Medical/cases.rsi
  - type: PhysicalComposition
    materialComposition:
      Plastic: 150

