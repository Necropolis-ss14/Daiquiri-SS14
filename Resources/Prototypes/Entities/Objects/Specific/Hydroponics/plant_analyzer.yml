- type: entity
  parent: BaseItem
  id: PlantAnalyzer
  name: анализатор растений
  description: Сканер для оценки различных параметров роста растения, генетических признаков и химического состава.
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/plant_analyzer.rsi
    layers:
    - state: icon
    - state: analyzer
      shader: unshaded
  - type: Item
    storedRotation: -90
  - type: UserInterface
    interfaces:
      enum.PlantAnalyzerUiKey.Key:
        type: PlantAnalyzerBoundUserInterface
  - type: ItemToggle
    onUse: false
  - type: PlantAnalyzer
  - type: GuideHelp
    guides:
    - Botany
    - Chemicals
