- type: entity
  id: PartResomi
  parent: [BaseItem, BasePart]
  name: часть тела резоми
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: ResomiBlood # Starlight
        Quantity: 10

- type: entity
  id: TorsoResomi
  name: туловище резоми
  parent: [PartResomi, BaseTorso]
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Resomi/parts.rsi
    state: "torso_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: ResomiBlood # Starlight
        Quantity: 20


