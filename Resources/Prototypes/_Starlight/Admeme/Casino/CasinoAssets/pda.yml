- type: entity
  parent:  [ BasePDA, BaseCasinoContraband ]
  id: CasinoPDA
  abstract: true
  components:
  - type: Appearance
    appearanceDataInit:
     enum.PdaVisuals.PdaType:
       !type:String
       pda-casino
  - type: PdaBorderColor
    accentVColor: "#FFA213"
    borderColor: "#600000"
  - type: Sprite
    sprite: Objects/Devices/pda.rsi
    layers:
    - sprite: _Starlight/Admeme/Casino/Objects/pda.rsi
      map: [ "enum.PdaVisualLayers.Base" ]
      state: "pda-casino"
    - state: "light_overlay"
      map: [ "enum.PdaVisualLayers.Flashlight" ]
      shader: "unshaded"
      visible: false
    - state: "id_overlay"
      map: [ "enum.PdaVisualLayers.IdLight" ]
      shader: "unshaded"
      visible: false
  - type: Icon
    sprite: _Starlight/Admeme/Casino/Objects/pda.rsi
    state: pda-casino
  - type: CartridgeLoader
    uiKey: enum.PdaUiKey.Key
    preinstalled:
      - CrewManifestCartridge
      - NotekeeperCartridge
      - NanoTaskCartridge
      - NewsReaderCartridge
      - AstroNavCartridge
      - NanoChatCartridge
  - type: Tag
    tags:
    - DoorBumpOpener

- type: entity
  parent: CasinoPDA
  id: CasinoPDASecurity
  name: КПК охраны Gamorrah
  description: Убивать не люблю, но праведное убийство — рутина как любая. Дом всегда выигрывает.
  components:
  - type: Pda
    id: CasinoIDCardSecurity

- type: entity
  parent: CasinoPDA
  id: CasinoPDAOwner
  name: КПК владельца Gamorrah
  description: Дом всегда выигрывает.
  components:
    - type: Pda
      id: CasinoIDCardOwner


- type: entity
  parent: CasinoPDA
  id: CasinoPDAManager
  name: КПК менеджера Gamorrah
  description: Дом всегда выигрывает.
  components:
    - type: Pda
      id: CasinoIDCardManager

- type: entity
  parent: CasinoPDA
  id: CasinoPDADealer
  name: КПК дилера Gamorrah
  description: Успех зависит от предусмотрительности, бесстрастного подсчёта вероятностей и учёта каждой случайности. Дом всегда выигрывает.
  components:
    - type: Pda
      id: CasinoIDCardDealer

- type: entity
  parent: CasinoPDA
  id: CasinoPDABrigmed
  name: КПК бригмедика Gamorrah
  description: Подлатай их и верни за столы. Дом всегда выигрывает.
  components:
    - type: Pda
      id: CasinoIDCardBrigmed
    - type: CartridgeLoader
      preinstalled:
        - CrewManifestCartridge
        - NotekeeperCartridge
        - NanoTaskCartridge
        - NewsReaderCartridge
        - AstroNavCartridge
        - NanoChatCartridge
        - MedTekCartridge

- type: entity
  parent: CasinoPDA
  id: CasinoPDATreasurer
  name: КПК казначея Gamorrah
  description: Каждая фишка сочтена, каждый кредит учтён. Дом всегда выигрывает.
  components:
    - type: Pda
      id: CasinoIDCardTreasurer
