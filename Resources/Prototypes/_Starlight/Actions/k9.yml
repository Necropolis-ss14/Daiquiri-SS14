- type: entity
  parent: BaseAction
  id: Latch
  name: "[color=orange]Захват[/color]"
  description: Прижать цель на месте. Укус сильнее продлевает удержание; полученные удары сокращают его.
  components:
  - type: Action
    useDelay: 60
    itemIconStyle: BigAction
    icon:
      sprite: _Starlight/Interface/Actions/actions_k9.rsi
      state: latch
  - type: LimitedCharges
    maxCharges: 1
  - type: AutoRecharge
    rechargeDuration: 60
  - type: TargetAction
    range: 3
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState
    event: !type:LatchActionEvent

- type: entity
  parent: BaseAction
  id: LatchBiteHarder
  name: "[color=orange]Кусать сильнее[/color]"
  description: Наносит урон и удлиняет захват до предела.
  components:
  - type: Action
    useDelay: 0.75
    itemIconStyle: BigAction
    icon:
      sprite: _Starlight/Interface/Actions/actions_k9.rsi
      state: bite-harder
  - type: InstantAction
    event: !type:LatchBiteHarderActionEvent

- type: entity
  parent: BaseAction
  id: LatchRelease
  name: "[color=orange]Отпустить[/color]"
  description: Немедленно отпустить захват.
  components:
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: _Starlight/Interface/Actions/actions_k9.rsi
      state: release
  - type: InstantAction
    event: !type:LatchReleaseActionEvent

- type: entity
  parent: BaseAction
  id: K9Sprint
  name: "[color=lightblue]Рывок[/color]"
  description: Короткий всплеск скорости.
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: BigAction
    icon:
      sprite: _Starlight/Interface/Actions/actions_k9.rsi
      state: sprint
  - type: LimitedCharges
    maxCharges: 1
  - type: AutoRecharge
    rechargeDuration: 30
  - type: InstantAction
    event: !type:ZoomiesActionEvent
