# Syndicate Contraband CDs
- type: entity
  parent: [ BaseCDDisc, BaseSyndicateContraband ]
  id: CDSyndicateFM
  name: "CD: Радио Синдиката"
  description: 102.9 радио Синдиката.
  components:
  - type: Sprite
    state: synd-cd
  - type: Vinyl
    song:
      path: /Audio/_Goobstation/RadioStation/CDs/misc/syndicateFM.ogg

- type: entity
  parent: [ BaseCDDisc, BaseSyndicateContraband ]
  id: CDNumbers
  name: "CD: Номера"
  description: Диск с загадочным сообщением для связи с ближайшей угрозой вне станции.
  components:
  - type: Sprite
    state: synd-cd
  - type: Vinyl
    song:
      path: /Audio/_Goobstation/RadioStation/CDs/misc/numbersShort.ogg # Short version of numbers and takes 171 seconds to summon a threat.
  - type: VinylSummonRule # This CD summons a random station threat from the following gamerule.
    gameRule: NumberStationThreats

- type: entity
  parent: [ BaseCDDisc, BaseCommandContraband ]
  id: CDNumbersSlow
  name: "CD: Ничего не происходит..."
  description: Диск с загадочным сообщением, которое рано или поздно свяжется с ближайшей угрозой вне станции.
  components:
  - type: Sprite
    state: nt-cd
  - type: Vinyl
    song:
      path: /Audio/_Goobstation/RadioStation/CDs/misc/numbers.ogg # This is the long version of numbers and takes 275 seconds to summon a threat.
  - type: VinylSummonRule
    gameRule: NumberStationThreats

- type: entity
  parent: [ BaseCDDisc, BaseSyndicateContraband ]
  id: CDNumbersQuickAdmin
  suffix: ADMEME
  name: "CD: Нмбра"
  description: Ускоренный диск, который быстро свяжется с ближайшей угрозой вне станции.
  components:
  - type: Sprite
    state: synd-cd
  - type: Vinyl
    song:
      path: /Audio/_Goobstation/RadioStation/CDs/misc/numbersAdmin.ogg # Super sped up version of numbers which will summon a threat in about 15 seconds.
  - type: VinylSummonRule
    gameRule: NumberStationThreats

