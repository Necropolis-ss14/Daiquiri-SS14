- type: entity
  parent: BaseSubdermalImplant
  id: BluespaceImplant
  name: блюспейс-имплант
  description: Продвинутый подкожный имплант, который при активации телепортирует пользователя далеко прочь.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    permanent: true
    implantAction: ActionActivateBluespaceImplant
  - type: TriggerOnMobstateChange
    mobState:
      - Dead
  - type: TriggerOnActivateImplant
  - type: DeleteOnTrigger
    targetUser: true
  - type: SpawnOnTrigger
    proto: BluespaceImplantEffect

