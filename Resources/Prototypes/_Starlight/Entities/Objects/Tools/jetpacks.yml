# NTNC borg
- type: entity
  parent: [ BaseCentcommContraband, JetpackBlack ] # Blimpuf
  id: JetpackCyborgCentcomm
  name: джетпак ЦентКома
  suffix: Cyborg, Infinite
  description: Специализированный джетпак для киборгов, собирающий моли на ходу.
  components:
  - type: Jump
    action: JumpJetNoMoles
  - type: GasTank
    outputPressure: 21.3
    air:
      volume: 5
      temperature: 293.15
  - type: Jetpack
    moleUsage: 0
  - type: MovementSpeedModifier
    weightlessAcceleration: 1.3
    weightlessFriction: 0.3
    weightlessModifier: 1
