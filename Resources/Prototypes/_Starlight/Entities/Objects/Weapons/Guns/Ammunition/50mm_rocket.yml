# Starlight 50mm Rocket Ammunition

# Starlight override of the base 60mm rocket projectile with radar blip.
- type: entity
  parent: BulletWeakRocket
  id: Bullet50mmRocketStarlight
  categories: [ HideSpawnMenu ]
  components:
  - type: RadarBlip
    color: "#44FFAA"
    scale: 1
    shape: Circle
    requireInSpace: true
  - type: PDTarget

# 50mm Rocket Cartridge
- type: entity
  parent: [BaseItem, BaseMajorContraband]
  id: Cartridge50mmRocket
  name: ракета 50мм
  description: Ракетный патрон 50мм для челночной пушки ADMP-27 VESPERA. Меньше и легче обычных снарядов РПГ, но бьёт сильно.
  components:
  - type: Tag
    tags:
      - Cartridge50mmRocket
  - type: Item
    size: Small
  - type: CartridgeAmmo
    proto: Bullet50mmRocketStarlight
    deleteOnSpawn: true
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    state: rpg
  - type: StaticPrice
    price: 15

# 30-Round Magazine for 60mm Rockets
- type: entity
  parent: BaseMagazineGrenade
  id: Magazine50mmRocket
  name: магазин ракет 50мм
  description: Магазин повышенной ёмкости на 26 ракет 60мм для челночной пушки ADMP-27 VESPERA.
  components:
  - type: Tag
    tags:
    - Magazine50mmRocket
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - Cartridge50mmRocket
    proto: Cartridge50mmRocket
    capacity: 26
    soundRack:
      path: /Audio/Weapons/Guns/Bolt/lmg_bolt_closed.ogg
      params:
        variation: 0.05
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/rifle_load.ogg
      params:
        variation: 0.05
  - type: Item
    size: Huge
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/Grenade/grenade_cartridge.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-4
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: StaticPrice
    price: 600

- type: entity
  parent: Magazine60mmRocket
  id: Magazine50mmRocketEmpty
  name: магазин ракет 50мм (пустой)
  suffix: empty
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - Cartridge50mmRocket
    capacity: 26
