- type: entity
  id: MobHumanCCServiceWorkerEOR
  name: сервисный ЦентКом
  parent: MobHuman
  components:
    - type: RandomHumanoidAppearance
      randomizeName: true
    - type: IdBind
    - type: Loadout
      prototypes: [ CCServiceWorkerGear ]
      roleLoadout: [ RoleSurvivalStandard ]
    - type: AutoImplant
      implants:
      - MindShieldImplant

