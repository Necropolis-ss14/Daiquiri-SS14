- type: entity
  id: WeatherMarkerBase
  name: маркер погоды
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Marker
  - type: Clickable
  - type: InteractionOutline
  - type: Tag
    tags:
    - ForceFixRotations

# Wet Weather
- type: entity
  id: WeatherMarkerRain
  parent: WeatherMarkerBase
  suffix: Rain
  description: Немного петрикора для души.
  components:
  - type: Transform
  - type: WeatherMarker
    weather: WeatherRain
    delay: 0
  - type: Sprite
    sprite: /Textures/Effects/weather.rsi
    state: rain

- type: entity
  id: WeatherMarkerStorm
  parent: WeatherMarkerBase
  suffix: Rainstorm
  description: Это была тёмная бурная ночь...
  components:
  - type: Transform
  - type: WeatherMarker
    weather: WeatherStorm
  - type: Sprite
    sprite: /Textures/Effects/weather.rsi
    state: storm

- type: entity
  id: WeatherMarkerHail
  parent: WeatherMarkerBase
  suffix: Hail
  description: В основном не смертельно.
  components:
  - type: Transform
  - type: WeatherMarker
    weather: WeatherHail
  - type: Sprite
    sprite: /Textures/Effects/weather.rsi
    state: hail

- type: entity
  id: WeatherMarkerSnowfallLight
  parent: WeatherMarkerBase
  suffix: "Snowfall, Light"
  description: Лёгкая пороша.
  components:
  - type: Transform
  - type: WeatherMarker
    weather: WeatherSnowfallLight
  - type: Sprite
    sprite: /Textures/Effects/weather.rsi
    state: snowfall_light

- type: entity
  id: WeatherMarkerSnowfallMedium
  parent: WeatherMarkerBase
  suffix: "Snowfall, Medium"
  description: Щедрая порция снега.
  components:
  - type: Transform
  - type: WeatherMarker
    weather: WeatherSnowfallMedium
  - type: Sprite
    sprite: /Textures/Effects/weather.rsi
    state: snowfall_med

- type: entity
  id: WeatherMarkerSnowfallHeavy
  parent: WeatherMarkerBase
  suffix: "Snowfall, Whiteout"
  description: Воющий буран с белой мглой.
  components:
  - type: Transform
  - type: WeatherMarker
    weather: WeatherSnowfallHeavy
  - type: Sprite
    sprite: /Textures/Effects/weather.rsi
    state: snowfall_heavy

- type: entity
  id: WeatherMarkerSnowLobster
  parent: WeatherMarkerBase
  suffix: "Snowfall, Heavy"
  description: Сильный снег с лёгким туманом.
  components:
  - type: Transform
  - type: WeatherMarker
    weather: WeatherSnowfallLobster
    delay: 0
  - type: Sprite
    sprite: /Textures/_Starlight/Effects/weather.rsi
    state: snowfall_lobster

