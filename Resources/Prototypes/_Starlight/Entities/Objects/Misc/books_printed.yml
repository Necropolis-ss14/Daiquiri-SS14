- type: entity
  parent: BookBase
  id: BookPrintedArchive
  name: ent-BookPrinted
  description: ent-BookPrinted-desc
  components:
  - type: Sprite
    sprite: Objects/Misc/books.rsi
    layers:
    - state: paper
    - state: cover_base
      color: "#1134A6"
      map: [ "cover" ]
    - state: decor_spine
      color: "#e8dcc0"
      map: [ "decor" ]
    - state: book_icon
      map: [ "icon" ]
    - state: overlay_null
      map: [ "overlay" ]

