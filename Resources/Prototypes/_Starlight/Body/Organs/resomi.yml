- type: entity
  id: OrganResomiEyes
  parent: OrganHumanEyes
  name: ent-OrganResomiEyes
  suffix: Resomi
  description: ent-OrganResomiEyes-desc
  components:
  - type: OrganVisualization
    layer: Eyes
    prototypes:
      Default: MobResomiEyes
  - type: FunctionalOrgan
    comps:
    - type: NightVision
      disabilityBlockable: true
    - type: FlashModifier
      modifier: 2

- type: entity # Starlight
  id: OrganResomiHeart
  parent: OrganHumanHeart
  name: ent-OrganResomiHeart
  suffix: Resomi
  description: ent-OrganResomiHeart-desc
  components:
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [Resomi]
    stages: [ Bloodstream ]
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Resomi/organs.rsi
    state: heart-on

- type: entity
  id: OrganResomiLiver
  parent: OrganHumanLiver
  name: ent-OrganResomiLiver
  suffix: Resomi
  description: ent-OrganResomiLiver-desc
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Resomi/organs.rsi
    state: liver

- type: entity
  id: OrganResomiKidneys
  parent: OrganHumanKidneys
  name: ent-OrganResomiKidneys
  suffix: Resomi
  description: ent-OrganResomiKidneys-desc
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Resomi/organs.rsi
    layers:
      - state: kidney-l
      - state: kidney-r

- type: entity
  id: OrganResomiLungs
  parent: OrganHumanLungs
  name: ent-OrganResomiLungs
  suffix: Resomi
  description: ent-OrganResomiLungs-desc
  components:
  - type: Metabolizer
    metabolizerTypes: [ Resomi, Human ] #They get both so they can still breathe oxygen without us needing to add Resomi everywhere Human is listed
    stages: [ Respiration ]
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Resomi/organs.rsi
    layers:
      - state: lung-l
      - state: lung-r

- type: entity
  id: OrganResomiBrain
  parent: OrganHumanBrain
  name: ent-OrganResomiBrain
  suffix: Resomi
  description: ent-OrganResomiBrain-desc
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Resomi/organs.rsi
    state: brain

- type: entity
  id: OrganResomiStomach
  parent: OrganHumanStomach
  name: ent-OrganResomiStomach
  suffix: Resomi
  description: ent-OrganResomiStomach-desc
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Resomi/organs.rsi
    state: stomach

- type: entity
  id: OrganResomiTongue
  parent: OrganHumanTongue
  suffix: Resomi
  components:
  - type: OrganTongue
    allowedEmotes: ['Chirp', 'Hisses', 'Purr', 'Growl', 'Trill', 'Scree', 'Call', 'Squawk']
    sounds:
      Male: UnisexResomi
      Female: UnisexResomi
      Unsexed: UnisexResomi
