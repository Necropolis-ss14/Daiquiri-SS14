- type: entity
  parent: [BaseHardBomb, BaseETOContraband]
  id: ETOBomb
  name: PS-3ETO
  description: Модифицированная бомба помощнее, разнесёт твою цель! Магнитные ремни — вешай на спину.
  components:
    - type: Sprite
      sprite: _Starlight/Admeme/ETO/etobomb.rsi
      layers:
        - state: ETO-bomb
        - state: ETO-bomb-active
          visible: false
          map: [ "primed" ]
        - state: ETO-bomb-wires
          visible: false
          map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
    - type: GenericVisualizer
      visuals:
        enum.DefusableVisuals.Active:
          primed:
            True: { visible: true }
            False: { visible: false }
        enum.WiresVisualLayers.MaintenancePanel:
          enum.WiresVisualLayers.MaintenancePanel:
            True: { visible: true }
            False: { visible: false }
    - type: Item
      size: Large
      shape:
      - 0,0,4,4
    - type: Clothing
      quickEquip: false
      slots:
      - back
      - suitStorage
    - type: TimerTrigger
      delay: 300
      delayOptions: [300, 600, 900]
      initialBeepDelay: 0
      beepSound: /Audio/Machines/timer.ogg
    - type: PointLight
      color: "#C7001B"
      radius: 1.1
      softness: 1
    - type: Explosive
      explosionType: HardBomb
      totalIntensity: 20000.0
      intensitySlope: 10
      maxIntensity: 75

- type: entity
  parent: ETOBomb
  id: ETOBetterBomb
  name: PS-21ETO «Разрушитель планет»
  description: Бомба массового уничтожения, рвущая даже укреплённые сооружения. «Смерть врагу, свободу рабам».
  components:
    - type: Explosive
      explosionType: HardBomb
      totalIntensity: 500000.0
      intensitySlope: 10
      maxIntensity: 75
