- type: entity
  parent: DeathRattleImplant
  id: TrackingImplantMedTak
  name: ent-TrackingImplantMedTak
  description: ent-TrackingImplantMedTak-desc
  abstract: true
  components:
    - type: IconImplant
      icon: MedTakOperator
      iconType: MedTak
    - type: RattleOnTrigger
      radioChannel:
      - MedTak
    - type: SuitSensor
      faction: MedTak
      randomMode: false
      controlsLocked: true
      mode: SensorCords
      activationContainer: "implant"
    - type: DeviceNetwork
      deviceNetId: Wireless
      transmitFrequencyId: SuitSensor
    - type: StationLimitedNetwork
      allowNonStationPackets: true
    - type: WirelessNetworkConnection
      range: 1500

- type: entity
  parent: TrackingImplantMedTak
  id: TrackingImplantMedTakBronze
  name: ent-TrackingImplantMedTakBronze
  categories: [ HideSpawnMenu ]
