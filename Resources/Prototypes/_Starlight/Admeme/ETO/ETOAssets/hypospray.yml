- type: entity
  parent: [ AdvancedJetInjector, BaseETOContraband ]
  id: ETOMartyrInjector
  name: инъектор боевых стимуляторов
  description: Модифицированный инъектор, сам синтезирует боевую смесь. Полная заправка за 40 секунд.
  suffix: ETO
  categories: [ DoNotMap ]
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/ETO/crackheadjetinjector.rsi
    layers:
    - state: jetinjector_base
      map: [ "enum.SolutionContainerLayers.Base" ]
    - state: jetinjector_filled1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
  - type: Item
    sprite: _Starlight/Admeme/ETO/crackheadjetinjector.rsi
  - type: SolutionContainerVisuals
    maxFillLevels: 3
  - type: Solution
    id: hypospray
    solution:
      reagents:
      - ReagentId: Bicaridine
        Quantity: 10
      - ReagentId: Ephedrine
        Quantity: 10
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: Bicaridine
        Quantity: 0.25
      - ReagentId: Ephedrine
        Quantity: 0.25

- type: entity
  parent: [ChemicalMedipen, BaseETOContraband]
  id: CombatMedipenETO
  name: разбавленная боевая медиручка
  description: Более слабая версия стандартной боевой медиручки.
  suffix: ETO
  categories: [ DoNotMap ]
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: base-needle-inhand-left
      - state: base-colorA-inhand-left
        color: "#3b2905"
      - state: base-colorB-inhand-left
      right:
      - state: base-needle-inhand-right
      - state: base-colorA-inhand-right
        color: "#3b2905"
      - state: base-colorB-inhand-right
  - type: Sprite
    sprite: _Starlight/Admeme/ETO/medipen.rsi
    layers:
    - state: combatpeneto
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: combatpeneto_empty
  - type: Solution
    solution:
        maxVol: 30
        reagents:
        - ReagentId: Omnizine
          Quantity: 10
        - ReagentId: Tricordrazine
          Quantity: 15
        - ReagentId: TranexamicAcid
          Quantity: 5
