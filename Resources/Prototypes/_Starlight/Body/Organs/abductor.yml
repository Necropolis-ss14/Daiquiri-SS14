- type: entity
  id: BaseAbductorOrgan
  parent: BaseItem
  abstract: true
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Abductor/organs.rsi
  - type: Organ
  - type: Edible
  - type: Extractable
    grindableSolutionName: organ
  - type: SolutionManager
    solutions:
    - SolutionOrganNutriment
    - SolutionOrganFoodMeat
  - type: FlavorProfile
    flavors:
      - people
  - type: Tag
    tags:
      - Meat


- type: entity
  id: OrganAbductorBrain
  parent: [BaseOrganBrain, BaseAbductorOrgan]
  name: ent-OrganAbductorBrain
  suffix: Abductor
  description: ent-OrganAbductorBrain-desc
  components:
  - type: Sprite
    state: brain

- type: entity
  id: OrganAbductorEyes
  parent: [BaseAbductorOrgan, BaseOrganEyes]
  name: ent-OrganAbductorEyes
  suffix: Abductor
  description: ent-OrganAbductorEyes-desc
  components:
  - type: Sprite
    layers:
      - state: eyeballs
  - type: OrganVisualization
    layer: Eyes
    prototypes:
      Default: MobAbductorEyes

- type: entity
  id: OrganAbductorEars
  parent: [BaseAbductorOrgan, BaseOrganEars]
  name: ent-OrganAbductorEars
  suffix: Abductor
  description: ent-OrganAbductorEars-desc
  components:
  - type: Sprite
    state: ears

- type: entity
  id: OrganAbductorLungs
  parent: [BaseAbductorOrgan, BaseOrganLungs]
  name: ent-OrganAbductorLungs
  suffix: Abductor
  description: ent-OrganAbductorLungs-desc
  components:
  - type: Sprite
    layers:
      - state: lung-l
      - state: lung-r

- type: entity
  id: OrganAbductorHeart
  parent: [BaseAbductorOrgan, BaseOrganHeart]
  name: ent-OrganAbductorHeart
  suffix: Abductor
  description: ent-OrganAbductorHeart-desc
  components:
  - type: Sprite
    state: heart-on
  # The heart 'metabolizes' medicines and poisons that aren't filtered out by other organs.
  # This is done because these chemicals need to have some effect even if they aren't being filtered out of your body.
  # You're technically 'immune to poison' without a heart, but.. uhh, you'll have bigger problems on your hands.
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [ Slime ]
    stages: [ Bloodstream ]
- type: entity
  id: OrganAbductorStomach
  parent: [BaseAbductorOrgan, BaseOrganStomach]
  name: ent-OrganAbductorStomach
  suffix: Abductor
  description: ent-OrganAbductorStomach-desc
  components:
  - type: Sprite
    state: stomach
  - type: SolutionManager
    solutions:
    - SolutionOrganNutriment
    - SolutionOrganFoodMeat
    - SolutionOrganStomach50
  - type: Stomach
  # The stomach metabolizes stuff like foods and drinks.
  # TODO: Have it work off of the ent's solution container, and move this
  # to intestines instead.
  - type: Metabolizer
    # mm yummy
    maxReagents: 3
    metabolizerTypes: [ Slime ]
    stages: [ Digestion ]

- type: entity
  id: OrganAbductorLiver
  parent: [BaseAbductorOrgan, BaseOrganLiver]
  name: ent-OrganAbductorLiver
  suffix: Abductor
  description: ent-OrganAbductorLiver-desc
  components:
  - type: Sprite
    state: liver
  - type: Metabolizer # The liver metabolizes certain chemicals only, like alcohol.
    maxReagents: 1
    metabolizerTypes: [ Slime ]
    stages: [ Metabolites ]
- type: entity
  id: OrganAbductorKidneys
  parent: [BaseAbductorOrgan, BaseOrganKidneys]
  name: ent-OrganAbductorKidneys
  suffix: Abductor
  description: ent-OrganAbductorKidneys-desc
  components:
  - type: Sprite
    layers:
      - state: kidney-l
      - state: kidney-r
  # The kidneys just remove anything that doesn't currently have any metabolisms, as a stopgap.
  - type: Metabolizer
    maxReagents: 5
    metabolizerTypes: [ Slime ]

- type: entity
  id: OrganAbductorTongue
  parent: OrganHumanTongue
  suffix: Abductor
