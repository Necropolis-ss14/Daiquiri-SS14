# Starlight
- type: entity
  parent: [ BaseCartridge, BaseMajorContraband ]
  id: Cartridge48Rifle
  name: патрон (.48 rifle)
  description: Тяжёлый промежуточный патрон неизвестного происхождения. Что-то между магнумом и противотанковым. Фирменный, на полке не найдёшь.
  components:
  - type: Tag
    tags:
    - Cartridge48Rifle
  - type: CartridgeAmmo
    proto: Bullet48RifleFMJ
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/large_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: StaticPrice
    price: 25
# Starlight

- type: entity
  parent: [ BaseItem, BaseMajorContraband ]
  id: SpeedLoader48Rifle
  name: быстрозарядник (.48 rifle)
  description: Обойма на патроны .48 для внутреннего магазина «Охотника на львов». Фирменная, достать сложно.
  components:
  - type: Tag
    tags:
    - SpeedLoader48Rifle
  - type: SpeedLoader
  - type: BallisticAmmoProvider
    mayTransfer: true
    fillDelay: 0.1
    whitelist:
      tags:
      - Cartridge48Rifle
    capacity: 10
    proto: Cartridge48Rifle
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/SpeedLoaders/LightRifle/light_rifle_speed_loader.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-5
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 6
    zeroVisible: false
  - type: Appearance
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
  - type: StaticPrice
    price: 50
