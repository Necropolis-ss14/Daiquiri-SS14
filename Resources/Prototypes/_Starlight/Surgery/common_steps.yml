- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepExposeNerves
  name: Обнажить нервы
  components:
  - type: SurgeryStep
    duration: 4
    tools:
    - type: Scalpel
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel
  - type: SurgeryStepEmoteEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepExposeBloodVessels
  name: Обнажить кровеносные сосуды
  components:
  - type: SurgeryStep
    duration: 4
    tools:
    - type: Scalpel
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel
  - type: SurgeryStepEmoteEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepDeepIncision
  name: Глубокий разрез
  components:
    - type: SurgeryStep
      duration: 5
      tools:
      - type: Scalpel
    - type: Sprite
      sprite: Objects/Specific/Medical/Surgery/scalpel.rsi
      state: scalpel
    - type: SurgeryStepEmoteEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRetractSkin
  name: Оттянуть кожу
  components:
  - type: SurgeryStep
    tools:
    - type: Retractor
    add:
    - type: SkinRetracted
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/scissors.rsi
    state: retractor

- type: entity
  parent: SurgeryStepRetractSkin
  id: SurgeryStepRetractMembrane
  name: Оттянуть мембрану

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepCoagulateJellyFlow
  name: Остановить вытекание геля
  components:
  - type: SurgeryStep
    tools:
      - type: Hemostat
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/scissors.rsi
    state: hemostat
