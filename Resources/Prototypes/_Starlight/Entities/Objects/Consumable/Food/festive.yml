
- type: entity
  name: жареная индейка
  parent: [SolutionHuge, FoodMealBase, BaseSlicingRefinableFood]
  id: FoodFeastTurkey
  description: "Целая жареная индейка. Поделишься, правда?"
  components:
    - type: MultiHandedItem
    - type: FlavorProfile
      flavors:
        - meaty
    - type: Item
      size: Huge
      shape:
        - 0,0,3,2
      inhandVisuals:
        left:
          - state: plate-inhand-left
        right:
          - state: plate-inhand-right
    - type: Edible
      trash:
        - FoodPlate
    - type: Sprite
      sprite: _Starlight/Objects/Consumable/Food/turkey.rsi
      layers:
        - state: turkeycooked
    - type: Solution
      id: food
      solution:
        maxVol: 360 # 12 inventory tiles, but it is hollow.
        reagents:
          - ReagentId: Nutriment
            Quantity: 200
          - ReagentId: Protein
            Quantity: 100

    - type: Tag
      tags:
        - Meat
    - type: ToolRefinable
      refineResult:
      - id: FoodTurkeySlice
        amount: 16

- type: entity
  name: кусок жареной индейки
  parent: [SolutionTiny, FoodMealBase]
  id: FoodTurkeySlice
  description: Порция жареной индейки. В следующий раз готовь целый пир!
  components:
    - type: MultiHandedItem
    - type: FlavorProfile
      flavors:
        - meaty
    - type: Item
      size: Tiny
    - type: Sprite
      sprite: _Starlight/Objects/Consumable/Food/turkey.rsi
      layers:
        - state: turkeyslice
    - type: Solution
      id: food
      solution:
        reagents:
          - ReagentId: Nutriment
            Quantity: 12.5
          - ReagentId: Protein
            Quantity: 6.25
    - type: Tag
      tags:
        - Meat

# hypothetically contains 320 nutriment, 100 protein, 50 gravy, 8 vitamin
- type: entity
  name: праздничный пир
  parent: BoxCardboard
  id: FoodFeastFestiveDinner
  description: В общей сложности тут не меньше 32 000 калорий.
  components:
    - type: MultiHandedItem
    - type: Storage
      grid:
        - 0,0,7,3
      maxItemSize: Normal
      whitelist:
        tags:
        - FestiveDinner
      hideStackVisualsWhenClosed: false
    - type: Item
      size: Normal
      shape:
        - 0,0,3,2
      sprite: _Starlight/Objects/Consumable/Food/turkey.rsi
      inhandVisuals:
        left:
          - state: plate-inhand-both
        right:
          - state: plate-inhand-both
    - type: Sprite
      sprite: _Starlight/Objects/Consumable/Food/turkey.rsi
      layers:
        - state: turkeyfeasted
        - state: turkeyfeast
          map: ["turkeyfeast1"]
        - state: turkeyfeast
          map: ["turkeyfeast2"]
    - type: Tag
      tags:
        - Meat
        - Potato
        - Trash
    - type: ItemCounter
      count:
        tags: [FestiveDinner]
      composite: true
      layerStates:
      - turkeyfeast1
      - turkeyfeast2
    - type: Appearance
    - type: EntityTableContainerFill
      containers:
        storagebase: !type:AllSelector
          children:
            - id: FoodMealFestiveDinner
              amount: 8
            - id: FoodMealFestiveDinnerGravy
              amount: 8

- type: entity
