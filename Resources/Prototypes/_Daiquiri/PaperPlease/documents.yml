- type: entity
  parent: MarkerBase
  id: PassportGuideBookSpawner
  name: спавнер справочника (случайное издание)
  suffix: PapersPlease
  categories: [ PapersPlease ]
  components:
  - type: Sprite
    layers:
    - state: green
  - type: RandomSpawner
    chance: 1
    prototypes:
    - PassportGuideBook1
    - PassportGuideBook2
    - PassportGuideBook3

- type: entity
