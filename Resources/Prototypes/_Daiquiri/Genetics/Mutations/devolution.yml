- type: entity
  abstract: true
  parent: BaseMutation
  id: BaseMutationDevolution
  components:
  - type: Mutation
    instability: -40
    rarity: Common

- type: entity
  parent: BaseMutationDevolution
  id: MutationDevolutionArachnid
  name: Arachnid Devolution
  description: A dormant genome that turns an arachnid back into a giant spider.
  components:
  - type: PolymorphMutation
    prototypes:
      Arachnid: MutationGiantSpider
    fallback: MutationHuman

- type: entity
  parent: BaseMutationDevolution
  id: MutationDevolutionElf
  name: Elven Heritage
  description: A genome that turns a human into an elf.
  components:
  - type: PolymorphMutation
    prototypes:
      Human: MutationElf
    reverts:
      Elf: MutationHuman
    fallback: MutationHuman

