- type: entity
  id: OrganNeocyteLungs
  parent: [BaseNeocyteOrgan, BaseOrganLungs]
  name: ent-OrganNeocyteLungs
  suffix: Neocyte
  description: ent-OrganNeocyteLungs-desc
  components:
  - type: Sprite
    layers:
    - state: lung-l
    - state: lung-r
  - type: Item
    size: Small
    heldPrefix: lungs
  - type: Lung
  - type: Metabolizer
    metabolizerTypes: [ Neocyte ]
    stages: [ Respiration ]
  - type: SolutionManager
    solutions:
    - SolutionOrganNutriment
    - SolutionOrganFoodMeat
    - SolutionOrganLung
