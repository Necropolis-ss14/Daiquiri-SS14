- type: entity
  parent: BaseItem
  id: BasePDACartridge
  abstract: true
  components:
  - type: Item
    storedRotation: -90
  - type: Sprite
    sprite: Objects/Devices/cartridge.rsi

- type: entity
  parent: BasePDACartridge
  id: NotekeeperCartridge
  name: картридж для заметок
  description: Программа для ведения заметок.
  components:
  - type: Sprite
    state: cart-y
  - type: UIFragment
    ui: !type:NotekeeperUi
  - type: Cartridge
    programName: notekeeper-program-name
    icon:
      sprite:  Objects/Misc/books.rsi
      state: book_icon
  - type: NotekeeperCartridge

- type: entity
  parent: BasePDACartridge
  id: NanoTaskCartridge
  name: картридж NanoTask
  description: Программа, позволяющая вести список дел.
  components:
  - type: Sprite
    state: cart-nav
  - type: Cartridge
    programName: nano-task-program-name
    icon:
      sprite: Interface/Misc/program_icons.rsi
      state: nano_task
  - type: UIFragment
    ui: !type:NanoTaskUi
  - type: NanoTaskCartridge

- type: entity
  parent: BasePDACartridge
  id: NewsReaderCartridge
  name: картридж новостей
  description: Программа для чтения новостей.
  components:
  - type: Sprite
    state: cart-y
  - type: UIFragment
    ui: !type:NewsReaderUi
  - type: Cartridge
    programName: news-read-program-name
    icon:
      sprite: Interface/Misc/program_icons.rsi
      state: news_read
  - type: NewsReaderCartridge

- type: entity
  parent: BasePDACartridge
  id: CrewManifestCartridge
  name: картридж манифеста экипажа
  description: Программа для просмотра списка членов экипажа.
  components:
    - type: Sprite
      state: cart-y
    - type: UIFragment
      ui: !type:CrewManifestUi
    - type: Cartridge
      programName: crew-manifest-program-name
      icon:
        sprite: Interface/Misc/program_icons.rsi
        state: crew_manifest
    - type: CrewManifestCartridge

- type: entity
  parent: [ BasePDACartridge, BaseEngineeringContraband ] # TODO Starlight partial once space-wizards/RobustToolbox/pull/7084 gets fixed
  id: NetProbeCartridge
  name: картридж NetProbe
  description: Программа для получения адреса и частоты сетевых устройств.
  components:
    - type: Sprite
      state: cart-y
    - type: UIFragment
      ui: !type:NetProbeUi
    - type: Cartridge
      programName: net-probe-program-name
      icon:
        sprite: Structures/Machines/server.rsi
        state: server
    - type: NetProbeCartridge

- type: entity
  parent: [ BasePDACartridge, BaseSecurityContraband ] # TODO Starlight partial once space-wizards/RobustToolbox/pull/7084 gets fixed
  id: LogProbeCartridge
  name: картридж LogProbe
  description: Программа для получения журналов доступа с устройств.
  components:
    - type: Sprite
      state: cart-log
    - type: Icon
      sprite: Objects/Devices/cartridge.rsi
      state: cart-log
    - type: UIFragment
      ui: !type:LogProbeUi
    - type: Cartridge
      programName: log-probe-program-name
      icon:
        sprite: Structures/Doors/Airlocks/Standard/security.rsi
        state: closed
    - type: LogProbeCartridge
    - type: GuideHelp
      guides:
      - Forensics

- type: entity
  parent: [ BasePDACartridge, BaseSecurityContraband ] # TODO Starlight partial once space-wizards/RobustToolbox/pull/7084 gets fixed
  id: WantedListCartridge
  name: картридж списка разыскиваемых
  description: Программа для получения списка разыскиваемых лиц.
  components:
  - type: Sprite
    state: cart-sec
  - type: Icon
    sprite: Objects/Devices/cartridge.rsi
    state: cart-sec
  - type: UIFragment
    ui: !type:WantedListUi
  - type: Cartridge
    programName: wanted-list-program-name
    icon:
      sprite: Objects/Misc/books.rsi
      state: icon_magnifier
  - type: WantedListCartridge
  - type: StealTarget
    stealGroup: WantedListCartridge

- type: entity
  parent: BasePDACartridge
  id: MedTekCartridge
  name: картридж медтек
  description: Программа с инструментами для медицинской диагностики.
  components:
    - type: Sprite
      state: cart-med
    - type: Icon
      sprite: Objects/Devices/cartridge.rsi
      state: cart-med
    - type: Cartridge
      programName: med-tek-program-name
      icon:
        sprite: Objects/Specific/Medical/healthanalyzer.rsi
        state: icon
    - type: MedTekCartridge

- type: entity
  parent: BasePDACartridge
  id: AstroNavCartridge
  name: картридж астронав
  description: Навигационная программа, предоставляющая GPS-координаты.
  components:
    - type: Sprite
      state: cart-nav
    - type: Icon
      sprite: Objects/Devices/cartridge.rsi
      state: cart-nav
    - type: Cartridge
      programName: astro-nav-program-name
      icon:
        sprite: Objects/Devices/gps.rsi
        state: icon
    - type: AstroNavCartridge
    - type: StealTarget # Starlight
      stealGroup: AstroNavCartridge # Starlight

- type: entity
  parent: BasePDACartridge
  id: BookWriterCartridge
  name: картридж книжника
  description: Картридж с программой для написания и печати книг.
  components:
    - type: Sprite
      state: cart-lib
    - type: UIFragment
      ui: !type:BookWriterUi
    - type: Cartridge
      programName: book-writer-program-name
      icon:
        sprite: Objects/Misc/books.rsi
        state: book_icon
    - type: BookWriterCartridge
