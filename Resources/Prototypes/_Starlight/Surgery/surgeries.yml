    speciesBlacklist: []
    speciesWhitelist:
    - SlimePerson
    - NeoSlimePerson

- type: entity
  parent: SurgeryCloseIncision
  id: SurgeryCloseIncisionSlimeHead
  name: Закрыть разрез
