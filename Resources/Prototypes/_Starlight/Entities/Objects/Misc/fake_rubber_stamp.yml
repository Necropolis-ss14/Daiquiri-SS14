  description: Небольшая коробка с поддельными печатями.
  components:
    - type: Storage
      maxItemSize: Small
      grid:
        - 0,0,4,1
      whitelist:
        components:
          - Stamp
    - type: EntityTableContainerFill
      containers:
        storagebase: !type:AllSelector
          children:
            - !type:NestedSelector
              tableId: RandomCaptainStampFakeTable
            - !type:NestedSelector
              tableId: RandomClownStampFakeTable
            - !type:NestedSelector
              tableId: RandomCEStampFakeTable
            - !type:NestedSelector
              tableId: RandomCMOStampFakeTable
            - !type:NestedSelector
              tableId: RandomHopStampFakeTable
            - !type:NestedSelector
