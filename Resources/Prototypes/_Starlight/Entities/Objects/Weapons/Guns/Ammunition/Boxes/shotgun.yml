  - type: BallisticAmmoProvider
    proto: ShellShotgunToz

- type: entity
  name: pellet ammunition box, 20 gauge калибра
  description: Надпись на упаковке почти не читается, советует взять нож, но она такая дешёвая, что можно просто разорвать.
  parent: BaseItem
  suffix: sealed
  id: BoxLethalshotToz
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Ammunition/Boxes/toz.rsi
    layers:
    - state: base
  - type: SpawnItemsOnUse
    items:
    - id: BoxLethalshotTozOpen
    sound:
      path: /Audio/_Starlight/Effects/rip.ogg
