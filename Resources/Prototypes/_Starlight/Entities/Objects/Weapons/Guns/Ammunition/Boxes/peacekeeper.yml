    - type: Sprite
      layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-1
        map: ["enum.GunVisualLayers.Mag"]
      - state: baton

- type: entity
  parent: BasePeacekeeperBox
  id: BoxPeacekeeperBola
  name: коробка бола-патронов миротворца
  description: Коробка бола-гранат для «Миротворца», ронять подозреваемых станет ещё веселее!
  components:
    - type: BallisticAmmoProvider
      proto: GrenadeBola
      mayTransfer: true
    - type: Sprite
      layers:
