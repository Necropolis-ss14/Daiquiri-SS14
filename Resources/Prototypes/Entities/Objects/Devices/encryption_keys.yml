- type: entity
  parent: EncryptionKey
  id: EncryptionKeyFreelance
  name: ключ шифрования фрилансера
  description: Ключ шифрования, используемый фрилансерами, у которых может быть, а может и не быть принадлежности. Выглядит поношенным.
  components:
    - type: EncryptionKey
      channels:
        - Freelance
      defaultChannel: Freelance
    - type: Sprite
      layers:
        - state: crypt_rusted
        - state: pirate_label
