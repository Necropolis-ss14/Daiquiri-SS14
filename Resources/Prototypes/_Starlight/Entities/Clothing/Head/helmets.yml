- type: entity
  parent: [ClothingHeadBase, BaseSecurityContraband, BaseToggleClothing]
  id: ClothingHeadHelmetBulletProof
  name: пуленепробиваемый шлем
  description: Защищает лицо от пуль, поднимается и опускается.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Head/Helmets/bulletproof.rsi
    layers:
    - state: icon
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Clothing
    sprite: _Starlight/Clothing/Head/Helmets/bulletproof.rsi
  - type: Item
    storedRotation: 0
  - type: ItemToggle # Welding mask starts in an activated state
    activated: true
  - type: Appearance
  - type: Pierceable
    level: Metal
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.80
  - type: ToggleClothing
    action: ActionToggleWeldingMask
  - type: WeldingMask
  - type: HideLayerClothing
    slots:
    - Snout
    hideOnToggle: true
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: {state: icon}
          False: {state: icon-up}
  - type: ComponentToggler
    components:
    - type: IngestionBlocker
    - type: FlashImmunity
    - type: IdentityBlocker

- type: entity
  parent: [ BaseContrabandTier2, ClothingHeadHelmetBase, BaseSecurityContraband ] # Blimpuf
  id: ClothingHeadHelmetReflective
  name: отражающий шлем
  description: Блестящий шлем к столь же блестящему жилету. Даёт 100% отражение при ношении со светоотражающим жилетом.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Head/Helmets/reflect.rsi
  - type: Clothing
    sprite: _Starlight/Clothing/Head/Helmets/reflect.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
        Heat: 0.80
  - type: Reflect
    reflectProb: 0.35 # STARLIGHT: Helmet base reflect probability, adds with vest to 100%
    reflects:
      - Energy
  # STARLIGHT: Component for set bonus system. Stores original reflection and tag for helmet piece.
  - type: ReflectiveSetBonus
    helmetTag: ReflectiveArmorHelmet
  - type: Tag
    tags:
    - SecurityHelmet
    - ReflectiveArmorHelmet # STARLIGHT: Tag for set bonus system detection

