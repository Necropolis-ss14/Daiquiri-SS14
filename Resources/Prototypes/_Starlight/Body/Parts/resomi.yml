- type: entity
  id: PartResomi
  parent: [BaseItem, BasePart]
  name: ent-PartResomi
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: ResomiBlood # Starlight
        Quantity: 10

- type: entity
  id: TorsoResomi
  name: ent-TorsoResomi
  parent: [PartResomi, BaseTorso]
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Resomi/parts.rsi
    state: "torso_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: ResomiBlood # Starlight
        Quantity: 20


