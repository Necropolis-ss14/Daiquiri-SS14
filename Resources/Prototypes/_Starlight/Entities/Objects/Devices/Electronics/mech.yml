# Clarke

- type: entity
  id: ClarkeCentralElectronics
  parent: BaseElectronics
  name: центральный модуль управления «Кларк»
  description: Электрический центр управления мехом «Кларк».
  components:
    - type: Item
      storedRotation: 0
    - type: Sprite
      sprite: Objects/Misc/module.rsi
      state: mainboard
    - type: Tag
      tags:
      - ClarkeCentralControlModule
      - RamChip
    - type: GuideHelp
      guides:
      - Robotics

- type: entity
  id: ClarkePeripheralsElectronics
  parent: BaseElectronics
  name: модуль периферии «Кларк»
  description: Модуль управления периферией меха «Кларк».
  components:
    - type: Sprite
      sprite: Objects/Misc/module.rsi
      state: id_mod
    - type: Tag
      tags:
      - ClarkePeripheralsControlModule
      - RamChip
    - type: GuideHelp
      guides:
      - Robotics

