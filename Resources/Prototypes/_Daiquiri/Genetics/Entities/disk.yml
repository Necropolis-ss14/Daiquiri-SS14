- type: entity
  parent: BaseItem
  id: GeneticsDisk
  name: genetics disk
  suffix: Blank
  description: A storage disk capable of encoding a single mutation for use in a genetics console. Do not expose to microwave radiation.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    layers:
    - state: datadisk_base
      map: ["base"]
    - state: datadisk_label
  - type: RandomSprite
    available:
    - base:
        datadisk_base: Sixteen
  - type: Item
    size: Tiny
  - type: GeneticsDisk

- type: entity
  parent: GeneticsDisk
  id: GeneticsDiskUnstableDna
  suffix: Unstable DNA
  components:
  - type: GeneticsDisk
    mutation: MutationUnstableDna

- type: entity
  parent: BoxCardboard
  id: BoxGeneticsDisk
  name: genetics disk box
  description: A box of blank genetics disks.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: GeneticsDisk
        amount: 9
  - type: Sprite
    layers:
    - state: box
    - state: encryptokey
