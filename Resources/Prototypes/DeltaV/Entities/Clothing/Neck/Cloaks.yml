  description: Более нарядная версия обычного плаща, призванная немного повысить восхищение экипажа вами.
  components:
    - type: Sprite
      sprite: DeltaV/Clothing/Neck/Cloaks/hop.rsi
    - type: StealTarget
      stealGroup: HeadCloak
