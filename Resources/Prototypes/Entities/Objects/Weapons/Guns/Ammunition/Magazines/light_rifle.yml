# Empty mags
- type: entity
  abstract: true
  parent: [ BaseContrabandTier3, BaseItem, BaseSecurityContraband ] # Blimpuf
  id: BaseMagazineLightRifle
  name: "magazine (.30 rifle)"
  components:
  - type: Tag
    tags:
      - MagazineLightRifle
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgeLightRifle
    proto: CartridgeLightRifleSP
    capacity: 30
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/LightRifle/light_rifle_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

# Magazines
- type: entity
  parent: BaseMagazineLightRifle
  id: MagazineLightRifleBoxSP
  name: "короб с лентой для L6 SAW (.30 винтовка SP)"
  description: Короб с лентой на 100 патронов .30, для ручных пулемётов вроде L6. Подходит для кинетических боеприпасов общего назначения.
  components:
  - type: Tag
    tags:
      - MagazineLightRifleBox
  - type: BallisticAmmoProvider
    proto: CartridgeLightRifleSP
    capacity: 100
  - type: Item
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/LightRifle/light_rifle_box.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 8
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: BaseMagazineLightRifle
  id: MagazineLightRifleSP
  name: "магазин (.30 винтовка SP)"
  description: Изогнутый двухрядный магазин на 30 патронов для боевых винтовок. Подходит для кинетических боеприпасов общего назначения.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeLightRifleSP
  - type: Sprite
    layers:
    - state: sp
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  parent: MagazineLightRifleSP
  id: MagazineLightRifleEmpty
  name: "magazine (.30 rifle any)"
  suffix: empty
  description: Изогнутый двухрядный магазин на 30 патронов для боевых винтовок.
  components:
  - type: BallisticAmmoProvider
    proto: null
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag

- type: entity
  parent: BaseMagazineLightRifle
  id: MagazineLightRiflePractice
  name: "magazine (.30 rifle practice)"
  description: Изогнутый двухрядный магазин на 30 патронов для боевых винтовок. Подходит для безвредных учебных боеприпасов.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeLightRiflePractice
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: stripe
      color: "#dbdbdb"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      - state: inhand-left-stripe
        color: "#dbdbdb"
      right:
      - state: inhand-right-mag
      - state: inhand-right-stripe
        color: "#dbdbdb"

- type: entity
  parent: BaseMagazineLightRifle
  id: MagazineLightRifleUranium
  name: "magazine (.30 rifle uranium)"
  description: Изогнутый двухрядный магазин на 30 патронов для боевых винтовок. Подходит для экзотических боеприпасов с урановым сердечником.
  components:
