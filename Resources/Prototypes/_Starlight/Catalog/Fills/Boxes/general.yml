  id: BoxEncryptionKeySalvage
  suffix: DO NOT MAP, Steal Objective
  components:
    - type: EntityTableContainerFill
      containers:
        storagebase: !type:AllSelector
          children:
          - id: EncryptionKeySalvage
            amount: 4

- type: entity
  name: коробка блэклайта
  parent: BoxLightbulb
