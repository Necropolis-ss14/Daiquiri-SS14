- type: entity
  id: PartNeocyte
  parent: [BaseItem, BasePart]
  name: часть тела неоцита
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: BatteryAcid
        Quantity: 5
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: TorsoNeocyte
  name: туловище неоцита
  parent: [PartNeocyte, BaseTorso]
  components:
  - type: Sprite
    sprite: _FarHorizons/Mobs/Species/Protogen/parts.rsi
    state: "torso_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: BatteryAcid
        Quantity: 15
      - ReagentId: Blood
        Quantity: 20

- type: entity
  id: HeadNeocyte
  name: голова неоцита
  parent: [PartNeocyte, BaseHead]
