- type: entity
  id: OrganNeoDionaStomach
  parent: OrganDionaStomach
  name: ent-OrganNeoDionaStomach
  suffix: Neo-Diona
  description: ent-OrganNeoDionaStomach-desc
  components:
  - type: Stomach
    specialDigestible:
      tags:
      - RamChip
    isSpecialDigestibleExclusive: false
  - type: Metabolizer
    maxReagents: 6
    metabolizerTypes: [ Plant, Neocyte ] # Can't do animal since they would get poisoned by theobromine.
    stages: [ Digestion, Bloodstream, Metabolites ]
  - type: OrganDamage
    damage:
      types:
        Poison: 130
        Cellular: 30 # 1.5x cellular, since it can make it impossible to revive them with the half healing they get
        Bloodloss: 20
        Caustic: 20
        Radiation: 10

- type: entity
  id: OrganNeoDionaLungs
  parent: OrganDionaLungs
  name: ent-OrganNeoDionaLungs
  suffix: Neo-Diona
  description: ent-OrganNeoDionaLungs-desc
  components:
  - type: OrganDamage
    damage:
      types:
        Asphyxiation: 130
        Cellular: 30 # 1.5x cellular, since it can make it impossible to revive them with the half healing they get
        Bloodloss: 20
        Radiation: 30

# Organs that turn into nymphs on removal
