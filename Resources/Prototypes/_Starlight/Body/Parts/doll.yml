- type: entity
  id: PartDoll
  parent: [BaseItem, BasePart]
  name: часть тела куклы
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: UncookedAnimalProteins
        Quantity: 10
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: TorsoDoll
  name: туловище куклы
  parent: [PartDoll, BaseTorso]
  components:
    - type: Sprite
      sprite: _Starlight/Mobs/Species/Doll/parts.rsi
      state: "torso"
    - type: Icon
      sprite: _Starlight/Mobs/Species/Doll/parts.rsi
      state: "torso"
    - type: Extractable
      juiceSolution:
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 20
        - ReagentId: Fat
          Quantity: 20
        - ReagentId: Blood
          Quantity: 40

