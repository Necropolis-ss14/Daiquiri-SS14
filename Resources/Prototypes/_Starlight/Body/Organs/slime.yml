- type: entity
  id: SentientSlimeCore
  parent: [BaseItem, BaseOrganBrain]
  name: разумное ядро слайма
  suffix: Slime
  description: "The source of incredible, unending gooeyness."
  components:
    - type: Sprite
      sprite: Mobs/Species/Slime/organs.rsi
      state: brain
    - type: Stomach
    - type: Metabolizer
      maxReagents: 6
      metabolizerTypes: [ Slime ]
      stages: [ Digestion, Metabolites ]
    - type: SolutionManager
      solutions:
      - SolutionOrganSlime
      - SolutionOrganFoodGreyMatterLarge
      - SolutionOrganStomach50

- type: entity
  id: OrganSlimeLungs
  parent: [BaseHumanOrgan, BaseOrganLungs]
  name: газовые мешки слайма
  suffix: Slime
  description: "Собирает азот, который клетки слайма используют для жизнедеятельности."
  components:
  - type: Sprite
    sprite: Mobs/Species/Slime/organs.rsi
    layers:
      - state: lung-l
      - state: lung-r
  - type: Lung
    alert: LowNitrogen
  - type: Metabolizer
    metabolizerTypes: [ Slime ]
    stages: [ Respiration ]
  - type: SolutionManager
    solutions:
    - SolutionOrganSlime
    - SolutionOrganFoodSlime
    - SolutionOrganLung
  - type: Item
    size: Small
    heldPrefix: lungs


- type: entity
  id: OrganSlimeHeart
  parent: [BaseHumanOrgan, BaseOrganHeart]
  name: циркулятор слайма
  suffix: Slime
  description: Маленький циркулятор, гоняющий жидкость по телу слайма.
  components:
  - type: Sprite
    sprite: Mobs/Species/Slime/organs.rsi
    state: heart-on
  - type: Item
    size: Small
    heldPrefix: heart
  - type: Metabolizer
    maxReagents: 6
    metabolizerTypes: [ Slime ]
    stages: [ Bloodstream ]

# Starlight start
- type: entity
  id: OrganSlimePeepoids
  parent: [BaseHumanOrgan, BaseOrganEyes]
  name: пипоиды
  suffix: Slime
  description: Примитивные и сопливые, но почти так же хороши, как человеческий аналог.
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Slime/organs.rsi
    state: peepoids
  - type: Item
    size: Small
    heldPrefix: peepoids
  - type: OrganVisualization
    layer: Eyes
    prototypes:
      Default: MobHumanoidEyes

- type: entity
  id: OrganSlimeSlurpoid
  parent: OrganHumanTongue
  name: сларпоид
  suffix: Slime
  description: По консистенции — чистое желе.
  components:
  - type: OrganTongue
    allowedEmotes: ['Squish', 'Bubble', 'Pop']
    sounds:
      Male: MaleSlime
      Female: FemaleSlime
      Unsexed: MaleSlime
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Slime/organs.rsi
    state: slurpoid
# Starlight end
