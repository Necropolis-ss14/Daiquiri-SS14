# brain implants

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepInsertBrainImplant
  name: Вставить мозговой имплант
  components:
  - type: SurgeryStep
    duration: 2
    tools:
    - type: BrainImplant
  - type: SurgeryStepOrganInsert
    slot: brain_implant
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/implants.rsi
    layers:
      - state: brain_implant_translator

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRemoveBrainImplant
  name: Удалить мозговой имплант
  components:
  - type: SurgeryStep
    duration: 2
    tools:
    - type: Scalpel
  - type: SurgeryStepEmoteEffect
  - type: SurgeryStepOrganExtract
    organ:
    - type: BrainImplant
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel

# tongue

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepPrepareImplantSiteTongue
  name: Подготовить место импланта
  components:
  - type: SurgeryStep
    duration: 2
    tools:
    - type: Scalpel
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepPositionTongue
  name: Установить язык
  components:
  - type: SurgeryStep
    duration: 2
    tools:
    - type: OrganTongue
    bodyRemove:
    - type: Muted
  - type: SurgeryStepOrganInsert
    slot: tongue
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    state: tongue

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepAttachTongue
  name: Прикрепить язык
  components:
  - type: SurgeryStep
    duration: 3
    tools:
    - type: Hemostat
  - type: SurgeryStepEmoteEffect
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/scissors.rsi
    state: hemostat

# brain

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepCleanImplantSite
  name: Очистить место импланта
  components:
  - type: SurgeryStep
    duration: 2
    tools:
    - type: Cautery
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/cautery.rsi
    state: cautery

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepPrepareScalp
  name: Подготовить скальп
  components:
  - type: SurgeryStep
    duration: 3
    tools:
    - type: Scalpel
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepPrepareDuraMater
  name: Подготовить твёрдую мозговую оболочку
  components:
  - type: SurgeryStep
    duration: 2
    tools:
    - type: Cautery
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/cautery.rsi
    state: cautery

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepInsertBrain
  name: Вставить мозг
  components:
  - type: SurgeryStep
    duration: 5
    tools:
    - type: OrganBrain
    bodyRemove:
    - type: Uncryoable
  - type: SurgeryStepOrganInsert
    slot: brain
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    state: brain

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepReconnectCranialNerves
  name: Воссоединить черепные нервы
  components:
  - type: SurgeryStep
    duration: 6
    tools:
    - type: Hemostat
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/scissors.rsi
    state: hemostat

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepReplaceDuraMater
  name: Вернуть твёрдую мозговую оболочку
  components:
  - type: SurgeryStep
    duration: 3
    tools:
    - type: Retractor
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/scissors.rsi
    state: retractor

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepSealDuraMater
  name: Герметизировать твёрдую мозговую оболочку
  components:
  - type: SurgeryStep
    duration: 4
    tools:
    - type: Cautery
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/cautery.rsi
    state: cautery

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepReplaceBoneFlap
  name: Вернуть костный лоскут
  components:
  - type: SurgeryStep
    duration: 4
    tools:
    - type: BoneSetter
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/scissors.rsi
    state: setter

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepSecureBoneFlap
  name: Закрепить костный лоскут костным гелем
  components:
  - type: SurgeryStep
    duration: 5
    tools:
    - type: BoneGel
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/bone_gel.rsi
    state: bone-gel

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepReplaceScalp
  name: Вернуть скальп
  components:
  - type: SurgeryStep
    duration: 3
    tools:
    - type: Retractor
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/scissors.rsi
    state: retractor

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepSutureScalp
  name: Зашить разрез скальпа
  components:
  - type: SurgeryStep
    duration: 4
    tools:
    - type: Cautery
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/cautery.rsi
    state: cautery
  - type: SurgeryClearProgress

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRemoveEgg
  name: Удалить яйцо
  components:
  - type: SurgeryStep
    duration: 5
    tools:
    - type: Scalpel
    bodyRemove:
    - type: HasEggHolder
    - type: EggHolder
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel
  - type: SurgeryStepEmoteEffect

# Cavity

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepLocateItemCavity
  name: Найти предмет
  components:
  - type: SurgeryStep
    duration: 3
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
    state: torso_m

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRemoveItemCavity
  name: Извлечь предмет
  components:
  - type: SurgeryStep
    duration: 6
    tools:
    - type: Scalpel
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
    state: torso_m
  - type: SurgeryStepEmoteEffect
  - type: SurgeryStepOrganExtract
    organ:
    - type: Item
    slot: cavity

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepPrepareImplantSiteCavity
  name: Подготовить место импланта
  components:
  - type: SurgeryStep
    duration: 4
    tools:
    - type: Scalpel
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepInsertItemCavity
  name: Вставить предмет
  components:
  - type: SurgeryStep
    duration: 3
    tools:
    - type: Item
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
    state: torso_m
  - type: SurgeryItemSizeCondition
  - type: SurgeryStepOrganInsert
    slot: cavity

# Shadekin Core

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepLocateCore
  name: Найти ядро
  components:
  - type: SurgeryStep
    duration: 3
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Shadekin/organs.rsi
    state: core

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepInsertShadekinCore
  name: Вставить ядро
  components:
  - type: SurgeryStep
    duration: 5
    tools:
    - type: OrganShadekinCore
  - type: SurgeryStepOrganInsert
    slot: core
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Shadekin/organs.rsi
    state: core

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepExtractShadekinCore
  name: Извлечь ядро
  components:
  - type: SurgeryStep
    duration: 5
    tools:
    - type: Retractor
  - type: SurgeryStepOrganExtract
    organ:
    - type: OrganShadekinCore
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/scissors.rsi
    state: retractor
  - type: SurgeryStepEmoteEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepClampShadekinCoreVessels
  name: Пережать сосуды ядра
  components:
  - type: SurgeryStep
    duration: 5
    tools:
    - type: Hemostat
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/scissors.rsi
    state: hemostat

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepConnectShadekinCoreVessels
  name: Соединить сосуды ядра
  components:
  - type: SurgeryStep
    duration: 10
    tools:
    - type: Hemostat
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/scissors.rsi
    state: hemostat


# Shell

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRemoveShell
  name: Удалить панцирь
  components:
  - type: SurgeryStep
    duration: 4
  - type: SurgeryStepEmoteEffect
  - type: SurgeryStepOrganExtract
    organ:
    - type: OrganShell
  - type: SurgeryStepBleedEffect
    damage:
      types:
        Blunt: 4
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Doll/organs.rsi
    state: shell

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepPositionShell
  name: Установить панцирь
  components:
  - type: SurgeryStep
    duration: 3
    tools:
    - type: OrganShell
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Doll/organs.rsi
    state: shell
  - type: SurgeryStepOrganInsert
    slot: shell
