- type: entity
  id: CrateFunSuperSynth
  parent: CrateGenericSteel
  name: ящик суперсинтезатора
  description: Внутри суперсинтезатор. Груви!
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: SuperSynthesizerInstrument

- type: entity
  id: CrateFunPinata
  parent: CrateGenericSteel
  name: ящик пиньяты
  description: Внутри клоун-пиньята и бита, чтобы её бить.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClownPinata
        - id: BaseBallBat

- type: entity
  name: ящик набора таракамоля
  description: Коробка с набором таракамоля на двух таракамолей.
  id: CrateFunMoproach
  parent: CratePlastic
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: MoproachBox

- type: entity
  name: ящик набора твинпоинтера
  description: Один набор твинпоинтера для всех нужд двусторонней навигации.
  id: CrateFunTwinPointer
  parent: CrateGenericSteel
  components:
    - type: EntityTableContainerFill
      containers:
        entity_storage: !type:AllSelector
          children:
            - id: TwinPointerKit
              amount: 1

- type: entity
  id: CrateFunMegaShark
  parent: CrateGenericSteel
  name: ящик мега-акулы
  description: Одна абсолютно огромная обнимаемая акула-плюш. Для тех, кому нужен БОЛЬШОЙ друг!
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: PlushieLargeSoftShark

- type: entity
  id: CrateSaltLamp
  parent: CrateGenericSteel
  name: ящик соляных ламп-плюшей
  description: Маленькая и большая соляные лампы-плюши. Уют любой комнате.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: PlushieSaltLampLarge
        - id: PlushieSaltLampSmall
