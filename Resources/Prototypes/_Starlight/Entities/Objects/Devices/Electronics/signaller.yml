#Dead man Remote Signaller Device

- type: entity
  parent: RemoteSignaller
  id: DeadManRemoteSignaller
  name: дистанционный сигнализатор «мёртвая рука»
  description: Ручное устройство для дистанционной отправки сигналов объектам в небольшом радиусе около 15 метров. К нему криво примотан провод, из-за которого оно срабатывает при падении.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Devices/deadmansignaller.rsi
    state: signaller
  - type: TriggerOnDropped
  - type: TriggerOnMobstateChange
    mobState:
      - Dead
      - Critical
  - type: Construction
    graph: makeshiftdeadmansignaler
    node: msdeadmansignaler

- type: entity
  parent: RemoteSignallerAdvanced
  id: DeadManRemoteSignallerAdvanced
  name: улучшенный дистанционный сигнализатор «мёртвая рука»
  description: Ручное устройство для дистанционной отправки сигналов объектам в небольшом радиусе около 50 метров. К нему криво примотан провод, из-за которого оно срабатывает при падении.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Devices/deadmansignaller.rsi
    state: advanced
  - type: Item
    inhandVisuals:
      left:
      - state: advanced-inhand-left
      right:
      - state: advanced-inhand-right
  - type: WirelessNetworkConnection
    range: 50
  - type: StaticPrice
    price: 30
  - type: TriggerOnDropped
  - type: TriggerOnMobstateChange
    mobState:
      - Dead
      - Critical
  - type: Construction
    graph: makeshiftdeadmansignaleradvanced
    node: msdeadmansignaleradvanced
