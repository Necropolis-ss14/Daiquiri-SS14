- type: entity
  parent: BaseItem
  id: BaseMagazineBoxImprovised
  name: самодельная коробка патронов (любые)
  description: Похоже на коробку .20 с грубым рисунком пули сверху. Смешивать патроны не рекомендуется.
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgePistol
        - CartridgePistolImprovised
        - CartridgeMagnum
        - CartridgeMagnumImprovised
        - CartridgeLightRifle
        - CartridgeLightRifleImprovised
        - ShellShotgun
        - ShellShotgunImprovised
    proto: null
    capacity: 40
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Ammunition/Boxes/improvised.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false
  - type: Appearance
  - type: Construction
    graph: ImprovisedMagazineBoxGraph
    node: shell
  - type: Tag
    tags:
    - ImprovisedAmmoBox

- type: entity
  parent: BaseMagazineBoxImprovised
  id: MagazineBoxImprovisedPistol
  name: самодельная коробка патронов (.35 авто самодельные)
