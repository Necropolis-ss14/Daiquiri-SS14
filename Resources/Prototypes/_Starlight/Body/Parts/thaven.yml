- type: entity
  id: PartThaven
  parent: [BaseItem, BasePart]
  name: ent-PartThaven
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: TorsoThaven
  name: ent-TorsoThaven
  parent: [PartThaven, BaseTorso]
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Thaven/parts.rsi
    state: "torso"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20

