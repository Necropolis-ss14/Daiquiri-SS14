# Blackstar heavy assault kit. Combat protection and movement retained from the retired kit.
- type: entity
  parent: [ClothingOuterBaseLarge, BaseMajorContraband]
  id: ClothingOuterArmorBlackstarAssault
  name: штурмовая броня Blackstar
  description: Тяжёлый боевой костюм с ребристым нагрудником и шарнирными щитками поверх коричневой стёганой формы. Для дредуокеров Blackstar.
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/Scarlet/blackstar_assault/armor.rsi
  - type: Clothing
    sprite: _Starlight/Admeme/Scarlet/blackstar_assault/armor.rsi
  - type: Item
    sprite: _Starlight/Admeme/Scarlet/blackstar_assault/armor.rsi
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: StaminaResistance
    damageCoefficient: 0.75
  - type: Pierceable
    level: Metal
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.5
        Heat: 0.5
        Radiation: 0.5
        Caustic: 0.5
    staminaModifier: 0.3
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: HeldSpeedModifier
  - type: AllowSuitStorage
  - type: Tag
    tags:
    - MonkeyWearable
    - WhitelistChameleon
    - CorgiWearable
    - ScurretWearable
    - FootstepSound

