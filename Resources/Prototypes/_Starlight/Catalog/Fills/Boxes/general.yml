# Fashion-O-Mat-Start
- type: entity
  name: сумка сладкого кондитерского набора
  parent: ClothingBackpackDuffel
  id: BoxPancakes
  description: Выгляди как та, кому блины важнее чужого мнения. Выгляди как... РОБОТ??!
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingHeadHoney
        - id: ClothingUniformPastryDress
        - id: ClothingUniformApron
