- type: entity
  parent: BaseMobDragon
  id: MobDragonClown
  name: клоун-дракон
  description: Идеальная форма жизни, созданная хонк-матерью.
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Aliens/Carps/clowndragon.rsi
    noRot: true
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: alive-unshaded
      shader: unshaded
  - type: GhostRole
    mindRoles:
    - MindRoleDragon
  - type: Butcherable
    spawned:
    - id: FoodCakeClown
      amount: 1
  - type: ActionGun
    action: ActionClownsBreath
    gunProto: ClownsBreathGun
  - type: GuideHelp
    guides:
    - MinorAntagonists
  - type: Slippery
  - type: Damageable
    damageModifierSet: DragonResistances

- type: entity
  parent: BaseAction
  id: ActionClownsBreath
  name: "[color=pink]Кластер Банана![/color]"
  description: Выплюнь банан, что делится на взрывающиеся шкурки!
  components:
  - type: Action
    icon: { sprite : Objects/Specific/Hydroponics/banana.rsi, state: produce }
    itemIconStyle: BigAction
    priority: 2
  - type: TargetAction
    checkCanAccess: false
    range: 0
  - type: WorldTargetAction
    event: !type:ActionGunShootEvent
  - type: EorgPreventAction

- type: entity
  categories: [ HideSpawnMenu ]
  id: ClownsBreathGun
  name: лёгкое клоуна
  description: Для смешного дыхания.
  components:
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 10
    rechargeSound:
      path: /Audio/Animals/space_dragon_roar.ogg
  - type: BasicEntityAmmoProvider
    proto: ClusterBananaPeel
    capacity: 1
    count: 1
  - type: Gun
    soundGunshot:
      path: /Audio/Animals/space_dragon_roar.ogg
    soundEmpty: null
    projectileSpeed: 5
