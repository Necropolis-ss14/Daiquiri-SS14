# Rubber
- type: entity
  name: дрозд
  parent: [ BaseContrabandTier3, WeaponSubMachineGunDrozd, BaseSecurityContraband ] # Blimpuf
  id: WeaponSubMachineGunDrozdRubber
  suffix: Non-Lethal
  components:
    - type: ItemSlots
      slots:
        gun_magazine:
          name: item-slot-component-slot-name-magazine
          startingItem: MagazinePistolSubMachineGunRubber
          insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
          ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
          priority: 2
          whitelist:
            tags:
              - MagazinePistolSubMachineGunSP
        gun_chamber:
          name: item-slot-component-slot-name-chamber
          startingItem: CartridgePistolRubber
          priority: 1
          whitelist:
            tags:
              - CartridgePistol

- type: entity
  name: СП-91-РС
  parent: [ BaseContrabandTier3, BaseWeaponSubMachineGun, BaseGunWieldable, BaseSecurityContraband ] # Blimpuf
  id: WeaponSubMachineGunSP91RC
  description: Компактный пистолет-пулемёт для разгона беспорядков.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/SMGs/sp91rc.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Gun
    fireRate: 13
    selectedMode: Burst
    shotsPerBurst: 5
    availableModes:
      - Burst
    soundGunshot:
      path: /Audio/_Starlight/Weapons/Guns/Gunshots/1sp_91.ogg
    minAngle: 6
    maxAngle: 20
    angleIncrease: 1.5
    angleDecay: 12
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Appearance
  - type: ChamberMagazineAmmoProvider
    autoEject: true
  - type: GunWieldBonus
    minAngle: 0
    maxAngle: 0
    minAngleDivider: 2
    maxAngleDivider: 2
    angleIncreaseDivider: 2

- type: entity
  name: Узи типа U3
  parent: [BaseWeaponSubMachineGun, BaseGunWieldable, BaseMajorContraband]
  id: WeaponSubMachineGunUzi
  description: Лёгкий пистолет-пулемёт с магазином на 32 патрона, режимы одиночный или по 4.
  components:
  - type: Item
    size: Normal
    shape:
    - 0,0,1,1 # Starlight
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/SMGs/uzi.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Gun
    fireRate: 10
    minAngle: 8
    maxAngle: 26
    angleIncrease: 2.5
    angleDecay: 14
    selectedMode: FullAuto
    shotsPerBurst: 4
    availableModes:
    - SemiAuto
    - Burst
    - FullAuto
    soundGunshot:
      path: /Audio/_Starlight/Weapons/Guns/Gunshots/uzi.ogg
