- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseBloodBoundObjective
  components:
  - type: Objective
    issuer: objective-issuer-blood-bound
  - type: RoleRequirement
    roles:
    - BloodBoundRole

- type: entity
  abstract: true
  parent: BaseBloodBoundObjective
  id: BaseBloodBoundStealObjective
  components:
  - type: StealCondition
    descriptionText: objective-condition-blood-bound-steal-description
    descriptionMultiplyText: objective-condition-blood-bound-steal-multiply-description

# Tracked objectives
- type: entity
  parent: [BaseBloodBoundObjective, BaseTargetObjective]
  id: BloodBoundStealHeartObjective
  description: "Нам нужно сердце этого человека."
  components:
  - type: Objective
    hidden: true
    hiddenTitle: objective-picker-hidden-steal-heart
    difficulty: 2
    unique: true
    icon:
      sprite: Mobs/Species/Human/organs.rsi
      state: heart-on
  - type: TargetObjective
    title: objective-condition-blood-bound-steal-heart
  - type: PickRandomPerson
    pool: !type:WeightedAlivePool
      weightHighValue: true
    filters:
    - !type:HasHeartMindFilter
    - !type:TargetObjectiveMindFilter
      blacklist:
        components:
        - StealHeartCondition
  - type: StealHeartCondition

- type: entity
  parent: BaseBloodBoundObjective
  id: BloodBoundFirestakeObjective
  components:
  - type: Objective
    difficulty: 2
    unique: true
    icon:
      sprite: Structures/Decoration/bonfire_stake.rsi
      state: burning
  - type: NumberObjective
    min: 1
    max: 4
  - type: FirestakeCondition
    title: objective-condition-blood-bound-firestake
    description: objective-condition-blood-bound-firestake-description

# Support a sworn partner
- type: entity
  parent: [BaseBloodBoundObjective, BaseTargetObjective]
  id: BloodBoundAssistObjective
  name: "Помогите своему кровному брату."
  description: "Помогайте своему кровному брату выполнить все его цели, чего бы это ни стоило."
  components:
  - type: Objective
    difficulty: 0 # never given randomly anyways
    issuer: objective-issuer-blood-bound
    icon:
      sprite: /Textures/Interface/Alerts/bleed.rsi
      state: bleed10
  - type: TargetObjective
    title: objective-condition-blood-bound-progress-title
  - type: HelpProgressCondition

