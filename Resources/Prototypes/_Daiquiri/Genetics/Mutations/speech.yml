- type: entity
  parent: BaseFreeMutation
  id: MutationNervousness
  name: Nervousness
  description: Causes the holder to stutter.
  components:
  - type: ComponentMutation
    added:
    - type: StutteringAccent

- type: entity
  parent: BaseMutation
  id: MutationMute
  name: Mute
  description: Completely inhibits the vocal section of the brain.
  components:
  - type: Mutation
    instability: -40
  - type: RemovesMutation
    removes:
    - MutationUnintelligible
  - type: StatusEffectsMutation
    statusEffects:
    - StatusEffectMutedMutation

- type: entity
  parent: BaseMutation
  id: MutationUnintelligible
  name: Unintelligible
  description: Partially inhibits the vocal center of the brain, severely distorting speech.
  components:
  - type: Mutation
    instability: -30
    conflicts:
    - MutationMute

- type: entity
  parent: [ BaseFreeMutation, BaseTriggerMutation ]
  id: MutationElvis
  name: Elvis
  description: "A terrifying mutation named after its 'patient-zero'."
  components:
  - type: ReplacementAccent
    accent: Elvis
  - type: RandomTrigger
    prob: 0.075
  - type: EntityEffectOnTrigger
    effects:
    - !type:RelayMutated
      effect: !type:NestedEffect
        proto: MutationElvisDance

- type: entity
  parent: BaseFreeMutation
  id: MutationStoner
  name: Stoner
  description: A common mutation that severely decreases intelligence.

- type: entity
  parent: BaseFreeMutation
  id: MutationSwedish
  name: Swedish
  description: A horrible mutation originating from the distant past. Thought to be eradicated after the incident in 2037.
  components:
  - type: CharactersAccent
    chars:
      w: [ "v" ]
      j: [ "y" ]
      b: [ "bj" ]
      a: [ "å", "ä", "æ", "a" ]
      o: [ "ö", "ø", "o" ]

- type: entity
  parent: BaseFreeMutation
  id: MutationChav
  name: Chav
  description: A mutation that makes the holder speak like they were raised in the dodgiest parts of old England.
  components:
  - type: ChavAccent

- type: entity
  parent: BaseFreeMutation
  id: MutationMedieval
  name: Medieval
  description: A horrible mutation originating from the distant past, thought to have once been a common gene in all of old world Europe.
  components:
  - type: ArchaicAccent

- type: entity
  parent: BaseFreeMutation
  id: MutationPigLatin
  name: Pig Latin
  description: Historians say back in the 2020's humanity spoke entirely in this mystical language.
  components:
  - type: PigLatinAccent

- type: entity
  parent: BaseFreeMutation
  id: MutationHeckaciousLarincks
  name: Heckacious Larincks
  description: duge what is WISH your words man...........
  components:
  - type: RemovesMutation
    removes:
    - MutationStoner
  - type: ReplacementAccent
    accent: Heckacious
